e Documents folder.", "I name it *contact sheet dot p d f*."]], ["PAGES", 23, "Blank document, heading for autumn newsletter credits", 24, ["In *Pages*, I start a *Blank* document.", "Heading: *Autumn newsletter, pages 6-7, photo credits*."]], ["PAGES", 24, "Type the first credit line, reading off the Safari tab", 28, ["First credit line format: *File name - Author - CC BY-SA 4.0*.", "I switch back to the first Safari file tab and *Command C* the file name, then *Command V* it in.", "Author's name, then the licence. One line done, that's one of eight."]], ["PAGES", 25, "Type credit lines two through eight, progress check", 50, ["Second line, copying from the second tab. Done.", "Third through fifth, each one off its open tab. That's five of eight.", "Sixth, seventh, eighth — same pattern, copying not retyping. All eight are done.", "Attribution is a licence condition — we use them, they get named. A misspelt credit is a broken attribution, so I copy, never retype."]], ["PAGES", 26, "Type closing line: all from Wikimedia Commons, none NonCommercial", 22, ["Closing line: *All images from Wikimedia Commons, public domain or Creative Commons licence.*", "*No NonCommercial images included.*"]], ["PAGES", 27, "File > Export To > PDF to photo_credits.pdf", 20, ["*File*, *Export To*, *P D F*, and save it as *photo credits dot p d f*."]], ["PREVIEW", 28, "Open contact_sheet.pdf, verify four by two grid on one page", 26, ["In *Preview*, I open *contact sheet dot p d f*.", "The *Thumbnails* sidebar shows one page, four by two. I count eight photos aloud."]], ["PREVIEW", 29, "View > Zoom In, verify readability at 60 mm", 22, ["*View*, *Zoom In*. At sixty millimetres the photos are still sharp and readable.", "Cluttered photos turn to mush at that size — these are clear."]], ["PREVIEW", 30, "Check the margins and print layout one more time", 20, ["I zoom back out to see the whole page. The grid is square, eight photos land perfectly, nothing spills off the edge."]], ["FINDER", 31, "Select both PDFs, compress to deliverables.zip", 28, ["Back in *Finder*. I select *contact sheet dot p d f* and *photo credits dot p d f*.", "Right-click, *Compress 2 Items*."]], ["FINISH", 32, "Rename archive to deliverables.zip, closing line", 38, ["I rename it *deliverables dot zip*.", "Nine Creative Commons photos down to eight. Four by two contact sheet, every photo credited, nothing NonCommercial made it through.", "Ahead of the twenty-fourth of September deadline.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r07_session_analysis", "title": "Heart-rate and cadence session analysis", "group": "Outdoors and cycling", "apps": ["Safari", "Numbers", "Pages", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["I ride road bikes. Last Sunday I did a ninety-two-minute steady test on the Parpers loop, trying to hold two hundred and five watts.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// Accessibility Inspector running, window closed, dot under Dock icon", "// Do Not Disturb on, desktop empty, no disk images mounted", "// only Safari, Numbers, Pages, Preview, Finder, Notes may run"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 23, ["It felt much harder at the end, and I need to know whether my heart rate agrees.", "So: cardiovascular drift in *Safari*, the ride file in *Numbers*, and the review written in *Pages*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 56, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "First, cardiovascular drift in *Safari*, so I know what I am actually looking for.", "Then the ride file in *Numbers*, cleaning the dropped sensor readings and charting heart rate, cadence, and power.", "Then the early and late blocks compared, and the review written in *Pages*.", "Then the charts marked up in *Preview*, and everything zipped.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open the folder, name the files", 30, ["In *Finder*, in my Documents, I open *tasks*, then *r zero seven session analysis*.", "Two files: the *brief* telling me what to check, and the *session dot c s v* with the data."]], ["SETUP", 5, "Preview — read the brief aloud", 32, ["I open *brief dot p d f* in *Preview*.", "Four questions: did heart rate climb? Where in the ride? Are power and heart rate linked? What does the data say about pacing?"]], ["SETUP", 6, "Open Safari, Numbers, Pages — one reason each", 28, ["From the *Dock*: *Safari*, to look up what cardiovascular drift actually means.", "*Numbers*, for the session data and the charting. And *Pages*, to write the analysis."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The brief is read, so I'll get into the data.", "// minimise Notes with the yellow button - work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Search Wikipedia for Cardiovascular drift", 28, ["In *Safari* I search *cardiovascular drift*.", "The Wikipedia page opens. I read the opening paragraph: heart rate climbs at unchanged workload."]], ["SAFARI", 9, "Explain cardiovascular drift from the article", 26, ["*Cardiovascular drift* happens when you hold the same power but your heart rate goes up.", "Plasma volume falls, so there's less blood per beat, and the heart has to beat more times to keep up.", "// close Safari with the red button - I'm done with it"]], ["NUMBERS", 10, "Open session.csv from the folder", 26, ["Back in *Finder*, I double-click *session dot c s v*.", "It opens in *Numbers* — five hundred and fifty-two rows, one row every ten seconds, ninety-two minutes of riding data from my head unit."]], ["NUMBERS", 11, "Describe the four data columns", 24, ["Four columns: *elapsed min* from zero to ninety-two. *H R bpm*, heart rate in beats per minute.", "*Cadence R P M*, pedal strokes per minute. *Power W*, watts."]], ["NUMBERS", 12, "Scroll to row 427, find the three zero heart-rate cells", 28, ["I scroll down to around row four hundred and twenty-seven, looking for anomalies.", "At minute seventy-one, the heart rate shows zero for three consecutive rows. That's a dropped chest-strap sensor — dead strap, not a heart rate of zero."]], ["NUMBERS", 13, "Select and delete the three zero cells, not empty them to zero", 26, ["I select those three cells in the H R column — they show zero but cadence and power are fine.", "*Delete* to empty them. Zeros wreck the chart line and mess up whole-session averages."]], ["NUMBERS", 14, "Table menu > Headers > Header Column on column A", 26, ["*Table*, *Headers*, *Header Column*. Column *A* goes grey.", "If I don't do this, Numbers plots elapsed time as a zero-to-ninety-two ramp line instead of a proper time axis for the chart."]], ["NUMBERS", 15, "Select column B, create line chart for Heart rate", 30, ["I click the *B* column header to select heart rate.", "*Chart* from the toolbar, *2D Line* chart. I set the *Y* minimum to ninety bpm so the variation shows.", "Title: *Heart rate over the ride*."]], ["NUMBERS", 16, "Create cadence chart in column C", 24, ["Column *C* for cadence. *Chart*, *2D Line*.", "Title: *Cadence over the ride*."]], ["NUMBERS", 17, "Create power chart in column D", 22, ["Column *D* for power. *Chart*, *2D Line*.", "Title: *Power over the ride*."]], ["NUMBERS", 18, "Verify the three charts show the pattern clearly", 26, ["All three charts now show the session structure. Heart rate climbs at the end while power stays flat — that's the drift.", "The cadence drop during the climb block shows the effort change."]], ["NUMBERS", 19, "Add two columns for block averages", 24, ["*Table*, *Add Column After*, twice. Columns *E* and *F* for the block calculations.", "These two columns will hold the early block and late block averages."]], ["NUMBERS", 20, "Early block formula: average HR from minute 10 to 40", 28, ["In cell *F two*, I type an AVERAGEIFS formula.", "Average column *B* (heart rate) where column *A* (elapsed time) is between *ten* and *forty* minutes, and heart rate is greater than zero.", "The answer is *one hundred and forty point zero* bpm."]], ["NUMBERS", 21, "Late block formula: average HR from minute 72 to 90", 26, ["In cell *F three*, the same formula for the late block, minute seventy-two to ninety.", "The answer is *one hundred and forty-nine point one* bpm.", "Nine beats of drift at unchanged power — that's cardiovascular drift."]], ["NUMBERS", 22, "Early and late power averages to confirm they match", 32, ["In cells *F four* and *F five* I calculate power averages for the same two blocks.", "Early: *two hundred and four point one* watts. Late: *two hundred and four point four* watts.", "Effectively the same power both times. So it's not that I worked harder at the end."]], ["NUMBERS", 23, "Cadence averages for the climb block: minute 55 to 67", 32, ["In cells *F six* and *F seven*, cadence averages for the climb window, minute fifty-five to sixty-seven.", "Early cadence: *eighty-eight point zero* R P M. On the climb: *sixty-three point eight* R P M.", "Much lower cadence at higher power — that's where the heavy legs came from."]], ["NUMBERS", 24, "File > Export To > PDF to session_charts.pdf", 22, ["*File*, *Export To*, *P D F*, named *session charts dot p d f*."]], ["PAGES", 25, "Blank document, heading for session review", 26, ["In *Pages*, I start a *Blank* document.", "Heading: *Parpers loop, nine August, session review*."]], ["PAGES", 26, "Write four paragraphs: drift, climb, missing data, pacing plan", 48, ["Paragraph one: cardiovascular drift — same power at the end but nine more beats. Why that matters.", "Paragraph two: the climb, minute fifty-five to sixty-seven. Cadence dropped to sixty-four, power went up to two hundred and fifty. That's heavy work.", "Paragraph three: the zero cells at minute seventy-one. Not a heart rate — a dropped sensor.", "Paragraph four: pacing plan for September long rides — pace off power, not heart rate."]], ["PAGES", 27, "Export To PDF to session_review.pdf", 20, ["*File*, *Export To*, *P D F*, named *session review dot p d f*."]], ["PREVIEW", 28, "Open session_charts.pdf and markup with pen", 28, ["In *Preview*, I open *session charts dot p d f*.", "I click the *markup* button — the pen-tip icon in the toolbar."]], ["PREVIEW", 29, "Add labels to the heart-rate chart: 140 bpm early, 149 bpm late", 26, ["On the heart-rate chart, I add a text label: *one hundred and forty bpm at two hundred and four watts*.", "Then another label on the late part: *one hundred and forty-nine bpm at two hundred and four watts*."]], ["PREVIEW", 30, "Label the climb block on the cadence chart", 20, ["On the cadence chart, I add a label: *twelve minute climb, eighty-eight to sixty-four R P M*."]], ["PREVIEW", 31, "File > Export as PNG to session_charts_annotated.png", 20, ["*File*, *Export*, format *P N G*, named *session charts annotated*."]], ["FINDER", 32, "Select the three exports and compress", 22, ["Back in *Finder*. Three exports: the charts PDF, the review PDF, and the annotated image.", "I select all three. Right-click, *Compress 3 Items*."]], ["FINISH", 33, "Rename archive to deliverables.zip, closing line", 42, ["I rename it *deliverables dot zip*.", "Same power both blocks, nine beats of drift — it felt harder, it wasn't harder.", "The climb dropped my cadence to sixty-four, hence the heavy legs. The zeros are missing data from a dropped strap.", "September long rides: pace off power, not heart rate.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r08_kit_weight", "title": "Bikepacking kit weight budget", "group": "Outdoors and cycling", "apps": ["Safari", "Numbers", "Pages", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["I'm packing for a three-day bikepacking trip in the Pyrenees next month.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// Accessibility Inspector running, window closed, dot under Dock icon", "// Do Not Disturb on, desktop empty, no disk images mounted", "// only Safari, Numbers, Pages, Preview, Finder, Notes may run"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 28, ["I weighed every item on the kitchen scale, and I need to know what stays home to get under nine kilos.", "So: base weight in *Safari*, the kit list and the cuts in *Numbers*, and the cut list written in *Pages*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 50, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "First, what base weight actually means, in *Safari*, so the budget starts from the right definition.", "Then the kit list in *Numbers*, grouped by category and charted.", "Then what to cut worked out, nothing essential touched.", "Then the cut list written in *Pages*, and everything zipped.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open the folder, name the files", 30, ["In *Finder*, in my Documents, I open *tasks*, then *r zero eight kit weight*.", "Three files: the *brief*, the *kit dot c s v* with all thirty-eight items weighed, and a *weight budget* sheet I have to fill."]], ["SETUP", 5, "Preview — read the brief aloud", 32, ["I open *brief dot p d f* in *Preview*.", "Target weight: under nine kilos. Base weight means no food, no water, no fuel, just the kit itself — which is my list.", "The brief says nothing essential gets cut."]], ["SETUP", 6, "Open Safari, Numbers, Pages — one reason each", 28, ["From the *Dock*: *Safari*, to check what base weight actually means in ultralight backpacking.", "*Numbers*, for the kit list and charting. And *Pages*, to write the cut list."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The target is nine kilos, so I'll get to work.", "// minimise Notes with the yellow button - work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Search Wikipedia for Ultralight backpacking and base weight", 28, ["In *Safari* I search *ultralight backpacking base weight*.", "The Wikipedia page defines it: base weight is everything you carry except food, water, and fuel. That's my list exactly."]], ["SAFARI", 9, "Explain base weight concept, close Safari", 20, ["If I get base weight wrong the whole budget is wrong — so I check Wikipedia first.", "// close Safari with the red button - I don't need it anymore"]], ["NUMBERS", 10, "Open kit.csv from the folder", 22, ["Back in *Finder*, I double-click *kit dot c s v*.", "It opens in *Numbers* — thirty-eight items, all weighed."]], ["NUMBERS", 11, "Describe the spreadsheet structure", 24, ["Four columns: the *item name*, *grams*, *category*, and whether it's marked *essential*.", "The categories are Shelter, Clothing, Bags, Electronics, Cooking, Tools, and Personal."]], ["NUMBERS", 12, "Click grams column header, read the total bottom right", 24, ["I click the *grams* column header to select all the weights.", "The sum appears bottom right: *ten thousand six hundred and ten grams — ten point six one kilos*. Over target by one thousand six hundred and ten."]], ["NUMBERS", 13, "Find the blank category in Washbag row, fix it to Personal", 26, ["I scroll to find the Washbag row. It has a blank category field.", "A blank category means that row falls out of every group total and the percentages stop adding to a hundred. So it gets fixed, never deleted. I type *Personal*."]], ["NUMBERS", 14, "Sort grams column descending to see heaviest items first", 24, ["*Sort and Filter* toolbar button. Sort the grams column *descending*, heaviest first.", "The top four rows are a quarter of the whole pack."]], ["NUMBERS", 15, "Organize by Categories, set summary to Sum", 28, ["*Organize*, *Categories* on the category column.", "The summary is set to *Sum*, so each group shows its total weight."]], ["NUMBERS", 16, "Read the seven category totals aloud", 28, ["Reading the seven group totals: Shelter and sleep is the heaviest at four thousand one hundred and sixty-nine grams.", "That's nearly forty percent of everything I carry. Clothing is two thousand and thirteen. Bags are one thousand four hundred and thirteen."]], ["NUMBERS", 17, "Continue reading category totals", 22, ["Electronics: one thousand two hundred and seventy-two. Cooking: seven hundred and thirty-two.", "Tools: six hundred and fifty-nine. Personal: three hundred and fifty-two."]], ["NUMBERS", 18, "Explain the shelter weight: tent is essential, heaviest but stays", 26, ["Tent is essential and the heaviest item at one thousand four hundred and twenty grams — that's the winter purchase, not a cut.", "Sums come from clicked cells, not memory — the data does the maths."]], ["NUMBERS", 19, "Create a clean block of categories and weights in F/G columns", 28, ["I build a clean seven-by-two block in columns *F* and *G* with category names and their totals.", "I never chart off the grey group rows — I keep clear of the grams column and build my own block instead."]], ["NUMBERS", 20, "Select block, create bar chart", 24, ["I select the block. *Chart* from the toolbar, *2D bar* chart.", "Title: *Base weight by category*, showing grams. Format to show *value labels* on each bar."]], ["NUMBERS", 21, "Export the chart to PDF", 20, ["*File*, *Export To*, *P D F*, named *kit chart dot p d f*."]], ["NUMBERS", 22, "Calculate what to cut: current total minus optional items", 34, ["In cell *F twelve*, I build a sum: I click the grams header, which gives me *ten thousand six hundred and ten*.", "In *F thirteen*, I type the formula minus the camp chair, the spare shoes, and the second lens — all non-essential. That's *eight thousand six hundred and seventy* grams."]], ["NUMBERS", 23, "Name the three cuts and explain the logic", 32, ["Chair sat in twice in two years — *eight hundred and ninety grams*. Spare shoes become flip-flops — *six hundred and forty*.", "Second camera lens I can live without for three days — *four hundred and ten*. Together: *one thousand nine hundred and forty grams.*"]], ["NUMBERS", 24, "Verify final weight is under nine kilos", 18, ["Eight thousand six hundred and seventy grams is *eight point six seven kilos*, three hundred grams under nine."]], ["NUMBERS", 25, "Explain the decision method: heaviest first, non-essential only", 22, ["Heaviest first, all marked non-essential. Nothing essential is touched — that's what the brief asked for."]], ["SHEET", 26, "Open weight_budget.xlsx from the folder", 22, ["Back in *Finder*, I open *weight budget dot x l s x*.", "Yellow cells are mine to fill in."]], ["SHEET", 27, "Fill current weight, cuts, and new total", 26, ["I type the current weight: *ten thousand six hundred and ten grams*.", "The cuts: *one thousand nine hundred and forty grams*. The new total: *eight thousand six hundred and seventy*."]], ["SHEET", 28, "Fill the three cut items with reasons", 24, ["*Camp chair*: sat in twice in two years.", "*Spare shoes*: become flip-flops. *Second lens*: not needed for three days."]], ["SHEET", 29, "Export the filled sheet to PDF", 20, ["*File*, *Export To*, *P D F*, named *weight budget dot p d f*."]], ["PAGES", 30, "Blank document, heading for cut list", 28, ["In *Pages*, I start a *Blank* document.", "Heading in bold, large type at about twenty-eight points: *LEAVE AT HOME — Pyrenees, eleven to thirteen September*."]], ["PAGES", 31, "Type the three cut lines with reasons", 24, ["Three lines: Camp chair, nothing else came close. Spare shoes become flip-flops. Second lens not needed for three days.", "Then the summary: *Total saved one thousand nine hundred and forty grams. New base weight eight point six seven kilos.*"]], ["PAGES", 32, "Export to PDF to cut_list.pdf", 18, ["*File*, *Export To*, *P D F*, named *cut list dot p d f*."]], ["PREVIEW", 33, "Open kit_chart.pdf and markup with pen", 26, ["In *Preview*, I open *kit chart dot p d f*.", "I click the *markup* button — the pen-tip icon."]], ["PREVIEW", 34, "Add label to the Shelter & sleep bar", 20, ["I add a text label on the Shelter bar: *four thousand one hundred and sixty-nine grams — thirty-nine percent of base weight*."]], ["PREVIEW", 35, "Export to PNG as kit_chart_annotated.png", 18, ["*File*, *Export*, format *P N G*, named *kit chart annotated*."]], ["FINDER", 36, "Select four exports and compress", 22, ["Back in *Finder*. Four exports: the chart, the filled weight budget, the cut list, and the annotated image.", "I select all four. Right-click, *Compress 4 Items*."]], ["FINISH", 37, "Rename archive to deliverables.zip, closing line", 42, ["I rename it *deliverables dot zip*.", "Started at ten point six one kilos against a nine kilo target.", "Dropping the chair, spare shoes and second lens saves one thousand nine hundred and forty grams, putting me at eight point six seven.", "Nothing essential touched.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r09_club_poster", "title": "Autumn century ride poster", "group": "Outdoors and cycling", "apps": ["Inkscape", "Safari", "Numbers", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["I ride with a local cycling club, and I do the posters.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// Accessibility Inspector running, window closed, dot under Dock icon", "// Do Not Disturst on, desktop empty, no disk images mounted", "// only Inkscape, Safari, Numbers, Preview, Finder, Notes may run"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 25, ["I need an A4 poster for our autumn century ride, with the date the biggest thing on the page.", "So: the route distances in *Numbers*, the sunrise time in *Safari*, and the poster built in *Inkscape*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 57, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "First, the route distances in *Numbers*, so nothing on the poster is guessed.", "Then the sunrise time in *Safari*, to check whether the ride starts in the dark.", "Then the poster built in *Inkscape* — the roundel, the date, the routes, and the start logistics.", "Then export it, check it in *Preview*, and zip it for Ricard.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open the folder, name the files", 30, ["In *Finder*, in my Documents, I open *tasks*, then *r zero nine club poster*.", "Three files: the *brief*, the *route segments* with distances, and the *assets* SVG with the roundel."]], ["SETUP", 5, "Preview — read the brief aloud", 32, ["I open *brief dot p d f* in *Preview*.", "The date needs to be the biggest thing on the page. PNG version for the WhatsApp group. PDF for Ricard to print forty copies."]], ["SETUP", 6, "Open Safari, Numbers, Inkscape — one reason each", 28, ["From the *Dock*: *Safari*, to check the sunrise time in Sabadell in late September.", "*Numbers*, for the route distances. And *Inkscape*, where the poster gets made."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["Everything I need is open, so I'll get into the design.", "// minimise Notes with the yellow button - work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["NUMBERS", 8, "Open route_segments.csv from the folder", 22, ["Back in *Finder*, I open *route segments dot c s v* in *Numbers*.", "Each row is one leg of the three routes: Short, Century, and Long Distance."]], ["NUMBERS", 9, "Select and sum the Short route distances", 24, ["I select the distance cells for the *Short* route and read the sum bottom right: *sixty-one point eight* kilometres.", "On the poster that rounds to *sixty*."]], ["NUMBERS", 10, "Sum the Century route total", 26, ["Repeat for *Century*. I select the distance cells for the Century route.", "*One hundred and three point five* kilometres. Rounds to *one hundred* on the poster."]], ["NUMBERS", 11, "Sum the Long Distance route total", 24, ["*Long Distance* — select those distance cells. *One hundred and fifty-eight point five* kilometres.", "Rounds to *one hundred and sixty* on the poster."]], ["NUMBERS", 12, "Note the missing ascent figure, mention but don't invent", 34, ["I notice one gap in the data: Coll de Davi to Rellinars, the ascent is blank — the head unit dropped out on that leg.", "The distance for that leg is sound, so the total is correct. I'll mention it to the ride captain, not invent a climbing figure."]], ["SAFARI", 13, "Search for sunrise time in Sabadell in September", 32, ["In *Safari* I search *sunrise sunset Sabadell September two thousand twenty-six*.", "The page loads and shows sunrise time in the region at about *seven forty-five*. That's quarter to eight.", "We're rolling out at half seven, so the first twenty minutes are in poor light."]], ["SAFARI", 14, "Explain the sunrise check and close Safari", 22, ["Sunrise is quarter to eight, we roll out at half seven — first twenty minutes in poor light. That earns the lights line.", "// close Safari with the red button"]], ["INKSCAPE", 15, "File > New, Document Properties A4 Portrait", 32, ["In *Inkscape*, *File*, *New*. A blank canvas opens.", "*Document Properties*: set the page to *A four*, *Portrait* orientation."]], ["INKSCAPE", 16, "File > Import assets.svg, the roundel", 32, ["*File*, *Import*, open *assets dot s v g*. *Include SVG*.", "The club roundel lands on the page — circle, chainring, and club name. I import it as SVG so it stays sharp at any size."]], ["INKSCAPE", 17, "Scale the roundel to about one-third page width at the top", 24, ["I grab the corner handle and drag it down to about *one-third* the page width.", "*Align and Distribute* to center it vertically on the page. Roundel in as SVG so it stays sharp."]], ["INKSCAPE", 18, "Text tool: add VALLES AUTUMN CENTURY, large bold sans", 32, ["*Text* tool. I type *VALLES AUTUMN CENTURY* in large bold sans-serif typeface.", "That's the event name across the top of the poster, setting the context."]], ["INKSCAPE", 19, "Add date: SATURDAY 26 SEPTEMBER 2026 — biggest type on page", 26, ["Below that, *SATURDAY twenty-sixth SEPTEMBER two thousand twenty-six*.", "This is the biggest type on the page — the brief asked for it to read from across the room."]], ["INKSCAPE", 20, "Add start time and location", 22, ["*zero seven colon three zero START — CLUB HOUSE* straight under the date.", "Start time reads clearly, location is clear."]], ["INKSCAPE", 21, "Add the three route distances", 24, ["Three lines: *sixty* km Serra loop. *one hundred* km Century. *one hundred and sixty* km Coll d'Estenalles.", "I'm not printing a distance I haven't checked."]], ["INKSCAPE", 22, "Align the three route lines and space them evenly", 22, ["I select all three distance lines. *Align* and *Center vertical*. *Make vertical gaps equal*.", "Align and Distribute, not eyeballing."]], ["INKSCAPE", 23, "Add logistics text at the bottom", 24, ["Below the routes: *Free for members — guests six euros*.", "*Coffee at the finish*. *Lights on for the first hour* — that earns its place from the sunrise check."]], ["INKSCAPE", 24, "Draw a thin rust-coloured bar under the date", 22, ["*Rectangle* tool. A thin rust-coloured bar under the date for visual separation.", "Two colours only: navy from the roundel, and rust."]], ["INKSCAPE", 25, "Check and refine text sizing for hierarchy", 26, ["Looking at the layout: the date is the biggest, the event name and location are secondary, the routes and logistics are readable at a glance.", "The hierarchy reads clearly — people need to see the date from across the room."]], ["INKSCAPE", 26, "Select all, align everything to page center", 20, ["*Edit*, *Select All*. *Align*, *Relative to Page*, center on the vertical axis.", "Everything lines up down the middle."]], ["INKSCAPE", 27, "Save as SVG to autumn_century_poster.svg", 22, ["*File*, *Save As*, named *autumn century poster dot s v g*.", "The working file stays editable."]], ["INKSCAPE", 28, "Export as PNG at 300 DPI", 24, ["*File*, *Export*: *Document*. Format *P N G*, *three hundred D P I*.", "Named *autumn century poster dot p n g*."]], ["INKSCAPE", 29, "Export as PDF with same name", 18, ["*File*, *Export*. Switch format to *P D F*, named *autumn century poster dot p d f*.", "That's the file Ricard prints."]], ["PREVIEW", 30, "Open the PDF and check it at Actual Size", 24, ["In *Preview*, I open *autumn century poster dot p d f*.", "*View*, *Actual Size*. The date reads from across the room. Nothing's off the page."]], ["PREVIEW", 31, "Open the PNG and check its resolution", 22, ["I open *autumn century poster dot p n g*.", "*Tools*, *Show Inspector*: about twenty-five hundred by thirty-five hundred pixels — plenty for a phone."]], ["PREVIEW", 32, "Check the roundel is sharp and nothing is off-page", 26, ["The roundel looks sharp in both formats. Back in the PDF view at Actual Size — nothing spills off the page margins.", "The date reads clearly from across the room, which is exactly what the brief asked for."]], ["PREVIEW", 33, "Check that the text hierarchy is correct", 18, ["The roundel came in as SVG, so it's sharp at any size. The hierarchy reads well — date biggest, event name secondary."]], ["FINDER", 34, "Select PDF, PNG, SVG and compress", 22, ["Back in *Finder*. I select *autumn century poster dot p d f*, the PNG, and the SVG.", "Right-click, *Compress 3 Items*."]], ["FINISH", 35, "Rename archive to deliverables.zip, closing line", 38, ["I rename it *deliverables dot zip*.", "The date reads from across the room. The three routes match the measured distances. Nuria gets one zip: PNG for the phones, PDF for the printer, and the SVG so next year starts from here.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r10_trail_conditions", "title": "Six-week trail conditions log", "group": "Outdoors and cycling", "apps": ["Safari", "Numbers", "Freeform", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["I'm the trail rep for my cycling club — every week I walk our twelve trails and note what state they're in.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// Accessibility Inspector running, window closed, dot under Dock icon", "// Do Not Disturb on, desktop empty, no disk images mounted", "// only Safari, Numbers, Freeform, Preview, Finder, Notes may run"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 24, ["Six weeks of that now, and I need to turn it into something the club can read.", "So: trail drainage in *Safari*, the summary built in *Numbers*, and a visual board made in *Freeform*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 57, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "First, what trail drainage actually means, in *Safari*, so I know what I am looking at in the log.", "Then six weeks of surveys in *Numbers*, counting dry, wet, muddy, and closed for each trail.", "Then deciding what needs action, and a visual board built in *Freeform*.", "Then check both in *Preview*, and zip it up.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open the folder, name the files", 30, ["In *Finder*, in my Documents, I open *tasks*, then *r one zero trail conditions*.", "Three files: the *brief* with the asks, the *log dot c s v* with six weeks of trail status, and a *summary* sheet."]], ["SETUP", 5, "Preview — read the brief aloud", 32, ["I open *brief dot p d f* in *Preview*.", "Three asks: how many trails are fully dry this week? What did the storm close? Which trail needs drainage work?"]], ["SETUP", 6, "Open Safari, Numbers, Freeform — one reason each", 28, ["From the *Dock*: *Safari*, to understand what trail drainage actually means.", "*Numbers*, for the data and building the summary. And *Freeform*, to make the visual board."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The brief is read, so I'll get into the analysis.", "// minimise Notes with the yellow button - work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Search Wikipedia for Trail maintenance and drainage", 32, ["In *Safari* I search *trail maintenance wikipedia drainage*.", "The page opens and explains: a trail stays muddy because water sits on it, not because it rains more in that place. That's the key insight."]], ["SAFARI", 9, "Explain drainage grade dips and culverts", 22, ["Grade dips or a culvert get water off the tread — that's volunteer work, not a contractor job.", "// close Safari with the red button"]], ["NUMBERS", 10, "Open log.csv from the folder", 22, ["Back in *Finder*, I open *log dot c s v* in *Numbers*.", "Seventy-two rows, one per trail per week. Twelve trails, six weekly surveys."]], ["NUMBERS", 11, "Describe the data and note the anomalies", 36, ["The dates are uneven — week three is Tuesday, week four is July twentieth, right after the storm. Bosc de Faig is missing week three reading.", "Week four data shows Roca Alta and Canal Nord are closed — the storm damage. Both stay closed through week five and reopen week six."]], ["NUMBERS", 12, "Select all data including headers and copy", 20, ["I select the whole table including headers. *Edit*, *Copy* — I say *Command C* aloud.", "// the table is ready to paste into the summary sheet"]], ["NUMBERS", 13, "Open conditions_summary.xlsx and create a new sheet named Log", 26, ["Back in *Finder*, I open *conditions summary dot x l s x*.", "*Plus button* to add a sheet. I name it *Log*."]], ["NUMBERS", 14, "Click A1 and paste the log data", 18, ["Click cell *A one*, then *Edit*, *Paste* — I say *Command V* aloud.", "The seventy-two rows land in the sheet."]], ["NUMBERS", 15, "In Summary sheet, click the first status cell and build COUNTIFS", 28, ["Back on the *Summary* sheet, in the first status cell I build a COUNTIFS formula.", "Count rows where the trail name matches this row, and the status equals *dry*. The answer for Roca Alta is *two*."]], ["NUMBERS", 16, "Build formulas for all status types: wet, muddy, closed", 34, ["I copy the formula across to count *wet*, *muddy*, and *closed* — editing the status word each time and dragging down.", "For each trail, the five counts tell the story of six weeks: how many times dry, wet, muddy, or closed."]], ["NUMBERS", 17, "Fill week-six current status by hand from the Log sheet", 32, ["Last column: the current status at week six. I read off the log and type it in by hand for each trail.", "Roca Alta is *wet* at week six, not fully dry yet. Canal Nord is *wet*. Font Seca remains *muddy*."]], ["NUMBERS", 18, "Set Action dropdowns for each trail", 32, ["Dropdowns in the Action column. Roca Alta and Canal Nord both get *Reopen check* — they've been closed.", "Font Seca gets *Drainage work* — it's muddy five of six weeks, which is a pattern not a weather problem. The rest get *No action*."]], ["NUMBERS", 19, "Verify the formulas and counts make sense", 28, ["Bosc de Faig totals five, not six — no week three reading. That's my check the formulas count right and are counting the right data.", "Font Seca is muddy five weeks — the one job worth asking the committee for."]], ["NUMBERS", 20, "Spot-check a couple of trail totals against the Log sheet", 26, ["I switch to the Log sheet and count one trail manually to verify the formulas are working.", "Roca Alta: two dry, two wet, zero muddy, two closed. That matches. The formulas are right."]], ["NUMBERS", 21, "Add three summary notes at the bottom", 26, ["Below the table, I type three notes:", "Dry at week six: seven of twelve trails. Storm on July nineteenth closed Roca Alta and Canal Nord for two weeks each. Font Seca muddy five weeks, a drainage problem."]], ["NUMBERS", 22, "Export to PDF to conditions_summary.pdf", 20, ["*File*, *Export To*, *P D F*, named *conditions summary dot p d f*."]], ["FREEFORM", 23, "New board with heading and subtitle", 24, ["In *Freeform*, *New* board.", "Text: *TRAIL STATUS — week of nine August two thousand twenty-six*. Subtitle: *Valles Riders Club — twelve trails, six weekly surveys*."]], ["FREEFORM", 24, "Create green card for first dry trail: Serrat del Vent", 30, ["*Rounded rectangle* tool. Draw a card, fill it *green*. Text: *Serrat del Vent — DRY*.", "Cards coloured by current status — riders see where to go at a glance without reading."]], ["FREEFORM", 25, "Copy the first green card and paste the remaining dry trails", 34, ["*Command C* to copy the card. I say it aloud.", "*Command V* to paste it, then edit the text for the next dry trail. Seven green cards total for the seven dry trails: Coll de Bou, Pla de Ginebre, Sot de l'Om, Cami dels Bancals, Turo Gris, Bosc de Faig."]], ["FREEFORM", 26, "Create amber cards for wet trails", 28, ["Amber fill for wet trails — amber means caution, ride with care. Four cards: Roca Alta, Canal Nord, Torrent Fosc, Rasa Llarga.", "Each one says the trail name and *WET*."]], ["FREEFORM", 27, "Create brown card for Font Seca muddy", 18, ["Brown fill for Font Seca. One card: *Font Seca — MUDDY*.", "That's the drainage job."]], ["FREEFORM", 28, "Group cards into columns: DRY, WET, MUDDY", 20, ["I arrange the cards into three columns by status.", "*DRY*, *WET*, *MUDDY* — organized so the club sees the breakdown at a glance."]], ["FREEFORM", 29, "Add text for closed duration and drainage plan", 22, ["Below the cards, I type: *Roca Alta and Canal Nord closed twenty July to two August — two weeks, now open.*", "*Font Seca scheduled for drainage work in September.*"]], ["FREEFORM", 30, "Verify the board layout is complete and readable", 24, ["I review the board: the heading is clear, the three status columns are organized, the cards show the current state.", "The closed duration and drainage note are at the bottom. Everything fits on one page and reads at a glance."]], ["FREEFORM", 31, "Export board as PDF to trail_board.pdf", 20, ["*File*, *Export as P D F*, named *trail board dot p d f*."]], ["PREVIEW", 32, "Open both PDFs to verify they fit on one page", 22, ["In *Preview*, I open *conditions summary dot p d f*.", "Then *trail board dot p d f*. Both fit on one page — the board has room to print."]], ["FINDER", 33, "Select both PDFs and compress", 20, ["Back in *Finder*. I select the summary PDF and the board PDF.", "Right-click, *Compress 2 Items*."]], ["FINISH", 34, "Rename archive to deliverables.zip, closing line", 42, ["I rename it *deliverables dot zip*.", "Six weeks, twelve trails. Seven fully dry again at week six. The storm shut Roca Alta and Canal Nord for two weeks and both are open now.", "Font Seca's five muddy weeks make it the drainage job, which the club can read off one board.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r11_hiking_boots", "title": "Compare three hiking boots", "group": "Outdoors and cycling", "apps": ["Preview", "Safari", "Numbers", "Pages"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["My hiking boots came apart on me in June, and I want a pair before autumn.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// only Finder, Preview, Safari, Numbers, Pages may open - everything else quit", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through the apps", 22, ["I need to know which of three boots actually wins on the specs, not on a hunch.", "So: the specs in *Preview*, the scoring in *Numbers*, and the pick written in *Pages*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 56, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "First, the three spec sheets in *Preview*, to pull the real numbers before I trust any of them.", "Then why wet grip matters, in *Safari*, so the weighting makes sense.", "Then the scoring worked out in *Numbers*, five criteria against a weighting set before I looked.", "Then the pick written in *Pages*, and everything zipped.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open r11_hiking_boots, name the two files", 30, ["In *Finder*, in my Documents, I open the folder *r eleven hiking boots*.", "Two files: the *brief* as a PDF, and a blank *sheet* I have to fill and send back."]], ["SETUP", 5, "Preview — brief.pdf, read the three asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what they want.", "Three asks. Which boot wins on the specs. Why wet grip gets thirty percent weight.", "And watch the weight: one sheet says pair, the rest per boot."]], ["SETUP", 6, "Open Safari, Numbers, Pages from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to look up why limestone matters.", "*Numbers*, for the scoring sheet.", "And *Pages*, for the summary they get back."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything I need is open, so I will get into the boots.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["PREVIEW", 8, "Open spec_vallmar_alpin3.pdf, read the spec aloud", 42, ["In *Preview* I click *Finder* in the sidebar, then open the first spec: *spec vallmar alpin3 dot p d f*.", "Vallmar Alpin 3: *six twelve grams per boot*, EU42, *HydroSeal* three-layer membrane, *five millimetre lugs*, Kaldera XT compound.", "Twelve millimetre drop, *one hundred and eighty-nine euros*. Footer says *per boot*, which is the right way to quote it."]], ["PREVIEW", 9, "Open spec_terrafox_swift.pdf, spot the trap", 44, ["Next spec: *spec terrafox swift dot p d f*.", "Terrafox Swift Low: *eight seventy-six grams*. But the row says *weight, pair* — that is both shoes together.", "So I halve it: *four thirty-eight grams per boot*. No membrane at all, lug depth is blank — they did not list it.", "Eight millimetre drop, *one hundred and thirty-nine euros*. That is the trap laid out."]], ["PREVIEW", 10, "Open spec_nordkamm_midtr.pdf, the middle contender", 32, ["Third spec: *spec nordkamm midtr dot p d f*.", "Nordkamm Mid TR: *five hundred and five grams per boot*, *AquaStop* two-layer membrane, *four point five millimetre lugs*, GripStone MX compound.", "Ten millimetre drop, *one hundred and fifty-nine euros*. Right in the middle of the other two, every axis."]], ["SAFARI", 11, "Wikipedia karst page, why wet grip matters", 48, ["Now to *Safari*. I search *karst* and click the Wikipedia page.", "Scroll down to the *dissolution* section. Limestone is calcium carbonate, which *rainwater dissolves* because the rain is slightly acidic.", "The result: *smooth, polished rock*. Smooth plus wet is where hard shallow lugs *let go* — so wet grip gets thirty percent weight in my scoring.", "That is not my opinion, it is how limestone creeps and what it does to your feet."]], ["NUMBERS", 12, "Open boot_scores.xlsx, describe the grey and yellow sections", 30, ["Back to *Finder*, I open *boot scores dot x l s x* in *Numbers*.", "*Grey* cells are the specs I read off the sheets. *Yellow* is mine — weights, scores, and the weighted totals.", "The five criteria are wet grip, waterproofing, weight, ankle support, and price."]], ["NUMBERS", 13, "Type the specs into the yellow cells", 28, ["In row five, Vallmar: *six one two* grams, *one eight nine* euros, yes for waterproofing.", "Row six, Terrafox: *four three eight* grams — the halved pair — *one three nine* euros, no waterproofing.", "Row seven, Nordkamm: *five zero five* grams, *one five nine* euros, yes."]], ["NUMBERS", 14, "Type the five scores, out of five", 42, ["Column E, wet grip. Vallmar gets *five* out of five for the Kaldera grip. Terrafox gets *two* — hard compound on wet limestone is no good.", "Nordkamm gets *four* — it is the middle contender.", "Column F, waterproofing. Vallmar *five*, Terrafox *one* — no membrane — Nordkamm *four*.", "Column G, weight. Vallmar is heavy so *one*, Terrafox is light so *five*, Nordkamm *four*."]], ["NUMBERS", 15, "Finish the scores and enter the formula", 74, ["Column H, ankle support. Vallmar *five* — high cut — Terrafox *two*, Nordkamm *four*.", "Column I, price. Vallmar is dear so *one*, Terrafox is cheap so *five*, Nordkamm *four* — middle price, middle score.", "Now cell J five. I type the formula: *equals zero point three star e five plus zero point two five star f five plus zero point two star g five plus zero point one five star h five plus zero point one star i five*.", "I say it aloud: thirty percent wet grip, twenty-five percent waterproofing, twenty percent weight, fifteen percent support, ten percent price."]], ["NUMBERS", 16, "Drag the formula down to rows 6 and 7", 22, ["The little square handle at the bottom right of the cell. I drag it down to J six and J seven.", "Three totals land: *three point eight zero*, *two point six five*, *four point zero zero*."]], ["NUMBERS", 17, "Read the results and set the verdict dropdowns", 32, ["Vallmar three point eight zero. Terrafox two point six five. Nordkamm four point zero zero — the winner.", "The *Verdict* column is a dropdown. Vallmar: *Reject*. Terrafox: *Reject*. Nordkamm: *Buy*.", "// weights add to one, so totals stay out of five. Nordkamm is a four everywhere, check it lands exactly 4.00"]], ["NUMBERS", 18, "Fill the penalty block — weight difference from Nordkamm", 32, ["Scroll down to the penalty block. Cell B twenty: Vallmar minus Nordkamm is *one zero seven* grams per boot.", "Cell C twenty: Nordkamm minus Terrafox is *minus sixty-seven* — that is sixty-seven grams lighter.", "B twenty-one and C twenty-one are the same numbers, but per thousand steps instead of per boot."]], ["NUMBERS", 19, "Explain the weight penalty in human terms", 42, ["One step lifts one boot. So one hundred and seven grams extra per step is one hundred and seven *kilograms* extra per thousand steps.", "On my fourteen point six kilometre loop, that is about twenty-one thousand steps.", "One hundred and seven kilograms times twenty-one thousand steps divided by a thousand steps per kilogram... call it over *two tonnes* of lifting.", "That is the cost of the Vallmar, in my knees."]], ["NUMBERS", 20, "Select Boot and Weighted total columns, create a chart", 36, ["Now I select the *Boot* column and the *Weighted total* column. Command-click to add the second column.", "Click the *Chart* button in the toolbar, then *2D Column chart*.", "The title is *Weighted total, out of five*. Turn on *Value Labels* so the numbers show on the bars."]], ["NUMBERS", 21, "Export the chart as boot_scores.pdf", 26, ["Click an empty cell. *File*, *Export To*, *P D F*.", "Save it as *boot scores dot p d f* into the folder."]], ["PREVIEW", 22, "Open boot_scores.pdf, markup the winner", 32, ["Back in *Preview*, I open *boot scores dot p d f*.", "Click the *markup* button in the toolbar — the pen tip.", "An *arrow* pointing at the *Nordkamm* bar. Text beside it: *Nordkamm Mid TR - four point zero zero*.", "It is the only bar that reads exactly four."]], ["PREVIEW", 23, "Export the marked-up PDF as boot_chart.png", 22, ["*File*, *Export*, format *P N G*, named *boot chart dot p n g*, into the folder.", "The marked-up version as a picture for my notes."]], ["PAGES", 24, "Blank template, heading, and opening paragraph", 40, ["In *Pages*, I click *Blank* and *Create*.", "Heading: *Boot replacement - the pick*.", "Paragraph: I am *buying Nordkamm at one fifty-nine euros*. The *Nordkamm scores four point zero* versus three point eight zero for Vallmar and two point six five for Terrafox."]], ["PAGES", 25, "Explain the trade-offs and copy the chart", 48, ["Continue: The Terrafox is *sixty-seven grams lighter*, but it *loses on wet limestone* — no membrane, hard compound.", "The Vallmar grips better and carries more support, but it *costs one hundred and seven kilograms of lifting per thousand steps* — and thirty euros more.", "What the Nordkamm gives up: the stiff shank and the crampon welt, so it is *not a February boot*.", "Now I go back to *Numbers*, click the chart, and *Command C*."]], ["PAGES", 26, "Paste the chart and export the summary", 30, ["Back in *Pages*, *Command V* to paste the chart under the text.", "*File*, *Export To*, *P D F*, named *boot pick dot p d f*, into the folder."]], ["FINDER", 27, "Select the three exports and compress", 30, ["Back in *Finder*. Three files: the *chart*, the *marked-up image*, and the *summary page*.", "I select all three, right-click, *Compress three items*."]], ["FINISH", 28, "Rename deliverables.zip, closing line, hold on recorder", 44, ["Rename the archive *deliverables dot zip*.", "So: the *Nordkamm wins* at four point zero, ahead of three point eight zero and two point six five.", "The *light pair loses* on wet limestone — hard lugs, no membrane.", "The *heavy pair costs one hundred and seven kilograms per thousand steps* — over two tonnes on my loop.", "159 euros, bought.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "r12_ride_clip", "title": "Ride highlight clip with Creative Commons credit", "group": "Outdoors and cycling", "apps": ["Safari", "iMovie", "TextEdit", "QuickTime Player"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["I run the social account for my cycling club, and Friday needs a forty-five second clip.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// only Finder, Safari, iMovie, TextEdit, QuickTime Player, Notes, Preview may open", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through the apps", 25, ["No club footage this summer, so I need a Creative Commons clip, properly credited, cut to exactly forty-five seconds.", "So: the footage and the licence in *Safari*, the edit in *iMovie*, and the check in *QuickTime*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 56, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "First, the footage on *Safari*, checking the licence before I touch a single frame.", "Then the cut made in *iMovie* — forty-one seconds of the ride, a title card with the credit, one dissolve.", "Then the caption written in *TextEdit* while the file downloads.", "Then verify the finished file in *QuickTime*, and zip it up.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open r12_ride_clip, name the file", 28, ["In *Finder*, in my Documents, I open the folder *r twelve ride clip*.", "One file: the *brief* as a PDF, which tells me exactly what to do."]], ["SETUP", 5, "Preview — brief.pdf, read the asks aloud", 34, ["I double-click *brief dot p d f* so it opens in *Preview*, to see what they want.", "Forty-five seconds at *ten eighty p*, not the first forty-five seconds — the camera work is no good.", "A *title card*, *one dissolve*, and the *credit* must survive on the file itself, because clips travel captionless."]], ["SETUP", 6, "Open Safari, iMovie, TextEdit, QuickTime — one reason each", 28, ["From the *Dock*: *Safari*, to find the footage and check the licence.", "*iMovie*, because that is where the edit gets made.", "*TextEdit*, for the caption file they can drop into their post.", "And *QuickTime*, to verify the final file before I ship it."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything I need is open, so I will get into the clip.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Open archive.org, search Ride with Wendy", 36, ["In *Safari* I go to *archive dot o r g* and search *ride with wendy*.", "Click the first result, and the item page opens. I can see the *creator: Doug Whitfield*.", "Right there at the top."]], ["SAFARI", 9, "Click the licence link and read the CC BY 4.0 deed", 40, ["Click the *licence* link.", "*Creative Commons Attribution Four Point Oh*. I say it clearly: *CC BY Four Point Oh*.", "I *can share it and adapt it*, even commercially. The one condition is *attribution* — I must credit the creator.", "Back to the item page."]], ["SAFARI", 10, "Show All, describe the file and start download", 42, ["Click *Show all* to see every file in the item.", "Scroll down to *lightcheck dash G H zero one zero six three six dot M P four*, resolution *nineteen twenty by ten eighty*.", "*Three hundred megabytes*. Click it to start the download.", "// do NOT watch the progress bar - it runs for about five minutes. The next three beats fill that time with real narrated work"]], ["TEXTEDIT", 11, "Create caption.txt while the file downloads", 42, ["In *TextEdit*, *File*, *New Document*. Go to *Format* menu, *Make Plain Text*.", "Type the caption: *Ridge line, Saturday nine*.", "Credit line: *Doug Whitfield, Creative Commons Attribution Four Point Oh*.", "Add the URL to the archive item so they can check the licence themselves.", "Save it as *caption dot t x t* into the folder."]], ["IMOVIE", 12, "Create new project, name it Summer on the ridge", 48, ["In *iMovie*, *File*, *New*, then *Movie*, with no template.", "A blank project appears with an empty timeline at the bottom.", "Name the project *Summer on the ridge* — this name will be in all the metadata.", "Look at the duration readout at the top right of the screen. It must end at *forty-five point zero seconds* exactly.", "Right now it shows zero seconds because the timeline is empty."]], ["FINDER", 13, "Check the Downloads folder, file is there", 36, ["Back to *Finder*, click *Downloads* in the sidebar.", "The file has arrived: *lightcheck dash G H zero one zero six three six dot M P four*.", "Check the *size* in the info panel — it says *three hundred megabytes*, which matches the archive page exactly.", "This is the complete file."]], ["IMOVIE", 14, "Import media, select and import the downloaded file", 48, ["Back in *iMovie*, click *Import Media* on the left sidebar.", "A dialog appears. Folder is set to *Downloads*. I can see *lightcheck dash G H zero one zero six three six*.", "Select it and click *Import Selected*.", "The clip gets imported into the *Library* on the left, and iMovie shows me a preview."]], ["IMOVIE", 15, "Skim and clip, note what to skip", 44, ["The clip appears in the library. Move the *skim cursor* across it to preview what is in it.", "The first *twenty seconds* is just the camera setting up — lens cap off, checking focus.", "The brief says *skip that part* entirely. I want forty-one seconds of the actual ride.", "The whole file is *one minute nineteen seconds* long, which gives me plenty of slack."]], ["IMOVIE", 16, "Drag-select from 00:20 to 01:01, verify forty-one seconds", 48, ["Click at the *twenty-second mark* and hold, then drag to the *one-minute one-second mark*.", "That is exactly *forty-one seconds* — from the end of the camera work to forty-one seconds into the ride.", "Drag this selection into the timeline at the bottom of the window.", "The readout in the top right corner shows *forty-one point zero seconds*. That is the footage I want."]], ["IMOVIE", 17, "Add title card, two lines with credit", 58, ["Click the *Titles* tab on the left panel.", "Drag the *Standard* title style and drop it *before* the footage clip — this style has a top line and a bottom line.", "Click inside the title on the timeline to edit the text.", "Type the top line: *Summer on the ridge*.", "Type the bottom line: *Footage: Doug Whitfield · CC BY Four Point Oh*.", "Set the duration to *five point zero seconds* in the inspector, click *Apply*.", "The readout now shows *forty-six seconds total* — the title added one second, but the dissolve will subtract it back."]], ["IMOVIE", 18, "Add cross-dissolve between title and footage", 62, ["Click the *Transitions* tab on the left panel.", "Drag *Cross Dissolve* onto the join between the title and the footage clip — the line where they meet in the timeline.", "Double-click the transition to open its settings panel.", "Set the duration to *one point zero* second exactly — the default is usually point five, but I need one.", "Click *Apply* and the transition is set.", "Look at the readout in the top right. It must now say *forty-five point zero* seconds exactly.", "This is right because the dissolve *overlaps* the two clips: five plus forty-one minus one equals forty-five."]], ["IMOVIE", 19, "Play the beginning to verify credit is on screen", 32, ["Click the *play* button to preview the first ten seconds.", "The title card appears first, with both lines of credit visible.", "Then the forty-one seconds of footage starts, at the twenty-second mark of the footage.", "The credit *rides on the clip itself* — that is what the licence requires."]], ["IMOVIE", 20, "Export to file as ridge_highlight.mp4", 48, ["*File*, *Share*, *File*.", "On the dialog: resolution is *ten eighty p*, not four K — bigger than the source invents detail.", "Quality: *High*, then *Better Quality*.", "Name it *ridge highlight*, and save to the folder.", "// iMovie will render for 30-60 seconds - sit with this window open and let it finish"]], ["QUICKTIME", 21, "Open the exported file, show Movie Inspector", 40, ["*QuickTime Player*, open *ridge highlight dot m p four* from the folder.", "*Window*, *Show Movie Inspector* — this opens a panel on the right with file details.", "Resolution: *nineteen twenty by ten eighty* pixels. Duration: *zero zero forty-five* — exactly forty-five seconds.", "Play a few seconds to see the credit card and the footage itself."]], ["FINDER", 22, "Select both files and compress", 28, ["Back in *Finder*. Two files: *ridge highlight dot m p four* and *caption dot t x t*.", "Select both, right-click, *Compress two items*."]], ["FINISH", 23, "Rename deliverables.zip, closing line, hold on recorder", 48, ["Rename the archive *deliverables dot zip*.", "*CC BY Four Point Oh* — Doug Whitfield. That is what the licence lets me do.", "*Forty-one seconds* of footage, *five-second* title card with the credit, *one dissolve* between them.", "Exactly *forty-five seconds*, *ten eighty p*, verified in QuickTime.", "Zipped and ready for Friday's post to the club.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "r13_activity_dashboard", "title": "Eight-week activity dashboard", "group": "Outdoors and cycling", "apps": ["Numbers", "Safari", "Preview", "Pages"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["I ride with a club on Sundays and I have got a hundred and eighteen kilometre ride booked in September.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// only Finder, Numbers, Safari, Preview, Pages, Notes may open - everything else quit", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through the apps", 24, ["I pulled eight weeks of numbers off my watch, and I need to know if the training is working.", "So: resting heart rate in *Safari*, three charts in *Numbers*, and the summary written in *Pages*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 48, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "First, what resting heart rate actually tells me, in *Safari*.", "Then eight weeks of watch data in *Numbers* — steps, heart rate, and active minutes against workouts.", "Then the dashboard marked up in *Preview*.", "Then the summary written in *Pages*, and everything zipped.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open r13_activity_dashboard, name the two files", 30, ["In *Finder*, in my Documents, I open the folder *r thirteen activity dashboard*.", "Two files: the *brief* as a PDF, and the *raw data* from my watch as a C S V."]], ["SETUP", 5, "Preview — brief.pdf, read the three asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what they want.", "Three charts. *Steps per day* — are the weekly walks normal. *Resting heart rate* — is the training working.", "*Active minutes against workouts* — did one drop while the other held."]], ["SETUP", 6, "Open Safari, Numbers, Preview, Pages — one reason each", 28, ["From the *Dock*: *Safari*, to look up what resting heart rate means.", "*Numbers*, for the data and the three charts.", "*Preview*, to check the page will fit on one sheet. *Pages*, for the written summary."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything I need is open, so I will get into the data.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Wikipedia heart rate page, resting heart rate section", 32, ["In *Safari* I search *heart rate wikipedia* and click the page.", "Scroll to the *Resting heart rate* section. Normal is *sixty to a hundred* beats per minute.", "But *trained cyclists sit lower*. A falling resting heart rate is the *direction I want*."]], ["NUMBERS", 9, "Open activity.csv, describe the eight weeks", 36, ["In *Numbers*, I open *activity dot c s v*.", "*Eight weeks*, Monday starting, *first of June to the twenty-sixth of July*. Rows are weeks.", "Columns: average steps per day, active minutes, workouts, and resting heart rate.", "Click the empty heart rate cell on *twenty-second of June* — the watch was charging that week. Leave it *blank*."]], ["NUMBERS", 10, "Format the table, bold header, widen columns", 34, ["Bold the *header row* — Week, Avg steps, Active min, Workouts, Resting HR.", "*Widen every column* so the numbers are clear and do not overlap.", "Give the table a name: *Weekly activity, June-July twenty twenty-six*.", "Point at the *thirteenth of July* row — that is the heatwave week, where everything dips."]], ["NUMBERS", 11, "Select Week and Avg steps columns, create chart", 32, ["Select the *Week* column and the *Avg steps* column.", "Click the *Chart* button in the toolbar, then *2D Column*.", "*Columns* because each week is a separate bucket, not one continuous reading.", "Title: *Average steps per day*. Drag the chart below the table."]], ["NUMBERS", 12, "Point at the short seventh bar, the heatwave week", 32, ["Look at the chart that appeared. Six bars are tall, around ten thousand to eleven thousand.", "But the seventh bar, week of *thirteenth of July*, is *short* — that is the heatwave week.", "Steps dropped to nine thousand one hundred and forty-three because the heat stopped people walking around town.", "// this is the visual evidence of the heatwave impact"]], ["NUMBERS", 13, "Select week and Resting HR columns for second chart", 40, ["Click the table header. Select the *Week* column to start.", "Now I *Command-click* the *Resting HR* column — I say it aloud so it is clear what I am selecting.", "Two columns selected. Chart button, then *2D Line*.", "*Lines* are for things measured over and over, like heart rate week by week."]], ["NUMBERS", 14, "Set Y axis manually to 50-60, show the trend", 40, ["Title: *Resting heart rate, b p m*.", "The heart rate only changes by a few beats over eight weeks. From *zero*, that is *flat as a floor*.", "So I set the Y axis by hand. *Format*, *Axis*, *Value*, set minimum to *fifty*, maximum to *sixty*.", "Now the trend is *obvious* — the line falls from left to right, and that is the good news."]], ["NUMBERS", 15, "Select week, active minutes, and workouts for third chart", 40, ["For the third chart, click the *Week* column header to start.", "*Command-click* the *Active minutes* column — I say it.", "*Command-click* the *Workouts* column as well.", "Now I have three columns selected. Chart button, and I pick *2D 2-Axis*, the last option in the row."]], ["NUMBERS", 16, "Set series: minutes as column, workouts as line", 46, ["Title: *Active minutes and workouts*.", "On the *Series* tab, I see both data series. *Active minutes* is a *Column*. *Workouts* is a *Line* on the secondary axis.", "The reason: minutes are in the hundreds — two hundred seventy-four, two hundred forty-eight. Workouts are single digits — four, five.", "On one shared axis, the workouts line lies flat on the floor because the scale is wrong. Two axes solve this by letting each scale be right for its data."]], ["NUMBERS", 17, "Arrange the three charts in a row, check page fit", 40, ["Drag all three charts to line up side by side under the table, all roughly the same width.", "The stepped bar chart on the left, the falling heart rate line in the middle, the two-axis chart on the right.", "Once they are arranged, *File*, *Print* preview to check it fits on *one page*.", "// if text wraps to page 2, shrink the charts or table slightly and try again"]], ["NUMBERS", 18, "Check one page, export the sheet as activity_dashboard.pdf", 32, ["*File*, *Print*, and scroll down to check it fits on *one page*. The three charts should line up without wrapping.", "*Cancel* the print dialog.", "*File*, *Export To*, *P D F*, *Best quality*, into the folder.", "Name it *activity dashboard dot p d f*."]], ["PREVIEW", 19, "Open the PDF, markup the short steps bar", 44, ["In *Preview*, I open *activity dashboard dot p d f*.", "Click the *markup* button — the pen tip icon in the toolbar.", "Draw an *oval* around the *short bar* on the steps chart — the thirteenth of July bar is clearly the shortest.", "Add a *text box* beside it: *13 Jul heatwave, minus eighteen percent steps, workouts held*.", "This annotates the problem and the solution right on the chart."]], ["PREVIEW", 20, "Save the marked-up PDF", 24, ["*File*, *Save*.", "The marked-up version is saved over the original file.", "// this is the version that will go into the email — the chart with the annotation"]], ["PAGES", 21, "Blank template, heading with date and route", 36, ["In *Pages*, *Blank*, *Create*.", "Heading: *Eight-week activity dashboard*.", "Subheading: *First of June to twenty-sixth of July twenty twenty-six, building for the one-eighteen kilometre ride*.", "// this subheading frames why I am tracking these numbers"]], ["PAGES", 22, "Type the four summary lines", 36, ["Type four lines. Mean steps over the eight weeks: *ten thousand and ninety-three* a day.", "Best week: *eleven thousand one hundred and fifty*, sixth of July.", "The thirteenth: *nine thousand one hundred and forty-three*, eighteen percent down, but workouts held at four.", "Resting heart rate *fifty-eight* in week one, *fifty-four* in week eight — that is the headline."]], ["PAGES", 23, "Explain the training impact", 34, ["Add: The *heat stopped the walking, not the training*. Active minutes fell only nine point five percent, but workouts held steady at four.", "Heart rate falling from fifty-eight to fifty-four — that is the one number that says *the training is doing something*.", "// the point: steady workouts plus falling resting heart rate means the training is working"]], ["PAGES", 24, "Export as activity_summary.pdf", 28, ["*File*, *Export To*, *P D F*, named *activity summary dot p d f*, into the folder.", "// check the page is one sheet, not two - if it wraps to page 2, shrink the text slightly"]], ["FINDER", 25, "Select the two PDFs and compress", 32, ["Back in *Finder*. Two files are ready: *activity dashboard dot p d f* with the annotation, and *activity summary dot p d f* with the notes.", "Select both files, right-click, *Compress two items*.", "// the dashboard is the visual story, the summary is the text story"]], ["FINISH", 26, "Rename deliverables.zip, closing line, hold on recorder", 62, ["Rename the archive *deliverables dot zip*.", "Eight weeks, *about ten thousand steps a day* on average. One bad week in the heat — *walking stopped, not training*.", "*Resting heart rate falling from fifty-eight down to fifty-four beats per minute*, the headline.", "The training *is working*. The September ride is doable.", "I will *book the hotel* for that week.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "r14_elevation_goal", "title": "Elevation gain goal tracker", "group": "Outdoors and cycling", "apps": ["Numbers", "Safari", "Pages", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["This one is my own, not work. I set myself a hundred thousand metres of climbing this year.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// only Finder, Numbers, Safari, Pages, Preview, Notes may open - everything else quit", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through the apps", 25, ["I have not checked the total since February, and I need to know what is left before the club calendar comes out.", "So: the log and the tracker in *Numbers*, and the plan written in *Pages*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 54, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "First, the scale of it, in *Safari*, so the big numbers mean something.", "Then the log and the tracker in *Numbers* — the running total, the share of the goal, and what is left per month.", "Then the chart marked up in *Preview*.", "Then the plan written in *Pages*, and everything zipped.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open r14_elevation_goal, name the three files", 30, ["In *Finder*, in my Documents, I open the folder *r fourteen elevation goal*.", "Three files: the *brief*, the monthly *log*, and the *tracker sheet* I have to fill."]], ["SETUP", 5, "Preview — brief.pdf, read the three asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what they want.", "The running total and the share of the goal. How many metres I need per month from here.", "And a *chart* that shows the months, this year against last year."]], ["SETUP", 6, "Open Safari, Numbers, Pages — one reason each", 28, ["From the *Dock*: *Safari*, to picture the metres with a real climb.", "*Numbers*, for the data and the tracker.", "*Pages*, for the plan."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything I need is open, so I will get into the data.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Wikipedia Mont Ventoux, Bedoin climb section", 38, ["In *Safari* I search *mont ventoux wikipedia* and click the page.", "Scroll to the *Bedoin* section. The climb from Bedoin is *one thousand six hundred and seventeen metres* of ascent.", "One Ventoux is one unit of climbing — I use it to picture the big numbers."]], ["NUMBERS", 9, "Open monthly.csv, describe the seven rows", 42, ["In *Numbers*, I open *monthly dot c s v*.", "*Seven rows*, *January to July*. Month, rides, metres in twenty twenty-six and twenty twenty-five, and notes.", "Point at *February* — collarbone, I was off the bike three weeks.", "Point at *July* — the head unit died on the twelfth, so six hundred and twenty metres that month was read off the map, not recorded by the watch."]], ["NUMBERS", 10, "Sum the 2026 metres column", 32, ["Click the *twenty twenty-six metres* column letter to select the entire column.", "The sum reads in the *status bar at the bottom: fifty-four thousand three hundred* metres."]], ["NUMBERS", 11, "Open elevation_tracker.xlsx, describe grey and yellow", 34, ["Now I open *elevation tracker dot x l s x*, the tracker sheet.", "*Grey* cells come from the log. *Yellow* cells are mine — I build them with *formulas*, by *clicking cells*, not typing addresses."]], ["NUMBERS", 12, "Build cumulative 2026 formula in column B", 42, ["Cell B three, January. I type *equals*, then *click* the January metres cell in the log.", "Cell B four, February. Type *equals*, *click* the cell above, type *plus*, *click* the cell to the left.", "Then *drag the handle down* to July. The total lands on *fifty-four thousand three hundred* — it matches the raw sum.", "// formulas built by clicking, never by typing cell addresses"]], ["NUMBERS", 13, "Build percentage of goal formula", 32, ["Now column C, percentage of goal. Type *equals*, *click* the cumulative cell, type *divided by one hundred thousand times one hundred*.", "*Drag down* to July.", "*Format* as a number with *one decimal*. July reads *fifty-four point three* percent."]], ["NUMBERS", 14, "Build cumulative 2025 the same way", 32, ["Column D, cumulative twenty twenty-five. Same formula shape: equals, click, plus, click, drag down.", "It ends on *fifty-two thousand six hundred and sixty* metres. I climbed *three point one percent more* last year at this point."]], ["NUMBERS", 15, "Set Ahead/Behind dropdowns for each month", 36, ["Column E, *Against last year*. Dropdowns: January *Ahead*, February through April *Behind*, then May and beyond *Ahead*.", "The flip happens at May — that is where twenty twenty-six catches up and passes twenty twenty-five."]], ["NUMBERS", 16, "Fill the note cells with calculations", 36, ["Scroll down to the yellow note cells.", "Remaining: one hundred thousand minus fifty-four thousand three hundred is *forty-five thousand seven hundred*.", "Months left: *five* — August through December.", "Needed per month: forty-five thousand seven hundred divided by five is *nine thousand one hundred and forty*.", "Best month so far: *May, nine thousand eight hundred and fifty*."]], ["NUMBERS", 17, "Read the results aloud and calculate ratios", 48, ["*Fifty-four thousand three hundred metres*, *fifty-four point three percent* of the goal.", "The year is *fifty-eight percent gone* on August second — I am *behind*.", "*Nine thousand one hundred and forty* metres per month from here — *eighteen percent* above my average so far of seven thousand seven hundred and fifty-seven.", "That is *five point seven Ventoux ascents* per month. Still *three point one percent up* on last year — the riding is fine, the goal is just big."]], ["NUMBERS", 18, "Select Month and both metres columns, create chart", 36, ["Select the *Month* column, the *twenty twenty-six metres* column, and the *twenty twenty-five metres* column.", "Click the *Chart* button, *2D Column*.", "Title: *Metres climbed by month, twenty twenty-six versus twenty twenty-five*.", "The chart shows *February as a hole* — collarbone — and *May as a peak*, the only month that already clears the nine thousand one hundred and forty line."]], ["NUMBERS", 19, "Set Y axis label and export PDF", 34, ["*Format*, *Axis*, *Value*, title: *Metres climbed*.", "Click an empty cell. *File*, *Export To*, *P D F*, named *elevation tracker dot p d f*, into the folder."]], ["PREVIEW", 20, "Open the PDF, markup a line at nine thousand one hundred forty", 48, ["In *Preview*, open *elevation tracker dot p d f*.", "Click the *markup* button — the pen tip.", "Draw a *line* across the chart at the *nine thousand one hundred and forty* level.", "Add a *text box*: *nine thousand one hundred and forty metres per month needed*."]], ["PREVIEW", 21, "Export the marked-up PDF as PNG", 28, ["*File*, *Export*, format *P N G*, named *elevation chart dot p n g*, into the folder."]], ["PAGES", 22, "Blank template, type the numbers and decision", 42, ["In *Pages*, *Blank*, *Create*.", "Type a short page: *Fifty-four point three percent done, nine thousand one hundred and forty metres a month from here.*", "The year is *fifty-eight percent gone* — I am *behind on pace*, but the *riding is fine, the goal is just big*.", "Decision: *book Ventoux week in September, sign up for every Aitana day*."]], ["PAGES", 23, "Export as climb_plan.pdf", 22, ["*File*, *Export To*, *P D F*, named *climb plan dot p d f*, into the folder.", "// check the page is one sheet"]], ["FINDER", 24, "Select the three exports and compress", 34, ["Back in *Finder*. Three files: the *chart*, the *marked-up image*, and the *plan*.", "Select all three, right-click, *Compress three items*."]], ["FINISH", 25, "Rename deliverables.zip, closing line, hold on recorder", 84, ["Rename the archive *deliverables dot zip*.", "Fifty-four point three by the end of July, *nine thousand one hundred and forty metres a month* from here.", "*It is not that the riding went badly* — the goal is just big.", "*Three point one percent up* on last year.", "Ventoux week *gets booked*.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "r15_safety_brief", "title": "Group ride safety brief", "group": "Outdoors and cycling", "apps": ["Numb
