ers", "Safari", "Freeform", "Pages"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["I ride with a local cycling club; Sunday I am ride captain for a sixty-two kilometre run.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// only Finder, Numbers, Safari, Freeform, Pages, Preview, Notes may open", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through the apps", 27, ["Fourteen people in two groups, and I need a safety board for the start and a brief for the group chat.", "So: the hazards in *Numbers*, the forecast in *Safari*, the board in *Freeform*, and the write-up in *Pages*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 48, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "First, the hazards in *Numbers*, and Sunday's forecast in *Safari*, because wet gravel changes the rule.", "Then the safety board built in *Freeform*, readable from two metres away.", "Then the written brief in *Pages*.", "Then check both in *Preview*, and zip them up.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open r15_safety_brief, name the two files", 28, ["In *Finder*, in my Documents, I open the folder *r fifteen safety brief*.", "Two files: the *brief* and a *hazards list* to work from."]], ["SETUP", 5, "Preview — brief.pdf, read the three asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what they want.", "A *board* that is readable from two metres away, one *gravel rule*, and the *emergency contact form*.", "The *table* in both the board and the brief."]], ["SETUP", 6, "Open Numbers, Safari, Freeform, Pages — one reason each", 28, ["From the *Dock*: *Numbers*, for the hazard data.", "*Safari*, to check the forecast.", "*Freeform*, to draw the board. *Pages*, for the brief."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything I need is open, so I will get into the route.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["NUMBERS", 8, "Open hazards.csv, identify the six points", 40, ["In *Numbers*, I open *hazards dot c s v*.", "*Six rows*: kilometre, hazard name, detail, action.", "Two of the six are *regroups* — where we *wait* for the second group. Kilometre *eighteen*, Cafe Nou, and kilometre *forty-one*, Font de la Teula.", "The other four are *hazards* — places that need a safety rule."]], ["NUMBERS", 9, "Calculate the gap between regroups", 32, ["Between the two regroups, click the *empty cell* in the kilometre column.", "Type *equals forty-one minus eighteen*, press *Return*. It reads *twenty-three* kilometres.", "That is the *longest stretch* the two groups do not see each other. Delete this calculation — it was just to show the gap."]], ["NUMBERS", 10, "Point out the blank action cell", 28, ["Look at kilometre *twenty-seven*, the gravel descent. The *action cell is blank* — that is *today's decision*.", "That is what I build on the board."]], ["SAFARI", 11, "Meteocat forecast for Sunday at Mura", 38, ["In *Safari* I go to *meteo dot c a t*, search for the municipal forecast, and find *Mura*.", "Read *Sunday's* forecast aloud. The forecast says *dry*.", "Dry means the gravel rule is: *single file, three bike gaps*. Wet gravel is stricter — one rider at a time."]], ["FREEFORM", 12, "Create new board, draw the route line", 40, ["In *Freeform*, *File*, *New*, *Board*.", "*Shapes*, *Lines*, drag a *long horizontal line* across the board. This is the route flattened out.", "Put *zero* at the left end and *sixty-two point four* at the right."]], ["FREEFORM", 13, "Add title text, biggest font", 32, ["Click *Text* and add the biggest text on the board: *MURA LOOP dash sixty-two point four K M dash fourteen riders comma two groups*.", "Position it at the left end of the route line."]], ["FREEFORM", 14, "Add green circles for the two regroups", 32, ["*Shapes*, *Circle*. Draw a *green circle* at roughly one-third of the way along the line — that is kilometre eighteen.", "Label it: *REGROUP dot K M eighteen dash Cafe Nou*.", "Draw another *green circle* at roughly two-thirds — kilometre forty-one.", "Label: *REGROUP dot K M forty-one dash Font de la Teula*."]], ["FREEFORM", 15, "Add four orange triangles for hazards", 48, ["*Shapes*, *Triangle*. Four orange triangles for the four hazards, at approximately *seven, twenty-three, twenty-seven, and fifty-four* kilometres.", "Label each one with the kilometre, the hazard name, and the action:", "Seven point four: *BLIND JUNCTION dot give way, no shouting through*.", "Twenty-two point six: *LEVEL CROSSING dot unclip and wait, up to four minutes*.", "Twenty-seven: *GRAVEL DESCENT dot SINGLE FILE comma three BIKE GAPS* — make this one *boldest*.", "Fifty-three point nine: *UNLIT TUNNEL dot rear lights on, no overtaking*."]], ["FREEFORM", 16, "Add corner box with kit and emergency", 36, ["Bottom right corner, add a *text box*: *Tool kit and four tubes: JORDI group two*.", "Add: *Emergency:* then a blank space in the shape *six underscore underscore space underscore underscore underscore space underscore underscore underscore*, for phone number on paper.", "The emergency number stays *blank* — I fill it by hand on the printed copies."]], ["FREEFORM", 17, "Export the board as PDF", 22, ["*File*, *Export as PDF*, named *route board dot p d f*, save to the folder.", "The board is *one page*, readable from two metres."]], ["PAGES", 18, "Blank template, heading with date and distance", 28, ["In *Pages*, *Blank*, *Create*.", "Heading: *Sunday sixth September dash Mura loop, sixty-two point four K M*."]], ["PAGES", 19, "Add roll-out details", 28, ["Next line: *zero eight one five club house, fourteen riders, two groups of seven*."]], ["PAGES", 20, "Copy the four hazard rows from Numbers", 40, ["Back to *Numbers*. Select the *four hazard rows only* — not the regroups, just the four numbered hazards.", "Say *Command C* aloud, and copy them.", "Back to *Pages*, *Command V* to paste. Drag the *table edge* to fit the page width."]], ["PAGES", 21, "Add three summary lines", 32, ["Below the table, add three lines:", "First: *Twenty-three K alone between regroups, gravel descent sits inside this gap.*", "Second: *Gravel rule: single file, three bike gaps — the loose line is one bike wide.*", "Third: *Jordi group two carries the tool kit and four spare tubes. Emergency number by hand.*"]], ["PAGES", 22, "Export the brief as PDF", 22, ["*File*, *Export To*, *P D F*, named *safety brief dot p d f*, save to the folder.", "// check it is one page"]], ["PREVIEW", 23, "Check both PDFs before compression", 28, ["In *Preview*, open *route board dot p d f*, *View*, *Actual Size*. The colours read and nothing is off the edge.", "Then open *safety brief dot p d f*. Check it is *one page*, the table reads, and the *emergency number is blank*."]], ["FINDER", 24, "Select both PDFs and compress", 24, ["Back in *Finder*. Two files: *route board dot p d f* and *safety brief dot p d f*.", "Select both, right-click, *Compress two items*."]], ["FINISH", 25, "Rename deliverables.zip, closing line, hold on recorder", 150, ["Rename the archive *deliverables dot zip*.", "Sixty-two point four K, *fourteen riders in two groups*. Regroups at *eighteen and forty-one* leaving *twenty-three K alone*.", "*Four hazards*. Gravel is *single file, three bike gaps*.", "*Jordi has the tool kit*. Emergency number goes on by hand.", "Board and brief ready for Sunday.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "r16_nutrition_plan", "title": "Long ride nutrition plan", "group": "Outdoors and cycling", "apps": ["Safari", "Numbers", "Pages", "Preview", "Finder"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["I ride a lot, and on the twenty-ninth I'm doing 160 kilometres on my own with one shop stop.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 29, ["Last time I ran out of food at 120 and crawled home, so I need to know exactly what goes in my pockets.", "So: the absorption ceiling in *Safari*, the foods and the plan in *Numbers*, and the fuelling card in *Pages*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 54, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "First, the absorption ceiling in *Safari*, so I know how many carbs an hour is actually usable.", "Then the twelve foods in *Numbers*, to pick what to carry and total the carbs against the target.", "Then the fuelling card built in *Pages*.", "Then mark it up in *Preview*, and zip it up.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open r16_nutrition_plan, name the three files", 30, ["In *Finder*, in my *Documents*, I open the folder *r sixteen nutrition plan*, because everything for this lives there.", "Three files: the *brief* as a PDF, the *foods* as a CSV, and an empty *fuelling sheet* I have to fill."]], ["SETUP", 5, "Preview — brief.pdf, read the three asks aloud", 34, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what they want.", "Three hundred and ninety grams of carbs, the weight and cost, the caffeine timing, and a *twenty euro* budget.", "The ride is 160 kilometres, one shop stop at 92."]], ["SETUP", 6, "Open Safari, Numbers, Pages from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to find the absorption ceiling for carbs.", "*Numbers*, because I have to fill a sheet with the twelve foods and the quantities.", "And *Pages*, to make the card for my top-tube bag."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything I need is open, so I will get into the numbers.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Wikipedia sports drink page, read the carbohydrate section", 28, ["In *Safari*, I go to Wikipedia's *sports drink* page, and scroll to the carbohydrate section.", "*Sixty grams an hour* is about the ceiling. Past that your gut can't absorb it, it just sits there."]], ["SAFARI", 9, "Read the absorption explanation, say why mixed sources matter", 26, ["*Mixed glucose and fructose* absorb by two different routes.", "So a mix plus bananas sits better than four gels in a row.", "// close the Safari window with the red button before moving on"]], ["NUMBERS", 10, "Open foods.csv from the folder, point at each column", 32, ["Back in the folder, I double-click *foods dot c s v*, and it opens in *Numbers*.", "*Twelve items*, weighed as carried — skin on the banana, with the drink mix in the bottle.", "Carbs, weight, caffeine, cost."]], ["NUMBERS", 11, "Point at the three items that are out: sachet, nuts, cola", 30, ["The sachet from Denmark: caffeine column is *blank*, and *four seventy-five euros*, price outlier.", "Salted nut mix: *nine grams* of carbs for *fifty grams* of weight — terrible ratio.", "Cola: *three hundred and fifty grams* to carry for *thirty-five grams* of carbs."]], ["NUMBERS", 12, "Open fuelling_plan.xlsx, describe grey and yellow cells", 26, ["Now I open *fuelling plan dot x l s x*. *Grey* cells are given. *Yellow* is mine to fill.", "Quantities for gel, bar, banana, drink mix, and everything else marked zero."]], ["NUMBERS", 13, "Type the quantities: 4, 3, 2, 2, then the rest", 24, ["Four gels — one an hour for the back half of the ride.", "Three oat bars. Two bananas, thirty-five cents each and they go down easily early.", "Two bottles, because that is what the cages hold."]], ["NUMBERS", 14, "Fill the weight column: 260, 216, 384, 320", 26, ["Weight column: *two hundred and sixty* grams for the gels.", "*Two hundred and sixteen* for the bars. *Three hundred and eighty-four* for the bananas — they are the heaviest item.", "*Three hundred and twenty* for the bottles."]], ["NUMBERS", 15, "Fill the cost column: 5.80, 3.60, 0.70, 4.20", 24, ["Cost: *five euros eighty* for the gels. *Three sixty* for the bars. *Seventy cents* for the bananas, great value.", "*Four twenty* for the bottles."]], ["NUMBERS", 16, "Fill the dropdown 'In plan?' column per item", 24, ["Dropdown column *In plan?*: the gel is *In plan*, the bar is *In plan*, the banana is *In plan*, the bottle is *In plan*.", "The sachet, nuts and cola are all *Leave at home*. Everything else is *Backup*."]], ["NUMBERS", 17, "Select the four weight cells, check the total", 24, ["Now I select the four *weight* cells. The sum is *eleven hundred and eighty grams*, about *two point six pounds* on the bike.", "The bottles are the heaviest, but the bananas are dense."]], ["NUMBERS", 18, "Select the four cost cells, confirm under budget", 22, ["I select the four *cost* cells. The sum is *fourteen euros thirty*, leaving *five euros seventy* of my twenty euro budget.", "That sachet outlier cost a fortune."]], ["NUMBERS", 19, "Select carbs column, read the individual totals aloud", 26, ["Carbs: *eighty-eight* from the gels, *one hundred and twenty* from the bars, *fifty-four* from the bananas, *one hundred and thirty-four* from the bottles.", "// read them down the column to confirm each entry"]], ["NUMBERS", 20, "Select all four carbs cells, read the sum in the status bar", 28, ["I select the four carbs numbers and look at the bottom status bar.", "The sum reads *three hundred and ninety-six* against a target of *three ninety*. Six grams over across the whole ride."]], ["NUMBERS", 21, "Type the totals line: 396 g, 60.9 g/h, 1180 g, 14.30 EUR, 200 mg caffeine", 34, ["Below that I type the totals. *Three hundred and ninety-six grams* of carbs.", "That works out to *sixty point nine grams an hour*, six over my target across six and a half hours.", "*Eleven hundred and eighty grams* carried. *Fourteen euros thirty* of my twenty euro budget. Caffeine *two hundred milligrams*."]], ["NUMBERS", 22, "Select four names and four carb totals, insert 2D column chart", 32, ["Now I select the four food *names* and the four *carb totals* beside them.", "Chart button in the toolbar, *2D column chart*.", "A picture of where those *three hundred and ninety-six grams* comes from."]], ["NUMBERS", 23, "Type the chart title, read the bottles row", 26, ["Title: *Where the 396 g comes from*.", "The bottles are the *biggest single block at 134 grams*, so the refill at ninety-two kilometres is not optional."]], ["NUMBERS", 24, "Drag chart to clear space, then File > Export To > PDF", 26, ["I drag the chart aside so nothing is hidden, then *File*, *Export To*, *P D F*, into the *r16* folder.", "Named *fuelling plan dot p d f*."]], ["PAGES", 25, "Blank template, custom heading", 22, ["In *Pages*, *Blank* template, *Create*.", "Heading: *160 km - fuelling card - 60 g/h*."]], ["PAGES", 26, "Type the seven hour lines with their carb totals", 34, ["*H1* thirty-four grams. *H2* forty-seven. *H3* sixty. *H4* forty, refill at Prats ninety-two.", "*H5*, from four hours thirty, *caffeine starts*, seventy-eight grams.", "*H6* ninety-five. *H6.5* forty-two, final climb."]], ["PAGES", 27, "Type the totals and caffeine note at the bottom", 24, ["Bottom line: *396 grams, 1180 grams, 14.30 euros*.", "Then: *caffeine 200 milligrams, none before 4 h 30*."]], ["PAGES", 28, "Select the heading, apply bold via the Format panel", 24, ["I select the heading and click *Bold* in the Format panel on the right.", "The card is printed at half size and goes in my top-tube bag."]], ["PAGES", 29, "File > Export To > PDF, save as fuel_card.pdf", 22, ["*File*, *Export To*, *P D F*, and I point it at the *r16* folder.", "Named *fuel card dot p d f*."]], ["PREVIEW", 30, "Open fuel_card.pdf, click the markup pen-tip icon", 24, ["I open *fuel card dot p d f* in *Preview*, and click the *markup* button in the toolbar — the pen tip.", "I'm going to mark the caffeine window."]], ["PREVIEW", 31, "Draw a box around H5 to H6.5, add text label", 28, ["A *box* around *H5* through *H6.5*, the last two hours of the ride.", "Text beside it: *caffeine window - last 2 h*."]], ["PREVIEW", 32, "File > Export as PNG, save as fuel_card_marked.png", 22, ["*File*, *Export*, format *P N G*, named *fuel card marked*, so the marked-up version is a picture I can drop into a message."]], ["FINISH", 33, "Finder — select the three exports > Compress", 24, ["Back in *Finder*. Three files came out of this: the *plan*, the *card*, and the *marked card*.", "I select all three, right-click, *Compress 3 Items*."]], ["FINISH", 34, "Rename deliverables.zip, closing line, hold on the recorder window", 44, ["I rename the archive *deliverables dot zip*.", "So: four gels, three oat bars, two bananas, two bottles. *Three hundred and ninety-six grams* against a *three ninety target*.", "*Eleven hundred and eighty grams* carried. *Fourteen euros thirty* of twenty. No caffeine before *four hours thirty*.", "Sachet, nuts and cola stay home.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "r21_pc_build", "title": "PC build parts list and cost model", "group": "Gaming, tech and making", "apps": ["Safari", "Numbers", "Pages", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["Everything is ready, so I will get started.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed · Do Not Disturb on · desktop empty · no disk images mounted"]], ["SETUP", 2, "The opening — what you are building and why", 28, ["My 2017 desktop can't hold 1440p, so I'm pricing a replacement build.", "I need to know which of eleven parts to cut to land under fifteen hundred euros.", "So I'll cost it in *Numbers*, check the supply math in *Safari*, and write the verdict in *Pages*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 52, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "Open the brief in *Preview*, and see exactly what the ceiling and the parts list are.", "Then build the running cost sheet in *Numbers*, so I can watch exactly where the total crosses fifteen hundred euros.", "Then the verdict in *Pages* — which parts I am cutting and why — and everything exported and zipped up.", "// the note itself is five short lines. You are explaining it, not reading it", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open r21_pc_build, name the three files", 30, ["In *Finder*, in my Documents, I open the folder *r twenty-one p c build*.", "Three files: the *brief* as a PDF, the *parts list* as a CSV, and an empty *cost sheet* I have to fill."]], ["SETUP", 5, "Preview — brief.pdf, read the three asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what I need to figure out.", "Eleven parts priced. Hard ceiling of fifteen hundred euros. Which parts do I downgrade, and what does each downgrade cost."]], ["SETUP", 6, "Open Safari, Numbers, Pages from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, because I need to understand why a power supply that big is a waste.", "*Numbers*, for the prices and for the cost model.", "And *Pages*, because I need to write up what each cut costs me in real terms."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything I need is open, so I will get into the build.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Open Wikipedia power supply unit page, efficiency section", 30, ["In *Safari* I search *power supply unit computer wikipedia*, and open the article.", "The *Efficiency* section: a power supply runs best near *half its rated load*.", "Eight hundred and fifty watts is headroom I won't use with one eight-core CPU and a mid-range card."]], ["NUMBERS", 9, "Open parts.csv, describe the structure and data", 50, ["Back in Finder I double-click *parts dot c s v*, and it opens in *Numbers*.", "*Eleven* parts from CPU through Wi-Fi card, priced across three shops: *Bitwerk*, *Nordlager*, *Stromhaus*.", "The graphics card is *five eighty-seven thirty-five euros*, three weeks on backorder — that sets the build date.", "It was six hundred and nineteen euros back in June, so it has come down forty euros since the sale.", "The *Notes* column holds the three cheaper options I found when pricing alternative parts."]], ["NUMBERS", 10, "Select the eleven price cells only, say Command C", 22, ["I drag across the *eleven price cells*, starting at *C5*.", "*Command C* to copy them."]], ["NUMBERS", 11, "Open build_sheet.xlsx, click cell C5, say Command V", 22, ["I close the CSV and open *build sheet dot x l s x* in the same folder.", "I click the first yellow cell at *C five*, and *Command V* to paste."]], ["NUMBERS", 12, "Create the running total, D5 equals C5", 26, ["A running total shows me *where* I cross the line, not just *that* I cross it.", "Cell *D five*: equals *C five*. Return."]], ["NUMBERS", 13, "Copy D6 equals D5 plus C6 down to row 15", 26, ["Cell *D six*: equals *D five plus C six*. Return.", "I drag the yellow handle down to the last row, so every row has its running total."]], ["NUMBERS", 14, "Read the running total result aloud", 40, ["The running total ends on *one thousand five hundred and ninety-three forty*.", "I'm *over by ninety-three euros and forty cents*.", "But more important: the total crosses my fifteen hundred ceiling at *row eight, the case*: one thousand five hundred and seven euros five.", "I still have fans, Windows and a Wi-Fi card to pay for after that — so the overage is worse than it looks."]], ["NUMBERS", 15, "Drag columns B5:C15 to make a chart", 36, ["I select the *Part* column and the *Price* column, both from rows five through fifteen.", "That is *one drag*, keeping the columns adjacent so the chart algorithm picks them up together.", "Prices from two hundred eighty-nine ninety through six hundred twenty-one: I want to see this as bars."]], ["NUMBERS", 16, "Insert chart, select 2D column, set title", 34, ["Toolbar *Chart* button. I pick *2D Column*.", "The title is *Where the one thousand five hundred and ninety-three forty goes*.", "It is a simple column chart with each part as a separate bar, priced in euros.", "Now I can see which parts take the money at a glance."]], ["NUMBERS", 17, "Read the chart and identify the biggest cost item", 46, ["Looking at the chart: the graphics card is *five eighty-seven thirty-five*, way the tallest bar.", "That is thirty-six point nine percent of the whole build in one single part — more than one third.", "The CPU and cooler together are three hundred twenty-four seventy-five, about twenty percent.", "Everything else below the case is under thirty-five euros each — I cannot shop my way out of a ninety-three euro gap by hunting around on fans and cables."]], ["NUMBERS", 18, "Add cheaper options and dropdown verdict", 38, ["A new column: *Cheaper option*, with three candidate swaps.", "The one terabyte N V Me: minus fifty-five euros off the two terabyte.", "The six hundred fifty watt supply: minus thirty-eight euros off the eight fifty.", "The steel case: minus twenty-two euros off the mesh.", "Dropdown below: which rows do I swap? The answer is *Swap three, keep the rest*."]], ["NUMBERS", 19, "Add four note lines, explain the cuts and headroom", 42, ["*Note lines*: First pass costs one thousand five hundred and ninety-three forty euros, over budget by ninety-three forty.", "Two obvious swaps save ninety-three fifteen, which leaves me at one thousand five hundred and twenty-five cents over.", "The third cut, the steel case, saves twenty-two euros, landing at one thousand four hundred and seventy-eight twenty-five.", "Headroom left under the ceiling: *twenty-one seventy-five euros*."]], ["NUMBERS", 20, "File > Export To > PDF, name build_sheet.pdf", 22, ["*File*, *Export To*, *P D F*, and save it in the r twenty-one folder as *build sheet*."]], ["PREVIEW", 21, "Copy the chart, open in Preview, mark it up", 38, ["Back in Numbers I select the entire chart and *Command C* to copy it.", "In *Preview* I open *File* > *New from Clipboard* so the chart is pasted into a new document.", "I click the *markup* toolbar button — the pen tip icon in the toolbar.", "Then I *draw an arrow* pointing at the tallest bar, which is the graphics card."]], ["PREVIEW", 22, "Add a label and export PNG", 26, ["Next to the arrow I type *37 percent of the build* — the card is the single biggest line.", "*File*, *Export*, format *P N G*, named *spend chart*."]], ["PAGES", 23, "Create a blank document, write the verdict heading and costs", 38, ["In *Pages* I create a *Blank* document.", "A heading: *P C build verdict*.", "Subheading: *Final cost: one thousand four hundred seventy-eight twenty-five euros*.", "The body starts with the three swaps: two obvious ones save ninety-three fifteen and land twenty-five cents over.", "Add the steel case for another twenty-two euros to get to one thousand four hundred seventy-eight twenty-five."]], ["PAGES", 24, "Write the impact of the power supply cut", 34, ["The six-fifty-watt supply cut: that is free money.", "Nothing I run in this build approaches eight fifty watts.", "A supply runs most efficiently near half its rated load, and a single eight-core CPU and mid-range card stay well below half of eight fifty."]], ["PAGES", 25, "Write the impact of the storage and case cuts", 34, ["The one-terabyte drive cut is the one I will feel: half the space, about six large games installed instead of twelve.", "The steel case cut: it runs warmer and louder than mesh, but that is annoying, not fatal.", "The cooling does the work, just with more noise and a bit of extra heat."]], ["PAGES", 26, "File > Export To > PDF, name build_verdict.pdf", 22, ["*File*, *Export To*, *P D F*, and save as *build verdict*."]], ["FINDER", 27, "Select three exports, compress, rename deliverables.zip", 24, ["Back in *Finder* I select the three exports: *build sheet*, *spend chart*, and *build verdict*.", "Right-click, *Compress three items*."]], ["FINISH", 28, "Rename archive, closing line, hold on the recorder window", 52, ["I rename the archive *deliverables dot zip*.", "So: one thousand five hundred and ninety-three forty euros down to one thousand four hundred and seventy-eight twenty-five.", "That leaves twenty-one seventy-five under the ceiling.", "The card stays untouched — it is the whole reason for the build.", "Two swaps get me most of the way, and the steel case swap gets me the rest.", "The card is on three weeks backorder, so that is the first part I order tonight — everything else can wait.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "r22_gpu_compare", "title": "Compare five GPUs on benchmarks", "group": "Gaming, tech and making", "apps": ["Safari", "Numbers", "Pages", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["Everything is ready, so I will get started.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed · Do Not Disturb on · desktop empty · no disk images mounted"]], ["SETUP", 2, "The opening — what happened and why you need a benchmark", 27, ["My graphics card died Tuesday, so I'm pricing five replacements.", "I need to know which one truly gives the most frames per euro, not just the cheapest.", "So I'll crunch benchmarks in *Numbers*, check frame rate on *Safari*, and write the pick in *Pages*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 48, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "Open the brief in *Preview*, and see the shortlist and the warning about the VX-780's missing run.", "Then work the frame data in *Numbers* — averages, then euros per frame — to find which card is really the best value.", "Then the recommendation in *Pages*, and everything exported and zipped up.", "// the note itself is five short lines. You are explaining it, not reading it", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open r22_gpu_compare, name the three files", 30, ["In *Finder*, in my Documents, I open the folder *r twenty-two g p u compare*.", "Three files: the *benchmark data* as CSV, the *brief* as a PDF, and an empty *summary sheet* I have to fill."]], ["SETUP", 5, "Preview — brief.pdf, read the three asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*.", "Three things: euros per frame, a chart, and one card picked. There's a warning on the V X-seven eighty: it has a missing run."]], ["SETUP", 6, "Open Safari, Numbers, Pages from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to look up what a published frame rate really means.", "*Numbers*, for the benchmarks and for the comparison sheet.", "And *Pages*, for the write-up and the reasoning behind the pick."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything I need is open, so I will get into the data.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Open Wikipedia frame rate page, read the definition", 39, ["In *Safari* I search *frame rate wikipedia* and open the first result.", "A published fps number is an *average* over a run — it hides the worst moments.", "So I need to check the individual game runs before I buy, not just trust the average."]], ["NUMBERS", 9, "Open bench.csv, describe the five cards and six games", 49, ["Back in Finder I open *bench dot c s v* in *Numbers*.", "*Five* graphics cards: Auron *V X-four sixty* through *V X-seven eighty*, and the *Cygnet* flagship.", "*Six* games, all running at one-four-four-zero-p, with a *blank cell* at V X-seven eighty row, Skyward Drift column.", "Prices go from *two hundred seventy-nine* up to *six hundred twenty-one* euros."]], ["NUMBERS", 10, "Add Average column header, create the formula", 42, ["Next column: *Average*.", "Cell *H two*: equals *A V E R A G E* of the six game cells for that card.", "Important: A V E R A G E skips blank cells. The V X-seven eighty row has a blank at Skyward Drift, so that card averages over five games, not six.", "That is the right way — a missing run is missing, not zero."]], ["NUMBERS", 11, "Copy average formula down five rows", 31, ["I press Return and drag the yellow fill handle down to fill all five cards.", "The V X-seven eighty averages over five games, the rest over six."]], ["NUMBERS", 12, "Add EUR per frame column, create the value formula", 35, ["Next column: *EUR per fps*.", "Cell *I two*: equals *price divided by average fps*.", "Lower is better — the shortest bar on a chart wins."]], ["NUMBERS", 13, "Copy value formula down, read the results", 45, ["I fill down to all five rows.", "The winner is *not* the cheapest card: V X-four sixty is three seventy-four, V X-six eighty is three sixty-four.", "The six-eighty is twenty-nine percent faster than the four-sixty for only twenty-five percent more money."]], ["NUMBERS", 14, "Add the vs-pick column, showing relative cost", 39, ["Next column: *vs pick*.", "A simple percentage formula relative to the winner, three sixty-four.", "Minus twenty-two percent, zero, plus fifteen, plus twenty-three, plus thirty-one percent."]], ["NUMBERS", 15, "Select Card and EUR/fps columns, make a chart", 39, ["I select the *Card* column, then *Command click* to also select *EUR per fps*.", "Toolbar *Chart* button, *2D Column*.", "The title is *Cost per frame at one-four-four-zero-p*."]], ["NUMBERS", 16, "Enable axis labels on the chart", 35, ["In the *Chart* tab on the right, I tick *Axis Labels* so the numbers show on each bar.", "Now I can see at a glance which bar is shortest."]], ["NUMBERS", 17, "Read the honest limitation: Ashfall Legion", 45, ["Back at the table: the V X-six eighty sits near one hundred in five games.", "Then *Ashfall Legion* with ray tracing ultra: *sixty-one fps*.", "The flagship holds one hundred and eighteen there — nearly *double* the six-eighty, not the thirty-one percent advantage.", "That gap is big enough to write down, not bury in an average."]], ["NUMBERS", 18, "Open gpu_summary.xlsx, fill the grey cells", 43, ["I close the CSV and open *gpu summary dot x l s x*.", "*Grey* cells are the data I already have.", "The *yellow* cells are for me to fill with the numbers from my analysis."]], ["NUMBERS", 19, "Fill the summary row with averages and calculations", 39, ["Five rows of cards: for each one, the *average fps* from my table, the *EUR per fps*, and a *Verdict* dropdown.", "The winner is *Buy this*. The rest are *Pass*.", "And at the bottom: three key lines about the trade-off and the caveat."]], ["NUMBERS", 20, "Add note lines explaining the flagship trade", 37, ["Three lines: the six-eighty wins on value.", "The flagship is thirty-one percent faster for seventy-eight percent more money.", "And Ashfall Legion is the hard case: the six-eighty falls to sixty-one, the flagship holds one hundred eighteen."]], ["NUMBERS", 21, "Copy chart from Numbers, paste into summary sheet", 33, ["I go back to the benchmark window, select the chart, and *Command C*.", "In the summary sheet I click below the table and *Command V* to paste it."]], ["NUMBERS", 22, "File > Export To > PDF, name gpu_summary.pdf", 31, ["*File*, *Export To*, *P D F*, and save as *gpu summary*."]], ["PAGES", 23, "Create blank document, write the recommendation", 74, ["In *Pages* I create a *Blank* document.", "Heading: *Graphics card pick, Auron V X-six eighty*.", "The body: this is the value winner at three sixty-four euros per frame.", "It is the *second-cheapest* card, not the cheapest — the cheapest costs more per frame.", "The V X-six eighty is twenty-nine percent faster than the four-sixty for only twenty-five percent more money.", "Now the flagship trade: the Cygnet RT twelve is thirty-one percent faster than my pick for seventy-eight percent more cost. At one-sixty-five hertz, that trade is not worth it.", "The caveat: Ashfall Legion ray tracing is where the gap opens up — the six eighty falls to sixty-one fps, the flagship holds one eighteen.", "So I write that down as the honest trade-off."]], ["PAGES", 24, "File > Export To > PDF, name gpu_recommendation.pdf", 31, ["*File*, *Export To*, *P D F*, and save as *gpu recommendation*."]], ["PREVIEW", 25, "Open gpu_summary.pdf, mark the shortest bar", 41, ["I open *gpu summary dot p d f* in *Preview*, and click the *markup* toolbar button.", "An *arrow* pointing at the *shortest bar* — the V X-six eighty.", "Text box: *Best value, three sixty-four E U R per frame*."]], ["PREVIEW", 26, "Export as PNG", 31, ["*File*, *Export*, format *P N G*, named *gpu chart annotated*."]], ["FINDER", 27, "Select three exports, compress, rename deliverables.zip", 33, ["Back in *Finder* I select *gpu summary*, *gpu recommendation*, and *gpu chart annotated*.", "Right-click, *Compress three items*."]], ["FINISH", 28, "Rename archive, closing line, hold on the recorder window", 51, ["I rename the archive *deliverables dot zip*.", "Five cards, six games: the winner is the V X-six eighty at three sixty-four euros per frame.", "Second-cheapest card, not cheapest.", "The caveat is Ashfall Legion ray tracing, where the gap to the flagship is much bigger than the average suggests.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "r23_game_backlog", "title": "Game backlog priority tracker", "group": "Gaming, tech and making", "apps": ["Safari", "Numbers", "Pages", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["Everything is ready, so I will get started.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed · Do Not Disturb on · desktop empty · no disk images mounted"]], ["SETUP", 2, "The opening — the backlog problem and the scoring rule", 27, ["I own thirty-two games I've never played, and there's a sale coming in October.", "I need to know which five actually deserve my evenings, on enjoyment per hour.", "So I'll pull hours from *Safari*, score them in *Numbers*, and write the plan in *Pages*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 48, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "Open the brief in *Preview*, and see the scoring rule and the floor on interest.", "Then score and sort the whole list in *Numbers*, so the real priority order shows itself.", "Then the plan in *Pages* — the five I am playing next — and everything exported and zipped up.", "// the note itself is five short lines. You are explaining it, not reading it", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open r23_game_backlog, name the three files", 30, ["In *Finder*, in my Documents, I open the folder *r twenty-three game backlog*.", "Three files: the *game list* as CSV, the *brief* with my scoring rule as a PDF, and an empty *backlog sheet* I have to fill."]], ["SETUP", 5, "Preview — brief.pdf, read the rule and the asks", 32, ["I double-click *brief dot p d f* so it opens in *Preview*.", "The rule: interest out of ten, *times ten, divided by hours to beat*.", "And the drop rule: anything at interest three or lower drops, no matter the score."]], ["SETUP", 6, "Open Safari, Numbers, Pages from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to look up game lengths on HowLongToBeat.", "*Numbers*, for the game list and for the scoring.", "And *Pages*, for the five-game plan I hand in."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything I need is open, so I will get into the backlog.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Open HowLongToBeat, explain the three figures per game", 40, ["In *Safari* I search *how long to beat*, and open the site.", "Every game on HowLongToBeat has *three* figures: Main Story, Main plus Extras, and Completionist.", "My column is *Main Story every time*, because mixing them would punish some games unfairly."]], ["NUMBERS", 9, "Open games.csv, describe the thirty-two titles", 50, ["Back in Finder I open *games dot c s v* in *Numbers*.", "*Thirty-two* games I own and have never played.", "Shortest is *five point five* hours, longest is *one hundred and five*.", "One row has a blank cell — that does not matter for the scoring."]], ["NUMBERS", 10, "Add Priority score column, create the formula", 36, ["Next column: *Priority score*.", "Cell *E two*: equals *interest* times *ten*, divided by *hours to beat*.", "This gives me enjoyment per hour."]], ["NUMBERS", 11, "Copy score formula down thirty-two rows", 32, ["I press Return and drag the yellow handle down to fill all the games.", "Every game gets a score now."]], ["NUMBERS", 12, "Add Verdict column, create the IF formula", 36, ["Next column: *Verdict*.", "Cell *F two*: equals *I F* interest less than or equal to three, then *Drop*, otherwise *Keep*.", "This is my hard floor."]], ["NUMBERS", 13, "Copy verdict formula down, count the drops", 32, ["I fill down to all thirty-two rows.", "*Exactly* six games read *Drop*."]], ["NUMBERS", 14, "Sort the entire table by priority score, descending", 40, ["*Organize* toolbar, *Sort* tab.", "*Sort Entire Table* — not just one column, or the rows scramble.", "Priority score, *Descending*, so the highest scores rise to the top."]], ["NUMBERS", 15, "Read the top five games aloud, with hours and scores", 46, ["*Paper Lanterns*: eight point five hours, interest ten, score *eleven point seven six*.", "*Salt and Signal*: nine hours, *eleven point eleven*.", "*Nine Volt Heart*: nine point seven five hours, *ten point two six*.", "All three are short indies with high interest — a game I want badly that only asks nine hours wins every time."]], ["NUMBERS", 16, "Read the two big RPGs and note their rank", 40, ["*Verdant Kingdoms II*: eighty-four point five hours, interest nine, rank *seventeen of thirty-two*.", "*Ashfall Chronicles*: ninety-two hours, interest nine, rank *eighteen of thirty-two*.", "Same interest as the top games, but eighty-plus hours each costs more than my whole top five."]], ["NUMBERS", 17, "Read Turbo Bandit Rally and the drop list", 40, ["*Turbo Bandit Rally*: fifth shortest game at five point five hours, but interest *three*, so *Drop*.", "A short game I do not want is still a game I do not want.", "The drop list has six titles and *three hundred and thirty-four* hours total."]], ["NUMBERS", 18, "Open backlog_priority.xlsx, explain the grey and yellow", 38, ["I close the CSV and open *backlog priority dot x l s x*.", "*Grey* cells hold the data that came with the sheet.", "*Yellow* cells are where I fill in my top five and the decision notes."]], ["NUMBERS", 19, "Copy the five game titles and scores from the CSV", 34, ["From the CSV I select the top five titles and their scores, *Command C*.", "I paste them into the yellow rows, *Command V*, said aloud."]], ["NUMBERS", 20, "Set verdict dropdowns and add four note lines", 56, ["For each of the top five, the *Verdict* is a dropdown: *Play next* or *Play soon*.", "Then four key lines: exactly *six* games flagged Drop — interest three or lower drops, no matter the score.", "Hours in the top five: *fifty-three hours* total.", "Hours locked up in the drop list: *three hundred and thirty-four hours* of games I do not want.", "Best long RPG and where it ranks: *Verdant Kingdoms II, seventeenth of thirty-two* — same interest as the top games, but eighty-four hours is expensive in evenings."]], ["NUMBERS", 21, "File > Export To > PDF, name backlog_priority.pdf", 32, ["*File*, *Export To*, *P D F*, and save as *backlog priority*."]], ["PAGES", 22, "Create blank document, write the top-five plan", 44, ["In *Pages* I create a *Blank* document.", "Heading: *Backlog plan — next five games*.", "The top five with hours and scores, your own words about what appeals.", "Closing: six titles and three hundred and thirty-four hours dropped. Nothing bought before the second of October."]], ["PAGES", 23, "File > Export To > PDF, name backlog_plan.pdf", 32, ["*File*, *Export To*, *P D F*, and save as *backlog plan*."]], ["PREVIEW", 24, "Open both PDFs and confirm one page each", 36, ["I open *backlog priority dot p d f* and *backlog plan dot p d f* in *Preview*.", "Both are one page. The top five in the plan matches the priority sheet."]], ["FINDER", 25, "Select two exports, compress, rename deliverables.zip", 34, ["Back in *Finder* I select *backlog priority* and *backlog plan*.", "Right-click, *Compress two items*."]], ["FINISH", 26, "Rename archive, closing line, hold on the recorder window", 52, ["I rename the archive *deliverables dot zip*.", "Thirty-two games scored on interest per hour.", "Short indies on top, big RPGs mid-table and that is honest, six titles and three hundred and thirty-four hours dropped.", "*Paper Lanterns* tonight.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "r24_desk_diagram", "title": "Desk setup diagram", "group": "Gaming, tech and making", "apps": ["Freeform", "Numbers", "Safari", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["Everything is ready, so I will get started.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed · Do Not Disturb on · desktop empty · no disk images mounted"]], ["SETUP", 2, "The opening — new arm arriving and the reason for a plan", 28, ["My new monitor arm arrives Thursday, and I get one Saturday to fit it.", "Last time I clamped first and had to redo the tray, so I need the right edge before touching it.", "So I'll check clearances in *Numbers*, then scale the desk in *Freeform*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 49, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "Open the brief in *Preview*, and see the three questions — plan view, which edge, and whether the second screen lies flat.", "Then check the measurements in *Numbers*, so I know which edge actually has clearance for the clamp.", "Then draw it to scale in *Freeform*, and everything exported and zipped up.", "// the note itself is five short lines. You are explaining it, not reading it", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open r24_desk_diagram, name the two files", 30, ["In *Finder*, in my Documents, I open the folder *r twenty-four desk diagram*.", "Two files: the *measurements* as a CSV, and the *brief* as a PDF."]], ["SETUP", 5, "Preview — brief.pdf, read the three asks", 32, ["I double-click *brief dot p d f* so it opens in *Preview*.", "Three things I need to figure out: a scaled plan view. Which edge the monitor arm clamps to. Whether the second screen fits lying down."]], ["SETUP", 6, "Open Safari, Numbers, Freeform from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, because the arm and screens both use the V E S A hole pattern.", "*Numbers*, for the measurements and edge calculations.", "And *Freeform*, because that is where I draw the plan to scale."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything I need is open, so I will work through the desk.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here onwards", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Open Wikipedia VESA mounting interface, check the specs", 39, ["In *Safari* I search *V E S A flat display mounting interface wikipedia*.", "Both my screens use *one hundred by one hundred millimeter holes*.", "The monitor arm is fine. The problem is at the desk end: the clamp needs *six* centimetres of clear edge to bite on."]], ["NUMBERS", 9, "Open measurements.csv, describe the desk and items", 49, ["Back in Finder I open *measurements dot c s v* in *Numbers*.", "First row: the desk, *one hundred sixty by eighty centimetres*.", "Then twelve items that live on the desk: monitor, tray, speakers, lamp, keyboard, mouse pad, laptop dock, notebook, coaster, and the second screen dimensions."]], ["NUMBERS", 10, "Read the clamp constraint: back edge fails, left edge works", 39, ["The cable tray brackets sit four centimetres in from the back edge.", "The clamp needs six — two centimetres short.", "The left edge has eight point five centimetres before the crossbar.", "*That* is where the arm goes."]], ["NUMBERS", 11, "Add a Squares column, convert centimetres to grid units", 35, ["New column: *Squares*, to convert to Freeform grid units.", "Cell header: one grid square is *five* centimetres.", "Formula: equals *value divided by five*. Drag down to fill all rows."]], ["NUMBERS", 12, "Calculate monitor placement: centre and span", 39, ["The arm reaches sixty-eight centimetres from its post at the left edge.", "The monitor centre lands at sixty-four centimetres from the left edge — *sixteen centimetres left of desk centre*.", "The monitor spans thirty-three point three to ninety-four point seven centimetres."]], ["NUMBERS", 13, "Calculate second screen fit: landscape vs portrait", 39, ["After the main monitor, there is thirty-six point three centimetres of free run.", "*Lying down*, the second screen is fifty-three point five: *seventeen centimetres too wide*.", "*On its end*, the second screen is thirty-two point four: *fits, three point nine centimetres spare*."]], ["NUMBERS", 14, "Read the converted grid squares aloud", 35, ["Desk: *thirty-two by sixteen* squares.", "Main monitor: *twelve point three* squares.", "Second screen portrait: *six point five* squares.", "Keyboard: *eight point nine*, mouse pad *five*."]], ["FREEFORM", 15, "Create new board, show the grid", 31, ["In *Freeform* I create a *New board*.", "*View*, *Show Grid*, so my squares are visible for scaling."]], ["FREEFORM", 16, "Draw the desk rectangle, label it", 35, ["*Shapes*, *Basic*, *Rectangle*.", "I drag a rectangle *thirty-two by sixteen* squares, pale fill, dark border.", "Label: *Desk top one hundred sixty by eighty*."]], ["FREEFORM", 17, "Draw the monitor arm clamp on the left edge", 35, ["*Red* rectangle, *one square* wide, *straddling the left edge*.", "Label: *Arm clamp*.", "This shows the arm position and solves the back-edge problem."]], ["FREEFORM", 18, "Draw the cable tray along the back edge", 35, ["*Grey* rectangle, inside the back edge, *eight squares* wide.", "Label: *Cable tray — brackets four centimetres in*.", "This is why the back edge is out."]], ["FREEFORM", 19, "Draw the main monitor off-centre to the left", 35, ["A *rectangle about twelve squares* wide, positioned *left of the desk centre*.", "Label: *Main monitor twenty-seven inch*.", "The arm reach puts it here, not dead centre — honest drawing."]], ["FREEFORM", 20, "Draw the second screen portrait in the gap", 39, ["A *tall rectangle*, about *six point five by four point five* squares, positioned in the free run to the right of the main monitor.", "Label: *Second screen twenty-four inch, portrait*.", "This decides the orientation: landscape would be seventeen centimetres too wide; portrait fits with four to spare."]], ["FREEFORM", 21, "Draw the speakers and lamp in the back corners", 35, ["*Small* rectangles for the speakers either side of the back row, each eight centimetres wide.", "A lamp base in the right corner, twelve centimetres wide."]], ["FREEFORM", 22, "Draw the front-row items with widths", 39, ["Front row: keyboard at eight point nine squares, mouse pad at five, laptop dock at two point one, notebook at four point two, coaster at two.", "The front row is never the problem — this layout has plenty of gaps and one hundred twenty-two centimetres of one hundred sixty, leaving thirty-seven spare."]], ["FREEFORM", 23, "Add the scale caption to the board", 31, ["A text box: *Scale: one grid square equals five centimetres*.", "A plan view without a scale is a doodle, not a diagram."]], ["FREEFORM", 24, "Export the diagram as PDF", 31, ["*File*, *Export as P D F*, and save as *desk plan*."]], ["PREVIEW", 25, "Open desk_plan.pdf, add markup arrows and labels", 41, ["I open *desk plan dot p d f* in *Preview*, and click the *markup* toolbar button.", "Arrow pointing at the back edge with label: *Back edge, four centimetres clear, need six — no*.", "Arrow pointing at the left edge: *Left edge, eight point five centimetres clear — yes*."]], ["PREVIEW", 26, "Export the marked-up plan as PNG", 31, ["*File*, *Export*, format *P N G*, named *desk plan marked*."]], ["FINDER", 27, "Select both exports, compress, rename deliverables.zip", 33, ["In *Finder* I select *desk plan* and *desk plan marked*.", "Right-click, *Compress two items*."]], ["FINISH", 28, "Rename archive, closing line, hold on the recorder window", 51, ["I rename the archive *deliverables dot zip*.", "Back edge out, four against six needed.", "Arm on the left edge, monitor sixteen centimetres left of centre, second screen portrait, and now I only have to do this once.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "r25_filament_costs", "title": "3D print filament cost calculator", "group": "Gaming, tech and making", "apps": ["Safari", "Numbers", "Pages", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["Everything is ready, so I will get started.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed · Do Not Disturb on · desktop empty · no disk images mounted"]], ["SETUP", 2, "The opening — printing at home and the market stall", 29, ["I print on a little FDM printer at home, and next month I'm taking a stall in Sabadell.", "I need to know what each print costs me, and if twelve euros is enough.", "So I'll work costs in *Numbers*, check density on *Safari*, write notes in *Pages*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 48, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "Open the brief in *Preview*, and see the spool price, the power rate, and the fifty-eight percent floor.", "Then cost every print in *Numbers* — plastic and power together — to see which ones actually clear that floor.", "Then the pricing note in *Pages*, and everything exported and zipped up.", "// the note itself is five short lines. You are explaining it, not reading it", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open r25_filament_costs, name the three files", 30, ["In *Finder*, in my Documents, I open the folder *r twenty-five filament costs*.", "Three files: the *print log* as CSV, the *brief* as a PDF, and an empty *cost sheet* I have to fill."]], ["SETUP", 5, "Preview — brief.pdf, read the rates and asks", 32, ["I double-click *brief dot p d f* so it opens in *Preview*.", "Filament spool costs twenty-four ninety-nine euros per kilogram. The printer uses point one two kilowatts, power costs fourteen cents per kilowatt hour.", "I need margin at twelve euros a piece, and a fifty-eight percent floor."]], ["SETUP", 6, "Open Safari, Numbers, Pages from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to check whether my spool really holds a kilogram.", "*Numbers*, for the print log and for the cost calculation.", "And *Pages*, for the repricing decision."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything I need is open, so I will work through the prints.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Open Wikipedia polylactic acid page, check the material", 40, ["In *Safari* I search *polylactic acid wikipedia*.", "The page confirms the density and material properties of P L A filament.", "The whole cost model rests on my filament spool *really* holding a kilogram, not an estimate."]], ["NUMBERS", 9, "Open prints.csv, describe the nine print jobs", 50, ["Back in Finder I open *prints dot c s v* in *Numbers*.", "*Nine* print jobs logged: grams in one column, print hours in another.", "*Shortest* is twenty-two grams — the aborted Benchy retry. *Longest* is six hundred and forty-two grams, the terrain panel.", "The panel is mine, not for sale. It is the outlier."]], ["NUMBERS", 10, "Open filament_costs.xlsx, explain grey vs yellow cells", 38, ["I close the CSV and open *filament costs dot x l s x*.", "*Grey* cells hold data that came with the sheet.", "*Yellow* cells are where I fill in the material cost, power cost, total cost, and margin for each print."]], ["NUMBERS", 11, "Create the material cost formula", 36, ["Material column: equals *grams times price per gram*.", "That is *grams times twenty-four ninety-nine divided by one thousand*.", "Cell *D five*, press Return, and the first print's material cost appears."]], ["NUMBERS", 12, "Create the power cost formula", 36, ["Power column: equals *hours times kilowatts times price per kilowatt hour*.", "That is *hours times nought point one two times nought point one four*.", "Cell *E five*, press Return."]], ["NUMBERS", 13, "Create the total and margin formulas", 36, ["Total: equals *material plus power*.", "Margin: equals *twelve minus total, divided by twelve, times one hundred* for a percentage.", "Cells *F five* and *G five*."]], ["NUMBERS", 14, "Copy all formulas down nine rows", 32, ["I select the four formula cells, and drag the yellow fill handle down to row thirteen.", "All nine prints now have their costs calculated."]], ["NUMBERS", 15, "Read the material and power costs, and analyze the results", 50, ["Plastic is *two and a half cents per gram*. That is the whole story.", "Electricity is *noise* — even the longest nine-hour print costs only fifteen cents in power.", "The terrain panel is six hundred and forty-two grams at two and a half cents, so *sixteen seventy-four* euros in plastic.", "At twelve euros selling price, that is *minus thirty-nine percent* — the panel cannot pay."]], ["NUMBERS", 16, "Read the three good stall prints and their margins", 46, ["The hex planter: one hundred seventy-five grams, *four fifty-three euros*, *sixty-two point three percent* margin.", "The bike light mount: one hundred sixty-eight grams, *four thirty-four euros*, *sixty-three point eight percent*.", "The dice tower: one hundred eighty-six grams, *four eighty-five euros*, *fifty-nine point six percent*.", "All three sit between fifty-nine and sixty-four percent, comfortably over my fifty-eight percent floor."]], ["NUMBERS", 17, "Read the desk lamp shade problem and calculate repricing", 48, ["The desk lamp shade: two hundred and ten grams, *five fifty-one euros*, *fifty-four point one percent*.", "That *misses* the fifty-eight percent floor by four percentage points.", "To reach fifty-eight percent margin at fifty-eight percent, the price is five fifty-one divided by nought point four two.", "That works out to *thirteen twelve euros*. So I call it *thirteen fifty*, or reprint it thinner to use less plastic."]], ["NUMBERS", 18, "Create verdict dropdowns for each print", 34, ["A new column: *Verdict*, dropdown for each row.", "Three of the stall prints: *Sell at twelve*. The lamp shade: *Reprice*. The rest: *Not for sale*."]], ["NUMBERS", 19, "Create a chart of prints and margins", 36, ["I select the *Print* column, then *Command click* the *Margin* column to multi-select.", "Toolbar *Chart*, *2D Column*.", "Title: *Margin at twelve euros per item*."]], ["NUMBERS", 20, "Read the chart and describe what it shows", 38, ["The four stall prints show as bars: three above the fifty-eight line, one below.", "The terrain panel is way off the chart at minus thirty-nine percent — a six hundred and forty-two gram print can never pay at twelve euros.", "That makes the repricing decision visual."]], ["NUMBERS", 21, "File > Export To > PDF, name filament_costs.pdf", 32, ["*File*, *Export To*, *P D F*, and save as *filament costs*."]], ["PREVIEW", 22, "Open filament_costs.pdf, mark up the 58% floor", 42, ["I open *filament costs dot p d f* in *Preview*, and click the *markup* toolbar button.", "A horizontal line across the chart at *fifty-eight percent*.", "Text box: *Fifty-eight percent floor*, and another: *Reprice to thirteen fifty*."]], ["PREVIEW", 23, "Export the marked-up chart as PNG", 32, ["*File*, *Export*, format *P N G*, named *margin chart*."]], ["PAGES", 24, "Create blank document, write the pricing decision", 52, ["In *Pages* I create a *Blank* document.", "The material rate: twenty-four ninety-nine per kilogram, so *two and a half cents per gram*.", "Power is noise. Plastic is the whole story.", "Three prints stay at twelve euros: the planter at sixty-two point three, the mount at sixty-three point eight, the tower at fifty-nine point six.", "The lamp shade at two hundred and ten grams misses at fifty-four point one.", "Reprice to thirteen fifty or reprint it thinner. That is the stall priced."]], ["PAGES", 25, "File > Export To > PDF, name pricing_note.pdf", 32, ["*File*, *Export To*, *P D F*, and save as *pricing note*."]], ["FINDER", 26, "Select three exports, compress, rename deliverables.zip", 34, ["In *Finder* I select *filament costs*, *margin chart*, and *pricing note*.", "Right-click, *Compress three items*."]], ["FINISH", 27, "Rename archive, closing line, hold on the recorder window", 54, ["I rename the archive *deliverables dot zip*.", "Plastic is two and a half cents a gram, electricity barely registers.", "Three prints stay at twelve euros. The lamp shade goes to thirteen fifty or gets redesigned.", "One thousand six hundred and twenty-five grams of plastic and power, forty-two thirty-three euros total.", "The stall is priced.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "r26_cable_audit", "title": "Cable and adapter audit", "group": "Gaming, tech and making", "apps": ["Preview", "Safari", "Numbers", "Pages"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["Everything is ready, so I will get started.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Do Not Disturb on · desktop empty · no disk images mounted", "// only Preview, Safari, Numbers, Pages may be open — everything else quit", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 38, ["New desk arrives in a fortnight, so I finally tipped out the cable drawer and counted everything.", "Today I turn that count into a *shopping list* and a *drawer map*.", "Their brief in *Preview*, the hand count in *Numbers*, prices off a shop list, and I fill the audit sheet and create an order document and drawer labels."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 53, ["In *Notes* I am typing the plan, five lines, before I touch the drawer count.", "First, their brief in *Preview*, for what counts as usable and what my budget is.", "Then the USB-C power spec in *Safari*, to order the right adapter, not the slower lookalike.", "Then the count in *Numbers*, to fill the audit sheet with what is usable.", "Then the order and drawer map built in *Pages*, and the exports zipped.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open r26_cable_audit, name the four files", 32, ["In *Finder*, in Documents, I open the folder *r twenty-six cable audit*.", "Four files: the *brief* as a PDF, the *cable count* as a CSV, a *price list* PDF, and an *audit sheet* I have to fill in."]], ["SETUP", 5, "Preview — brief.pdf, read the three asks aloud", 50, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what I need to do.", "Three asks: how many usable cables do I have now, which ones do I need to buy, and what is the euro total.", "Budget is *forty euros*, and no rebuy on spares — if I already have five of something I do not need any more."]], ["SETUP", 6, "Open Safari, Numbers, Pages from the Dock — one reason each", 32, ["From the *Dock*: *Safari*, to check the USB-C power spec.", "*Numbers*, to read the cable count and fill the audit sheet.", "And *Pages*, because that is where the order document and the drawer map get made."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything I need is open, so I will get into the data.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Google USB-C power delivery, explain EPR versus standard", 58, ["In *Safari* I search *USB-C 240W EPR*, and click the *Wikipedia* article.", "*Extended Power Range* carries *two hundred and forty watts* at forty-eight volts.", "My laptop brick is *ninety-six watts*, so E P R covers it. Standard USB-C tops out well below that.", "This is why I order *K H one one nought two* at *six forty* and not the *K H one one nought three* at *three eighty*, which is only *sixty watts*."]], ["PREVIEW", 9, "pricelist.pdf, point at all four order lines with prices", 48, ["Back to the folder, I open *pricelist dot p d f* in *Preview*, from *Kabelhoek* with V A T included.", "I can see the four product codes I need: *K H one one nought two* at *six forty*. *K H twelve nought seven* at *three forty-five*. *K H two three nought one* at *four seventy-five*. *K H three one four zero* at *two ten*.", "// keep Preview open for the prices"]], ["NUMBERS", 10, "Open cables.csv, describe the twenty-three lines", 42, ["Back to Finder, I double-click *cables dot c s v*. It opens in *Numbers*.", "*Twenty-three* lines, each one a cable type. Columns show description, quantity, and condition.", "Condition column: *good*, *worn*, or *dead*. *Good* is the only one that counts as usable. *Worn* still charges but the sleeve is splitting. Only *good* gets counted."]], ["NUMBERS", 11, "Point out the critical two-metre USB-C row", 36, ["The two-metre USB-C row is the one I use daily for the laptop. It shows *both cables are dead*, so usable is *zero* against three wanted.", "The *Micro-USB* row has *nine good* cables, all for one e-reader and one bike light. That is *seven surplus* to cull."]], ["NUMBERS", 12, "Open cable_audit.xlsx, start filling usable counts", 50, ["Now I open *cable audit dot x l s x*. Yellow cells are mine to fill, grey cells are given.", "The *Usable* column first: zero for the two-metre USB-C, two for the one-metre, two for the short, three for USB-A to USB-C.", "Then nine for Micro-USB, zero for Lightning, one for each HDMI row, one for Ethernet, one for audio, one for DisplayPort, two for the obsolete row."]], ["NUMBERS", 13, "Fill Short/spare as usable minus want", 39, ["The *Short or spare* column is usable minus want. Minus means buy, plus means cull.", "Minus three for the two-metre, zero, plus one, plus one, plus seven, minus one, minus one, zero, minus two, zero, zero, plus two.", "The *Order qty* goes only in the minus rows: three, one, one, two."]], ["NUMBERS", 14, "Look up prices and calculate line totals", 40, ["Unit prices straight off the *pricelist* from *Preview*: *six forty*, *three forty-five*, *four seventy-five*, *two ten*.", "Line total is order quantity times unit price: *nineteen twenty*, *three forty-five*, *four seventy-five*, *four twenty*.", "Bottom line total: *thirty-one sixty euro*, under the *forty euro* budget."]], ["NUMBERS", 15, "Fill the Action column dropdown or type", 36, ["The *Action* column has a dropdown with three choices. The four short rows are *Order*. The rest are either *No action* if they are fine or *Cull* if they are spare.", "// if the dropdown menu does not appear, type the words directly into the cells"]], ["NUMBERS", 16, "Fill the Drawer locations A1 through B3", 34, ["The *Drawer* column maps where each cable lives in the six-drawer unit: *A one*, *A two*, *A three*, *B one*, *B two*, *B three*.", "A dash goes in the last row for obsolete cables that are going to be binned."]], ["NUMBERS", 17, "Fill summary key lines and review totals", 32, ["At the bottom I fill four key lines: four *line items* to order, *seven cables* to cull, order total *thirty-one sixty*.", "I check the numbers once more. All totals match."]], ["NUMBERS", 18, "Export the filled sheet as PDF", 22, ["*File*, *Export To*, *P D F*. I save as *cable audit dot p d f* in the folder."]], ["PAGES", 19, "Create a new blank document for the order", 26, ["In *Pages*, I choose *Blank* and click *Create*."]], ["PAGES", 20, "Type the order heading and four product lines", 48, ["Heading: *Kabelhoek order hyphen twenty-two August twenty twenty-six*.", "Four product lines with code, quantity, and price: K H one one nought two, three at six forty equals nineteen twenty. K H twelve nought seven, one at three forty-five. K H two three nought one, one at four seventy-five. K H three one four zero, two at two ten equals four twenty.", "Bottom line: *Total thirty-one sixty euro*."]], ["PAGES", 21, "Add the Drawer map heading and insert table", 32, ["I add a new heading: *Drawer map*.", "Then *Insert*, *Table*. Plain style, two columns, six rows for A one through B three."]], ["PAGES", 22, "Fill the drawer map table with locations", 30, ["Column one: drawer labels A one, A two, A three, B one, B two, B three.", "Column two: what lives in each drawer — the cable types and quantities for that location."]], ["PAGES", 23, "Add the cull list and dead cables note", 32, ["After the table, a *Cull* line: seven Micro-USB, one short USB-C, one USB-A to USB-C, obsolete cables.", "A note: six dead cables going to the bin."]], ["PAGES", 24, "Export the order and drawer map as PDF", 22, ["*File*, *Export To*, *P D F*. Save as *reorder and drawer map dot p d f* in the folder."]], ["NUMBERS", 25, "Check the grand total one more time", 30, ["I scroll back to the total row to confirm: *four line items*, *seven cables being culled*, order total *thirty-one sixty*.", "Everything checks out. Under budget."]], ["FINISH", 26, "Compress both PDFs into deliverables.zip", 44, ["Back to *Finder*, I select the *cable audit* and *reorder* P D Fs, right-click, *Compress two items*.", "Rename to *deliverables dot zip*.", "Twenty-three cables counted, four line items to order, thirty-one sixty under budget, six-drawer map — it stays sorted this time."]]]}, {"id": "r27_boxart_restore", "title": "Straighten a scanned arcade flyer, export print-ready", "group": "Gaming, tech and making", "apps": ["Safari", "Preview", "Inkscape"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["Everything is ready, so I will get started.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Do Not Disturb on · desktop empty · no disk images mounted", "// Safari blank, downloads cleared · Inkscape launched once and quit · only Safari, Preview, Inkscape open", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 42, ["I collect retro arcade material. I want a *framed A three print* for the games room from a *Jaleco Formation Z arcade flyer* on archive dot org.", "So: *check the rights* first, *clip out the art panel*, and *export a P N G exactly twelve hundred pixels wide*.", "That is the *public domain scan*, the *Inkscape file* with the clipping still live, and the *print-ready P N G*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 56, ["In *Notes* I am typing the plan, five lines, before I touch the file.", "First, the rights on *archive dot org*, checked in *Safari*, so the scan is free to print.", "Then the scan opened in *Preview*, for its size and whether the border sits square.", "Then *Inkscape*, to clip the art panel and export it at twelve hundred pixels, not upscaled.", "Then the export reopened in *Preview*, to confirm the size and the address block is gone.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Minimize Notes and clean the desktop", 18, ["I minimise *Notes* — that is the work boundary. Clean desktop, Do Not Disturb on, *Safari* is blank.", "// Downloads list is cleared so the flyer download shows cleanly on camera"]], ["SETUP", 5, "Press Start, open Finder and navigate to the folder", 24, ["I start. In *Finder*, I navigate to *Documents*, *tasks*, *r twenty-seven box art restore*. The only file here is the brief."]], ["SETUP", 6, "Preview — brief.pdf, read the three asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*.", "An A three print from a public domain arcade flyer. *Twelve hundred pixels* wide, print-ready. The brief says *check the rights*, check the *skew*, and *don't upscale*."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["Rights check comes first — I check the licence before I download anything.", "// minimise Notes — this is the work boundary", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Type the archive.org item URL", 42, ["In *Safari* I type *archive dot org slash details slash formation hyphen z hyphen arcade hyphen flyer hyphen two*.", "The page loads. The title shows *Formation Z F C Computer P I N F O*.", "This is the right item."]], ["SAFARI", 9, "Scroll to metadata and find the rights statement", 50, ["I scroll down to the metadata section at the bottom. I find the *Rights* field.", "I read it slowly: *Public Domain Mark one point nought.*", "The rights are waived or expired. It is free to reuse, no attribution required. I can download this and frame it on the wall."]], ["SAFARI", 10, "Find the download link URL for full-size image", 38, ["I scroll back up and look for the full-size derivative. The U R L changes from *details* to *download* and adds */page/n zero w two thousand dot j p g*.", "This is the link to the full two-thousand-pixel width version."]], ["SAFARI", 11, "Control-click and save image to Downloads", 36, ["*Control-click* on the image, then *Save Image As*.", "Folder: *Downloads*. Filename: *formation z flyer source dot j p g*.", "// the downloads popover shows: one file downloaded"]], ["PREVIEW", 12, "Open JPEG in Preview and inspect dimensions", 40, ["Back to Finder, Downloads folder. I double-click the J P E G. It opens in *Preview*.", "*Tools*, *Show Inspector*. The image is *twenty-four hundred and eighty pixels* wide and *thirty-five hundred and nine* pixels tall.", "That confirms this is the full-size scan."]], ["PREVIEW", 13, "Check the skew: is the border parallel to the window", 40, ["I examine the top edge of the red printed border against the top of the window. They are *parallel*.", "This scan is already *square* to the frame. No rotation needed. The archive dot org pipeline and the flyer archivists deskewed this already.", "I can go straight to the crop."]], ["PREVIEW", 14, "Identify what stays and what goes in the crop", 32, ["What stays: the red printed border and the four small *gameplay screenshots* inside it — they are part of the artwork.", "What goes: the *white paper margin* around the edges and the *Jaleco address block* printed below the red border at the bottom."]], ["INKSCAPE", 15, "File > Import, select the JPEG and choose Embed", 36, ["In *Inkscape*, *File*, *Import*. I select the J P E G from Downloads.", "Dialog box: *Embed*, not *Link*. If I move the J P E G later, a linked image goes empty, but an embedded one carries it inside the S V G."]], ["INKSCAPE", 16, "Set image to exact dimensions with Selector tool", 32, ["*Selector* tool. In the toolbar, *Units* P X. Image position and size: *X* zero, *Y* zero.", "*Width* twenty-four eighty, *Height* thirty-five nought nine. *Return* after each one."]], ["INKSCAPE", 17, "Switch to Rectangle tool and draw over the panel", 34, ["*Rectangle* tool. I drag a rough rectangle over the red art panel area, covering the border and the four small screenshots inside.", "The rectangle goes from the red border edge to just above the address block."]], ["INKSCAPE", 18, "Set rectangle to exact art panel coordinates", 30, ["Back to *Selector* tool. Rectangle position and size: *X* thirty-nine, *Y* thirty-four.", "*Width* twenty-three ninety-six, *Height* thirty-one twenty-two. These are the art panel boundaries."]], ["INKSCAPE", 19, "Apply the clip: Select All then Clip > Set Clip", 34, ["*Edit*, *Select All* — both the image and the rectangle are now selected.", "*Object*, *Clip*, *Set Clip*. A clip hides everything outside the rectangle shape. It does not delete it."]], ["INKSCAPE", 20, "Resize the page to fit the clipped selection", 30, ["*File*, *Document Properties*, *Display* tab. Click *Resize page to drawing or selection*.", "Close the dialog. The page is now exactly the size of the clipped art panel."]], ["INKSCAPE", 21, "Draw frame rectangle and configure stroke", 48, ["*Rectangle* tool. I draw a rectangle that covers the entire page.", "*Selector* tool: *X* zero, *Y* zero, full page size.", "*Object*, *Fill and Stroke*. Fill: *X* — no paint. Stroke: paint, flat color *one A one A one A F F*, width *twenty-four pixels*."]], ["INKSCAPE", 22, "Export as PNG at exactly 1200 pixels wide", 42, ["*File*, *Export*. Click the *Page* tab. *Width* *twelve hundred*. The *Height* calculates automatically at *fifteen sixty-four*.", "Scale factor: *nought point five* — that is a reduction by half. Never upscaling.", "Filename: *formation z print dot p n g*, save to Downloads, click *Export*."]], ["INKSCAPE", 23, "Save the Inkscape file with clip kept live", 28, ["*File*, *Save As*. Save to Downloads folder.", "Filename: *formation z print dot s v g*. The clipping stays active in this file for later adjustments if needed."]], ["PREVIEW", 24, "Reopen exported PNG and verify final output", 44, ["Back to Finder, Downloads folder. I open *formation z print dot p n g* in *Preview*.", "*Tools*, *Show Inspector*. The export is *twelve hundred by fifteen sixty-four* pixels, exactly as requested.", "The border is intact, the screenshots are visible, and *no telephone number* is visible anywhere — the address block is successfully removed."]], ["FINISH", 25, "Select the three files and compress", 36, ["I select the *formation z print dot p n g*, the *formation z print dot s v g*, and the *formation z flyer source dot j p g*.", "*Control-click*, *Compress three items*.", "Rename the archive to *deliverables dot zip*."]], ["FINISH", 26, "Closing line and notes", 28, ["Public domain flyer, checked square so no straightening, cropped to the art panel, thin frame applied, exported at twelve hun
