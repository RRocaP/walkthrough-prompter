<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reference</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#141922; --line:#242c3a;
    --fg:#eef2f8; --dim:#7c8798; --accent:#5aa9ff;
    --ok:#3ddc84; --warn:#ffb020; --bad:#ff5f56;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg); color:var(--fg);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-text-size-adjust:100%; overscroll-behavior:none}

  /* ---------- menu ---------- */
  #menu{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
        padding:22px 20px 40px; display:flex; flex-direction:column; gap:26px}
  #menu h1{font-size:13px; letter-spacing:.22em; text-transform:uppercase;
           color:var(--dim); font-weight:600}
  .grp h2{font-size:11px; letter-spacing:.18em; text-transform:uppercase;
          color:var(--accent); margin-bottom:10px; font-weight:600}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px;
        padding:13px 15px; text-align:left; color:var(--fg); cursor:pointer;
        display:flex; flex-direction:column; gap:5px;
        -webkit-tap-highlight-color:transparent; touch-action:manipulation}
  .card:active{background:#1b2230}
  .card:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .card .id{font:600 11px/1 "SF Mono",ui-monospace,Menlo,monospace;
            color:var(--dim); letter-spacing:.06em}
  .card .ti{font-size:15px; font-weight:600; line-height:1.25}
  .card .mt{font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums}

  /* ---------- prompter ---------- */
  #run{flex:1; display:none; flex-direction:column; min-height:0}
  #run.on{display:flex}
  .clocks{display:flex; gap:1px; background:var(--line); border-bottom:1px solid var(--line)}
  .clock{flex:1; background:var(--panel); padding:8px 14px; min-width:0}
  .clock .k{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim)}
  .clock .v{font:600 26px/1.1 "SF Mono",ui-monospace,Menlo,monospace;
            font-variant-numeric:tabular-nums}
  .clock .s{font-size:11px; color:var(--dim); min-height:14px}
  #taskClock .v{color:var(--bad)}
  #taskClock.cleared .v{color:var(--ok)}
  #drift .v.ahead{color:var(--accent)} #drift .v.behind{color:var(--warn)}
  #beatBar{height:5px;background:var(--line)}
  #beatFill{height:100%;background:var(--accent);width:0}
  #beatFill.over{background:var(--warn)}

  main{flex:1; display:flex; flex-direction:column; padding:16px 40px; gap:10px; min-height:0}
  .phase{font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent);
         display:flex; justify-content:space-between; align-items:center; gap:12px}
  .phase b{color:var(--dim); font-weight:400}
  #back{background:none; border:1px solid var(--line); color:var(--dim);
        border-radius:8px; padding:4px 10px; font-size:11px; letter-spacing:.1em;
        text-transform:uppercase; cursor:pointer; touch-action:manipulation}
  #back:active{background:var(--panel)}
  .do{display:flex; gap:16px; align-items:baseline}
  .num{font:700 28px/1 "SF Mono",ui-monospace,Menlo,monospace; color:var(--dim);
       font-variant-numeric:tabular-nums}
  .txt{font-size:26px; font-weight:600; letter-spacing:-.01em}

  .saywrap{flex:1; display:flex; flex-direction:column; justify-content:center; gap:14px;
           min-height:0; overflow:hidden; border-left:3px solid var(--accent); padding-left:20px}
  .sayline{font-size:34px; line-height:1.34; transition:opacity .25s ease}
  .sayline.done{opacity:.28} .sayline.ahead{opacity:.42} .sayline.live{opacity:1}
  .sayline .w{color:#5d6878; transition:color .12s linear}
  .sayline .w.said{color:#dfe7f2}
  .sayline .w.now{color:#fff; box-shadow:inset 0 -.14em 0 var(--accent)}
  .sayline em{font-style:normal; font-weight:700}
  .sayline em .w.said,.sayline em .w.now{color:#fff}
  .sayline.q{color:var(--dim); font-size:22px; opacity:.75}
  .sayline.q .w{color:var(--dim)}

  .foot2{display:flex; gap:22px; align-items:baseline; flex-wrap:wrap}
  .rest{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim)}
  .next{font-size:17px; color:var(--dim)}
  .next .n{font-family:"SF Mono",ui-monospace,Menlo,monospace}
  .pace{font-size:12px; color:var(--dim)} .pace b{color:var(--fg); font-weight:600}
  #gate{display:none; font-size:17px; color:var(--warn); font-weight:600}
  #gate.show{display:block}

  footer{border-top:1px solid var(--line); background:var(--panel); padding:8px 16px;
         display:flex; justify-content:space-between; font-size:12px; color:var(--dim)}
  kbd{background:var(--line); border-radius:4px; padding:1px 6px;
      font-family:"SF Mono",ui-monospace,Menlo,monospace; color:var(--fg)}
  #state{font-weight:600}
  #state.run{color:var(--ok)} #state.pause{color:var(--warn)}
  #auto.on{color:var(--ok); font-weight:600}

  #touch{display:none; gap:10px; padding:10px 14px calc(16px + env(safe-area-inset-bottom));
         background:var(--panel); border-top:1px solid var(--line)}
  #touch button{flex:1; min-height:56px; font-size:17px; font-weight:600; color:var(--fg);
    background:#1b2230; border:1px solid var(--line); border-radius:12px;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation}
  #touch button:active{background:#243044}
  #touch button.wide{flex:1.6}
  #touch button.run{background:var(--accent); border-color:var(--accent); color:#08111c}
  #touch .sm{flex:.55; font-size:20px; font-weight:400}

  @media (max-width:760px){
    body{user-select:none; -webkit-user-select:none}
    #menu{padding:16px 14px 30px; gap:20px}
    .grid{grid-template-columns:1fr; gap:8px}
    .clocks{flex-wrap:wrap}
    .clock{flex:1 1 46%; padding:6px 12px}
    .clock .v{font-size:20px} .clock .s{font-size:10px}
    main{padding:12px 16px; gap:8px}
    .num{font-size:19px} .txt{font-size:18px}
    .saywrap{padding-left:13px; gap:10px; justify-content:flex-start}
    .sayline{font-size:clamp(19px,5.2vw,30px); line-height:1.3}
    .sayline.q{font-size:15px}
    .next{font-size:14px} .pace{font-size:11px}
    #touch{display:flex} footer{display:none}
  }
  @media (max-width:760px) and (orientation:landscape){
    .clock .v{font-size:16px}
    .sayline{font-size:clamp(17px,3.4vw,26px)}
    #touch button{min-height:44px}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body>

<div id="menu"></div>

<div id="run">
  <div class="clocks">
    <div class="clock"><div class="k">Beat</div><div class="v" id="beatV">0:00</div><div class="s" id="beatS"></div></div>
    <div class="clock" id="taskClock"><div class="k">Task clock</div><div class="v" id="taskV">0:00</div><div class="s" id="taskS"></div></div>
    <div class="clock"><div class="k">Total</div><div class="v" id="totV">0:00</div><div class="s" id="totS"></div></div>
    <div class="clock" id="drift"><div class="k">Drift</div><div class="v" id="driftV">0:00</div><div class="s" id="driftS">on plan</div></div>
  </div>
  <div id="beatBar"><div id="beatFill"></div></div>
  <main>
    <div class="phase"><span id="phase"></span><button id="back">&larr; all walkthroughs</button></div>
    <div class="do"><div class="num" id="num"></div><div class="txt" id="txt"></div></div>
    <div class="saywrap" id="say"></div>
    <div id="gate">Hold &mdash; clock still under 10:00. Stretch the closing line.</div>
    <div class="foot2">
      <span class="rest" id="restLbl">Next</span>
      <span class="next"><span class="n" id="nextN"></span> <span id="nextT"></span></span>
      <span class="pace" id="pace"></span>
    </div>
  </main>
  <footer>
    <div><kbd>space</kbd> start/pause &nbsp; <kbd>&rarr;</kbd> next &nbsp; <kbd>&larr;</kbd> back &nbsp;
         <kbd>[</kbd> <kbd>]</kbd> speed &nbsp; <kbd>A</kbd> auto &nbsp; <kbd>R</kbd> reset &nbsp;
         <kbd>esc</kbd> menu</div>
    <div><span id="state" class="pause">PAUSED</span> &nbsp;&middot;&nbsp;
         <span id="wpmLbl"></span> &nbsp;&middot;&nbsp; auto <span id="auto">off</span></div>
  </footer>
  <div id="touch">
    <button id="tBack" aria-label="Previous beat">&larr;</button>
    <button id="tPlay" class="wide">Start</button>
    <button id="tNext" aria-label="Next beat">&rarr;</button>
    <button id="tSlow" class="sm" aria-label="Slower">&minus;</button>
    <button id="tFast" class="sm" aria-label="Faster">+</button>
  </div>
</div>

<script>
const TASKS = [{"id": "p01_ic50", "title": "Dose-response, IC50 of two inhibitors", "group": "GraphPad Prism", "apps": ["Safari", "Numbers", "GraphPad Prism", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, then say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// only Prism, Numbers, Preview, Safari, Notes may open all run - everything else quit", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 36, ["I'm a molecular biologist, today on the pharmacology side.", "The screening group sent viability data for two kinase inhibitors. I need to know which is *more potent*, and whether that difference is *real*.", "So: their brief in *Preview*, the raw readings in *Numbers*, dose-response curves fitted in *Prism*, and I give them back the IC50s and the statistics."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down, so I can hold myself to it.", "Read the brief. Look up the equation. Paste the data. Fit the curves. Fill the sheet. Zip it up.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open p01_ic50, name the three files", 30, ["In *Finder*, in my Documents, I open the folder *p zero one ic fifty*, because everything for this lives there.", "Three files: the *brief* as a PDF, the *raw readings* as a CSV, and an empty *summary sheet* I have to send back."]], ["SETUP", 5, "Preview — brief.pdf, read the three asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what they want.", "Three asks. The *IC50* for each drug with its confidence interval. How much *more potent* is one than the other.", "And is the difference *real*, or could it be noise?"]], ["SETUP", 6, "Open Safari, Prism, Numbers from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to check how the dose-response equation is meant to be set up.", "*GraphPad Prism*, because that is where I fit the curves and read off the IC50s.", "And *Numbers*, for the raw data and for the summary sheet they want back."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. The plan is written, everything I need is open, so I will get into the data.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["SAFARI", 8, "Google \"graphpad log inhibitor dose response variable slope\"", 30, ["In *Safari* I search *graphpad log inhibitor dose response variable slope*, and click GraphPad's *own* guide in the results.", "I want their wording for the equation parameters before I build the table."]], ["SAFARI", 9, "Read the four parameters, then close Safari", 26, ["Four parameters: *Top* is viability with no drug at all. *Bottom* is viability once the drug saturates.", "*LogIC50* is the dose halfway between them. *Hill slope* is how steeply the curve falls.", "// close the Safari window with the red button before moving on - nothing should sit behind Numbers"]], ["NUMBERS", 10, "Open viability_assay.csv from the folder, describe its shape", 38, ["Back in the folder, I double-click *viability assay dot c s v*, and it opens in *Numbers*.", "*Nine* doses, from one to ten thousand nanomolar, ten-fold steps. *Three* wells each for *PKI-42* and *PKI-77*.", "The values are *percent viability*, normalized already — so I expect Top to land near one hundred."]], ["NUMBERS", 11, "Select the six data columns only, say \"Command C\"", 22, ["I drag across the *six data columns only*, leaving the dose column out, because Prism supplies its own X labels.", "*Command C* to copy."]], ["PRISM", 12, "Welcome dialog: XY > 2 replicate values side by side > Create", 30, ["In *Prism*'s welcome window I pick *XY*, because I have dose in X and viability in Y.", "Then *enter two replicate values in side-by-side subcolumns*, because each group has *three wells* but I'm not doing ANOVA.", "*Create*. A dose-response fit needs replicates so Prism builds error bars."]], ["PRISM", 13, "Click cell X1, say \"Command V\"", 22, ["I click cell *X one*, top left of the sheet, and *Command V*.", "Fifty-four values land in six subcolumns. Nothing shifted."]], ["PRISM", 14, "Rename Group A and B to PKI-42 and PKI-77", 26, ["Column *A* and its partner I title *PKI-42*, column *B* and its partner *PKI-77*, so the graph legend reads right later.", "Down the row titles I type the dose values from the CSV, one through ten thousand."]], ["PRISM", 15, "Analyze > Transform, set X = Log(X), OK", 30, ["*Analyze*, at the top. *Transform*, then *Normalize and Transform*.", "Tick *Transform X values*, and set *X equals Log of X*. My doses go ten-fold each step.", "*OK*. A new sheet appears."]], ["PRISM", 16, "On transformed sheet: Analyze > Nonlinear regression", 42, ["The transformed sheet has X in log units now. *Analyze*. *Nonlinear regression*, the curve fitting function.", "For the model, *Dose-response*, then *Inhibition*, because the drug *kills cells*.", "Then *log inhibitor versus response, variable slope*, four parameters — Prism fits the steepness itself rather than assuming it."]], ["PRISM", 17, "Compare tab: tick LogIC50, then OK", 26, ["On the *Compare* tab I tick *Do the best-fit values of unshared parameters differ?*", "And I tick *LogIC50*, because that is the question: are the IC50s different? *OK*."]], ["RESULTS", 18, "Read the IC50s, confidence intervals, and Hill slopes", 30, ["The results sheet opens. *PKI-42* IC50 is *forty nanomolar*, confidence interval *thirty-six to forty-five*.", "*PKI-77* is *two hundred eighty nanomolar*, confidence interval *two hundred forty-eight to three hundred sixteen*.", "Hill slopes: *minus nought point nine five* and *minus one point two one*. Both negative, as they must be — inhibitors."]], ["RESULTS", 19, "Read R squared and F test results", 28, ["*R squared* is *nought point nine nine seven* and *nought point nine nine six* — the curves run through the data.", "The *F test*: *P below nought point nought nought nought one*. The seven-fold gap is *real*."]], ["RESULTS", 20, "Explain the fold difference and the test", 26, ["Two hundred eighty divided by forty is *about seven*. PKI-42 needs seven times less drug for the same effect — it is *more potent*.", "The confidence intervals do not overlap, and the F test agrees: the difference is real."]], ["PRISM", 21, "Graphs > transformed data, format with two colours, axis titles", 36, ["In the left panel under *Graphs* I click *transformed data*, and choose *scatter plot with a line*, with *mean and SD* bars.", "*PKI-42* in *blue*, *PKI-77* in *orange*, so the two curves read apart at a glance.", "I double-click each axis title: *log concentration nM* across, *Viability percent of untreated* up."]], ["PRISM", 22, "File > Export the graph as ic50_curves.pdf", 22, ["*File*, *Export*, *P D F*, into the p zero one ic fifty folder, named *ic fifty curves*.", "The fitted curves are locked down."]], ["PRISM", 23, "Go to results sheet, export as ic50_results.pdf", 22, ["I click the *regression results* sheet tab, and export that too, as *ic fifty results*, so the numbers travel with the picture."]], ["NUMBERS", 24, "Minimise Prism, open ic50_summary.xlsx, explain grey vs yellow", 38, ["I minimise *Prism* — I am done with it, and I do not want it sitting behind what I am typing in.", "In the folder I open *ic fifty summary dot x l s x*. It came *attached to their brief*.", "*Grey* cells are theirs. *Yellow* is mine to fill."]], ["NUMBERS", 25, "Fill in the IC50s, confidence intervals, and Hill slopes for each drug", 34, ["Top row, *PKI-42*. IC50: *forty*. CI: *thirty-six to forty-five*. Hill slope: *minus nought point nine five*.", "Second row, *PKI-77*. IC50: *two hundred eighty*. CI: *two hundred forty-eight to three hundred sixteen*. Hill slope: *minus one point two one*."]], ["NUMBERS", 26, "Fill R squared and Verdict dropdown columns", 30, ["*R squared* for both: *nought point nine nine seven* and *nought point nine nine six*.", "The *Verdict* column is a dropdown. For PKI-42, I click and pick *Take forward*. For PKI-77, *Deprioritise*."]], ["NUMBERS", 27, "Fold difference and F test p-value", 22, ["*Fold difference*: *seven*.", "*F test P*: *below nought point nought nought nought one*."]], ["NUMBERS", 28, "Type the conclusion line", 22, ["At the bottom, the conclusion: *PKI-42 is about seven times more potent. The difference is real, F test p-value below zero point zero zero zero one.*"]], ["NUMBERS", 29, "File > Export To > PDF", 22, ["*File*, *Export To*, *P D F*, and I point it at the p zero one ic fifty folder."]], ["PREVIEW", 30, "ic50_curves.pdf > markup > arrows and labels at IC50s", 32, ["I open *ic fifty curves dot p d f* in *Preview*, and click the *markup* button in the toolbar — the pen tip.", "An *arrow* pointing at the halfway point on the *PKI-42* curve — that is the IC50.", "Text beside it: *IC50 forty nanomolar*."]], ["PREVIEW", 31, "Mark up second curve and export as PNG", 28, ["A second *arrow* at the halfway point on the *PKI-77* curve.", "Text: *IC50 two hundred eighty nanomolar*.", "*File*, *Export*, format *P N G*, named *ic fifty curves annotated*."]], ["FINISH", 32, "Finder — select the four exports > Compress", 24, ["Back in *Finder*. Four files came out of this: the *curves*, the *results table*, the *filled sheet*, and the *annotated image*.", "I select all four, right-click, *Compress four items*."]], ["FINISH", 33, "Rename deliverables.zip, closing line, hold on recorder window", 42, ["I rename the archive *deliverables dot zip*.", "So: *PKI-42* needs *forty nanomolar* to halve viability. *PKI-77* needs *two hundred eighty*.", "That is about *seven times* more drug for the same effect — *PKI-42* is the one worth taking forward.", "The F test says the difference is *real*. Both fits are *clean*.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "p02_growth", "title": "Growth curves, two-way ANOVA in Prism", "group": "GraphPad Prism", "apps": ["Safari", "Numbers", "GraphPad Prism", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, then say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// only Prism, Numbers, Preview, Safari, Notes may open all run - everything else quit", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 36, ["The microbiology group has sent me seven hours of growth readings, with and without a low dose of antibiotic.", "I need to know whether the drug *slows growth*, and *from what hour*.", "So: their brief in *Preview*, the readings in *Numbers*, a *two-way ANOVA* in *Prism*, and they get back the curve, the statistics and their filled sheet."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down, so I can hold myself to it.", "Read the brief. Check how the two-way ANOVA works. Run it in Prism. Fill the sheet. Zip it up.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open p02_growth, name the three files", 30, ["In *Finder*, in my Documents, I open the folder *p zero two growth*, because everything for this lives there.", "Three files: the *brief* as a PDF, the *raw readings* as a CSV, and an empty *summary sheet* I have to send back."]], ["SETUP", 5, "Preview — brief.pdf, read the three asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what they want.", "Three asks. Does the antibiotic change growth at all. From *what point in time* the difference appears.", "And no *t-test at every hour* — they were told off for that last time."]], ["SETUP", 6, "Open Safari, Prism, Numbers from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to check how the test is meant to be set up.", "*GraphPad Prism*, because that is where the ANOVA and the curve get made.", "And *Numbers*, for the readings and for the sheet they want back."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. The plan is written, everything I need is open, so I will get into the data.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["SAFARI", 8, "Google \"graphpad two-way anova\", open GraphPad's own guide", 30, ["In *Safari* I search *graphpad two-way anova*, and click GraphPad's *own* guide in the results.", "I want their wording for how the table has to be arranged before I build it."]], ["SAFARI", 9, "Read the interaction definition, then close the Safari window", 26, ["Two factors here: *time*, and *treatment*. The *interaction* is the one I care about.", "A significant interaction means the drug's effect *depends on when you look*, which is what a slow-down looks like.", "// close the Safari window with the red button before moving on - nothing should sit behind Numbers"]], ["NUMBERS", 10, "Open growth_curve.csv from the folder, describe its shape", 40, ["Back in the folder, I double-click *growth curve dot c s v*, and it opens in *Numbers*.", "*Eight* rows, hour zero to hour seven. *Six* data columns: three control flasks, three treated.", "*O D six hundred* is optical density — how cloudy the culture is, standing in for how many cells there are."]], ["NUMBERS", 11, "Select the six data columns only, say \"Command C\"", 22, ["I drag across the *six data columns only*, leaving the hour column out, because Prism supplies its own row labels.", "*Command C* to copy."]], ["PRISM", 12, "Welcome dialog: Grouped > 3 replicate values side by side > Create", 30, ["In *Prism*'s welcome window I pick *Grouped*, on the left.", "Then *enter three replicate values in side-by-side subcolumns*, because each group is *three separate flasks*.", "*Create*. Grouped is what makes the two-way ANOVA available — an X Y table would not."]], ["PRISM", 13, "Click cell A1, say \"Command V\"", 22, ["I click cell *A one*, top left of the sheet, and *Command V*.", "Forty-eight values land in six subcolumns. Nothing shifted."]], ["PRISM", 14, "Name the columns Control and Treated, rows 0 h to 7 h", 26, ["Column *A* I title *Control*, column *B* *Treated*, so the graph legend is right later.", "Down the row titles I type *zero h* through *seven h*."]], ["PRISM", 15, "Analyze > Two-way ANOVA > no matching or pairing", 30, ["*Analyze*, at the top of the sheet. *Two-way ANOVA*, then OK.", "*No matching or pairing* — these are *separate flasks* at every hour, not one flask followed through."]], ["PRISM", 16, "Multiple comparisons within each row, Options > Šídák", 42, ["On the *Multiple Comparisons* tab: *compare each cell mean with the other cell mean in that row* — control against treated, hour by hour.", "On *Options*, the *Šídák* correction. That is eight comparisons at once, and uncorrected, one of them flukes sooner or later.", "That is exactly what the brief asked me not to do."]], ["PRISM", 17, "Residuals tab — residual plot + normality test, then OK", 26, ["Before I trust a single P value, the *Residuals* tab. I tick *plot the residuals*, and *test residuals for normality*.", "The ANOVA assumes the scatter is even and roughly normal. If it is not, the P values underneath are not worth much. *OK*."]], ["RESULTS", 18, "Read the % of total variation: time 63, drug 24", 26, ["The results sheet splits the variation three ways. *Time*, *sixty-three percent* — bacteria grow, no surprise.", "*Treatment*, *twenty-four percent*. So the drug matters overall."]], ["RESULTS", 19, "Interaction 12 %, F = 111, P < 0.0001", 44, ["*Interaction*, *twelve percent*, F of a hundred and eleven, P below *nought point nought nought nought one*.", "That is the answer to their first question. A drug that shifted everything by the same amount would give an interaction of *zero*.", "Twelve percent means the gap *widens hour by hour*. Residual is half a percent — my three flasks agree."]], ["RESULTS", 20, "Šídák rows: 0 and 1 ns, hour 2 onward ****", 34, ["Scrolling to the comparisons. Hour *zero*, not significant. Hour *one*, not significant — the two groups start the same.", "Hour *two*: *four stars*, adjusted P of nought point nought nought nought nought five.", "And every hour after that, four stars. So their second answer is *hour two*."]], ["RESULTS", 21, "Residual plot + normality result — say whether the model holds", 44, ["Now back to the residuals. The plot is an *even band* either side of zero, with *no funnel* opening to the right.", "And the normality test on the residuals gives P of *[read the value]*, which is *[above / below]* nought point nought five.", "So the model fits the data, and the P values I just read stand up.", "// if normality fails, say so out loud - the design is balanced with equal n, which makes ANOVA tolerant. Never hide it"]], ["PRISM", 22, "Graphs > Data 1: points + line, mean/SD, two colours, axis titles", 36, ["In the left panel under *Graphs* I click *Data 1*, and choose *points with a connecting line*, with *mean and S D* bars.", "Control in *blue*, treated in *orange*, so the two curves read apart at a glance.", "I double-click each axis title: *Time in hours* across, *O D six hundred* up."]], ["PRISM", 23, "Double-click Y axis > Log scale, read it, then back to Linear", 42, ["One more look before I export. I double-click the *Y axis* and switch the scale to *log two*.", "Growth is exponential, so a log axis *straightens* it out, and the *slope* becomes the growth rate.", "The treated line is not just lower — it is *shallower*. A slower doubling, not a delayed start.", "Then I set the scale back to *linear*, because that is the picture they asked for."]], ["PRISM", 24, "Export the graph, then the ANOVA sheet, as PDFs", 30, ["*File*, *Export*, *P D F*, into the p zero two growth folder, named *growth curves*.", "Then I click the *ANOVA results* sheet and export that too, as *growth anova*, so the numbers travel with the picture."]], ["NUMBERS", 25, "Minimise Prism, open growth_summary.xlsx, explain grey vs yellow", 38, ["I minimise *Prism* — I am done with it, and I do not want it sitting behind what I am typing in.", "In the folder I open *growth summary dot x l s x*. It came *attached to their brief*.", "*Grey* cells are theirs. *Yellow* is mine to fill."]], ["NUMBERS", 26, "Type the difference for each hour", 34, ["Difference column, hour by hour, straight off the Prism comparisons.", "Nought point nought nought four. Nought point nought five one. Nought point one five two. Nought point three five two.", "Nought point five five one. Nought point six six eight. Nought point seven two four. Nought point six eight four."]], ["NUMBERS", 27, "Adjusted P column, then the Significant? dropdown per row", 34, ["Adjusted P beside each one — *greater than nought point nine nine* at hour zero, *nought point five* at hour one, then *below nought point nought nought nought one*.", "The *Significant* column is a dropdown: *no* for the first two rows, *yes* for the six after."]], ["NUMBERS", 28, "Three note lines at the bottom", 28, ["Three lines at the bottom, so they can read it without me.", "The interaction is significant, so the effect *builds* rather than being there from the start.", "The curves separate at *hour two*. The treated culture plateaus at about *half* the control's density."]], ["NUMBERS", 29, "File > Export To > PDF, into the task folder", 22, ["*File*, *Export To*, *P D F*, and I point it at the p zero two growth folder.", "// check the sheet you export is the FILLED one - Numbers likes to save a .numbers copy into Documents instead"]], ["PREVIEW", 30, "growth_curves.pdf > markup > arrow at hour 2 + label", 32, ["I open *growth curves dot p d f* in *Preview*, and click the *markup* button in the toolbar — the pen tip.", "An *arrow* pointing at *hour two*, where the two curves come apart.", "Text beside it: *curves separate, hour two, P below nought point nought nought nought one*."]], ["PREVIEW", 31, "File > Export as PNG", 22, ["*File*, *Export*, format *P N G*, named *growth curves annotated*, so the marked-up version is a picture they can drop into a slide."]], ["FINISH", 32, "Finder — select the four exports > Compress", 24, ["Back in *Finder*. Four files came out of this: the *curve*, the *ANOVA table*, the *filled sheet*, and the *annotated image*.", "I select all four, right-click, *Compress four items*."]], ["FINISH", 33, "Rename deliverables.zip, closing line, hold on the recorder window", 42, ["I rename the archive *deliverables dot zip*.", "So: the antibiotic *does* slow growth — twenty-four percent of the variation, and P below nought point nought nought nought one.", "The effect *builds* rather than being there from the start. That is the significant interaction.", "It becomes significant at *hour two*, and the treated culture finishes at about *half* the control's density.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "p03_survival", "title": "Kaplan-Meier survival, log-rank p=0.010", "group": "GraphPad Prism", "apps": ["Safari", "Numbers", "GraphPad Prism", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, then say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// only Prism, Numbers, Preview, Safari, Notes may open all run - everything else quit", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 36, ["I'm a molecular biologist, today on the *in-vivo* side.", "Sixty animals, vehicle versus a candidate therapy, sixty days. I need to build the *Kaplan-Meier curves* and test whether the therapy *helps*.", "So: their brief in *Preview*, the raw survival data in *Numbers*, the curves and the log-rank test in *Prism*, and they get back the numbers and the curves."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down, so I can hold myself to it.", "Read the brief. Look up how Kaplan-Meier handles censoring. Paste the data. Run the test. Fill the sheet. Zip it up.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open p03_survival, name the three files", 30, ["In *Finder*, in my Documents, I open the folder *p zero three survival*, because everything for this lives there.", "Three files: the *brief* as a PDF, the *raw survival data* as a CSV, and an empty *summary sheet* I have to send back."]], ["SETUP", 5, "Preview — brief.pdf, read the four asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what they want.", "Four asks. The *Kaplan-Meier curves*. The *median survival* for each group. Whether the difference is *significant*.", "And the *hazard ratio* with its confidence interval."]], ["SETUP", 6, "Open Safari, Prism, Numbers from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to check how Kaplan-Meier handles *censoring* — deaths versus withdrawals.", "*GraphPad Prism*, because that is where I build the curves and run the log-rank test.", "And *Numbers*, for the raw survival data and for the summary sheet they want back."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. The plan is written, everything I need is open, so I will get into the data.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["SAFARI", 8, "Google \"graphpad prism censored survival data\"", 32, ["In *Safari* I search *graphpad prism censored survival data*, and click GraphPad's *own* guide.", "I want to understand how Kaplan-Meier treats a *one* versus a *zero* in the survival data."]], ["SAFARI", 9, "Read about censoring, then close Safari", 26, ["A *one* means we saw the endpoint — the animal died. A *zero* means we stopped watching — a withdrawal, or still alive when the study closed.", "Censored is *not a survivor* and *not a death*. Kaplan-Meier is built to handle it properly.", "// close the Safari window with the red button before moving on - nothing should sit behind Numbers"]], ["NUMBERS", 10, "Open survival_study.csv, describe its structure", 38, ["Back in the folder, I double-click *survival study dot c s v*, and it opens in *Numbers*.", "*One row per animal*: the day of the event or censoring, then two columns — *Vehicle* and *Treated*.", "*One means event*. *Zero means censored*. *Blank means that animal is in the other group*."]], ["NUMBERS", 11, "Scroll to the end, note the run of zeros and blanks", 24, ["I scroll down to the bottom. A *run of sixty* — all *zeros and blanks*, because sixty animals reached the study close.", "Some treated, some vehicle — the study lasted sixty days for everyone."]], ["NUMBERS", 12, "Select all data, no headers, say \"Command C\"", 22, ["I drag across all the data, leaving the header row out, because Prism supplies its own column titles.", "*Command C* to copy."]], ["PRISM", 13, "Welcome dialog: Survival table > Create", 26, ["In *Prism*'s welcome window I pick *Survival table*, NOT *XY* — Prism does the Kaplan-Meier mathematics itself.", "*Enter or import data into a new table*. *Create*."]], ["PRISM", 14, "Click X1, say \"Command V\", rename columns", 30, ["I click cell *X one*, top left of the sheet, and *Command V*.", "All the rows land in place. Then I rename *Group A* to *Vehicle* and *Group B* to *Treated*.", "The blanks *must stay blank* — they are how Prism knows which animal is in which group."]], ["PRISM", 15, "Analyze > Survival curve, Configure", 32, ["*Analyze*, at the top of the sheet. *Survival curve*, because that is the Kaplan-Meier analysis.", "On the dialog, I do *not* tick *matching or pairing* — these are *separate animals* at every time point, not one animal followed through."]], ["PRISM", 16, "Compare tab: log-rank, hazard ratio, ratio of medians", 26, ["On the *Compare* tab: *log-rank test*, Mantel-Cox method — that is the standard.", "I tick *calculate hazard ratio* and *ratio of median survival times*, so the results sheet gives me both."]], ["PRISM", 17, "OK, review the results table", 26, ["*OK*. The results sheet opens.", "At the top: *forty-one events, nineteen censored* — not sixty. If it said sixty, I would know the zeros were read as deaths."]], ["RESULTS", 18, "Read medians and log-rank p-value", 26, ["*Vehicle* median survival: *twenty-two days*.", "*Treated* median survival: *fifty-one days*.", "*Log-rank p-value*: *nought point nought one nought five*. A real benefit."]], ["RESULTS", 19, "Read hazard ratio and confidence interval", 26, ["Hazard ratio, treated versus vehicle: *nought point four six*, confidence interval *nought point two four to nought point eight eight*.", "Below one means *lower risk* — about *half the hazard* at any moment."]], ["RESULTS", 20, "Explain the censoring imbalance", 22, ["*Vehicle* has *six censored* out of thirty. *Treated* has *thirteen censored* out of thirty.", "That imbalance is *no accident* — more treated animals were still alive at day sixty. Part of the answer."]], ["PRISM", 21, "Graphs, format with two colours, axis titles", 40, ["In the left panel under *Graphs* I click the *survival curves*, and format them.", "*Vehicle* in *blue*, *Treated* in *orange*, so the two curves read apart at a glance.", "I double-click each axis title: *Days since start of study* across, *Percent event-free* up."]], ["PRISM", 22, "File > Export the graph as survival_curves.pdf", 22, ["*File*, *Export*, *P D F*, into the p zero three survival folder, named *survival curves*.", "The curves are locked down."]], ["PRISM", 23, "Go to results sheet, export as survival_results.pdf", 22, ["I click the *Survival curve results* sheet tab, and export that too, as *survival results*, so the numbers travel with the picture."]], ["NUMBERS", 24, "Minimise Prism, open survival_summary.xlsx", 34, ["I minimise *Prism* — I am done with it, and I do not want it sitting behind what I am typing in.", "In the folder I open *survival summary dot x l s x*. It came *attached to their brief*.", "*Grey* cells are theirs. *Yellow* is mine to fill."]], ["NUMBERS", 25, "Fill Vehicle and Treated rows with counts and medians", 30, ["*Vehicle*: thirty subjects, *twenty-four* events, *six* censored, median *twenty-two* days.", "*Treated*: thirty subjects, *seventeen* events, *thirteen* censored, median *fifty-one* days."]], ["NUMBERS", 26, "Fill log-rank p-value and hazard ratio", 22, ["Log-rank *p equals nought point nought one nought five*.", "Hazard ratio: *nought point four six*, CI *nought point two four to nought point eight eight*."]], ["NUMBERS", 27, "Conclusion dropdown and notes", 22, ["The *Conclusion* column is a dropdown. Vehicle is the *Reference*, treated is the *Benefit*.", "At the bottom, the two key numbers so they do not have to hunt."]], ["NUMBERS", 28, "File > Export To > PDF", 22, ["*File*, *Export To*, *P D F*, and I point it at the p zero three survival folder."]], ["PREVIEW", 29, "survival_curves.pdf > markup with lines and labels", 34, ["I open *survival curves dot p d f* in *Preview*, and click the *markup* button — the pen tip.", "A *horizontal line* at fifty percent where the median sits. Vehicle curve crosses at twenty-two days, treated at fifty-one.", "Labels on each: *Median twenty-two days*, *Median fifty-one days*."]], ["PREVIEW", 30, "Mark tick marks and export as PNG", 30, ["A *circle* at one tick mark on the treated curve. Label: *censored* — the curve does not step down here, only at an event.", "*File*, *Export*, format *P N G*, named *survival curves annotated*."]], ["FINISH", 31, "Finder — select the four exports > Compress", 24, ["Back in *Finder*. Four files came out of this: the *curves*, the *results table*, the *filled sheet*, and the *annotated image*.", "I select all four, right-click, *Compress four items*."]], ["FINISH", 32, "Rename deliverables.zip, closing line, hold on recorder window", 42, ["I rename the archive *deliverables dot zip*.", "Sixty animals, *forty-one events, nineteen censored* — and the censored stayed in.", "Median survival jumps from *twenty-two days* to *fifty-one*, P nought point nought one nought five.", "Hazard ratio *nought point four six* — a *real benefit*. The treated animals lived longer.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "p04_qpcr", "title": "Severe group fails normality; use Kruskal-Wallis", "group": "GraphPad Prism", "apps": ["Safari", "Numbers", "GraphPad Prism", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, then say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// only Prism, Numbers, Preview, Safari, Notes may open all run - everything else quit", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 36, ["I'm a molecular biologist on a *biomarker study*. One gene, three donor groups, healthy to severe.", "Before comparing them I must pick a *valid test* — the last analyst's ANOVA got rejected.", "So: look up how to *test the assumption*, then the data in *Numbers*, the normality test in *Prism*, and the right statistical comparison."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down, so I can hold myself to it.", "Read the brief. Test normality first. Try ANOVA then see what it says. Choose the right test. Fill the sheet. Zip it up.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open p04_qpcr, name the three files", 30, ["In *Finder*, in my Documents, I open the folder *p zero four q p c r*, because everything for this lives there.", "Three files: the *brief* as a PDF, the *expression data* as a CSV, and an empty *summary sheet* I have to send back."]], ["SETUP", 5, "Preview — brief.pdf, read the asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what they want.", "Two asks. *Compare* the three groups. And *justify the test* — they rejected the last one for being invalid, not wrong.", "That is what matters here."]], ["SETUP", 6, "Open Safari, Prism, Numbers from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to check how to *test whether data is normal*.", "*GraphPad Prism*, because that is where I run the normality test and the comparison.", "And *Numbers*, for the expression data and for the summary sheet they want back."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. The plan is written, everything I need is open, so I will get into the data.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["NUMBERS", 8, "Open expression_data.csv, describe the three groups", 38, ["Back in the folder, I double-click *expression data dot c s v*, and it opens in *Numbers*.", "*Three columns*: *Healthy*, *Mild*, *Severe*. *Twelve donors* each. Healthy sits *tight between nought six and one six*.", "Mild spreads from *one to four*. Severe ranges from *one to twenty-one* — that single point is *twenty* times healthy's top."]], ["SAFARI", 9, "Google \"graphpad shapiro wilk normality test\"", 28, ["In *Safari* I search *graphpad shapiro wilk normality test*, and click GraphPad's *guide on normality*.", "I want to know what the test does and how to read it."]], ["SAFARI", 10, "Read about Shapiro-Wilk, then close Safari", 24, ["A *low p-value* means the group *fails* normality — the data is *not normal*.", "ANOVA assumes each group comes from a normal distribution. If one does not, ANOVA is *not valid*.", "// close the Safari window with the red button before moving on - nothing should sit behind Numbers"]], ["NUMBERS", 11, "Select the three data columns, no headers, say \"Command C\"", 24, ["I drag across all three columns of expression data, leaving the header row out, because Prism supplies its own column titles.", "*Command C* to copy."]], ["PRISM", 12, "Welcome dialog: Column table > Create", 26, ["In *Prism*'s welcome window I pick *Column*, because I have three groups as separate columns.", "*Enter replicate values, stacked into columns*. *Create*. Column is for comparing groups."]], ["PRISM", 13, "Click X1, say \"Command V\", rename columns", 28, ["I click cell *X one*, top left of the sheet, and *Command V*.", "Thirty-six values land in three columns. Then I rename them *Healthy*, *Mild*, and *Severe*."]], ["PRISM", 14, "Analyze > Column > Normality and Lognormality Tests", 28, ["*Analyze*, at the top. *Column analyses*. *Normality and Lognormality Tests* — I do *not* hide this inside an ANOVA dialog.", "I run it *first*, as its own analysis, so the decision is visible on camera."]], ["PRISM", 15, "Tick Shapiro-Wilk, OK, read the results", 30, ["I tick *Shapiro-Wilk test* — the gold standard.", "*OK*. Results come back. *Healthy* P is *nought point five nine seven* — passes. *Mild* is *nought point eight nought seven six* — passes.", "*Severe* is *nought point nought nought nine seven* — *fails*. Severely."]], ["PRISM", 16, "Back to Data 1, Analyze > One-way ANOVA", 30, ["I go back to the data sheet. I click *Analyze*, *One-way ANOVA* on purpose, to show *why* the last analyst got rejected.", "The ANOVA is *valid in form* — six groups, equal n — but its *assumption is broken*."]], ["PRISM", 17, "Read the ANOVA results, then back to re-analyze", 26, ["The results sheet shows ANOVA p of *nought point nought nought one three* — it *is* significant.", "But Severe fails normality, so this result is *suspect*. I must re-analyze with a valid test."]], ["PRISM", 18, "Analyze > One-way ANOVA again, but pick Kruskal-Wallis", 32, ["*Analyze*, *One-way ANOVA* again. On the dialog, under *Assumption*, I click *No*, I do not have *normal distributions*.", "Then *Use nonparametric test* — the dialog offers *Kruskal-Wallis*, which is the rank-based alternative."]], ["PRISM", 19, "Multiple comparisons: Dunn's test, OK", 24, ["Under *Multiple Comparisons*, I pick *Dunn's test*, which is the rank-based equivalent to pair-wise t-tests.", "*OK*."]], ["RESULTS", 20, "Read Kruskal-Wallis H, p-value, and df", 26, ["Results: Kruskal-Wallis *H equals twenty-one point two two*, p *below nought point nought nought nought one*.", "That is *stronger* than the ANOVA's p. Picking the *right test* made it *more sensitive*, not weaker."]], ["RESULTS", 21, "Read Dunn's pairwise comparisons", 28, ["*Healthy vs Mild*: one star, *p equals nought point nought two six seven*.", "*Healthy vs Severe*: *four stars*, p *below nought point nought nought nought one*.", "*Mild vs Severe*: *not significant*, p *nought point one four four* — needs more donors."]], ["PRISM", 22, "Graphs > scatter, every point, median line, axis titles", 40, ["In the left panel under *Graphs* I click the *scatter plot*, and format it.", "*Every point* visible. A *line at the median*, not the mean — the data is skewed.", "Axes: *Relative expression, fold change* up, and *target expression by disease severity* as the title."]], ["PRISM", 23, "File > Export the graph as expression_plot.pdf", 22, ["*File*, *Export*, *P D F*, into the p zero four q p c r folder, named *expression plot*.", "The graph is locked down."]], ["PRISM", 24, "Go to results sheet, export as expression_results.pdf", 22, ["I click the *One-way ANOVA results* sheet tab, and export that too, as *expression results*, so the numbers travel with the picture."]], ["NUMBERS", 25, "Minimise Prism, open expression_summary.xlsx", 34, ["I minimise *Prism* — I am done with it, and I do not want it sitting behind what I am typing in.", "In the folder I open *expression summary dot x l s x*. It came *attached to their brief*.", "*Grey* cells are theirs. *Yellow* is mine to fill."]], ["NUMBERS", 26, "Fill counts, medians, IQR, and Shapiro-Wilk results", 46, ["*Healthy*: twelve donors, median *nought point zero one*, IQR *nought point eight to nought point zero one one seven*, Shapiro p *nought point five nine seven*, *Pass*.", "*Mild*: twelve, median *two point zero three*, IQR *one point three to two point six three*, p *nought point eight zero seven six*, *Pass*.", "*Severe*: twelve, median *four point three nine*, IQR *two point five one to seven point four three*, p *nought point nought nought nine seven*, *Fail*."]], ["NUMBERS", 27, "Normal? column dropdown", 18, ["The *Normal?* column is a dropdown — *click and pick*, do not type. Pass, Pass, *Fail*."]], ["NUMBERS", 28, "Type notes: test chosen and why", 28, ["At the bottom: *Test chosen: Kruskal-Wallis with Dunn's*.", "*Why: Severe group fails Shapiro-Wilk, ANOVA assumption broken*."]], ["NUMBERS", 29, "File > Export To > PDF", 22, ["*File*, *Export To*, *P D F*, and I point it at the p zero four q p c r folder."]], ["PREVIEW", 30, "expression_plot.pdf > markup donor at 21, label results", 34, ["I open *expression plot dot p d f* in *Preview*, and click the *markup* button — the pen tip.", "A *circle* around the single point at twenty-one in the Severe group — that outlier is *one donor*, not a distribution.", "Labels: *four stars* for Healthy vs Severe, *ns* for Mild vs Severe."]], ["PREVIEW", 31, "Export as PNG", 18, ["*File*, *Export*, format *P N G*, named *expression plot annotated*."]], ["FINISH", 32, "Finder — select the four exports > Compress", 24, ["Back in *Finder*. Four files came out of this: the *plot*, the *results table*, the *filled sheet*, and the *annotated image*.", "I select all four, right-click, *Compress four items*."]], ["FINISH", 33, "Rename deliverables.zip, closing line, hold on recorder window", 42, ["I rename the archive *deliverables dot zip*.", "*Severe* group fails Shapiro-Wilk — so ANOVA was *never valid*. That was the rejection.", "*Kruskal-Wallis* with *Dunn's*: *Healthy vs Severe* four stars, *Mild vs Severe* needs more donors.", "*Test first*, always. The right test is also more sensitive.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "p05_elisa", "title": "ELISA 4PL standard curve, unknown D above top standard", "group": "GraphPad Prism", "apps": ["Safari", "Numbers", "GraphPad Prism", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, then say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// only Prism, Numbers, Preview, Safari, Notes may open all run - everything else quit", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 36, ["I'm a molecular biologist, today on the *immunoassay* side.", "The facility ran four culture supernatants on an *IL-6 ELISA*. I need to turn their optical density readings into *concentrations*.", "So: the raw plate data in *Numbers*, a *four-parameter sigmoidal curve* in *Prism*, and report which samples are in range."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down, so I can hold myself to it.", "Read the brief. Look up the 4PL equation. Paste the data. Fit the curve. Flag any unknowns out of range. Zip it up.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open p05_elisa, name the three files", 30, ["In *Finder*, in my Documents, I open the folder *p zero five elisa*, because everything for this lives there.", "Three files: the *brief* as a PDF, the *plate data* as a CSV, and an empty *summary sheet* I have to send back."]], ["SETUP", 5, "Preview — brief.pdf, read the asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what they want.", "Three asks. The *standard curve* fit and EC50. The *concentration* of each unknown. And *flag any that are out of range*."]], ["SETUP", 6, "Open Safari, Prism, Numbers from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to check the *4PL equation* for a sigmoidal standard curve.", "*GraphPad Prism*, because that is where I fit the curve and interpolate the unknowns.", "And *Numbers*, for the plate data and for the summary sheet they want back."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. The plan is written, everything I need is open, so I will get into the data.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["NUMBERS", 8, "Open elisa_plate.csv, describe its structure", 40, ["Back in the folder, I double-click *elisa plate dot c s v*, and it opens in *Numbers*.", "*Seven standards*, twofold dilutions from *five hundred down to seven point eight* nanograms per mL. Then a *blank*, and four *unknowns* A through D, all in *duplicate wells*.", "Raw values are *OD at four fifty* nanometers — optical density, how much colour."]], ["NUMBERS", 9, "Average the duplicate wells for each standard and unknown", 34, ["I add a column for *average*, using the *AVERAGE* function across the two wells for each standard.", "The blank average is *nought point nought four three*, very clean — the plate washed properly.", "I drag the formula down to the unknowns as well."]], ["NUMBERS", 10, "Note that unknown D reads above the top standard", 28, ["Looking at the averages: the top standard at five hundred nanograms reads *two point zero*.", "Unknown *D* reads *two point one four five* — *above* everything that calibrated the curve. Flag that for later."]], ["SAFARI", 11, "Google \"graphpad prism interpolating standard curve 4PL\"", 28, ["In *Safari* I search *graphpad prism interpolating standard curve 4PL*, and click GraphPad's *Equations used for interpolating* page.", "I want to know what a sigmoidal 4PL looks like."]], ["SAFARI", 12, "Read about 4PL parameters, then close Safari", 22, ["Four parameters: *Bottom* — the minimum response. *Top* — the maximum response.", "*EC50* — the concentration giving half-maximum. And the *Hill slope*, the steepness.", "// close the Safari window with the red button before moving on - nothing should sit behind Numbers"]], ["NUMBERS", 13, "Select the seven standard rows, both wells, no headers, Command C", 26, ["I select the *seven standards only*, both wells per row, leaving the blank out — zero nanograms has no logarithm.", "*Command C* to copy."]], ["PRISM", 14, "Welcome dialog: XY > 2 replicate values side by side > Create", 30, ["In *Prism*'s welcome window I pick *XY*, because I have concentration in X and optical density in Y.", "Then *enter two replicate values in side-by-side subcolumns*, because each standard has *two wells*.", "*Create*."]], ["PRISM", 15, "Click X1, say \"Command V\"", 22, ["I click cell *X one*, top left of the sheet, and *Command V*.", "Fourteen values land in two subcolumns — seven standards, two wells each."]], ["PRISM", 16, "Add unknown rows with empty X, Y from plate, name column", 36, ["Below the standards I add four rows for the unknowns. The *X column is left empty* — that is what I am solving for.", "The *Y column* gets the average OD: *nought four six eight, one point zero two six, one point five seven six, two point one four five*.", "I name the Y column *OD four fifty*."]], ["PRISM", 17, "Analyze > Interpolate a standard curve", 28, ["*Analyze*, at the top. *Interpolate a standard curve*, because I want to convert OD values back to concentration.", "Model: *Sigmoidal, 4PL, X is log(concentration)* — the standard for ELISA curves."]], ["PRISM", 18, "OK, read the fit parameters and interpolations", 34, ["The results sheet opens. *EC50* is *one hundred eighteen* nanograms per mL — the midpoint of the curve.", "*R squared* is *nought point nine nine eight six* — the curve sits right on the standards.", "The interpolations for A through D: *thirty*, *eighty-seven*, *two hundred six*, and *approximately seven hundred eighty* — far off the curve."]], ["PRISM", 19, "Explain the Bottom and Top parameters", 26, ["*Bottom* is *nought point nought three eight*, which matches the blank *nought point nought four three* — no systematic bias.", "*Top* is *two point four one*, fitted from the highest standards."]], ["PRISM", 20, "Graph the curve with log X axis, axis titles", 36, ["In the left panel under *Graphs* I click the *standard curve*, and format the axes.", "Double-click the *X axis*: it is already *log scale*, which is right for the 4PL.", "Axes: *IL-six nanograms per m L* across, *OD four fifty nanometers* up."]], ["PRISM", 21, "File > Export the graph as il6_standard_curve.pdf", 26, ["*File*, *Export*, *P D F*, into the p zero five elisa folder, named *il six standard curve*.", "The curve is locked down."]], ["PRISM", 22, "Go to results sheet, export as il6_interpolated.pdf", 22, ["I click the *Interpolated values* sheet tab, and export that too, as *il six interpolated*, so the numbers travel with the picture."]], ["NUMBERS", 23, "Minimise Prism, open elisa_summary.xlsx", 38, ["I minimise *Prism* — I am done with it, and I do not want it sitting behind what I am typing in.", "In the folder I open *elisa summary dot x l s x*. It came *attached to their brief*.", "*Grey* cells are theirs. *Yellow* is mine to fill."]], ["NUMBERS", 24, "Fill unknowns A, B, C with OD and interpolated concentration", 34, ["Unknown *A*: OD *nought four six eight*, concentration *thirty* nanograms per mL, *Yes* — report it.", "Unknown *B*: OD *one point zero two six*, concentration *eighty-seven*, *Yes* — report.", "Unknown *C*: OD *one point five seven six*, concentration *two hundred six*, *Yes* — report."]], ["NUMBERS", 25, "Fill unknown D and note it is out of range", 26, ["Unknown *D*: OD *two point one four five*, the software says *approximately seven hundred eighty nanograms* per mL.", "But that is *above the top standard* — *No*, do not report. Instead, *Dilute and rerun*."]], ["NUMBERS", 26, "Fill EC50, R2, and Hill slope at the top", 22, ["*EC50* is *one hundred eighteen* nanograms per mL. *R squared* is *nought point nine nine eight six*. Hill slope is *one point one*, positive — more antigen, more colour."]], ["NUMBERS", 27, "File > Export To > PDF", 22, ["*File*, *Export To*, *P D F*, and I point it at the p zero five elisa folder."]], ["PREVIEW", 28, "il6_standard_curve.pdf > markup line and label at OD 2.0", 36, ["I open *il six standard curve dot p d f* in *Preview*, and click the *markup* button — the pen tip.", "A *horizontal line* at OD *two point zero*, the top standard's level.", "Label: *Unknown D, OD two point one five — above top standard, extrapolated, do not report*."]], ["PREVIEW", 29, "Export as PNG", 18, ["*File*, *Export*, format *P N G*, named *il six curve annotated*."]], ["FINISH", 30, "Finder — select the four exports > Compress", 24, ["Back in *Finder*. Four files came out of this: the *curve*, the *interpolations*, the *filled sheet*, and the *annotated image*.", "I select all four, right-click, *Compress four items*."]], ["FINISH", 31, "Rename deliverables.zip, closing line, hold on recorder window", 42, ["I rename the archive *deliverables dot zip*.", "Curve clean — *EC50 one hundred eighteen, R squared nought point nine nine eight six*, background on the fitted bottom.", "*A*, *B*, and *C* report at *thirty, eighty-seven, two hundred six* nanograms per mL.", "*D* read *above the top standard* — it is flagged. Dilute one in five and rerun to get a mid-curve number.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "p06_agreement", "title": "Correlation 0.98 yet +12% bias; Bland-Altman shows disagreement", "group": "GraphPad Prism", "apps": ["Safari", "Numbers", "GraphPad Prism", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, then say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// only Prism, Numbers, Preview, Safari, Notes may open all run - everything else quit", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 36, ["I'm a molecular biologist on the *clinical lab* side, doing a method validation.", "The lab wants a *point-of-care reader* to replace a bench ELISA. My job: do they *agree* — not the same as do they correlate.", "So: the brief in *Preview*, the paired readings in *Numbers*, *correlation* and *Bland-Altman* in *Prism*, and the verdict."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down, so I can hold myself to it.", "Read the brief. Check correlation. Run Bland-Altman. Look for proportional bias. Make the verdict. Zip it up.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open p06_agreement, name the three files", 30, ["In *Finder*, in my Documents, I open the folder *p zero six agreement*, because everything for this lives there.", "Three files: the *brief* as a PDF, the *paired readings* as a CSV, and an empty *summary sheet* I have to send back."]], ["SETUP", 5, "Preview — brief.pdf, read the asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what they want.", "The vendor claims *r equals nought point nine eight* — essentially perfect correlation. But my job is to check *agreement*.", "Three asks: the correlation, the *limits of agreement*, and my verdict."]], ["SETUP", 6, "Open Safari, Prism, Numbers from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to read about the *Bland-Altman* method — difference versus agreement.", "*GraphPad Prism*, because that is where I run both the correlation and the Bland-Altman.", "And *Numbers*, for the paired readings and for the summary sheet they want back."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. The plan is written, everything I need is open, so I will get into the data.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["SAFARI", 8, "Google \"graphpad prism bland altman method comparison\"", 30, ["In *Safari* I search *graphpad prism bland altman method comparison*, and click GraphPad's *guide on Bland-Altman*.", "I want to understand the difference between correlation and agreement."]], ["SAFARI", 9, "Read about difference versus average, then close Safari", 26, ["The Bland-Altman plot shows *difference* on one axis, *average* on the other.", "The *middle line* is the *bias*. The *outer lines* are *bias plus or minus one point nine six SD*.", "// close the Safari window with the red button before moving on - nothing should sit behind Numbers"]], ["NUMBERS", 10, "Open methods_comparison.csv, describe its structure", 34, ["Back in the folder, I double-click *methods comparison dot c s v*, and it opens in *Numbers*.", "*Forty-five* paired samples. *ID column*, then *ELISA* in one column — that is the *reference* method.", "And *POC reader* in another. Both in *nanograms per mL*. I scroll: the reader runs *higher nearly every row*."]], ["NUMBERS", 11, "Select the two numeric columns, no headers, say \"Command C\"", 24, ["I drag across the *two numeric columns only*, leaving the ID out, because Prism supplies its own row labels.", "*Command C* to copy."]], ["PRISM", 12, "Welcome dialog: XY > single Y value > Create", 26, ["In *Prism*'s welcome window I pick *XY*, because I have method A against method B.", "Then *single Y value for each point*. *Create*. I will plot one method against the other."]], ["PRISM", 13, "Click X1, say \"Command V\", name columns", 28, ["I click cell *X one*, top left of the sheet, and *Command V*.", "Ninety values land in two columns. I name *X* column *Lab ELISA* and *Y* column *POC reader*, both in *nanograms per mL*."]], ["PRISM", 14, "Analyze > Correlation, Pearson", 26, ["*Analyze*, at the top. *Correlation*. *Pearson*, the standard.", "Results will tell me if the two methods *move together*."]], ["RESULTS", 15, "Read the correlation coefficient", 22, ["The results sheet opens. Pearson *r equals nought point nine eight two* — *essentially perfect* tracking.", "P is *below nought point nought nought nought one*. The vendor's number is correct."]], ["PRISM", 16, "Analyze > Simple linear regression", 24, ["But before I celebrate: back to *Data 1*. *Analyze*, *Simple linear regression* — the fit of reader on ELISA.", "This will show me if the reader *multiplies* or *adds*."]], ["RESULTS", 17, "Read slope and intercept", 22, ["Slope is *one point one two two*, not one. Intercept is *nought point two*, near zero.", "The reader does not *add* a constant — it *multiplies* every result by *one point one two*."]], ["PRISM", 18, "Back to Data 1 > Analyze > Bland-Altman method comparison", 28, ["Back to *Data 1*. *Analyze*, *Column analyses*, *Bland-Altman method comparison*.", "Method 1 is *ELISA*, method 2 is *POC reader*. Difference: *method two minus method one*."]], ["PRISM", 19, "Configure difference as Ratio, not percent", 26, ["*OK*. The results show a fanning plot — scatter grows with concentration. That tells me the bias is *proportional*, not constant.", "I go back and reopen parameters. Under *How to compute difference*, I change to *Ratio*: *method two divided by method one*."]], ["RESULTS", 20, "Read ratio Bland-Altman results", 26, ["Results: *Bias* is *one point one two one*, matching the slope — same *twelve percent*.", "*Lower limit* is *nought point nine two four*, *upper limit* is *one point three one eight*."]], ["PRISM", 21, "Format graph: check axes and bias line", 28, ["In the left panel under *Graphs* I click the *Bland-Altman* plot.", "The *bias line* sits *clearly above one* — not at zero agreement. Points scatter evenly, no slope — the bias is purely proportional."]], ["PRISM", 22, "Axis titles: Average, Ratio POC/ELISA", 22, ["I double-click the axes. *X axis*: *Average of the two methods, nanograms per mL*.", "*Y axis*: *Ratio, POC reader divided by ELISA*."]], ["PRISM", 23, "File > Export the graph as bland_altman_plot.pdf", 24, ["*File*, *Export*, *P D F*, into the p zero six agreement folder, named *bland altman plot*.", "The graph is locked down."]], ["PRISM", 24, "Go to results sheet, export as agreement_results.pdf", 22, ["I click the *Bland-Altman results* sheet tab, and export that too, as *agreement results*, so the numbers travel with the picture."]], ["NUMBERS", 25, "Minimise Prism, open correlation_plot.pdf and check it", 30, ["I minimise *Prism*. For completeness, I check the correlation plot in *Preview* — it is a *tight straight line*, as expected from r of nought point nine eight two.", "But a tight line does *not* mean agreement."]], ["NUMBERS", 26, "Minimise Preview, open agreement_summary.xlsx", 32, ["I minimise *Preview*. In the folder I open *agreement summary dot x l s x*. It came *attached to their brief*.", "*Grey* cells are theirs. *Yellow* is mine to fill."]], ["NUMBERS", 27, "Fill Pearson r and regression slope", 22, ["*Pearson r*: *nought point nine eight two*. Slope: *one point one two two*."]], ["NUMBERS", 28, "Fill Bland-Altman bias and limits of agreement", 28, ["Bland-Altman *bias* (ratio): *one point one two one*. That is *twelve point one percent*.", "*Lower limit*: *nought point nine two four*. *Upper limit*: *one point three one eight*."]], ["NUMBERS", 29, "Fill correction factor and Verdict dropdown", 24, ["*Correction factor*: divide every reader result by *one point one two*.", "*Verdict*: *Adopt with correction*."]], ["NUMBERS", 30, "Type the conclusion lines", 28, ["At the bottom: the two key findings so they do not have to hunt.", "*Correlation strong but bias is proportional. The reader reads twelve percent high.*"]], ["NUMBERS", 31, "File > Export To > PDF", 22, ["*File*, *Export To*, *P D F*, and I point it at the p zero six agreement folder."]], ["PREVIEW", 32, "bland_altman_plot.pdf > markup bias and limits", 32, ["I open *bland altman plot dot p d f* in *Preview*, and click the *markup* button — the pen tip.", "*Arrows* pointing at the bias line and the upper and lower limits.", "Labels: *Bias one point one two, plus twelve percent*, *Limits nought point nine two to one point three two*."]], ["PREVIEW", 33, "Export as PNG", 18, ["*File*, *Export*, format *P N G*, named *bland altman annotated*."]], ["FINISH", 34, "Finder — select the five exports > Compress", 26, ["Back in *Finder*. Five files came out of this: the *correlation plot*, the *Bland-Altman plot*, the *agreement results*, the *filled sheet*, and the *annotated image*.", "I select all five, right-click, *Compress five items*."]], ["FINISH", 35, "Rename deliverables.zip, closing line, hold on recorder window", 42, ["I rename the archive *deliverables dot zip*.", "Correlation *nought point nine eight two* — as tight as you could ask. And *not the answer*.", "The reader reads *twelve percent high* on every sample. Not interchangeable as-is.", "Adopt it with a *one point one two* correction, then re-check. That is the difference between correlation and agreement.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "e01_sanger_align", "title": "Sanger clone validation with EMBOSS Needle", "group": "Molecular biology", "apps": ["Safari", "SnapGene Viewer", "TextEdit", "Numbers", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, then say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 36, ["I design D N A constructs. Four Sanger reads came back from the sequencing facility.", "I need to *check each clone against the reference*, and *decide which ones are valid*.", "So: their brief in *Preview*, the map and traces in *SnapGene*, alignment at *EMBOSS Needle* online, and they get back marked-up evidence and a clean verdict."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down, so I can hold myself to it.", "Check each read. Find the primer site. Align to the reference. Verify mutations on the trace. Record verdicts.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open e01_sanger_align, name the files", 32, ["In *Finder*, I open the folder *e zero one sanger align*, in Documents.", "Four files: *reference dot g b*, the plasmid map. Four *dot a b one* files, the trace reads. *Dot fasta*, the sequences. And *clone underscore q c dot x l s x*, an empty sheet I have to fill."]], ["SETUP", 5, "Preview — brief.pdf, read the asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*.", "Four asks: confirm the entry, which clones are valid, what mutations if any, and save the proof as a zip file."]], ["SETUP", 6, "Open the other apps from the Dock, one reason each", 28, ["From the *Dock*: *Safari*, to look up the primer and to run *EMBOSS Needle* for alignment.", "*SnapGene*, to see the map and the traces. *TextEdit*, to copy the sequence from the fasta file.", "*Numbers*, for the summary sheet."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. The plan is written, everything I need is open, so I will start.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["VIEWER", 8, "Reference.gb — circular map, 5000 bp, tour the features", 34, ["I open *reference dot g b* and the circular map opens in *SnapGene*.", "Five thousand base pairs. Clockwise from the top: *C M V promoter* drives expression.", "*T G T one* is the target gene — nine hundred bases. Down the side: *poly-A* signal ends the transcript, *ori* tells bacteria where to copy, *AmpR* selects transformants."]], ["SAFARI", 9, "Search Addgene sequencing primers, find CMV Forward primer", 30, ["In *Safari*, I search *Addgene sequencing primers* and open the reference page.", "The facility used *C M V Forward*, so I find it on the list: *A A A T G G G C G G T A G G C G T G*."]], ["SAFARI", 10, "Copy the primer sequence, Command C", 14, ["*Command C* to copy the primer."]], ["VIEWER", 11, "Search field: paste, Command V, primer at 523-540", 28, ["Back in *SnapGene*, bottom left, the *search field*. *Command V* to paste.", "It matches at *five twenty-three* to *five forty*, just before the target gene starts. The reads begin right downstream."]], ["VIEWER", 12, "Open clone1.ab1: sharp peaks, good read quality", 24, ["I open *clone one dot a b one* in the traces panel. *Sharp peaks* all through the read.", "Clean bases, no ambiguity. This one looks good."]], ["VIEWER", 13, "Open clone4.ab1: scroll to tail, peaks ragged", 22, ["Then *clone four dot a b one*. Scroll to the last hundred bases.", "The peaks turn *ragged*, piling up into noise — normal Sanger end, chemistry running out."]], ["SAFARI", 14, "Copy TGT1 sequence: double-click in SnapGene map, Edit > Copy", 26, ["Back in *SnapGene*, double-click *T G T one*, the target gene. *Edit*, *Copy* to get the sequence."]], ["SAFARI", 15, "New tab, search EMBOSS Needle at EBI, set sequence type DNA", 26, ["In *Safari*, open a new tab. Search *EMBOSS Needle* at the *European Bioinformatics Institute*, *e b i dot a c dot u k*.", "Set the sequence type to *D N A*."]], ["SAFARI", 16, "Box 1: paste reference sequence, Command V", 14, ["In box one, paste the reference: *Command V*."]], ["TEXTEDIT", 17, "Open clone3.fasta, select sequence lines only, Command C", 24, ["I open *clone three dot fasta* in *TextEdit*. Select the *sequence lines only* — not the header line.", "*Command C* to copy."]], ["SAFARI", 18, "Box 2: paste clone3 sequence, Command V, submit", 18, ["Back in Needle, box two: *Command V*. *Submit*."]], ["SAFARI", 19, "Read alignment, scroll to position 388, call the difference", 26, ["When the alignment loads, I scroll down. At position *three eighty-eight*, I see *one mismatch*.", "G has changed to A in the read. That is the candidate mutation."]], ["VIEWER", 20, "Go back to clone3.ab1 trace, scroll to base 448", 22, ["Back in *SnapGene*, back to the traces. Double-click *clone three dot a b one*.", "Scroll to base *four forty-eight*, where the sequence change appears on the trace."]], ["VIEWER", 21, "Look at the peak at base 448: single sharp peak, confident", 26, ["At base *four forty-eight*, I see a *single sharp peak*, no wobble.", "The sequencer machine is confident in that base call. It is a *real* mutation, not a calling error."]], ["VIEWER", 22, "File > Export: save clone3_variant.png to task folder", 18, ["*File*, *Export*, and I save it as *clone three underscore variant dot p n g*."]], ["SAFARI", 23, "Needle: align clone1 sequence, compare to reference", 24, ["Now the other clones. Back to Needle with a new query. Clone one sequence in box two.", "Results: *nine hundred of nine hundred* bases match. Perfect."]], ["SAFARI", 24, "Needle: align clone2 sequence, compare", 18, ["Clone two in box two. Results: identical to clone one. No differences."]], ["SAFARI", 25, "Needle: align clone4 sequence, check differences", 22, ["Clone four in box two. Results: I see about *twenty-six* differences.", "All of them sit past base *seven sixty*, where the trace quality dropped. End-of-read noise, not mutations."]], ["NUMBERS", 26, "Open clone_qc.xlsx, explain yellow vs grey cells", 20, ["In *Numbers*, I open *clone underscore q c dot x l s x*.", "*Yellow* cells are mine to fill. *Grey* are pre-filled."]], ["NUMBERS", 27, "Clone 1: type 0, none, Pass", 16, ["Clone one: *zero* mismatches, *none*, *Pass*."]], ["NUMBERS", 28, "Clone 2: type 0, none, Pass", 16, ["Clone two: *zero* mismatches, *none*, *Pass*."]], ["NUMBERS", 29, "Clone 3: type 1, position 988, mutation c.388G>A, p.Gly130Ser, Reject", 34, ["Clone three: *one* mismatch at plasmid position *nine eighty-eight*.", "*C dot three eighty-eight G to A*. Codon one thirty: *G G C* becomes *A G C*. That is *glycine to serine*, *p dot Gly130Ser*.", "Verdict: *Reject*."]], ["NUMBERS", 30, "Clone 4: end-of-read noise only, Pass", 16, ["Clone four: *end-of-read* noise, *Pass*."]], ["NUMBERS", 31, "Fill Contact Type dropdown: H bond, None, None, None", 18, ["Contact type column: *hydrogen bond* for the mutation, *none* for the others."]], ["NUMBERS", 32, "File > Export To > PDF: clone_qc.pdf to task folder", 18, ["*File*, *Export To*, *P D F*, saved as *clone underscore q c*."]], ["PREVIEW", 33, "Open clone3_variant.png, click Markup button", 14, ["I open *clone three underscore variant dot p n g* in *Preview*."]], ["PREVIEW", 34, "Circle the sharp peak at base 448, add text label", 18, ["*Markup*, the pen icon. Circle the sharp peak at base *four forty-eight*.", "Label: *c dot three eighty-eight G greater than A*."]], ["PREVIEW", 35, "File > Save the marked-up image", 14, ["*File*, *Save*."]], ["FINISH", 36, "Finder: select both exports, compress 2 items", 16, ["In *Finder*, I select the P D F and the marked-up trace. Right-click, *Compress 2 Items*."]], ["FINISH", 37, "Rename the archive deliverables.zip", 12, ["Rename to *deliverables dot zip*."]], ["CLOSE", 38, "Closing line", 72, ["Four reads validated. Clone one: nine hundred of nine hundred bases match the reference. Pass.", "Clone two: identical to one. Pass.", "Clone three: one point mutation. *C dot three eighty-eight G to A*, changing codon one thirty from glycine to serine.", "The trace shows a single sharp peak at that position — the machine is confident, so this is a real change. Clone three fails.", "Clone four: has twenty-six differences, but every single one sits past base seven sixty where the trace quality drops and decays.", "That is chemistry running out, not mutations. Clone four passes.", "Clone one is the validated construct. It advances to the next stage of the project."]]]}, {"id": "r01_ride_log", "title": "Season ride log review for the club AGM", "group": "Outdoors and cycling",
