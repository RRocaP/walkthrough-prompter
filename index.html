t step: EUR 389 to 599, 0.6 points, 350 per point", 34, ["Three hundred eighty-nine to five hundred ninety-nine is *two hundred ten* euros. Accuracy from *one point eight to one point two* is *zero point six* points.", "*Two hundred ten* divided by *zero point six* is *three hundred fifty* euros per point. Nearly *six times* the first step's cost."]], ["NUMBERS", 23, "Sensitivity check: change weights for printing, calculate new totals", 50, ["Does the pick survive different weights? For printing: *gamut zero point two five*, *price zero point one*. The other three stay the same.", "New totals: Corvus *two point four five*, Meridian *three point nine five*, Aurelio *four point six*. Aurelio wins on printing weights.", "Not overkill in general. Overkill for *me*, because I don't print."]], ["NUMBERS", 24, "Select Monitor column and Weighted total column, then insert chart", 32, ["I select *Monitor* and *Weighted total*.", "*Insert* > *Chart* > *two-d column*, title *weighted total out of five*, *value labels* on."]], ["NUMBERS", 25, "Click empty cell, export sheet as PDF: monitor_matrix.pdf", 26, ["I click an empty cell, then *File* > *Export To* > *P D F*. Into the r thirty-six folder, named *monitor matrix*."]], ["PREVIEW", 26, "Open monitor_matrix.pdf, markup toolbar: arrow at Meridian bar with label", 36, ["I open *monitor matrix dot p d f* in *Preview*, and click the *markup* button — the pen tip in the toolbar.", "I draw an *arrow* pointing at the Meridian bar, and add a *text box* next to it: *Meridian Q two seven P — four point one five*.", "That points out the winner at a glance."]], ["PREVIEW", 27, "Export as PNG: monitor_chart.png", 20, ["*File* > *Export*, format *P N G*, named *monitor chart*, so the marked-up picture can go into a slide."]], ["PAGES", 28, "Create blank document, heading: Editing monitor — the pick", 30, ["I open *Pages*, pick *Blank* template, and start typing. Heading: *editing monitor — the pick*."]], ["PAGES", 29, "Write the decision paragraph, copy chart from Numbers and paste", 60, ["I type: Meridian at *three hundred eighty-nine euros*. Corvus out on accuracy — *four point one* Delta-E, twice the limit, with *eighteen percent drift*.", "Aurelio is better overall, wrong purchase — last *two hundred ten euros* buys *zero point six* points at *three hundred fifty* each.", "Back in *Numbers*, *Command C* the chart. In *Pages*, *Command V*."]], ["PAGES", 30, "File > Export To > PDF: monitor_pick.pdf", 20, ["*File* > *Export To* > *P D F*, into the folder, named *monitor pick*."]], ["FINISH", 31, "Finder — select three exports, compress, rename deliverables.zip", 32, ["Back in *Finder*, I select the three P D F exports — *monitor matrix*, *monitor chart*, and *monitor pick*.", "Right-click, *Compress three items*, and I rename the archive *deliverables dot zip*.", "// pause 2-3 s on the recorder window before you press Stop"]], ["FINISH", 32, "Closing line and hold on recorder window", 48, ["Three monitors. Meridian *four point one five* against *three point eight* and *three point zero five*.", "Corvus is a marketing number on a *bad panel* — ninety-nine percent coverage is useless at *Delta-E four point one*, twice the working limit.", "The last *two hundred ten euros* buys improvement *under the visible threshold*. *Three hundred eighty-nine euros, bought*.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r37_gameplay_clip", "title": "Trim and caption a gameplay clip", "group": "Gaming, tech and making", "apps": ["Preview", "Safari", "iMovie", "QuickTime Player"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["Everything is ready, so I will get started.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// only Preview, Safari, iMovie, QuickTime Player, Notes may open - everything else quit", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 30, ["A friend of mine wants to see what this game actually looks like.", "I need thirty seconds of continuous play, licensed so I can share it, with my verdict and credit on screen.", "So: the brief in *Preview*, footage in *Safari*, the cut in *iMovie*, the check in *QuickTime*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 51, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the footage.", "First, the brief in *Preview*, to see exactly what's needed.", "Then *Safari*, to find the trailer on the Internet Archive and check its licence.", "Then *iMovie*, to trim it to exactly thirty seconds and add the captions and credit.", "Then the export checked in *QuickTime*, and everything zipped.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open r37_gameplay_clip, name the brief", 28, ["In *Finder*, in Documents, I open *r thirty-seven gameplay clip*.", "One file: the *brief*, telling me what the clip needs."]], ["SETUP", 5, "Preview — brief.pdf, read the asks aloud", 32, ["I open *brief dot p d f* in *Preview*. Four asks: thirty seconds on the nose, one thousand eighty p, licence respected, and name the creator on screen."]], ["SETUP", 6, "Open Safari, iMovie, QuickTime from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, because I need to find the right footage and read the licence before I download.", "*iMovie*, for the editing and captions.", "*QuickTime Player*, to verify the export."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything is open, so I will search for the footage.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Navigate to archive.org, search \"wasted trailer 0.7\"", 34, ["In *Safari* I go to *archive dot org*. The Archive has millions of files — games, clips, everything. I search *wasted trailer zero point seven*.", "The first result is *Wasted Trailer 0.7* by Franzopow. That's the one I need."]], ["SAFARI", 9, "Read the licence in the right column before downloading", 42, ["In the right column I see the licence: *Creative Commons Attribution 4.0* — *CC B Y 4.0*.", "The *B Y* means attribution. I have to credit the creator. I'm free to reuse it and re-cut it, send it anywhere, as long as I name Franzopow.", "So the credit goes *into the clip itself*. Then it travels with the file when my friend forwards it on."]], ["SAFARI", 10, "Click the file row to open the file page", 26, ["I click the file row. The file page opens, showing the full metadata: *Wasted Trailer 0.7 dot m p 4*."]], ["SAFARI", 11, "Read the file specs aloud: 76 MB, 1920×1080, 2:23", 32, ["*Seventy-six megabytes*, *nineteen twenty by ten eighty*, two minutes twenty-three seconds. Plenty to cut from.", "I click the download link and it lands in Downloads. I talk while the download runs."]], ["IMOVIE", 12, "Create New > Movie: start a fresh project", 32, ["In *iMovie*, *Create New* > *Movie*. A fresh timeline opens, empty, ready for the clip."]], ["IMOVIE", 13, "Import Media > Downloads > select Wasted file > Import Selected", 40, ["*File* menu > *Import Media*. I navigate to the *Downloads* folder where the m p four file landed.", "I select *Wasted Trailer 0.7 dot m p 4* and click *Import Selected*. The file reads into the project library."]], ["IMOVIE", 14, "Skim the filmstrip, drag the clip into the timeline", 38, ["The clip is loaded. I skim through the filmstrip looking for a *continuous run of gameplay*. The opening is a logo — that's the developer's branding, which tells my friend nothing about the game, so I skip it.", "I drag the whole clip into the timeline. Now it's ready to cut down to thirty seconds."]], ["IMOVIE", 15, "Zoom slider right, trim right edge then left edge until badge reads 30.0", 48, ["I push the zoom slider all the way right to zoom in tight on the clip. The timeline fills the window.", "Now I drag the *right edge* in, cutting off the tail. Then I drag the *left edge* in, cutting off the head. I watch the yellow badge in the middle, which counts the seconds.", "I need *thirty point zero* seconds *exactly*. Not twenty-nine-point-nine, not thirty-point-one. The brief says thirty seconds, so that's exactly what I'm delivering."]], ["IMOVIE", 16, "Titles > Standard: drop ONTO clip at 0-4 s, type card 1", 48, ["*Titles* browser. I pick *Standard* style — white text on transparent.", "This is the critical bit: I drag it *onto the clip itself* — *never beside it*. If it lands beside the clip, iMovie adds a black card between, which pushes the whole thing past thirty seconds and fails the job.", "Card 1 runs from *zero to four* seconds. I type: *Wasted* on line one, then line two: *free and open source, made in Godot*."]], ["IMOVIE", 17, "Add second title card at 24-29 s, type verdict and credit", 48, ["Another *Standard* title, dragged *onto the clip* again — *not beside it, onto it*. This card runs *twenty-four to twenty-nine* seconds, right at the end.", "Line 1: *Verdict: worth one evening, not ten.* Line 2: *Footage: Franzopow — C C B Y 4.0*.", "The credit is *on the clip*, not in a message. When my friend forwards it on, the creator's name travels with it."]], ["IMOVIE", 18, "Play all 30 seconds back on camera to check", 38, ["I hit *Play* and watch the whole thirty seconds from start to end. The *Wasted* title appears at the beginning. Gameplay runs through the middle. At the end, the verdict and the credit line appear together.", "The text is *readable*, everything stays *in frame*, and it all plays without skips. It looks right."]], ["IMOVIE", 19, "Share button > Export File", 28, ["*Share* button in the top right corner. *Export File*. The export dialog opens."]], ["IMOVIE", 20, "Set format to picture and sound, resolution to 1080p", 40, ["Format: I need *both picture and sound*, so I select the combined format option.", "Resolution: I double-check it says *1080p* — *one thousand eighty p* — because I'm exporting to source resolution, not upscaling or reducing."]], ["IMOVIE", 21, "Set quality to High, compression to Better Quality", 36, ["Quality: *High*. Compress: *Better Quality*. These are the settings that balance file size with picture clarity for the final export."]], ["IMOVIE", 22, "Name it wasted_30s_1080p, save into Documents/tasks/r37_gameplay_clip", 36, ["Next. File name: *wasted thirty s one thousand eighty p*.", "Location: *Documents* > *tasks* > *r thirty-seven gameplay clip*. The export starts."]], ["QUICKTIME", 23, "Finder: double-click wasted_30s_1080p.mp4 > Window > Show Movie Inspector", 52, ["In *Finder* I double-click *wasted thirty s one thousand eighty p dot m p four*. It opens in *QuickTime Player*, not inside the iMovie project.", "*Window* menu > *Show Movie Inspector*. The inspector pops up with all the file's details.", "Codec: *H dot two six four*, the standard for internet distribution. Resolution: *nineteen twenty by ten eighty*, source resolution, so I haven't upscaled anything. Duration: *thirty seconds*, exact match to what I cut down from two forty-three."]], ["FINISH", 24, "Finder: select the MP4 only, Compress, rename deliverables.zip", 34, ["In *Finder* I select just the m p four file — *wasted thirty s one thousand eighty p*. No source file, no brief in the final archive.", "Right-click, *Compress*. One file becomes *deliverables dot zip*."]], ["FINISH", 25, "Closing line and hold on recorder window", 48, ["Thirty seconds at one thousand eighty p. *Wasted* title at the front, so he knows what it is straight away.", "My verdict and Franzopow's credit at the end. *CC B Y 4.0*, so when he forwards it on to other friends, they can see exactly where it came from and who made it.", "The licence stays on the file. Done.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r38_tool_inventory", "title": "Workshop tool inventory and reorder list", "group": "Gaming, tech and making", "apps": ["Preview", "Safari", "Numbers", "Pages"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["Everything is ready, so I will get started.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// only Preview, Safari, Numbers, Pages, Notes may open - everything else quit", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 30, ["A new workbench goes into my shed this month, so I counted every tool in it.", "I need to know which drawer is overcrowded, what needs replacing, and what it costs.", "So: the brief in *Preview*, the tool count in *Numbers*, and the order written up in *Pages*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 52, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the count.", "First, the brief in *Preview*, for the budget and the duplicate warning.", "Then *Safari*, to check hex key sizes, so duplicates don't get miscounted.", "Then the audit in *Numbers*, to see which drawer is overcrowded and what to replace.", "Then the reorder list written up in *Pages*, and everything zipped.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open r38_tool_inventory, name the files", 30, ["In *Finder*, in Documents, I open *r thirty-eight tool inventory*.", "Two files: the *brief*, and the *tool data* as a CSV, which I counted by hand."]], ["SETUP", 5, "Preview — brief.pdf, read the asks aloud", 32, ["I open *brief dot p d f* in *Preview*. Three asks: build the audit sheet, flag which drawers get split, and list the five tools that need buying.", "Budget is one hundred euros. Watch for duplicate entries in the data."]], ["SETUP", 6, "Open Safari, Numbers, Pages from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to understand metric and imperial tool sizes.", "*Numbers*, for the audit sheet and the cost calculations.", "And *Pages*, where the reorder instructions go."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything is open, so I will check the tool data.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Search Wikipedia: hex key metric imperial sizes", 28, ["In *Safari* I search *hex key metric imperial sizes wikipedia*. I find the page so I understand the trap in the data."]], ["SAFARI", 9, "Read the conversion: 1/8 inch = 3.175 mm, why this matters", 38, ["*One-eighth inch* is *three point one seven five millimetres*. That's a *hair* bigger than *three millimetre*.", "One-eighth *fits in the socket*, three millimetre *won't grip*, it rounds the socket and the set falls apart.", "So if someone owns one and the other, they own *two different tools*, not one."]], ["NUMBERS", 10, "Open tools.csv in Finder, count the rows and columns", 32, ["Back in *Finder* I open *tools dot c s v* in *Numbers*. *Fifty-two rows* under the header, fifty-two tools counted from the drawers.", "Columns: tool name, which drawer, condition, and price on the replace rows."]], ["NUMBERS", 11, "Point at drawer C block, everything small lives there", 32, ["I scroll down. Drawer C has everything small: screwdrivers, bits, sockets, everything under two inches.", "That's where the *overcrowding* happens. It's forty percent of all my tools in one drawer."]], ["NUMBERS", 12, "Identify the five priced rows: pliers, spanner, chisel, level, hacksaw", 38, ["I look at the price column. Five rows have numbers: pliers *eighteen fifty*, spanner *twenty-two forty*, chisel *fourteen ninety-five*, level *fourteen thirty*, hacksaw *sixteen seventy-five*.", "Those are the five tools that need replacing. Worn tools stay in the drawer — they still do the job."]], ["NUMBERS", 13, "Find the hex driver 3 mm listed twice: drawers B and C, both good", 36, ["I search the spreadsheet. The *hex driver three millimetre* appears in drawer B and again in drawer C. Both marked good.", "Fifty-two *rows*, fifty-one distinct *tools*. If I buy a third one, I'm buying something I already own twice."]], ["NUMBERS", 14, "File > New > Blank sheet, rename to Schedule; headers and data", 34, ["*File* > *New* > *Blank*. I rename the sheet *Audit*.", "Headers: Drawer, What's in it, Count, Percent, Good, Worn, Replace, Cost, Action."]], ["NUMBERS", 15, "Type the drawer totals: A nine, B eight, C twenty-one, D eight, E six", 36, ["I type the counts. *Nine* tools in drawer A, *eight* in B, *twenty-one* in C, *eight* in D, *six* in E. Total *fifty-two*, matching the file."]], ["NUMBERS", 16, "Calculate percentages, verify C is overcrowded at 40%", 32, ["I type percentages. A seventeen, B fifteen, C *forty percent*, D fifteen, E twelve. They add to *ninety-nine*, say roughly.", "Drawer C alone is over a quarter, so it's the only one that gets split."]], ["NUMBERS", 17, "Type the condition counts and costs by drawer", 48, ["Good, Worn, Replace by drawer. Drawer A: *five* good, *two* worn, *two* replace at *forty ninety*.", "B: *six* good, *two* worn, zero replace. C: *fifteen* good, *five* worn, *one* replace at *fourteen ninety-five*.", "D: *five* good, *two* worn, *one* replace at *fourteen thirty*. E: *four* good, *one* worn, *one* replace at *sixteen seventy-five*."]], ["NUMBERS", 18, "Set Action dropdown: C is Re-sort, others Leave as is", 28, ["Action column. *C* gets *Re-sort* because it's over a quarter. The other four get *Leave as is*."]], ["NUMBERS", 19, "Type the key numbers: 5 replace | total 86.90 | savings 13.10", 34, ["Summary rows. Five tools to buy, total *eighty-six ninety* euros. Budget was one hundred, so *thirteen ten* spare.", "The cost block, showing what I'm spending and where the money goes."]], ["NUMBERS", 20, "Export the audit sheet as drawer_audit.pdf", 24, ["*File* > *Export To* > *P D F*, named *drawer audit*, into the folder."]], ["PAGES", 21, "Create blank document, heading Doornik order August 2026", 32, ["In *Pages*, *Blank* template. Heading: *Doornik order workshop tools, August 2026*."]], ["PAGES", 22, "Insert table: 3 columns, 5 tools plus total, 86.90", 34, ["*Insert* > *Table*. *Three* columns: tool, drawer, price.", "*Five* rows for the tools, then total *eighty-six ninety*."]], ["PAGES", 23, "Type the split instructions: move sockets and nut drivers to B", 44, ["Under the table: *Drawer C is over forty percent, so split before moving to the new bench.*", "*Leave screwdrivers and bits in C. Move ratchet, socket set, extension bar, universal joint, and both nut drivers to drawer B.* That balances the load."]], ["PAGES", 24, "Type the hex driver note: don't buy a third, own two, put both in B", 44, ["*Last line: do not buy a three millimetre hex driver. Already own two — one in B, one in C — so put both in B when moving.*", "That solves the duplicate tool problem from the CSV, where the same tool was listed twice. Buying a third would be waste."]], ["PAGES", 25, "File > Export To > PDF: reorder_list.pdf", 22, ["*File* > *Export To* > *P D F*, named *reorder list*, into the folder."]], ["FINISH", 26, "Finder — select both PDFs, Compress, rename deliverables.zip", 32, ["In *Finder* I select *drawer audit* and *reorder list*.", "Right-click, *Compress two items*, rename *deliverables dot zip*."]], ["FINISH", 27, "Closing line and hold on recorder window", 52, ["Fifty-two tools: thirty-five good, twelve worn, five past saving at *eighty-six ninety*, under the hundred euro budget.", "Drawer C holds forty percent of the kit, so it's the only one that gets split. I own *two* three-millimetre drivers already, so *none* get bought.", "The trap: one-eighth inch and three millimetre look like the same tool, but one-eighth rounds the three-millimetre socket.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r39_build_timeline", "title": "Keyboard kit build timeline", "group": "Gaming, tech and making", "apps": ["Safari", "Numbers", "Pages", "Calendar"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["Everything is ready, so I will get started.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// only Safari, Numbers, Pages, Calendar, Notes may open - everything else quit", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 30, ["I build mechanical keyboards, and a group buy kit is finally arriving.", "I have six build phases and only three Saturdays in September to fit them into.", "So: the brief in *Preview*, the phases in *Numbers*, the dates checked in *Safari*, and it all goes into *Calendar*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 51, ["In *Notes* I am typing the plan, five lines, before I touch the phases.", "First, the brief in *Preview*, for the three asks and the Saturday rule.", "Then the phases in *Numbers*, five and a half days, and where the delivery blocks it.", "Then *Safari*, for the real September Saturdays and my one free evening.", "Then the schedule written up in *Pages*, and every date entered into *Calendar*.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "No Finder step — go straight to calendar apps", 20, ["Everything I need is already on camera, so I go straight to the apps. *Safari* for the calendar, *Numbers* for the schedule."]], ["SETUP", 5, "Preview: read the brief aloud, note the three asks", 28, ["I open *brief dot p d f*. Three asks. What fits on the twelfth. What's the critical path. Earliest finish date.", "Rules: Saturdays only, fifth is gone, Wednesday evening is free, no part means no start."]], ["SETUP", 6, "Open Safari, Numbers, Pages, Calendar from the Dock", 26, ["From the *Dock*: *Safari* for the calendar lookup, *Numbers* for the schedule, *Pages* for the plan, *Calendar* for the entries."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything is open, so I will check the September calendar.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Navigate to wiki-calendar September 2026 page", 26, ["In *Safari* I go to *wiki-calendar dot com*, search for *September two thousand twenty-six*. The calendar opens."]], ["SAFARI", 9, "Read the Saturdays aloud: 5, 12, 19, 26; note that 5 is gone", 34, ["*September* starts *Tuesday*. Saturdays are the *fifth*, *twelfth*, *nineteenth*, *twenty-sixth*.", "The fifth is gone, I was away. Three build weekends: twelve, nineteen, twenty-six."]], ["SAFARI", 10, "Find Friday 18, and Wednesday 23: critical dates", 28, ["Friday *eighteenth* is the day between weekends twelve and nineteen — that's the delivery day for the films and lube.", "Wednesday *twenty-third* is my only free evening, so that's the firmware day if it doesn't fit on a weekend."]], ["NUMBERS", 11, "File > New > Blank sheet, rename to Schedule", 28, ["In *Numbers*, *File* > *New* > *Blank*. I rename the sheet *Schedule*.", "I'm typing this myself, not from a template, so the schedule is real work."]], ["NUMBERS", 12, "Headers: Date, Weekend, Phases, Time, Why then", 26, ["Five columns: *Date*, *Weekend*, *Phases*, *Time*, *Why then*."]], ["NUMBERS", 13, "Row 1: Sat 12 (1+2, 10-16), what fits in that weekend", 36, ["*Sat 12*. *First build weekend*. Phases: *Inventory and PCB test, Stabiliser tune* — these need the plate and PCB, which are already in the box.", "Time: *ten to sixteen*. Why: *only phases that don't need the films*."]], ["NUMBERS", 14, "Row 2: Fri 18 all-day, films and lube delivery", 28, ["*Fri 18*. *Delivery*. Phases: *films and lube arrive, no build work*.", "All-day marker. Why: *this one delivery decides the finish date*."]], ["NUMBERS", 15, "Row 3: Sat 19 (3+4, 10-17), film and solder", 28, ["*Sat 19*. *Second build weekend*. Phases: *Film and lube, solder switches*.", "Time *ten to seventeen*. Why: *filming is done, soldering can start*."]], ["NUMBERS", 16, "Row 4: Wed 23 (5, 19-21), firmware", 26, ["*Wed 23*. *Weeknight*. Phase: *Firmware and keymap*. Time *nineteen to twenty-one*.", "Why: *only half-day, so it's the weeknight*."]], ["NUMBERS", 17, "Row 5: Sat 26 (6, 10-13), case and sound test", 28, ["*Sat 26*. *Third build weekend*. Phase: *Case assembly and sound test*. Time *ten to thirteen*.", "Why: *depends on firmware, so it's last*."]], ["NUMBERS", 18, "Bold the header fill, stronger fill on the delivery row", 28, ["I format. Header row gets bold fill. Delivery row gets *stronger* fill — it's the critical constraint."]], ["NUMBERS", 19, "File > Export To > PDF: schedule.pdf", 24, ["*File* > *Export To* > *P D F*, named *schedule*, into the folder."]], ["PAGES", 20, "Create blank document, title style: 65% kit build September 2026", 32, ["In *Pages*, *Blank*. Title style: *sixty-five percent kit build September two thousand twenty-six*."]], ["PAGES", 21, "Standfirst: films arrive Fri 18, everything after waits for it", 32, ["Standfirst: *films land Friday eighteenth, everything after it waits*."]], ["PAGES", 22, "Heading: The dates; copy Numbers table and paste", 32, ["Heading: *The dates*. In *Numbers*, I *Command C* the schedule table. In *Pages*, *Command V*, and it pastes in perfectly."]], ["PAGES", 23, "Heading: critical path; list film-solder-firmware-case, 3.5 days", 36, ["Heading: *What's on the critical path*. Film, solder, firmware, case — *three point five days* in fixed order, one delivery holds it.", "Inventory and stabilisers *have a weekend of slack*."]], ["PAGES", 24, "Type in bold colour: Finished and typed on Saturday 26 September", 32, ["Bold coloured line: *Finished and typed on Saturday 26 September two thousand twenty-six*. The end date."]], ["PAGES", 25, "File > Export To > PDF: build_plan.pdf, verify one page", 30, ["*File* > *Export To* > *P D F*, named *build plan*. Check it's *one page* before closing."]], ["CALENDAR", 26, "File > New Calendar: Keyboard build, month view Sep 2026", 32, ["In *Calendar*, *File* > *New Calendar* *On My Mac*. Name: *Keyboard build*. Month view, *September two thousand twenty-six*."]], ["CALENDAR", 27, "Create event: Sat 12 10-16, Inventory PCB test stabiliser tune", 32, ["Event 1. *Saturday twelfth*, *ten to four*. *Inventory, PCB test, stabiliser tune*."]], ["CALENDAR", 28, "Create all-day event: Fri 18, Switch films and lube arrive", 30, ["Event 2. *Friday eighteenth*, *all-day*. *Switch films and lube arrive*. All-day banner."]], ["CALENDAR", 29, "Create event: Sat 19 10-17, Film and lube, then solder", 30, ["Event 3. *Saturday nineteenth*, *ten to five*. *Film and lube, solder*."]], ["CALENDAR", 30, "Create event: Wed 23 19-21, Firmware flash and keymap", 28, ["Event 4. *Wednesday twenty-third*, *seven to nine p m*. *Firmware flash and keymap*."]], ["CALENDAR", 31, "Create event: Sat 26 10-13, Case assembly and sound test", 30, ["Event 5. *Saturday twenty-sixth*, *ten to one*. *Case assembly and sound test*."]], ["CALENDAR", 32, "File > Print > Month view > PDF: september_2026.pdf", 28, ["*File* > *Print*, *Month view*, then *PDF* button. Save as *september twenty twenty-six*."]], ["PREVIEW", 33, "Open build_plan.pdf, markup: oval round Fri 18, arrow to Sat 19", 38, ["I open *build plan dot p d f* in *Preview*. *Markup* toolbar. *Oval* round the Friday eighteenth row.", "*Arrow* down to Saturday nineteenth. Text: *critical path starts here*."]], ["PREVIEW", 34, "Export as PNG: build_plan_annotated.png", 22, ["*File* > *Export*, format *P N G*, named *build plan annotated*."]], ["FINISH", 35, "Finder: select four exports, Compress, rename deliverables.zip", 34, ["In *Finder* I select four files: *schedule*, *build plan*, *september*, *build plan annotated*.", "Right-click, *Compress four items*, rename *deliverables dot zip*."]], ["FINISH", 36, "Closing line and hold on recorder window", 42, ["The twelfth only gets what's already in the box. One delivery — Friday eighteenth — decides the finish date.", "Finished and typed on Saturday twenty-sixth at the earliest. Everything is in *Calendar*.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r40_build_log", "title": "Illustrated PC build log", "group": "Gaming, tech and making", "apps": ["Safari", "Numbers", "Pages", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["Everything is ready, so I will get started.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// only Safari, Numbers, Pages, Preview, Notes may open - everything else quit", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 30, ["I finished building a desktop at the start of August, and I owe the forum a write-up.", "I have my bench notes and six pictures to find, for three honest pages, mistake included.", "So: the notes in *Numbers*, the pictures from *Safari*, and the log laid out in *Pages*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 51, ["In *Notes* I am typing the plan, five lines, before I touch the notes.", "First, the notes in *Numbers*, nine of them, and which six need a picture.", "Then *Safari*, for six photos from Wikimedia Commons, with the licence read off the file page.", "Then the three pages built in *Pages*, notes quoted, photos placed, the mistake included.", "Then the export checked in *Preview*, and everything zipped.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder: Documents/tasks/r40_build_log, brief.pdf there", 28, ["In *Finder*, in *Documents*, I open *r forty build log*.", "Brief is there: three pages A four, two photos each, eight parts total, reused parts not counted."]], ["SETUP", 5, "Preview: read the brief aloud, note the parts total", 30, ["I open *brief dot p d f*. Eight parts, *nine hundred thirty-nine fifty* euros. Monitor, keyboard, disk were reused, don't count toward the total."]], ["SETUP", 6, "Open Safari, Numbers, Pages from the Dock", 24, ["From the *Dock*: *Safari* for Wikimedia Commons, *Numbers* for the notes, *Pages* for the layout."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything is open, so I will check the build notes.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["NUMBERS", 8, "Open buildnotes.csv, count nine rows, read dates from 18 Jul to 2 Aug", 38, ["I open *buildnotes dot c s v* in *Numbers*. *Nine* rows, one note per day from July eighteenth through August second.", "Columns: photo wanted yes or no, and the note itself, what I did that day."]], ["NUMBERS", 9, "Count photo flags: 6 yes, layout: 2 per page, 3 pages total", 32, ["Photo wanted column: *six yes* and three no. That means *two photos per page*, which fills *three pages exactly*."]], ["NUMBERS", 10, "Read note 8 aloud: 1 Aug, no POST, CPU fan cable in fan blades", 42, ["Note 8, August first. *No POST at all. Fans twitched, everything stopped. CPU fan cable pulled into the rear fan's blades.* Board cut power to protect itself.", "*That's* the mistake I made — I did it wrong when I routed the cable. And it goes into the write-up on purpose because it teaches."]], ["NUMBERS", 11, "Read note 9: re-routed, cable-tied, POST first try, 32 GB + NVMe", 34, ["Note 9, August second. *Re-routed and cable-tied, POST first try, 32 GB seen, NVMe seen, Windows in twenty minutes.*", "That's the happy ending."]], ["NUMBERS", 12, "Copy note 8 text, Command C", 22, ["I select and *Command C* note 8 so I can paste it into the write-up."]], ["SAFARI", 13, "Go to Wikimedia Commons, search Category Computer hardware", 28, ["In *Safari* I go to *commons dot wikimedia dot org*, search *Category Computer hardware*. Eight candidates."]], ["SAFARI", 14, "Click through to file page, read license once, Save Image As", 42, ["I click through to each *file page* — not the thumbnail, the full page. Read the licence once so I know what I'm using and I can credit it.", "*Save Image As* into build_photos folder. Eight downloads. I narrate during the downloads to stay under forty-five seconds of silence."]], ["FINDER", 15, "Open build_photos gallery view, drop the 2 weakest images", 32, ["In *Finder* I open the build_photos folder in gallery view. Of the eight pictures, two don't match the build: one is wrong subject, one is too dark.", "I drop those. *Eight down, two dropped, six going in*."]], ["PAGES", 16, "Create blank document, page 1: title and parts list", 34, ["In *Pages*, *Blank* template. No clutter. Heading: *What I built and what it cost*.", "The eight parts, total *nine hundred thirty-nine fifty*, then a note: *reused parts*."]], ["PAGES", 17, "Insert > Choose two photos for page 1, caption each", 32, ["*Insert* > *Choose*, two pictures from build_photos. Caption under each one, identifying what they show."]], ["PAGES", 18, "Page Break; page 2: Assembly day, quote notes 3-7 with dates", 36, ["Page break. *Assembly day*. I quote notes three through seven with their dates, one line each.", "Then *two pictures* from build_photos, captioned."]], ["PAGES", 19, "Page Break; page 3: First boot, paste note 8, type note 9", 36, ["Page break. *First boot and the mistake*. Paste note 8 from my clipboard: *Command V*. Then type note 9 below it with the happy ending."]], ["PAGES", 20, "Add two photos and caption the fan cable problem", 42, ["Two more pictures on page 3. Caption on the fan cable picture: *Why it's in the write-up. The CPU cable got pulled into the rear fan, the fan stalled, and the board cut power rather than run with a stalled fan.*", "*A build log where nothing went wrong teaches nobody anything*. This one does."]], ["PAGES", 21, "Credit line: photos from Wikimedia Commons, CC licences", 28, ["At the end of page 3: *Photographs from Wikimedia Commons under their Creative Commons licences*. That's my attribution."]], ["PAGES", 22, "View > Page Thumbnails, count pages aloud: exactly 3", 28, ["*View* > *Page Thumbnails*. I count on camera: *one, two, three* pages exactly."]], ["PAGES", 23, "File > Export To > PDF: build_log.pdf", 24, ["*File* > *Export To* > *P D F*, named *build log*, into the folder."]], ["PAGES", 24, "File > Save: build_log.pages, editable file for the forum", 28, ["*File* > *Save*, same folder. *build log dot pages*, so the forum can edit it if they want."]], ["PREVIEW", 25, "Open build_log.pdf, View > Thumbnails, verify 3 pages", 30, ["I open *build log dot p d f* in *Preview*. *View* > *Thumbnails*. Check: *three pages*."]], ["PREVIEW", 26, "Zoom page 3, read the fan cable caption to confirm it's there", 36, ["I zoom in on page three and read the fan cable caption aloud. If it's missing the build log fails — the point is the mistake.", "It's there, complete."]], ["FINISH", 27, "Finder: select PDF and Pages file, Compress 2 items", 28, ["In *Finder* I select *build log dot p d f* and *build log dot pages*.", "Right-click, *Compress two items*, rename *deliverables dot zip*."]], ["FINISH", 28, "Closing line and hold on recorder window", 48, ["Nine notes read, six photographs placed two per page, three pages total. One honest mistake documented with a caption, so the next builder learns from it.", "The graphics card is nearly a third of the build. The cheapest part, the cooler, caused the trouble. Exported as P D F with the editable document beside it.", "Zipped as deliverables.", "// pause 2-3 s on the recorder window before you press Stop"]]]}];
const GROUPS = ["GraphPad Prism", "Molecular biology", "Outdoors and cycling", "Gaming, tech and making"];
const SETUP_BEATS = 7;
const TASK_FLOOR = 600;
const PAUSE_LINE = 0.8;
let wpm = 110;

const $ = id => document.getElementById(id);
const mmss = s => { s = Math.max(0, Math.round(s));
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const words = l => l.replace(/\*/g,"").trim().split(/\s+/).filter(Boolean);
const isNote = l => l.startsWith("// ");

function planOf(t){
  let setup = 0, task = 0;
  t.beats.forEach((b, k) => { k < SETUP_BEATS ? setup += b[3] : task += b[3]; });
  return {setup, task, total: setup + task};
}

/* ---------- menu ---------- */
function drawMenu(){
  const m = $("menu"); m.innerHTML = "";
  const h = document.createElement("h1");
  h.textContent = TASKS.length + " walkthroughs";
  m.appendChild(h);
  GROUPS.forEach(g => {
    const list = TASKS.filter(t => t.group === g);
    if(!list.length) return;
    const sec = document.createElement("div"); sec.className = "grp";
    const h2 = document.createElement("h2"); h2.textContent = g; sec.appendChild(h2);
    const grid = document.createElement("div"); grid.className = "grid";
    list.forEach(t => {
      const p = planOf(t);
      const b = document.createElement("button"); b.className = "card";
      b.innerHTML = '<span class="id"></span><span class="ti"></span><span class="mt"></span>';
      b.querySelector(".id").textContent = t.id;
      b.querySelector(".ti").textContent = t.title;
      b.querySelector(".mt").textContent =
        mmss(p.task) + " of work · " + mmss(p.setup) + " opening · " + t.apps.join(", ");
      b.onclick = () => open_(t);
      grid.appendChild(b);
    });
    sec.appendChild(grid); m.appendChild(sec);
  });
}

/* ---------- prompter ---------- */
let T = null, BEATS = [], planEnd = [], planTotal = 0, planSetup = 0;
let i = 0, running = false, tTotal = 0, tBeat = 0, last = null, scale = 1, autoNext = false;
let lineEls = [], lineWordEls = [], lineDur = [], lineStart = [], speechTotal = 0;
let setupEndedAt = null, wake = null;

function open_(t){
  T = t; BEATS = t.beats;
  planEnd = []; BEATS.reduce((a,b,k) => planEnd[k] = a + b[3], 0);
  planTotal = planEnd[planEnd.length-1];
  planSetup = planEnd[SETUP_BEATS-1];
  i = 0; tTotal = 0; tBeat = 0; running = false; setupEndedAt = null; last = null;
  $("menu").style.display = "none"; $("run").classList.add("on");
  $("state").textContent = "PAUSED"; $("state").className = "pause";
  $("tPlay").textContent = "Start"; $("tPlay").classList.remove("run");
  $("totS").textContent = "plan " + mmss(planTotal);
  $("taskS").textContent = "starts at beat " + (SETUP_BEATS + 1);
  location.hash = t.id;
  buildBeat(); render();
}
function toMenu(){
  running = false; wakeOff();
  $("run").classList.remove("on"); $("menu").style.display = "flex";
  location.hash = "";
}

function buildBeat(){
  const say = BEATS[i][4], wrap = $("say");
  wrap.innerHTML = ""; lineEls = []; lineWordEls = []; lineDur = []; lineStart = []; speechTotal = 0;
  say.forEach(raw => {
    const div = document.createElement("div");
    if(isNote(raw)){ div.className = "sayline q"; div.textContent = raw.slice(3);
                     wrap.appendChild(div); return; }
    div.className = "sayline ahead";
    const spans = [];
    raw.split(/(\*[^*]+\*)/).filter(Boolean).forEach(chunk => {
      const em = chunk.startsWith("*") && chunk.endsWith("*");
      const host = em ? document.createElement("em") : div;
      words(chunk).forEach(w => {
        const s = document.createElement("span");
        s.className = "w"; s.textContent = w + " ";
        host.appendChild(s); spans.push(s);
      });
      if(em) div.appendChild(host);
    });
    wrap.appendChild(div);
    lineEls.push(div); lineWordEls.push(spans);
    const d = spans.length / wpm * 60 + PAUSE_LINE;
    lineStart.push(speechTotal); lineDur.push(d); speechTotal += d;
  });
  wrap.style.fontSize = scale + "em";
}

function paint(){
  for(let l = 0; l < lineEls.length; l++){
    const st = lineStart[l], en = st + lineDur[l];
    const live = tBeat >= st && tBeat < en, done = tBeat >= en;
    lineEls[l].className = "sayline " + (live ? "live" : done ? "done" : "ahead");
    const n = lineWordEls[l].length;
    const cut = done ? n : live ? Math.floor((tBeat - st) / (lineDur[l] - PAUSE_LINE) * n) : 0;
    lineWordEls[l].forEach((s, k) => {
      s.className = "w" + (k < cut ? " said" : k === cut && live ? " now" : "");
    });
  }
}

function planSetupActual(){ return setupEndedAt === null ? planSetup : setupEndedAt; }

function render(){
  if(!T) return;
  const [ph, n, tx, sec] = BEATS[i];
  $("phase").innerHTML = T.id + " &middot; " + ph + " <b>&middot; beat " + n + " of " + BEATS.length + "</b>";
  $("num").textContent = String(n).padStart(2,"0");
  $("txt").textContent = tx;
  paint();
  $("pace").innerHTML = "speech <b>" + mmss(speechTotal) + "</b> at " + wpm
    + " wpm &middot; beat allows <b>" + sec + "s</b>";
  const nx = BEATS[i+1];
  $("restLbl").textContent = nx ? "Next" : "";
  $("nextN").textContent = nx ? String(nx[1]).padStart(2,"0") : "";
  $("nextT").textContent = nx ? nx[2] : "— end of run —";
  $("beatV").textContent = mmss(sec - tBeat);
  $("beatS").textContent = "planned " + mmss(sec);
  $("beatFill").style.width = Math.min(100, tBeat / sec * 100) + "%";
  $("beatFill").classList.toggle("over", tBeat > sec);
  const task = Math.max(0, tTotal - planSetupActual());
  const cleared = task >= TASK_FLOOR;
  $("taskV").textContent = i < SETUP_BEATS ? "—" : mmss(task);
  $("taskClock").classList.toggle("cleared", cleared);
  $("taskS").textContent = i < SETUP_BEATS ? "starts at beat " + (SETUP_BEATS+1)
    : (cleared ? "floor cleared" : "floor 10:00 — " + mmss(TASK_FLOOR - task) + " to go");
  $("totV").textContent = mmss(tTotal);
  const d = tTotal - (i > 0 ? planEnd[i-1] : 0) - tBeat;
  $("driftV").textContent = (d >= 0 ? "+" : "-") + mmss(Math.abs(d));
  $("driftV").className = "v " + (d > 8 ? "behind" : d < -8 ? "ahead" : "");
  $("driftS").textContent = Math.abs(d) <= 8 ? "on plan" : d > 0 ? "behind plan" : "ahead of plan";
  $("gate").classList.toggle("show", i === BEATS.length-1 && !cleared);
  $("wpmLbl").textContent = wpm + " wpm";
}

async function wakeOn(){ try{ if("wakeLock" in navigator && !wake) wake = await navigator.wakeLock.request("screen"); }catch(e){} }
async function wakeOff(){ try{ if(wake){ await wake.release(); wake = null; } }catch(e){} }
addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && running) wakeOn(); });

function tick(ts){
  if(running && T){
    if(last !== null){ const dt = (ts - last)/1000; tTotal += dt; tBeat += dt; }
    last = ts;
    if(autoNext && tBeat > speechTotal + 1.5 && i < BEATS.length-1) go(1); else render();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function go(step){
  const to = i + step;
  if(to < 0 || to >= BEATS.length) return;
  if(step > 0 && i === SETUP_BEATS-1 && setupEndedAt === null) setupEndedAt = tTotal;
  if(step < 0 && to === SETUP_BEATS-1) setupEndedAt = null;
  i = to; tBeat = 0; buildBeat(); render();
}
function toggle(){
  running = !running; last = null;
  $("state").textContent = running ? "RUNNING" : "PAUSED";
  $("state").className = running ? "run" : "pause";
  $("tPlay").textContent = running ? "Pause" : "Start";
  $("tPlay").classList.toggle("run", running);
  running ? wakeOn() : wakeOff();
}
function speed(d){ wpm = Math.min(180, Math.max(70, wpm + d)); buildBeat(); render(); }

$("tPlay").onclick = toggle;
$("tBack").onclick = () => go(-1);
$("tNext").onclick = () => go(1);
$("tSlow").onclick = () => speed(-5);
$("tFast").onclick = () => speed(5);
$("back").onclick = toMenu;
$("tFull").onclick = () => {
  const d = document.documentElement;
  if(document.fullscreenElement || document.webkitFullscreenElement){
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    (d.requestFullscreen || d.webkitRequestFullscreen || (()=>{})).call(d);
  }
};

addEventListener("keydown", e => {
  if(!T || !$("run").classList.contains("on")) return;
  if(e.code === "Space"){ e.preventDefault(); toggle(); }
  else if(e.code === "ArrowRight") go(1);
  else if(e.code === "ArrowLeft") go(-1);
  else if(e.code === "Escape") toMenu();
  else if(e.key === "[") speed(-5);
  else if(e.key === "]") speed(5);
  else if(e.key.toLowerCase() === "a"){
    autoNext = !autoNext;
    $("auto").textContent = autoNext ? "on" : "off";
    $("auto").className = autoNext ? "on" : "";
  }
  else if(e.key === "+" || e.key === "="){ scale = Math.min(1.6, scale + .08); $("say").style.fontSize = scale + "em"; }
  else if(e.key === "-"){ scale = Math.max(.6, scale - .08); $("say").style.fontSize = scale + "em"; }
  else if(e.key.toLowerCase() === "r"){ open_(T); }
});

drawMenu();
const want = TASKS.find(t => t.id === location.hash.slice(1));
if(want) open_(want);
</script>
