 *Three hundred and ninety-six grams* of carbs.", "That works out to *sixty point nine grams an hour*, six over my target across six and a half hours.", "*Eleven hundred and eighty grams* carried. *Fourteen euros thirty* of my twenty euro budget. Caffeine *two hundred milligrams*."]], ["NUMBERS", 22, "Select four names and four carb totals, insert 2D column chart", 32, ["Now I select the four food *names* and the four *carb totals* beside them.", "Chart button in the toolbar, *2D column chart*.", "A picture of where those *three hundred and ninety-six grams* comes from."]], ["NUMBERS", 23, "Type the chart title, read the bottles row", 26, ["Title: *Where the 396 g comes from*.", "The bottles are the *biggest single block at 134 grams*, so the refill at ninety-two kilometres is not optional."]], ["NUMBERS", 24, "Drag chart to clear space, then File > Export To > PDF", 26, ["I drag the chart aside so nothing is hidden, then *File*, *Export To*, *P D F*, into the *r16* folder.", "Named *fuelling plan dot p d f*."]], ["PAGES", 25, "Blank template, custom heading", 22, ["In *Pages*, *Blank* template, *Create*.", "Heading: *160 km - fuelling card - 60 g/h*."]], ["PAGES", 26, "Type the seven hour lines with their carb totals", 34, ["*H1* thirty-four grams. *H2* forty-seven. *H3* sixty. *H4* forty, refill at Prats ninety-two.", "*H5*, from four hours thirty, *caffeine starts*, seventy-eight grams.", "*H6* ninety-five. *H6.5* forty-two, final climb."]], ["PAGES", 27, "Type the totals and caffeine note at the bottom", 24, ["Bottom line: *396 grams, 1180 grams, 14.30 euros*.", "Then: *caffeine 200 milligrams, none before 4 h 30*."]], ["PAGES", 28, "Select the heading, apply bold via the Format panel", 24, ["I select the heading and click *Bold* in the Format panel on the right.", "The card is printed at half size and goes in my top-tube bag."]], ["PAGES", 29, "File > Export To > PDF, save as fuel_card.pdf", 22, ["*File*, *Export To*, *P D F*, and I point it at the *r16* folder.", "Named *fuel card dot p d f*."]], ["PREVIEW", 30, "Open fuel_card.pdf, click the markup pen-tip icon", 24, ["I open *fuel card dot p d f* in *Preview*, and click the *markup* button in the toolbar — the pen tip.", "I'm going to mark the caffeine window."]], ["PREVIEW", 31, "Draw a box around H5 to H6.5, add text label", 28, ["A *box* around *H5* through *H6.5*, the last two hours of the ride.", "Text beside it: *caffeine window - last 2 h*."]], ["PREVIEW", 32, "File > Export as PNG, save as fuel_card_marked.png", 22, ["*File*, *Export*, format *P N G*, named *fuel card marked*, so the marked-up version is a picture I can drop into a message."]], ["FINISH", 33, "Finder — select the three exports > Compress", 24, ["Back in *Finder*. Three files came out of this: the *plan*, the *card*, and the *marked card*.", "I select all three, right-click, *Compress 3 Items*."]], ["FINISH", 34, "Rename deliverables.zip, closing line, hold on the recorder window", 44, ["I rename the archive *deliverables dot zip*.", "So: four gels, three oat bars, two bananas, two bottles. *Three hundred and ninety-six grams* against a *three ninety target*.", "*Eleven hundred and eighty grams* carried. *Fourteen euros thirty* of twenty. No caffeine before *four hours thirty*.", "Sachet, nuts and cola stay home.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "r26_cable_audit", "title": "Cable and adapter audit", "group": "Gaming, tech and making", "apps": ["Preview", "Safari", "Numbers", "Pages"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, then say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Do Not Disturb on · desktop empty · no disk images mounted", "// only Preview, Safari, Numbers, Pages may be open — everything else quit", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 38, ["New desk arrives in a fortnight, so I finally tipped out the cable drawer and counted everything.", "Today I turn that count into a *shopping list* and a *drawer map*.", "Their brief in *Preview*, the hand count in *Numbers*, prices off a shop list, and I fill the audit sheet and create an order document and drawer labels."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down, so I can hold myself to it.", "Read the brief. Check the USB-C spec. Count usable cables. Fill the audit sheet. Create the order.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open r26_cable_audit, name the four files", 32, ["In *Finder*, in Documents, I open the folder *r twenty-six cable audit*.", "Four files: the *brief* as a PDF, the *cable count* as a CSV, a *price list* PDF, and an *audit sheet* I have to fill in."]], ["SETUP", 5, "Preview — brief.pdf, read the three asks aloud", 50, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what I need to do.", "Three asks: how many usable cables do I have now, which ones do I need to buy, and what is the euro total.", "Budget is *forty euros*, and no rebuy on spares — if I already have five of something I do not need any more."]], ["SETUP", 6, "Open Safari, Numbers, Pages from the Dock — one reason each", 32, ["From the *Dock*: *Safari*, to check the USB-C power spec.", "*Numbers*, to read the cable count and fill the audit sheet.", "And *Pages*, because that is where the order document and the drawer map get made."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. The plan is written, everything I need is open, so I will get into the data.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["SAFARI", 8, "Google USB-C power delivery, explain EPR versus standard", 58, ["In *Safari* I search *USB-C 240W EPR*, and click the *Wikipedia* article.", "*Extended Power Range* carries *two hundred and forty watts* at forty-eight volts.", "My laptop brick is *ninety-six watts*, so E P R covers it. Standard USB-C tops out well below that.", "This is why I order *K H one one nought two* at *six forty* and not the *K H one one nought three* at *three eighty*, which is only *sixty watts*."]], ["PREVIEW", 9, "pricelist.pdf, point at all four order lines with prices", 48, ["Back to the folder, I open *pricelist dot p d f* in *Preview*, from *Kabelhoek* with V A T included.", "I can see the four product codes I need: *K H one one nought two* at *six forty*. *K H twelve nought seven* at *three forty-five*. *K H two three nought one* at *four seventy-five*. *K H three one four zero* at *two ten*.", "// keep Preview open for the prices"]], ["NUMBERS", 10, "Open cables.csv, describe the twenty-three lines", 42, ["Back to Finder, I double-click *cables dot c s v*. It opens in *Numbers*.", "*Twenty-three* lines, each one a cable type. Columns show description, quantity, and condition.", "Condition column: *good*, *worn*, or *dead*. *Good* is the only one that counts as usable. *Worn* still charges but the sleeve is splitting. Only *good* gets counted."]], ["NUMBERS", 11, "Point out the critical two-metre USB-C row", 36, ["The two-metre USB-C row is the one I use daily for the laptop. It shows *both cables are dead*, so usable is *zero* against three wanted.", "The *Micro-USB* row has *nine good* cables, all for one e-reader and one bike light. That is *seven surplus* to cull."]], ["NUMBERS", 12, "Open cable_audit.xlsx, start filling usable counts", 50, ["Now I open *cable audit dot x l s x*. Yellow cells are mine to fill, grey cells are given.", "The *Usable* column first: zero for the two-metre USB-C, two for the one-metre, two for the short, three for USB-A to USB-C.", "Then nine for Micro-USB, zero for Lightning, one for each HDMI row, one for Ethernet, one for audio, one for DisplayPort, two for the obsolete row."]], ["NUMBERS", 13, "Fill Short/spare as usable minus want", 39, ["The *Short or spare* column is usable minus want. Minus means buy, plus means cull.", "Minus three for the two-metre, zero, plus one, plus one, plus seven, minus one, minus one, zero, minus two, zero, zero, plus two.", "The *Order qty* goes only in the minus rows: three, one, one, two."]], ["NUMBERS", 14, "Look up prices and calculate line totals", 40, ["Unit prices straight off the *pricelist* from *Preview*: *six forty*, *three forty-five*, *four seventy-five*, *two ten*.", "Line total is order quantity times unit price: *nineteen twenty*, *three forty-five*, *four seventy-five*, *four twenty*.", "Bottom line total: *thirty-one sixty euro*, under the *forty euro* budget."]], ["NUMBERS", 15, "Fill the Action column dropdown or type", 36, ["The *Action* column has a dropdown with three choices. The four short rows are *Order*. The rest are either *No action* if they are fine or *Cull* if they are spare.", "// if the dropdown menu does not appear, type the words directly into the cells"]], ["NUMBERS", 16, "Fill the Drawer locations A1 through B3", 34, ["The *Drawer* column maps where each cable lives in the six-drawer unit: *A one*, *A two*, *A three*, *B one*, *B two*, *B three*.", "A dash goes in the last row for obsolete cables that are going to be binned."]], ["NUMBERS", 17, "Fill summary key lines and review totals", 32, ["At the bottom I fill four key lines: four *line items* to order, *seven cables* to cull, order total *thirty-one sixty*.", "I check the numbers once more. All totals match."]], ["NUMBERS", 18, "Export the filled sheet as PDF", 22, ["*File*, *Export To*, *P D F*. I save as *cable audit dot p d f* in the folder."]], ["PAGES", 19, "Create a new blank document for the order", 26, ["In *Pages*, I choose *Blank* and click *Create*."]], ["PAGES", 20, "Type the order heading and four product lines", 48, ["Heading: *Kabelhoek order hyphen twenty-two August twenty twenty-six*.", "Four product lines with code, quantity, and price: K H one one nought two, three at six forty equals nineteen twenty. K H twelve nought seven, one at three forty-five. K H two three nought one, one at four seventy-five. K H three one four zero, two at two ten equals four twenty.", "Bottom line: *Total thirty-one sixty euro*."]], ["PAGES", 21, "Add the Drawer map heading and insert table", 32, ["I add a new heading: *Drawer map*.", "Then *Insert*, *Table*. Plain style, two columns, six rows for A one through B three."]], ["PAGES", 22, "Fill the drawer map table with locations", 30, ["Column one: drawer labels A one, A two, A three, B one, B two, B three.", "Column two: what lives in each drawer — the cable types and quantities for that location."]], ["PAGES", 23, "Add the cull list and dead cables note", 32, ["After the table, a *Cull* line: seven Micro-USB, one short USB-C, one USB-A to USB-C, obsolete cables.", "A note: six dead cables going to the bin."]], ["PAGES", 24, "Export the order and drawer map as PDF", 22, ["*File*, *Export To*, *P D F*. Save as *reorder and drawer map dot p d f* in the folder."]], ["NUMBERS", 25, "Check the grand total one more time", 30, ["I scroll back to the total row to confirm: *four line items*, *seven cables being culled*, order total *thirty-one sixty*.", "Everything checks out. Under budget."]], ["FINISH", 26, "Compress both PDFs into deliverables.zip", 44, ["Back to *Finder*, I select the *cable audit* and *reorder* P D Fs, right-click, *Compress two items*.", "Rename to *deliverables dot zip*.", "Twenty-three cables counted, four line items to order, thirty-one sixty under budget, six-drawer map — it stays sorted this time."]]]}, {"id": "r31_playtime_log", "title": "Play session log to playtime charts", "group": "Gaming, tech and making", "apps": ["Safari", "Numbers", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, then say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 36, ["I've been logging every gaming session for ten weeks.", "Today I'm turning that raw log into three charts that tell me something about how I spend that time.", "So: the readings in *Numbers*, three pivot tables, three charts, and a markdown with the real numbers."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down, so I can hold myself to it.", "Read the brief. Check pivot tables. Make three charts. Mark up the PDFs. Zip it up.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open r31_playtime_log, name the two files", 30, ["In *Finder*, in my Documents, I open the folder *r thirty-one playtime log*, because everything for this lives there.", "Two files: the *brief* as a PDF, and the raw *sessions* as a CSV with fifty-three rows."]], ["SETUP", 5, "Preview — brief.pdf, read the four asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what they want.", "Four asks: total hours over the ten weeks. Weekend versus weekday split. Top game by hours. Longest session and streak.", "And a warning: weeks are lumpy, not a trend."]], ["SETUP", 6, "Open Safari, Numbers from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to check how pivot tables work first.", "And *Numbers*, because that's where the pivot tables and charts get made."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. The plan is written, everything I need is open, so I will get into the data.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["SAFARI", 8, "Search \"numbers mac pivot table apple support\", open the intro guide", 30, ["In *Safari* I search *numbers mac pivot table apple support*.", "I click *Intro to Pivot Tables*, the official Apple guide.", "The key point: *Rows* is what I group by, and *Values* gets summed up."]], ["NUMBERS", 9, "Open sessions.csv, rename the table \"sessions\"", 28, ["Back in the folder, I double-click *sessions dot c s v*, and it opens in *Numbers*.", "*Fifty-three* rows: date, game, and minutes. I right-click the table and rename it *sessions*, so the pivot tables know what to call it."]], ["NUMBERS", 10, "Add column D Week with formula =INT((A2-DATE(2026,5,25))/7)+1", 38, ["Click cell *D1*, type *Week*. In *D2*, type the formula to calculate week number.", "It runs from 1 to 10 only, because the log starts on 25 May, and today is 2 August.", "// the formula computes days since that start date, divides by 7, and adds 1 for week numbering"]], ["NUMBERS", 11, "Add column E Day type with formula =IF(WEEKDAY(A2,2)>5,\"Weekend\",\"Weekday\")", 40, ["Column *E*, label *Day type*. The formula checks the day of week and splits it into weekday or weekend.", "The *2* in WEEKDAY makes Monday *one*, so *greater than five* means Saturday and Sunday.", "Leave the 2 out and the share drifts wrong."]], ["NUMBERS", 12, "Add column F Hours with formula =C2/60", 28, ["Column *F* is *Hours*, which is just the minutes in column *C* divided by 60.", "I need hours because the pivot tables will work in hours, not minutes.", "// drag the fill handle down to row 54 so all 53 sessions get hours calculated"]], ["NUMBERS", 13, "Create pivot 1: Rows Week, Values Hours (Sum)", 40, ["Select the entire *sessions* table. *Insert*, then *Pivot Table*, then *New Sheet*.", "On the pivot, drag *Week* into Rows. Drag *Hours* into Values.", "The sum must read *one hundred and thirteen point three three* hours total."]], ["NUMBERS", 14, "Chart pivot 1 as 2D Column, title \"Hours per week\"", 32, ["With the pivot selected, click *Chart* in the toolbar. Choose *2D Column*.", "Title it *Hours per week*. The chart shows a lumpy line, not a trend - peak at week 5, down to 1.4 in week 8, back up in week 10.", "// lumpy exactly as the brief warned - weeks with holidays show as dips"]], ["NUMBERS", 15, "Create pivot 2: Rows Day type, Values Hours (Sum)", 36, ["Go back to the *sessions* sheet. Select it, *Insert* > *Pivot Table* > *New Sheet*.", "Rows: *Day type*. Values: *Hours*. This splits the total into weekday and weekend.", "The total still reads *one hundred thirteen point three three*."]], ["NUMBERS", 16, "Chart pivot 2 as Pie, title \"Weekend against weekday\", add Value Labels: Percentage", 38, ["*Chart* > *Pie*. Title *Weekend against weekday*.", "Click *Format* > *Series* > *Value Labels*, and change to *Percentage*.", "The pie shows *sixty-eight percent* on weekends, *thirty-two* on weekdays."]], ["NUMBERS", 17, "Create pivot 3: Rows Game, Values Hours (Sum), sort descending", 46, ["Back to *sessions*. *Insert* > *Pivot Table* > *New Sheet*.", "Rows: *Game*. Values: *Hours (Sum)*.", "Right-click the Values column header and *Sort Descending*, so the biggest game appears first.", "// watch the total - it must read one hundred and thirteen point three three hours or the pivot is filtering"]], ["NUMBERS", 18, "Chart pivot 3 as 2D Bar, title \"Hours per game\"", 32, ["*Chart* > *2D Bar*. Title *Hours per game*.", "Bars work better than a column chart because game names are long and will not fit vertically.", "*Ember Hollow* takes forty-one percent, more than the bottom four games combined."]], ["NUMBERS", 19, "Go back to sessions sheet, add column G Gap", 32, ["I click the *sessions* sheet tab to go back.", "Column *G*, label *Gap*. I am looking for the longest streak - days with play in a row.", "// minimise the pivot sheets first - they are not needed any more. This closes down the work that is done."]], ["NUMBERS", 20, "In G3 type =A3-A2, point at the nine-day streak", 40, ["Cell *G3*: *equals A3 minus A2*. This gives the number of days since the row above.", "Zero means same day, one means next day. I scroll down and find a block where every gap is zero or one.", "Twenty-seven June to five July - that's the nine-day streak, the longest run of consecutive play.", "// the streak starts with the longest session ever, which is a coincidence worth noting"]], ["NUMBERS", 21, "Delete column G Gap, sort table Minutes descending", 30, ["I *right-click* column *G* and *Delete Column*.", "Then I select the entire table and *Organize* > *Sort* > sort by *Minutes*, *Descending*.", "The top row is the longest session: *three hundred and seventy* minutes, Saturday 27 June, *Ember Hollow*."]], ["NUMBERS", 22, "File > Export To > PDF: playtime_charts.pdf", 22, ["*File*, *Export To*, *PDF*. I save it into the *r thirty-one playtime log* folder as *playtime charts dot p d f*.", "The PDF contains the entire workbook - all three charts and the raw data."]], ["PREVIEW", 23, "Open playtime_charts.pdf, click Markup, arrow week 5 \"peak 21.4 h\"", 30, ["I open *playtime charts dot p d f* in *Preview*, and click the *Markup* button in the toolbar — the pen tip.", "On the weekly chart, an *arrow* pointing at *week five*, where the peak sits.", "Text: *peak twenty-one point four h*."]], ["PREVIEW", 24, "Second arrow on week 8, \"away, 1.4 h\"", 24, ["Another *arrow* pointing at *week eight*, the trough.", "Label: *away, one point four h*."]], ["PREVIEW", 25, "Export as playtime_weekly_annotated.png", 22, ["*File*, *Export*, format *PNG*, named *playtime weekly annotated dot p n g*.", "// this PNG can be shared straight into chat or a slide"]], ["PREVIEW", 26, "Open the game chart page, box Ember Hollow, label \"41% of all playtime\"", 28, ["Back to the PDF. I navigate to the game chart page.", "I draw a *box* around the *Ember Hollow* bar, and add text: *forty-one percent of all playtime*."]], ["PREVIEW", 27, "Export as playtime_by_game_annotated.png", 18, ["*File*, *Export*, *PNG*, *playtime by game annotated dot p n g*."]], ["FINDER", 28, "Select the three exports > Compress", 24, ["Back in *Finder*. I select the *three* PNG and PDF exports.", "Right-click, *Compress three items*."]], ["FINISH", 29, "Rename deliverables.zip, closing line, hold on the recorder window", 42, ["I rename the archive *deliverables dot zip*.", "One hundred and thirteen hours over ten weeks. Lumpy, not a trend - twenty-one point four in week five, one point four in week eight, back to seventeen in week ten.", "Sixty-eight percent lands on weekends. Ember Hollow is forty-one percent alone. The longest session was six hours ten on 27 June, which started the nine-day streak.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "r32_sticker_sheet", "title": "Hex sticker sheet design", "group": "Gaming, tech and making", "apps": ["Inkscape", "Numbers", "Safari", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, then say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 36, ["I'm a molecular biologist, but today this one is off the bench.", "I'm laying out stickers for my cycling club. Six hexes on one A5 page, two colourways, and nothing may run to the edge.", "So: the geometry in *Numbers*, the layout in *Inkscape*, the check in *Preview*."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down.", "Check the geometry. Open Inkscape, position the hexes. Recolour one, duplicate it. Check the grid. Export for printing.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open r32_sticker_sheet, name the three files", 32, ["In *Finder*, in my Documents, I open *r thirty-two sticker sheet*.", "Three files: the *brief* as PDF, *colourways* as text, and the *assets* SVG with the hexagon already drawn."]], ["SETUP", 5, "Preview — brief.pdf, read the four asks plus Marta's question", 32, ["I open *brief dot p d f* in *Preview*.", "Four asks: does three rows fit on A5, what is the margin, the PDF for the printer, and the PNG for the club chat.", "And Marta asks whether it will actually fit. It will, but it is close."]], ["SETUP", 6, "Open Safari, Inkscape, Numbers from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to check Inkscape's guide on positioning.", "*Inkscape*, because that is where the layout gets drawn.", "*Numbers*, for the geometry maths first."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. Everything I need is open, so I will get into the design.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["SAFARI", 8, "Open Inkscape guide on positioning with Duplicate", 28, ["In *Safari*, I search for the Inkscape basic guide online.", "The key point: *Duplicate* lands the copy exactly on top, so I can type positions instead of dragging."]], ["NUMBERS", 9, "Type the geometry block: page, hex, gap, grid, margins", 38, ["I open a blank *Numbers* sheet. I type out the geometry table.", "*Page A5 one forty-eight by two hundred and ten*.", "*Hex fifty-five by sixty-three point five one, gap three, grid two by three*."]], ["NUMBERS", 10, "Calculate block width and side margin", 32, ["*Block width: two fifty-fives plus one gap equals one hundred and thirteen*.", "*Page one forty-eight minus one thirteen equals thirty-five; divide by two equals seventeen point five a side*.", "So each margin is exactly *seventeen point five millimetres*."]], ["NUMBERS", 11, "Calculate block height and top/bottom margin", 32, ["*Block height: three sixty-three point five ones plus two gaps equals one ninety-six point five three*.", "*Page two hundred and ten minus one ninety-six point five three leaves thirteen point four seven*.", "*Divide by two: six point seven four millimetres top and bottom*."]], ["NUMBERS", 12, "Marta check: margin is double the bleed requirement", 26, ["The printer needs *three millimetre bleed*. My margins are *six point seven four*, more than double.", "Tell Marta the stickers will definitely fit, clear of the edge everywhere."]], ["NUMBERS", 13, "Type the positions table: Granite and Alpine, X and Y", 34, ["Below, I type the positions for all six hexes.", "*Granite left column: X seventeen point five, Y six point seven four, seventy-three point two five, one thirty-nine point seven five*.", "*Alpine right column: X seventy-five point five, same Y values*."]], ["NUMBERS", 14, "File > Export To > PDF: grid_plan.pdf", 22, ["*File*, *Export To*, *PDF*. I save it as *grid plan dot p d f* into the folder."]], ["INKSCAPE", 15, "Open assets.svg, set Document Properties to A5 with bleed", 32, ["In *Inkscape*, I open *assets dot s v g*. It has one hexagon with the club motif already drawn.", "*File* > *Document Properties*. Units to *mm*, page size *A5 portrait one forty-eight by two ten*, *bleed margin three*."]], ["INKSCAPE", 16, "Select All, Group the sticker", 24, ["*Select All*. *Object* > *Group*. Now the sticker moves as one unit when I move it.", "The *units* drop-down in the tool controls bar must read *mm* before I type any coordinate."]], ["INKSCAPE", 17, "Type position X 17.5 Y 6.74, lock aspect, type size W 55 H 63.51", 36, ["With the group selected, I click in the *X* box and type *seventeen point five*. *Tab*, then *Y six point seven four*.", "I *click the lock* icon to lock the aspect ratio. Type *W fifty-five*. The *H* auto-fills to *sixty-three point five one*."]], ["INKSCAPE", 18, "Edit > Duplicate, change Y to 73.25", 26, ["*Edit* > *Duplicate*. A copy lands exactly on top.", "The *Y* box changes automatically to *seventy-three point two five*. *Tab* to confirm."]], ["INKSCAPE", 19, "Duplicate again, change Y to 139.75", 22, ["*Edit* > *Duplicate*. Type *Y one thirty-nine point seven five*.", "Left column Granite is done - three stickers down the left edge."]], ["INKSCAPE", 20, "Duplicate third sticker, change X to 75.5 Y to 6.74", 28, ["*Edit* > *Duplicate*. Type *X seventy-five point five*, *Tab*, *Y six point seven four*.", "This is the top-right sticker, Alpine colourway."]], ["INKSCAPE", 21, "Double-click into the group, recolour body and bolt holes", 30, ["*Double-click* to edit the group. Point at the sticker *body* and the *five bolt holes* inside the chainring.", "Click *Fill and Stroke* in the sidebar. Set both to *1F5241FF*, the Alpine dark green."]], ["INKSCAPE", 22, "Recolour mountain and chainring to EFE7D2", 24, ["Click the *mountain and chainring*. Set *Fill and Stroke* to *EFE7D2FF*, the Alpine light tan."]], ["INKSCAPE", 23, "Recolour keyline, snow cap, and text to 9FD3B8", 24, ["Click the *keyline, snow cap, and lettering*. Set *Fill and Stroke* to *9FD3B8FF*, the Alpine teal."]], ["INKSCAPE", 24, "Escape out of the group, duplicate the Alpine sticker down", 26, ["*Escape*. Click an empty part of the canvas.", "*Edit* > *Duplicate*, type *Y seventy-three point two five*. *Duplicate* again, *Y one thirty-nine point seven five*.", "Right column Alpine is done - three stickers down the right edge."]], ["OBJECT", 25, "Select All, Align and Distribute — all columns aligned", 32, ["*Select All*. *Object* > *Align and Distribute*.", "Check each column, set to *Relative to Last selected*, tick *Center on vertical axis*.", "Click *Make vertical gaps equal*. Nothing moves - proof my coordinates were exact."]], ["OBJECT", 26, "Select All, check size reads 113.00 × 196.53 mm", 24, ["*Select All*. The *W* and *H* boxes in the tool bar read *one hundred thirteen* and *one ninety-six point five three*.", "Exactly right. Every coordinate was precise."]], ["EXPORT", 27, "File > Save a Copy > PDF: stickers_a5.pdf", 26, ["*File* > *Save a Copy*. Format *PDF*. Name *stickers a5*.", "Tick *Use document's page size* and *Convert text to paths* — the printer doesn't have my font."]], ["EXPORT", 28, "File > Export > Document tab, 300 DPI: stickers_a5.png", 24, ["*File* > *Export*. Click the *Document* tab. Set DPI to *three hundred*.", "Name *stickers a5 dot p n g*. It comes out *one thousand seven hundred and forty-eight by twenty-four eighty* pixels at that resolution."]], ["PREVIEW", 29, "Open stickers_a5.pdf, check size 419.5 × 595.3 pt = A5", 28, ["I open *stickers a5 dot p d f* in *Preview*.", "Click *Tools* > *Show Inspector*. The page reads *four hundred nineteen point five by five ninety-five point three points* — that is exactly A5 in screen points."]], ["PREVIEW", 30, "Markup: line at top, label \"6.74 mm top margin\"", 26, ["*Markup*. I draw a *line* along the top margin and label it *six point seven four m m top margin*."]], ["PREVIEW", 31, "Line in the gap, label \"3 mm gap\"", 22, ["I draw a *line* inside one of the gaps between stickers and label it *three m m gap*."]], ["PREVIEW", 32, "File > Export... PNG: sheet_check.png", 20, ["*File* > *Export*, format *PNG*, *sheet check dot p n g*."]], ["FINDER", 33, "Select four exports > Compress", 22, ["Back in *Finder*. I select all *four* exports: the PDF for the printer, the PNG, the grid plan, and the sheet check.", "Right-click, *Compress four items*."]], ["FINISH", 34, "Rename deliverables.zip, closing line, hold on recorder", 28, ["I rename the archive *deliverables dot zip*.", "Six stickers, three Granite, three Alpine, two by three with three millimetre gaps.", "Margins seventeen point five and six point seven four, so it fits, clear of the bleed everywhere.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "r33_broadband_log", "title": "Broadband speed log and complaint letter", "group": "Gaming, tech and making", "apps": ["Safari", "Numbers", "Pages", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, then say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 36, ["Molecular biologist by day, but today this is household admin.", "My broadband is sold as three hundred megabits and the evenings are unusable.", "A month of logged speed tests becomes a complaint. Medians, not my one bad Sunday."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down.", "Read the brief. Check the regulator's code. Analyse the medians. Build a chart. Write the letter.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open r33_broadband_log, name the two files", 30, ["In *Finder*, in my Documents, I open *r thirty-three broadband log*.", "Two files: the *brief* as PDF, and the *speeds* as CSV with sixty tests across thirty days."]], ["SETUP", 5, "Preview — brief.pdf, read the three asks aloud", 32, ["I open *brief dot p d f* in *Preview*.", "Three asks: thirty days of measurements. A chart against the three hundred advertised. A letter quoting *medians*, not best or worst.", "The three hundred is guaranteed minimum one hundred."]], ["SETUP", 6, "Open Safari, Numbers, Pages from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to check the regulator's rules first.", "*Numbers*, for the medians and the chart.", "*Pages*, to write the letter that quotes them."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. Everything I need is open, so I will get into the data.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["SAFARI", 8, "Search Ofcom, broadband speeds code of practice", 26, ["In *Safari*, I type the address bar: *ofcom dot org dot u k slash phones and broadband slash service quality slash broadband speeds codes practice*.", "I skip any AI summary panel."]], ["SAFARI", 9, "Point at advertised average = median at peak time", 28, ["The page explains: an *advertised average* means half of customers get that speed at peak time.", "So it's a *median*. My median over thirty days is the fair comparison against their median.", "Below minimum without a fix means I can exit without an early fee."]], ["NUMBERS", 10, "Open speeds.csv, sixty tests, thirty-day window, three days away", 30, ["In *Finder* I double-click *speeds dot c s v*. It opens in *Numbers*.", "*Sixty* tests. Window is *6 July to 4 August* - thirty consecutive days.", "I was away 17 to 19 July, so only twenty-seven days have tests. That is fine, the data is still valid."]], ["NUMBERS", 11, "Calculate median of all downloads: =MEDIAN, click Download column header", 38, ["Click cell *F2*. Type *equals MEDIAN*, then *click* the *Download Mbps* column header to select the entire column.", "The result is *one eighty-seven point zero*. That is sixty-two percent of the three hundred sold.", "// the mean would be one eighty point seven, but median is the right number for this complaint"]], ["NUMBERS", 12, "Sort table by Time, ascending — point out evening block at bottom", 38, ["*Organize* > *Sort* > *Sort Entire Table*, choose *Time*, *Ascending*.", "The last twenty rows are times *nineteen hundred or later* — the evening block.", "Every evening reading sits below every daytime reading. They split cleanly.", "// this clean separation is because evening congestion is total - every evening maxes out below daytime minimum"]], ["NUMBERS", 13, "Select last 20 Download cells, calculate median: 74", 28, ["I select the bottom twenty *Download* cells. Type the MEDIAN formula in a spare cell.", "Evening median is *seventy-four* — exactly a quarter of three hundred, and below the guaranteed minimum one hundred."]], ["NUMBERS", 14, "Select first 40 Download cells, calculate median: 230", 26, ["I select the top forty *Download* cells — daytime only. MEDIAN again.", "Daytime median is *two hundred and thirty*. The line is clearly capable of far more, so the shortfall is congestion on their side, not my wiring."]], ["NUMBERS", 15, "Re-sort by Date ascending, then Time ascending", 26, ["Before I chart, I need to re-sort. *Organize* > *Sort* > Sort by *Date*, *Ascending*, then *Time*, *Ascending*.", "If the x-axis is not in chronological order, the chart is meaningless."]], ["NUMBERS", 16, "Type Advertised 300 in E1, fill 300 down to E61", 28, ["Click *E1*, type *Advertised 300*. In *E2*, type *300*. Drag the fill handle down to row 61.", "Now I have a constant series for comparison."]], ["NUMBERS", 17, "Select Download + Advertised columns, Chart > 2D Line", 30, ["Select the *Download Mbps* column and the *Advertised* column.", "*Chart* > *2D* > *Line*. A line chart shows both curves together."]], ["NUMBERS", 18, "Title the chart \"Download speed, 60 tests, 6 July to 4 August 2026\"", 28, ["In the chart editor, tick *Title*, and type the full title.", "The chart shows a jagged Download line well below a flat three hundred line."]], ["NUMBERS", 19, "Set Y axis max to 320, thin the X axis date labels", 32, ["Double-click the *Y axis*. Set *Value* (max) to *three hundred and twenty*, so there's room above.", "On the *X axis*, make the labels thinner so they overlap less.", "// the x-axis must show dates chronologically or the chart is meaningless"]], ["NUMBERS", 20, "Trace the evening dips with your finger and point", 20, ["Looking at the chart, the *evening dips* are visible as notches in the Download line.", "They sit well below the promise."]], ["NUMBERS", 21, "File > Export To > PDF: speed_chart.pdf", 22, ["*File* > *Export To* > *PDF*. I save it as *speed chart dot p d f* into the folder."]], ["PAGES", 22, "File > New > Blank, create the letter heading", 28, ["*File* > *New* > *Blank*. A new letter opens. I type the heading and the account number.", "Northgate Fibre, account *NF four four one seven two two nine zero*."]], ["PAGES", 23, "Type the three median lines: 187, 74, 230", 34, ["I type the medians paragraph.", "Median download across all sixty tests: *one eighty-seven* Mbps. Median for nineteen hundred to twenty-three hundred: *seventy-four*. Daytime median: *two hundred and thirty*.", "This is where the letter does its real work."]], ["PAGES", 24, "Point at worst reading 21.4, name it only to reject it", 26, ["I mention the worst single reading, *twenty-one point four* Mbps on a Sunday night.", "But I explain: one bad test is exactly what the provider said they would dismiss, so the case rests on the medians over thirty days."]], ["PAGES", 25, "Ask both remedies by name: price cut OR fee-free exit, 14 days", 32, ["I ask for *either* a permanent reduction in my monthly charge, *or* release from the contract without an early termination fee.", "Request a written response within *fourteen days*."]], ["PAGES", 26, "Bold the two key numbers: 187 and 74", 22, ["I select *one eighty-seven* and make it *bold*. Then *seventy-four* as well.", "They stand out now."]], ["PAGES", 27, "File > Export To > PDF: complaint_letter.pdf", 22, ["*File* > *Export To* > *PDF*. I save it as *complaint letter dot p d f* into the folder."]], ["PREVIEW", 28, "Open both PDFs, check nothing is cut off", 24, ["I open *speed chart dot p d f* in *Preview*, scroll down to check it is complete.", "Then *complaint letter dot p d f* - one page, nothing cropped."]], ["PREVIEW", 29, "Markup: shape round the evening dips, text \"Evening median 74 Mbps\"", 30, ["Back to the speed chart. *Markup*. I draw shapes rounding the dips in the Download line where evenings fall.", "Label: *Evening median seventy-four M b p s*."]], ["PREVIEW", 30, "File > Export as PDF: speed_chart_annotated.pdf", 20, ["*File* > *Export* (format is PDF). Save as *speed chart annotated dot p d f*."]], ["FINDER", 31, "Select three PDFs > Compress", 22, ["Back in *Finder*. I select all *three* PDF files.", "Right-click, *Compress three items*."]], ["FINISH", 32, "Rename deliverables.zip, closing line, hold on recorder", 42, ["I rename the archive *deliverables dot zip*.", "Sixty tests, thirty days. Typical download one eighty-seven against three hundred sold. Seventy-four in the evenings, below their own minimum.", "Medians, not my one bad Sunday. Daytime proves the line is capable of two thirty, so this is congestion on their side, not my wiring.", "Letter quotes both remedies and is ready to send.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "r34_led_wiring", "title": "LED strip wiring diagram", "group": "Gaming, tech and making", "apps": ["Freeform", "Numbers", "Safari", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, then say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 36, ["I'm a molecular biologist, but today I'm on the workshop side of the bench.", "Three LED strips go up in the study. Before I solder anything: can the supply I already own actually drive them?", "So: the Adafruit datasheet in *Safari*, the power budget in *Numbers*, and the wiring diagram in *Freeform*."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down.", "Check the power per pixel. Calculate the total current. Check the supply. Draw the diagram. Mark up the notes.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open r34_led_wiring, name the two files", 30, ["In *Finder*, in my Documents, I open *r thirty-four led wiring*.", "Two files: the *brief* as PDF, and the *strips* as CSV with three rows of LED data."]], ["SETUP", 5, "Preview — brief.pdf, read the three asks aloud", 32, ["I open *brief dot p d f* in *Preview*.", "Three asks: the worst-case current draw. Does my ten-amp supply cover it. A wiring diagram with injection points and fuses."]], ["SETUP", 6, "Open Safari, Numbers, Freeform from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to check the NeoPixel power per pixel.", "*Numbers*, for the power budget maths.", "*Freeform*, for the diagram."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. Everything I need is open, so I will get into the design.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["SAFARI", 8, "Search Adafruit, find NeoPixel power per pixel guide", 28, ["In *Safari* I search *neopixel power per pixel*.", "I click the *Adafruit* guide on powering NeoPixels.", "The key point: full white is *three channels at twenty milliamps each*, so *sixty milliamps per pixel*, *nought point three watts*."]], ["NUMBERS", 9, "Open strips.csv, describe the three strips", 28, ["In the folder I double-click *strips dot c s v*. It opens in *Numbers*.", "Three strips, each two metres, sixty LEDs per metre. Strip C's thirty-percent cell is *empty* — the measurement was never taken.", "Do not guess it. Design case is full white anyway."]], ["NUMBERS", 10, "Point out strip C idles 0.19 A, older 2023 reel", 26, ["Snag two: strip C idles at *zero point one nine* amps against *zero point one one* and *zero point one two*.", "Same length, so it is an older two thousand twenty-three reel. Flag it as worth watching, not a fault."]], ["NUMBERS", 11, "Build the budget block: LEDs, watts, current at 5V", 32, ["Below the table I build the power budget.", "*Three sixty* LEDs total. *Zero point three* watts each. *One hundred and eight* watts.", "*One hundred and eight divided by five volts equals twenty-one point six amps*."]], ["NUMBERS", 12, "Cross-check: 18 W/m × 6 m = 108 W", 24, ["I cross-check with the datasheet: *eighteen watts per metre times six metres total equals one hundred and eight watts*.", "Same answer by a different route. Say this out loud, it is a free credibility win."]], ["NUMBERS", 13, "Compare to the 10 A supply: covers 46%", 26, ["My shelf supply is *ten amps*. Twenty-one point six amps would need it to run at *two hundred and fifteen percent*.", "Actually covers *ten divided by twenty-one point six equals forty-six percent*. Not marginal. Less than half."]], ["NUMBERS", 14, "Option 1: cap brightness at 40%, = 8.64 A, 86% of 10 A", 30, ["*Option 1*: cap software brightness at forty percent. Twenty-one point six times zero point four equals *eight point six four amps*.", "That is *eighty-six percent* of the unit. No cost, but no headroom, and no room for a fourth strip."]], ["NUMBERS", 15, "Option 2: two 15 A supplies, 10.8 A each = 72% load, 46 euros", 32, ["*Option 2*: two fifteen-amp supplies with power injection. Thirty amps available, divided by three strips equals *ten point eight amps per supply*.", "That is *seventy-two percent* load — safe, with headroom. Cost *forty-six euros eighty*."]], ["NUMBERS", 16, "Choose Option 2, File > Export To > PDF: led_power_budget.pdf", 24, ["Option two is the right choice for full brightness and future expansion.", "*File* > *Export To* > *PDF*, save as *led power budget dot p d f*."]], ["FREEFORM", 17, "New board, title \"WS2812B shelf lighting - 360 LEDs, 21.6 A at 5 V full white\"", 32, ["In *Freeform* I create a new board.", "Title: *WS two eight one two B shelf lighting - three hundred and sixty LEDs, twenty-one point six amps at five volts full white*."]], ["FREEFORM", 18, "Draw three strip rectangles: A upper shelf, B desk rear, C bookcase", 30, ["I draw three *rectangles*, one for each strip.", "Label: *A shelf upper, B desk rear, C bookcase*. Each one *two metres, one hundred and twenty LEDs, seven point two amps* at full white."]], ["FREEFORM", 19, "Draw two PSU boxes: 5V 15A each", 22, ["Left side, I draw two *power supply boxes*. Each one *five volts, fifteen amps*."]], ["FREEFORM", 20, "Lines from PSU 1 to both ends of strips A and B", 26, ["I draw *lines* from *PSU 1* to the *left and right ends* of strip *A*.", "Then to both ends of strip *B*. That is *power injection* — feed both ends so current does not crawl down thin copper."]], ["FREEFORM", 21, "Lines from PSU 2 to both ends of strip C", 22, ["*Lines* from *PSU 2* to both ends of strip *C*.", "Two more feeds."]], ["FREEFORM", 22, "Label all six feeds 3.6 A", 20, ["Each feed carries *3.6 amps* — twenty-one point six divided by six.", "I label all six."]], ["FREEFORM", 23, "Fuse symbol on each feed, label FUSE 7.5 A", 24, ["On each feed I draw a *fuse symbol*. Label *FUSE 7.5 A*.", "Seven point five is the right size: above three point six so it does not nuisance-blow, well under ten so a shorted feed can't cook the wire."]], ["FREEFORM", 24, "Bottom line: COMMON GROUND - both PSUs bonded", 26, ["At the bottom, a *line* labelled *COMMON GROUND - both PSUs bonded*.", "No common ground and the data signal has no reference — strips flicker or latch. This one detail kills the build if it is missed."]], ["FREEFORM", 25, "New colour, CONTROLLER box, data LEFT end only of each strip", 28, ["In a *new colour*, I draw the *controller box*. One *data line per strip*, entering at the *left end only*.", "Data is directional. Looping it back breaks the timing."]], ["FREEFORM", 26, "Legend: red = 5V, black = ground, blue = data", 22, ["I add a *legend*: *red equals five volts, black equals ground, blue equals data*.", "Power and data in visibly different colours."]], ["FREEFORM", 27, "Corner note: 0.31 V drop, trim PSU 2 to 5.2 V", 32, ["In a corner I note the *volt drop*. Strip C is three point six metres out and back - seven point two metres of copper.", "At three point six amps, that is *zero point three one volts* lost. Trim *PSU 2 to 5.2 volts* to compensate.", "// the voltage drop across the wire becomes visible as warm-white instead of white at the far end"]], ["FREEFORM", 28, "Share > Export as PDF: led_wiring_diagram.pdf", 22, ["*Share* > *Export as PDF*. Save as *led wiring diagram dot p d f* into the folder."]], ["PREVIEW", 29, "Open the diagram PDF, check labels are readable", 24, ["I open *led wiring diagram dot p d f* in *Preview*. Everything is readable."]], ["PREVIEW", 30, "Markup: arrow to strip C far end, \"worst volt drop, 0.31 V\"", 28, ["*Markup*. An *arrow* pointing at the *far end of strip C*, with text *worst volt drop, zero point three one V*."]], ["PREVIEW", 31, "Arrow to common ground line, \"bond both PSU grounds here\"", 26, ["Another *arrow* pointing at the *common ground line*, labelled *bond both PSU grounds here*."]], ["PREVIEW", 32, "File > Export... PNG: led_wiring_notes.png", 20, ["*File* > *Export*, format *PNG*, save as *led wiring notes dot p n g*."]], ["FINDER", 33, "Select three exports > Compress", 22, ["Back in *Finder*. I select all *three* PDFs.", "Right-click, *Compress three items*."]], ["FINISH", 34, "Rename deliverables.zip, closing line, hold on recorder", 46, ["I rename the archive *deliverables dot zip*.", "Three hundred and sixty LEDs, one hundred and eight watts, twenty-one point six amps. The ten-amp supply covers forty-six percent.", "Two fifteen-amp supplies, both ends of every strip, six fused feeds at seven point five amps each. Common ground bonding everything together, data in one end only, and PSU two trimmed to five point two volts to compensate for the volt drop.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "r35_homebrew_catalogue", "title": "Homebrew game library catalogue", "group": "Gaming, tech and making", "apps": ["Safari", "Numbers", "Pages", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, then say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 36, ["I collect homebrew cartridges - games written for consoles long after discontinuation.", "My shelf goes to a retro meet in September, and my app spat out forty-four rows but merged two exports.", "So I'm cleaning the list into a proper catalogue and a printable index."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down.", "Sort by title. Flag duplicates. Count by platform. Fill the summary sheet. Export the index.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open r35_homebrew_catalogue, name the three files", 32, ["In *Finder*, in my Documents, I open *r thirty-five homebrew catalogue*.", "Three files: the *brief* as PDF, the *library* as CSV with forty-four rows, and a *summary sheet* template."]], ["SETUP", 5, "Preview — brief.pdf, read the four asks and two warnings", 32, ["I open *brief dot p d f* in *Preview*.", "Four asks: cull the duplicate rows. Count by platform. Count untested. Confirm oldest and newest year.", "Two warnings: expect one empty genre cell. Confirm the oldest year - homebrew can predate console discontinuation."]], ["SETUP", 6, "Open Safari, Numbers, Pages from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to check what homebrew means.", "*Numbers*, for the data cleaning and counting.", "*Pages*, for the printable index."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. Everything I need is open, so I will get into the data.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["SAFARI", 8, "Search Wikipedia, homebrew games page", 26, ["In *Safari* I search *homebrew games wikipedia*.", "I click the *Wikipedia* page on homebrew.", "The definition: hobbyist software, outside the official route, released years after the machine stopped selling."]], ["SAFARI", 9, "Point out: Mega Drive (EU) = Genesis (US), keep one spelling", 28, ["The page mentions *Mega Drive in Europe equals Genesis in the United States*.", "My export says *Mega Drive* - I keep that spelling everywhere so game counts don't split across two names."]], ["NUMBERS", 10, "Open library.csv, forty-four rows, five columns", 26, ["In the folder I double-click *library dot c s v*. It opens in *Numbers*.", "*Forty-four* rows. Columns: title, platform, year, genre, status."]], ["NUMBERS", 11, "Point at Solder Season: empty genre cell, leave it in", 26, ["I scroll through and point at *Solder Season, Mega Drive, two thousand eighteen*.", "The *genre* cell is *empty*. It stays in every count. It is there to be noticed, not fixed."]], ["NUMBERS", 12, "Organize > Sort > entire table by Title, Ascending", 28, ["*Organize* > *Sort tab* > *Sort Entire Table*. Choose *title*, *Ascending*.", "I must sort the *entire table*, not a single column, or game titles detach from their platform and year."]], ["NUMBERS", 13, "Type column F \"Repeat\", formula =IF(A2=A1,\"duplicate\",\"\")", 32, ["Column *F*, label *Repeat*. In *F2*, type the formula to flag duplicates.", "Any title that matches the row above gets flagged *duplicate*."]], ["NUMBERS", 14, "Four rows flagged: Kelp Forest 3x, Halide and Sardana 2x each", 28, ["Down the table, *four* rows are flagged.", "Three titles appear more than once: *Kelp Forest* in three times, *Halide* twice, *Sardana* twice."]], ["NUMBERS", 15, "Command-click the four flagged row numbers, Delete Rows", 28, ["I *command-click* each of the four flagged *row numbers* on the left.", "Right-click, *Delete Rows*. Forty rows left."]], ["NUMBERS", 16, "Right-click column F, Delete Column", 20, ["Right-click *column F* and *Delete Column*. The repeat flag is done.", "Table is clean now."]], ["NUMBERS", 17, "Type platform names in H1-H3: Mega Drive, Game Boy, NES", 30, ["In column *H* I type the three platforms: *Mega Drive*, *Game Boy*, *NES*."]], ["NUMBERS", 18, "In I1: =COUNTIF(B,\"Mega Drive\"), fill down to I3", 28, ["Column *I*, row 1: *equals COUNTIF, B, Mega Drive*. This counts how many games are on each platform.", "Fill the formula down for all three platforms."]], ["NUMBERS", 19, "In J1: =I1/40 as percentage, fill down to J3", 26, ["Column *J*, row 1: divide the count by forty and format as percentage.", "The totals: *twenty-four sixty percent*, *ten twenty-five percent*, *six fifteen percent*."]], ["NUMBERS", 20, "In K1: =COUNTIFS(B,\"Mega Drive\",E,\"untested\"), fill down", 30, ["Column *K* counts *untested* per platform.", "*COUNTIFS* with two conditions: platform *and* status equals *untested*."]], ["NUMBERS", 21, "In K4: =COUNTIF(E,\"untested\") for total untested", 26, ["Cell *K4*: total *untested* across all platforms.", "*Twelve* titles have never been tested. Eight are Mega Drive - that is the console I set up first at the meet."]], ["NUMBERS", 22, "In K6: =MIN(C), K7: =MAX(C) for oldest and newest year", 28, ["*K6*: *MIN* of the year column finds the oldest. Result: *nineteen ninety-seven*, *Chrome Lagoon* from Mega Drive.", "*K7*: *MAX* finds the newest. Result: *twenty twenty-five*."]], ["NUMBERS", 23, "Scroll up and point at 1997 Chrome Lagoon Demo", 22, ["I scroll to the top and point at the row.", "*Nineteen ninety-seven* on a *Mega Drive* is not a mistake. Homebrew came years after the console stopped selling."]], ["SUMMARY", 24, "Open catalogue_summary.xlsx, grey cells given, yellow cells mine", 28, ["I open *catalogue summary dot x l s x* from the folder.", "The sheet has two sections: *grey* cells are given, *yellow* cells I have to fill."]], ["SUMMARY", 25, "Fill counts and percentages: 24 60%, 10 25%, 6 15%", 28, ["I type the numbers from Numbers: *twenty-four sixty percent*, *ten twenty-five*, *six fifteen*.", "Using *Command C* and *Command V*, said aloud."]], ["SUMMARY", 26, "Fill untested counts per platform: 8, 2, 2, then total 12", 28, ["Column for untested: *eight* Mega Drive, *two* Game Boy, *two* NES. Total: *twelve*."]], ["SUMMARY", 27, "Play queue dropdown: Mega Drive \"Test next\", other two \"Fine for now\"", 30, ["I fill the *play queue* dropdown: *Mega Drive* gets *Test next* because eight untested is significant.", "The other two get *Fine for now*."]], ["SUMMARY", 28, "Fill key lines: 44, 4, 40, 12, 1997, 2025", 26, ["The bottom section: *44* rows in, *4* duplicate rows to cull, *40* unique titles left.", "*12* untested. Oldest year *nineteen ninety-seven*. Newest *twenty twenty-five*."]], ["SUMMARY", 29, "File > Export To > PDF: catalogue_summary.pdf", 22, ["*File* > *Export To* > *PDF*, save as *catalogue summary dot p d f* into the folder."]], ["PAGES", 30, "Select the forty cleaned rows plus header, Edit > Copy", 26, ["Back in Numbers, I select the *forty* data rows plus the header row at the top.", "*Edit* > *Copy*, say *Command C*."]], ["PAGES", 31, "File > New > Blank template, click Create", 22, ["*File* > *New* > *Blank*. A new document opens. Click *Create*."]], ["PAGES", 32, "Type heading: \"Homebrew shelf — index, August 2026\"", 24, ["I type the title: *Homebrew shelf hyphen index, August two thousand twenty-six*."]], ["PAGES", 33, "Type summary line: \"40 titles · Mega Drive 24 · Game Boy 10 · NES 6 · 12 untested\"", 32, ["One line under the heading: *forty titles, Mega Drive twenty-four, Game Boy ten, NES six, twelve untested*."]], ["PAGES", 34, "Press Return, Edit > Paste, say \"Command V\"", 22, ["I press *Return*, then *Edit* > *Paste*, say *Command V*.", "The forty-row table pastes below the heading."]], ["PAGES", 35, "Drag the width handle so the table fits inside the margins", 26, ["I *drag* the right edge of the table to fit inside the page margins.", "All forty rows are visible, and the status column shows tested or untested for each."]], ["PAGES", 36, "File > Export To > PDF: library_index.pdf", 20, ["*File* > *Export To* > *PDF*, save as *library index dot p d f* into the folder."]], ["PREVIEW", 37, "Open both PDFs, confirm 24 10 6 and 40 titles with status", 28, ["I open *catalogue summary dot p d f* and *library index dot p d f*.", "Confirm: *twenty-four, ten, six* split of the platforms. Forty total titles. Status column visible."]], ["FINDER", 38, "Select two PDFs > Compress", 18, ["Back in *Finder*. Select both *PDFs*.", "Right-click, *Compress two items*."]], ["FINISH", 39, "Rename deliverables.zip, closing line, hold on recorder", 32, ["I rename the archive *deliverables dot zip*.", "Forty-four rows, but four were duplicates across three games. The shelf is really forty.", "Sixty percent Mega Drive. Twelve untested, eight of them Mega Drive - the console I set up first at the meet.", "Twenty-eight years of homebrew, and an index I can print.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "r36_monitor_compare", "title": "Compare three monitors for colour work", "group": "Gaming, tech and making", "apps": ["Preview", "Safari", "Numbers", "Pages"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, then say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// only Preview, Safari, Numbers, Pages, Notes may open - everything else quit", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 38, ["My prints keep coming back wrong. My monitor shifts colour across its width.", "I have three replacement spec sheets. Instead of guessing I'm going to *score them* on five criteria, work out what accuracy costs, and pick one.", "So: the brief in *Preview*, three spec sheets, a *decision matrix* in *Numbers*, and the answer goes into *Pages*."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["I always write the plan down first, so I can stick to it.", "Read the specs. Understand Delta-E. Build the decision matrix. Check the cost per accuracy point. Finish the write-up.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open r36_monitor_compare, name the three files", 30, ["In *Finder*, in Documents, I open the folder *r thirty-six monitor compare*, because everything for this is there.", "Three files: the *brief*, explaining what I need to decide, and three *PDF spec sheets*, one for each monitor."]], ["SETUP", 5, "Preview — brief.pdf, read the asks aloud", 34, ["I open *brief dot p d f* in *Preview* to see what needs deciding.", "Three asks. First, which monitor scores highest. Second, what accuracy costs in euros. Third, does the pick survive different weights for printing.", "There's a warning about gamut, so I read carefully."]], ["SETUP", 6, "Open Safari, Numbers, Pages from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, because I need to understand what Delta-E actually means before I weight it.", "*Numbers*, for the decision matrix and the cost calculation.", "And *Pages*, where the final answer goes."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. The plan is written, everything I need is open, so I will read the specs.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["PREVIEW", 8, "Open spec_corvus_v27q.pdf, read the headline and the footnote", 34, ["I open *spec corvus*. The headline says *ninety-nine percent s R G B*. The footnote says Delta-E *four point one*, uncalibrated.", "*Twice* the working limit, so every edit is made on wrong colour."]], ["PREVIEW", 9, "Point at the uniformity and price, then open the Meridian sheet", 32, ["Eighteen percent uniformity — the panel shifts colour across its own width, which is the exact fault I'm escaping.", "Price: *two hundred and forty-nine euros*. *Coverage* says which colours the panel *can* show. *Accuracy* says whether it shows them *right*. This one is out on accuracy alone.", "Next: *spec meridian*."]], ["PREVIEW", 10, "Open spec_meridian_q27p.pdf, read accuracy and uniformity", 32, ["Meridian: Delta-E *one point eight*, per unit report, *nine percent uniformity*.", "*Three hundred eighty-nine euros*. Better overall, but let me check the third one."]], ["PREVIEW", 11, "Open spec_aurelio_pa32x.pdf, point at the 145% trap, read the real number", 42, ["The Aurelio headline shouts *one hundred and forty-five percent*, but look at note one. That's *volume*, not coverage.", "*Coverage* can't exceed one hundred. The real *coverage* is *one hundred percent* and *ninety-eight percent P three*.", "Delta-E *one point two*, *five percent uniformity*. Best of the three."]], ["SAFARI", 12, "Google \"delta E colour difference CIELAB just noticeable\", open Wikipedia", 30, ["In *Safari* I search *delta e colour difference CIELAB*. I need to know what Delta-E means before I weight it."]], ["SAFARI", 13, "Read the definition, point at the just-noticeable difference, then close", 34, ["*Delta-E* is a *distance in CIELAB*. Just-noticeable difference is *two*. So *under two* is the working limit for editing.", "*Four point one is twice* that — every edit looks wrong. One point two and one point eight are *good*, below the limit.", "// close Safari window with red button"]], ["NUMBERS", 14, "Open monitor_matrix.xlsx, see the grey cells and the yellow cells", 34, ["Back in *Finder*, I open *monitor matrix dot x l s x* in *Numbers*. It has the columns set up already.", "*Grey* cells are given to me — the spec sheet numbers. *Yellow* is mine to fill."]], ["NUMBERS", 15, "Type the Corvus numbers into the yellow cells: 99, 85, 4.1, 18, 249", 32, ["Corvus: *ninety-nine*, *eighty-five*, *four point one*, *eighteen*, *two hundred forty-nine*. Straight off the spec sheet."]], ["NUMBERS", 16, "Type the Meridian specs: 98, 90, 1.8, 9, 389", 32, ["Meridian: *ninety-eight*, *ninety*, *one point eight*, *nine percent*, *three hundred and eighty-nine euros*."]], ["NUMBERS", 17, "Type the Aurelio specs: 100, 98, 1.2, 5, 599 — not 145", 34, ["Aurelio: *one hundred*, *ninety-eight*, *one point two*, *five percent*, *five hundred and ninety-nine euros*.", "The *one hundred* is the real coverage — the *one forty-five* was volume, which I'm not using."]], ["NUMBERS", 18, "Score each monitor on the five criteria, /5 each", 40, ["Now I score them. Corvus on accuracy is a *one* — Delta-E four point one is way off. Coverage is a *five* — ninety-nine is nearly there.", "Uniformity is a *one* — eighteen percent drift is terrible. Price is a *five* — two hundred and forty-nine is cheap.", "Wide gamut is a *two* — eighty-five percent is weak."]], ["NUMBERS", 19, "Score Meridian: 4, 5, 3, 4, 4; then Aurelio: 5, 5, 5, 5, 1", 38, ["Meridian: *four* on accuracy, *five* coverage, *three* wide gamut, *four* uniformity, *four* price — good all round.", "Aurelio: *five* accuracy, *five* coverage, *five* wide gamut, *five* uniformity, *one* on price — it's the better display, but it costs more."]], ["NUMBERS", 20, "Type the formula, say each weight, drag to M7: 3.05, 4.15, 3.80", 54, ["In cell M five the weighted formula. *Accuracy zero point three five*, *price zero point three*, *coverage zero point two*, *gamut zero point zero five*, *uniformity zero point one*.", "They add to one. I drag down. Corvus *three point zero five*, Meridian *four point one five*, Aurelio *three point eight*."]], ["NUMBERS", 21, "Set Verdict dropdown: Reject, Buy, Reject; add the cost calculations", 44, ["Corvus *Reject*, Meridian *Buy*, Aurelio *Reject* — better overall, but wrong purchase.", "I type the cost blocks. Two hundred forty-nine to three hundred eighty-nine is *one hundred forty* euros. Accuracy from *four point one to one point eight* is *two point three* better. That's *sixty euros per point*."]], ["NUMBERS", 22, "Calculate the next step: EUR 389 to 599, 0.6 points, 350 per point", 34, ["Three hundred eighty-nine to five hundred ninety-nine is *two hundred ten* euros. Accuracy from *one point eight to one point two* is *zero point six* points.", "*Two hundred ten* divided by *zero point six* is *three hundred fifty* euros per point. Nearly *six times* the first step's cost."]], ["NUMBERS", 23, "Sensitivity check: change weights for printing, calculate new totals", 50, ["Does the pick survive different weights? For printing: *gamut zero point two five*, *price zero point one*. The other three stay the same.", "New totals: Corvus *two point four five*, Meridian *three point nine five*, Aurelio *four point six*. Aurelio wins on printing weights.", "Not overkill in general. Overkill for *me*, because I don't print."]], ["NUMBERS", 24, "Select Monitor column and Weighted total column, then insert chart", 32, ["I select *Monitor* and *Weighted total*.", "*Insert* > *Chart* > *two-d column*, title *weighted total out of five*, *value labels* on."]], ["NUMBERS", 25, "Click empty cell, export sheet as PDF: monitor_matrix.pdf", 26, ["I click an empty cell, then *File* > *Export To* > *P D F*. Into the r thirty-six folder, named *monitor matrix*."]], ["PREVIEW", 26, "Open monitor_matrix.pdf, markup toolbar: arrow at Meridian bar with label", 36, ["I open *monitor matrix dot p d f* in *Preview*, and click the *markup* button — the pen tip in the toolbar.", "I draw an *arrow* pointing at the Meridian bar, and add a *text box* next to it: *Meridian Q two seven P — four point one five*.", "That points out the winner at a glance."]], ["PREVIEW", 27, "Export as PNG: monitor_chart.png", 20, ["*File* > *Export*, format *P N G*, named *monitor chart*, so the marked-up picture can go into a slide."]], ["PAGES", 28, "Create blank document, heading: Editing monitor — the pick", 30, ["I open *Pages*, pick *Blank* template, and start typing. Heading: *editing monitor — the pick*."]], ["PAGES", 29, "Write the decision paragraph, copy chart from Numbers and paste", 60, ["I type: Meridian at *three hundred eighty-nine euros*. Corvus out on accuracy — *four point one* Delta-E, twice the limit, with *eighteen percent drift*.", "Aurelio is better overall, wrong purchase — last *two hundred ten euros* buys *zero point six* points at *three hundred fifty* each.", "Back in *Numbers*, *Command C* the chart. In *Pages*, *Command V*."]], ["PAGES", 30, "File > Export To > PDF: monitor_pick.pdf", 20, ["*File* > *Export To* > *P D F*, into the folder, named *monitor pick*."]], ["FINISH", 31, "Finder — select three exports, compress, rename deliverables.zip", 32, ["Back in *Finder*, I select the three P D F exports — *monitor matrix*, *monitor chart*, and *monitor pick*.", "Right-click, *Compress three items*, and I rename the archive *deliverables dot zip*.", "// pause 2-3 s on the recorder window before you press Stop"]], ["FINISH", 32, "Closing line and hold on recorder window", 48, ["Three monitors. Meridian *four point one five* against *three point eight* and *three point zero five*.", "Corvus is a marketing number on a *bad panel* — ninety-nine percent coverage is useless at *Delta-E four point one*, twice the working limit.", "The last *two hundred ten euros* buys improvement *under the visible threshold*. *Three hundred eighty-nine euros, bought*.", "// pause 2-3 s on the recorder window before you press Stop"]]]}];
const GROUPS = ["GraphPad Prism", "Molecular biology", "Outdoors and cycling", "Gaming, tech and making"];
const SETUP_BEATS = 7;
const TASK_FLOOR = 600;
const PAUSE_LINE = 0.8;
let wpm = 110;

const $ = id => document.getElementById(id);
const mmss = s => { s = Math.max(0, Math.round(s));
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const words = l => l.replace(/\*/g,"").trim().split(/\s+/).filter(Boolean);
const isNote = l => l.startsWith("// ");

function planOf(t){
  let setup = 0, task = 0;
  t.beats.forEach((b, k) => { k < SETUP_BEATS ? setup += b[3] : task += b[3]; });
  return {setup, task, total: setup + task};
}

/* ---------- menu ---------- */
function drawMenu(){
  const m = $("menu"); m.innerHTML = "";
  const h = document.createElement("h1");
  h.textContent = TASKS.length + " walkthroughs";
  m.appendChild(h);
  GROUPS.forEach(g => {
    const list = TASKS.filter(t => t.group === g);
    if(!list.length) return;
    const sec = document.createElement("div"); sec.className = "grp";
    const h2 = document.createElement("h2"); h2.textContent = g; sec.appendChild(h2);
    const grid = document.createElement("div"); grid.className = "grid";
    list.forEach(t => {
      const p = planOf(t);
      const b = document.createElement("button"); b.className = "card";
      b.innerHTML = '<span class="id"></span><span class="ti"></span><span class="mt"></span>';
      b.querySelector(".id").textContent = t.id;
      b.querySelector(".ti").textContent = t.title;
      b.querySelector(".mt").textContent =
        mmss(p.task) + " of work · " + mmss(p.setup) + " opening · " + t.apps.join(", ");
      b.onclick = () => open_(t);
      grid.appendChild(b);
    });
    sec.appendChild(grid); m.appendChild(sec);
  });
}

/* ---------- prompter ---------- */
let T = null, BEATS = [], planEnd = [], planTotal = 0, planSetup = 0;
let i = 0, running = false, tTotal = 0, tBeat = 0, last = null, scale = 1, autoNext = false;
let lineEls = [], lineWordEls = [], lineDur = [], lineStart = [], speechTotal = 0;
let setupEndedAt = null, wake = null;

function open_(t){
  T = t; BEATS = t.beats;
  planEnd = []; BEATS.reduce((a,b,k) => planEnd[k] = a + b[3], 0);
  planTotal = planEnd[planEnd.length-1];
  planSetup = planEnd[SETUP_BEATS-1];
  i = 0; tTotal = 0; tBeat = 0; running = false; setupEndedAt = null; last = null;
  $("menu").style.display = "none"; $("run").classList.add("on");
  $("state").textContent = "PAUSED"; $("state").className = "pause";
  $("tPlay").textContent = "Start"; $("tPlay").classList.remove("run");
  $("totS").textContent = "plan " + mmss(planTotal);
  $("taskS").textContent = "starts at beat " + (SETUP_BEATS + 1);
  location.hash = t.id;
  buildBeat(); render();
}
function toMenu(){
  running = false; wakeOff();
  $("run").classList.remove("on"); $("menu").style.display = "flex";
  location.hash = "";
}

function buildBeat(){
  const say = BEATS[i][4], wrap = $("say");
  wrap.innerHTML = ""; lineEls = []; lineWordEls = []; lineDur = []; lineStart = []; speechTotal = 0;
  say.forEach(raw => {
    const div = document.createElement("div");
    if(isNote(raw)){ div.className = "sayline q"; div.textContent = raw.slice(3);
                     wrap.appendChild(div); return; }
    div.className = "sayline ahead";
    const spans = [];
    raw.split(/(\*[^*]+\*)/).filter(Boolean).forEach(chunk => {
      const em = chunk.startsWith("*") && chunk.endsWith("*");
      const host = em ? document.createElement("em") : div;
      words(chunk).forEach(w => {
        const s = document.createElement("span");
        s.className = "w"; s.textContent = w + " ";
        host.appendChild(s); spans.push(s);
      });
      if(em) div.appendChild(host);
    });
    wrap.appendChild(div);
    lineEls.push(div); lineWordEls.push(spans);
    const d = spans.length / wpm * 60 + PAUSE_LINE;
    lineStart.push(speechTotal); lineDur.push(d); speechTotal += d;
  });
  wrap.style.fontSize = scale + "em";
}

function paint(){
  for(let l = 0; l < lineEls.length; l++){
    const st = lineStart[l], en = st + lineDur[l];
    const live = tBeat >= st && tBeat < en, done = tBeat >= en;
    lineEls[l].className = "sayline " + (live ? "live" : done ? "done" : "ahead");
    const n = lineWordEls[l].length;
    const cut = done ? n : live ? Math.floor((tBeat - st) / (lineDur[l] - PAUSE_LINE) * n) : 0;
    lineWordEls[l].forEach((s, k) => {
      s.className = "w" + (k < cut ? " said" : k === cut && live ? " now" : "");
    });
  }
}

function planSetupActual(){ return setupEndedAt === null ? planSetup : setupEndedAt; }

function render(){
  if(!T) return;
  const [ph, n, tx, sec] = BEATS[i];
  $("phase").innerHTML = T.id + " &middot; " + ph + " <b>&middot; beat " + n + " of " + BEATS.length + "</b>";
  $("num").textContent = String(n).padStart(2,"0");
  $("txt").textContent = tx;
  paint();
  $("pace").innerHTML = "speech <b>" + mmss(speechTotal) + "</b> at " + wpm
    + " wpm &middot; beat allows <b>" + sec + "s</b>";
  const nx = BEATS[i+1];
  $("restLbl").textContent = nx ? "Next" : "";
  $("nextN").textContent = nx ? String(nx[1]).padStart(2,"0") : "";
  $("nextT").textContent = nx ? nx[2] : "— end of run —";
  $("beatV").textContent = mmss(sec - tBeat);
  $("beatS").textContent = "planned " + mmss(sec);
  $("beatFill").style.width = Math.min(100, tBeat / sec * 100) + "%";
  $("beatFill").classList.toggle("over", tBeat > sec);
  const task = Math.max(0, tTotal - planSetupActual());
  const cleared = task >= TASK_FLOOR;
  $("taskV").textContent = i < SETUP_BEATS ? "—" : mmss(task);
  $("taskClock").classList.toggle("cleared", cleared);
  $("taskS").textContent = i < SETUP_BEATS ? "starts at beat " + (SETUP_BEATS+1)
    : (cleared ? "floor cleared" : "floor 10:00 — " + mmss(TASK_FLOOR - task) + " to go");
  $("totV").textContent = mmss(tTotal);
  const d = tTotal - (i > 0 ? planEnd[i-1] : 0) - tBeat;
  $("driftV").textContent = (d >= 0 ? "+" : "-") + mmss(Math.abs(d));
  $("driftV").className = "v " + (d > 8 ? "behind" : d < -8 ? "ahead" : "");
  $("driftS").textContent = Math.abs(d) <= 8 ? "on plan" : d > 0 ? "behind plan" : "ahead of plan";
  $("gate").classList.toggle("show", i === BEATS.length-1 && !cleared);
  $("wpmLbl").textContent = wpm + " wpm";
}

async function wakeOn(){ try{ if("wakeLock" in navigator && !wake) wake = await navigator.wakeLock.request("screen"); }catch(e){} }
async function wakeOff(){ try{ if(wake){ await wake.release(); wake = null; } }catch(e){} }
addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && running) wakeOn(); });

function tick(ts){
  if(running && T){
    if(last !== null){ const dt = (ts - last)/1000; tTotal += dt; tBeat += dt; }
    last = ts;
    if(autoNext && tBeat > speechTotal + 1.5 && i < BEATS.length-1) go(1); else render();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function go(step){
  const to = i + step;
  if(to < 0 || to >= BEATS.length) return;
  if(step > 0 && i === SETUP_BEATS-1 && setupEndedAt === null) setupEndedAt = tTotal;
  if(step < 0 && to === SETUP_BEATS-1) setupEndedAt = null;
  i = to; tBeat = 0; buildBeat(); render();
}
function toggle(){
  running = !running; last = null;
  $("state").textContent = running ? "RUNNING" : "PAUSED";
  $("state").className = running ? "run" : "pause";
  $("tPlay").textContent = running ? "Pause" : "Start";
  $("tPlay").classList.toggle("run", running);
  running ? wakeOn() : wakeOff();
}
function speed(d){ wpm = Math.min(180, Math.max(70, wpm + d)); buildBeat(); render(); }

$("tPlay").onclick = toggle;
$("tBack").onclick = () => go(-1);
$("tNext").onclick = () => go(1);
$("tSlow").onclick = () => speed(-5);
$("tFast").onclick = () => speed(5);
$("back").onclick = toMenu;

addEventListener("keydown", e => {
  if(!T || !$("run").classList.contains("on")) return;
  if(e.code === "Space"){ e.preventDefault(); toggle(); }
  else if(e.code === "ArrowRight") go(1);
  else if(e.code === "ArrowLeft") go(-1);
  else if(e.code === "Escape") toMenu();
  else if(e.key === "[") speed(-5);
  else if(e.key === "]") speed(5);
  else if(e.key.toLowerCase() === "a"){
    autoNext = !autoNext;
    $("auto").textContent = autoNext ? "on" : "off";
    $("auto").className = autoNext ? "on" : "";
  }
  else if(e.key === "+" || e.key === "="){ scale = Math.min(1.6, scale + .08); $("say").style.fontSize = scale + "em"; }
  else if(e.key === "-"){ scale = Math.max(.6, scale - .08); $("say").style.fontSize = scale + "em"; }
  else if(e.key.toLowerCase() === "r"){ open_(T); }
});

drawMenu();
const want = TASKS.find(t => t.id === location.hash.slice(1));
if(want) open_(want);
</script>
