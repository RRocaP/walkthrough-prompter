 "apps": ["Numbers", "Keynote", "Safari", "Preview", "Finder"], "beats": [["SETUP", 1, "Hold on the recorder window, say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Do Not Disturb on · desktop empty · no disk images mounted", "// only Numbers, Keynote, Safari, Preview, Finder, Notes may run"]], ["SETUP", 2, "The opening — what you are doing and the route through the apps", 48, ["I ride with a local cycling club, and I've been asked to put the season's numbers on a screen at our AGM.", "I have my ride log from January to July, and I need four slides out of it by Friday.", "So: the brief in *Preview*, the rides in *Numbers*, a chart by month in *Numbers*, and four slides in *Keynote*, exported as PDF."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down.", "Read the brief. Total the columns. Check the blank cell. Build the month chart. Create four slides. Export as PDF.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open r01_ride_log, name the two files", 30, ["In *Finder*, in my Documents, I open the folder *r zero one ride log*.", "Two files: the *brief* as a PDF, and my *rides* as a CSV."]], ["SETUP", 5, "Preview — brief.pdf, read the four asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what they want.", "Four slides. Totals in one. Chart by month in another. Standout rides. And next season's goal."]], ["SETUP", 6, "Open Safari, Numbers, Keynote from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to check the Everest comparison.", "*Numbers*, because that's where the rides live and the chart gets made.", "And *Keynote*, to build the four slides for the projector."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. The plan is written, everything I need is open.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["SAFARI", 8, "Search for Mount Everest height, point at the metres figure", 28, ["In *Safari* I search *mount everest height metres*, and click the Wikipedia result.", "I point at the infobox: *eight thousand eight hundred and forty-eight point eight six metres*."]], ["SAFARI", 9, "Calculate the Everest comparison, then close the Safari window", 30, ["My season's climbing is forty-one thousand eight hundred and fifty metres.", "Divide that by eight thousand eight hundred and forty-nine: that's *nearly five Everests*.", "// close the Safari window with the red button before moving on"]], ["NUMBERS", 10, "File > Open rides.csv, describe its shape", 36, ["Back in the folder, I double-click *rides dot c s v*, and it opens in *Numbers*.", "*Six* columns: date, distance, climbing, average speed, notes, and the ride name.", "*Sixty-eight* rides from the *fifth of January* to the *twenty-sixth of July*."]], ["NUMBERS", 11, "Click column C header, read the sum at bottom right", 26, ["I click the column *C* header — that's *distance in kilometres*.", "At the bottom right, Numbers shows me the sum: *three thousand four hundred and twelve kilometres*."]], ["NUMBERS", 12, "Click column D header, read the climbing total", 26, ["Column *D* header — that's *metres climbed*.", "The sum reads *forty-one thousand eight hundred and fifty metres*."]], ["NUMBERS", 13, "Scroll to row 43, point at the blank speed cell", 36, ["Now I scroll down to row *forty-three*, that's May nineteenth.", "Distance and climbing are recorded, but the average speed is *blank*. The note says the head unit died.", "I leave it blank, not zero. A zero would drag the season average down and lie about my speed."]], ["NUMBERS", 14, "Build the month table: months in column H, totals in column I", 42, ["Back to the top. I build a month table to chart the data.", "Column *H*, I type the months down: *January, February, March, April, May, June, July*.", "Column *I*, I type the monthly totals: three twenty, three ninety-five, five oh five, two sixty-two, six forty, seven twenty, five seventy.", "This aggregates all sixty-eight rides into seven numbers so I can see the pattern by month."]], ["NUMBERS", 15, "Select I1:I7, check the sum at bottom right matches 3,412", 26, ["I select *I one* down to *I seven*, the seven monthly totals.", "Bottom right: the sum reads three thousand four hundred and twelve — that matches exactly."]], ["NUMBERS", 16, "Select H1:I7, insert a 2D column chart", 48, ["I select from *H one* to *I seven* to include the month names and the totals.", "In the toolbar I click *Chart*, and I pick *2D Column* — bars, because these are seven separate months, not a continuous line.", "A bar chart shows each month as its own value, whereas a line would make it look like the riding flows smoothly through the season.", "// a line would suggest the months flow together, which they don't"]], ["NUMBERS", 17, "Set chart title, point at June and April, copy the chart", 51, ["Double-click the chart to edit it. The title box appears.", "I type *Kilometres per month, two thousand twenty-six season*.", "I point at the tall bar in June — *seven hundred and twenty* — that's the biggest month, roughly one fifth of the whole season.", "And the short one in April — *two hundred and sixty-two*, where I had the knee and took two weeks off."]], ["NUMBERS", 18, "Click the chart, Edit > Copy, say \"Command C\"", 22, ["I click the chart once to select it. *Edit*, *Copy*.", "*Command C*."]], ["KEYNOTE", 19, "Create a new Keynote presentation, white theme, wide 16:9", 32, ["In *Keynote*, the theme chooser appears. I pick the *white* theme — it's going on a projector at the AGM, so plain is better than fancy.", "I pick *wide* for *sixteen by nine*, because that's the standard format for a modern projector.", "Nothing distracts from the numbers."]], ["KEYNOTE", 20, "Slide 1: title and body with the season totals", 38, ["Slide one appears. I click the title and type *Valles Riders - my two thousand twenty-six season*.", "The body: *January to July, sixty-eight rides, three thousand four hundred and twelve kilometres, forty-one thousand eight hundred and fifty metres climbed — nearly five Everests — average fifty kilometres per ride*."]], ["KEYNOTE", 21, "Add Slide > Title & Bullets, paste the chart with Command V", 30, ["I click *Add Slide*, then pick *Title and Bullets*.", "I type the title *Kilometres per month*.", "I click in the body, *Edit > Paste*, say *Command V*. The chart lands in the slide."]], ["KEYNOTE", 22, "Drag the chart corner to resize it, make sure it's readable", 48, ["The chart is too big. I grab the *bottom-right corner* and drag it smaller so the whole slide reads together.", "I position it so the month names are readable and the bar heights are all visible.", "Month names and the numbers are clear on screen — that's what matters on a projector.", "I click on the slide background to deselect the chart."]], ["KEYNOTE", 23, "Add Slide 3: Rides worth talking about", 52, ["Add Slide again, Title and Bullets.", "Title: *Rides worth talking about*.", "Body: *One hundred and forty-two kilometres, Coast loop, Sunday June the fourteenth* — that's the only ride over a hundred all season. The next longest is eighty-four point two.", "*One thousand seven hundred and seventy metres of climbing, Collserola gravel, June the twenty-first* — that's the steepest day of the year in terms of metres per kilometre."]], ["KEYNOTE", 24, "Slide 3 continued: the April gap", 26, ["*April*: knee went on the twelfth, back on the twenty-seventh. Two weeks off, the longest break in the season.", "Everything either side of it is just a few days apart."]], ["KEYNOTE", 25, "Add Slide 4: Next season goal", 26, ["Add Slide, Title and Bullets.", "Title: *Next season*.", "Body: *Four thousand kilometres and fifty thousand metres. One more ride a month, off an injured season*."]], ["KEYNOTE", 26, "File > Export To > PDF, Good quality, season_summary.pdf", 24, ["*File*, *Export To*, *PDF*.", "Quality: *Good*. I save it to the folder as *season summary dot p d f*."]], ["PREVIEW", 27, "Open season_summary.pdf, click through the four slide thumbnails", 28, ["In *Finder* I double-click *season summary dot p d f* to open it in *Preview*.", "On the left sidebar I see the four thumbnails. I click each one to make sure the chart text survived the export."]], ["NUMBERS", 28, "File > Export To > PDF: month_totals.pdf", 22, ["Back to *Numbers*. *File*, *Export To*, *PDF*.", "I save it as *month totals dot p d f* to show the working."]], ["FINISH", 29, "Finder — select both PDFs, Compress, rename deliverables.zip", 26, ["In *Finder*, I select *season summary* and *month totals*, both PDFs.", "Right-click, *Compress two items*."]], ["FINISH", 30, "Closing line and hold on the recorder window", 34, ["I rename the archive *deliverables dot zip*.", "So: three thousand four hundred and twelve kilometres, forty-one thousand eight hundred and fifty metres, sixty-eight rides.", "June biggest at seven hundred and twenty, the Coast loop the standout at one hundred and forty-two, April the fortnight off.", "Four slides, PDF, ready for the projector.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r02_route_card", "title": "Hike route card with elevation profile", "group": "Outdoors and cycling", "apps": ["Safari", "Maps", "Numbers", "Pages", "Preview", "Finder"], "beats": [["SETUP", 1, "Hold on the recorder window, say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Do Not Disturb on · desktop empty · no disk images mounted", "// only Safari, Maps, Numbers, Pages, Preview, Finder, Notes may run"]], ["SETUP", 2, "The opening — what you are doing and the route through the apps", 36, ["I'm planning a Pyrenees day walk for me and four friends.", "I have the GPS track from walking it in June, and I'm turning it into a one-page route card they can each carry.", "So: drive time and sunset in *Maps* and *Safari*, the elevation profile in *Numbers*, a printed card in *Pages*, and everything zipped."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down.", "Check the drive. Find sunset. Open the track file. Calculate the hard parts. Build the elevation profile. Make the route card. Export.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open r02_route_card, name the two files", 30, ["In *Finder*, in my Documents, I open the folder *r zero two route card*.", "Two files: the *brief* as a PDF with my planning notes, and the *track* as a CSV with GPS points."]], ["SETUP", 5, "Preview — brief.pdf, read the four asks aloud", 36, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what they want.", "Four things. The route distance and climbing and the high point. An elevation profile so they see where the hard bit is.", "The steepest section with kilometre marks. And water plus one escape route if the weather turns."]], ["SETUP", 6, "Open Safari, Maps, Numbers, Pages from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to check sunset times so nobody comes down in the dark.", "*Maps*, to read the drive time from Barcelona.", "*Numbers*, for the track file and the calculations. And *Pages*, to make the printed card."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. The plan is written, everything I need is open.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["MAPS", 8, "Search Setcases, click the top result", 24, ["In *Maps* I search *Setcases*.", "I click the top result — that's the trailhead in the Camprodon valley."]], ["MAPS", 9, "Click Directions, from Barcelona, read the drive time aloud", 28, ["I click the *Directions* button.", "From Barcelona. The drive time appears: *two hours and fifteen minutes*.", "So if I want boots on at eight in the morning, I leave at *half past five*."]], ["MAPS", 10, "Close the directions, leave the map visible", 18, ["I close the directions drawer.", "// leave Maps showing the Setcases location for now"]], ["SAFARI", 11, "Search or open sunrise-sunset.org, look for Setcases", 26, ["In *Safari* I navigate to *sunrise dash sunset dot org*.", "I search for *Setcases* to find the sunset time."]], ["SAFARI", 12, "Read the sunset time aloud", 20, ["The sunset time appears. That's when we stop and turn down the mountain.", "Nobody descends a steep track in the dark, so I make a note of it on the card."]], ["NUMBERS", 13, "File > Open track.csv, describe its shape", 32, ["Back in the folder, I double-click *track dot c s v*, and it opens in *Numbers*.", "*Two* columns: cumulative distance in kilometres and elevation in metres.", "*Two hundred and eighty-four* rows of GPS points, from the starting height back to the same height when the loop closes."]], ["NUMBERS", 14, "Scroll to the bottom row, check the distance and elevation", 26, ["I scroll to the bottom. The last row shows *fourteen point two kilometres* and we're back to *six hundred and twelve metres*.", "The loop closes — that's the sanity check."]], ["NUMBERS", 15, "Back to the top, add a change column", 24, ["Back to the top. I add a change column in *C*.", "In *C one* I type *change*. In *C three* I type equals *B three* minus *B two*."]], ["NUMBERS", 16, "Copy C3, paste it down to C285", 22, ["I click *C three*. *Command C*.", "I select from *C four* down to *C two hundred and eighty-five*, *Command V*."]], ["NUMBERS", 17, "Add calculations in column F: max distance, total ascent, high point", 36, ["In *F one* I type equals *M A X* of *A two* to *A two hundred and eighty-five* — that's the maximum distance.", "In *F two* I type equals *S U M I F* of *C three* to *C two hundred and eighty-five* comma greater than zero — that's total ascent.", "// only count the uphill steps, not the whole net change, which is zero on a loop"]], ["NUMBERS", 18, "High point and kilometre, steepness calculation", 36, ["In *F three* I find the high point: *M A X* of *B two* to *B two hundred and eighty-five*.", "In *F four* the kilometre where it happens: *I N D E X* and *M A T C H*.", "In *F five* I calculate the steepest gradient: the height change divided by five hundred metres, times one hundred.", "// this will show me the steepest half-kilometre on the route"]], ["NUMBERS", 19, "Look at column B around the water site at km 6.1", 26, ["I scroll down to around kilometre six point one.", "The elevation is dead flat at seven hundred and ninety-six metres — that's the spring, the only water on the walk."]], ["NUMBERS", 20, "Select columns A and B, insert a scatter chart", 28, ["I select *A* — distance — and *command-click* *B* — elevation.", "I click *Chart* in the toolbar, and pick *two D scatter* — not a line, because the GPS points are unevenly spaced and a scatter keeps each one in its true place on the axis."]], ["NUMBERS", 21, "Format the chart: add connecting line, set axis limits and titles", 32, ["I right-click the chart and click *Format*.", "*Series*: I turn on the connecting line so it reads as a profile.", "On *Axis*, Y minimum six hundred and fifty, maximum one thousand one hundred and fifty. Axis titles: *Distance (km)* across, *Elevation (m)* up."]], ["NUMBERS", 22, "Set chart title, point at the peak and the water", 26, ["Chart title: *Coll de Ferro circular*.", "I point at the peak around kilometre nine — that's the col at eleven hundred and two metres.", "And the flat section around kilometre six — that's the water."]], ["NUMBERS", 23, "File > Export To > PDF: track_profile.pdf", 22, ["*File*, *Export To*, *PDF*.", "I save it to the folder as *track profile dot p d f*."]], ["PAGES", 24, "Click the chart, Command C, open Pages blank document", 26, ["I click the chart to select it. *Command C*.", "In *Pages*, I click *Blank*, then *Create*. A blank page opens."]], ["PAGES", 25, "Paste the chart, add title and statistics above", 32, ["*Command V*. The chart lands on the page.", "Above it I type: *Saturday September the twelfth, Setcases, Coll de Ferro circular*.", "*Fourteen point two kilometres, six hundred and forty metres climbed, high point eleven hundred and two metres*."]], ["PAGES", 26, "Add route notes: low point, spring, ramp, escape", 70, ["Below the chart, I type the route notes.", "*Kilometre three point seven five: low point at six hundred and twenty-nine metres, in the beech wood*.", "*Kilometre six point one: spring at seven hundred and ninety-six metres, the only water on the whole loop*.", "*Kilometre eight point nine to nine point four: the ramp, fourteen percent gradient, seventy metres of climbing in half a kilometre — the steepest section*.", "*Kilometre eleven: forestry track escape to the valley road, roughly forty minutes down if the weather turns or someone gets hurt*."]], ["PAGES", 27, "Add leave time, parking, and boots-on time", 24, ["I add the logistics.", "*Drive from Barcelona two hours fifteen, so we leave at half past five*.", "*Gravel pull-in parking, four euros*.", "*Boots on at eight in the morning*."]], ["PAGES", 28, "File > Export To > PDF: route_card.pdf", 22, ["*File*, *Export To*, *PDF*.", "I save it as *route card dot p d f*."]], ["PREVIEW", 29, "Open route_card.pdf, use markup to annotate the steep section", 30, ["I double-click *route card dot p d f* to open it in *Preview*.", "I click the *markup* button in the toolbar — the pen-tip icon.", "I draw an *oval* around the steep section around kilometre nine and add text: *fourteen percent ramp*."]], ["PREVIEW", 30, "Add an arrow at the water site", 22, ["I draw an *arrow* pointing at the flat section around kilometre six.", "Next to it: *water, kilometre six point one*."]], ["PREVIEW", 31, "File > Export as PNG: route_card_marked.png", 22, ["*File*, *Export*, format *P N G*, named *route card marked dot p n g*.", "This marked-up version is a picture the group can drop into their phone."]], ["FINISH", 32, "Finder — select three exports, Compress, rename deliverables.zip", 26, ["Back in *Finder*. I select *track profile* PDF, *route card* PDF, and *route card marked* PNG — three files.", "Right-click, *Compress three items*."]], ["FINISH", 33, "Closing line and hold on the recorder window", 68, ["I rename the archive *deliverables dot zip*.", "So: fourteen point two kilometres, six hundred and forty metres up, the col at eleven hundred and two metres at kilometre nine point four.", "One steep bit at fourteen percent between kilometre eight point nine and nine point four — that's the crux of the route.", "Water only at kilometre six point one at the spring.", "A bail-out at kilometre eleven down the forestry track, and we leave at half five in the morning to make boots on at eight.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r03_bike_lights", "title": "Compare four bike lights on specs", "group": "Outdoors and cycling", "apps": ["Preview", "Safari", "Numbers", "Pages", "Finder"], "beats": [["SETUP", 1, "Hold on the recorder window, say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Do Not Disturb on · desktop empty · no disk images mounted", "// only Preview, Safari, Numbers, Pages, Finder, Notes may run"]], ["SETUP", 2, "The opening — what you are doing and the route through the apps", 36, ["I commute fourteen kilometres each way and the clocks go back at the end of October, so I need a proper front light.", "I have spec sheets for four lights and a scoring rule I wrote down in advance.", "So: pull the numbers in *Preview*, work them out in *Numbers*, score them, and write a recommendation in *Pages*."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down.", "Read the specs. Build the comparison. Work out runtime per gram. Score them. Write the recommendation.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open r03_bike_lights, name the files", 30, ["In *Finder*, in my Documents, I open the folder *r zero three bike lights*.", "My own *brief* with the scoring rule, and four spec sheets in PDF."]], ["SETUP", 5, "Preview — brief.pdf, read the scoring rule aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*, to see the scoring rule.", "Sixty euro ceiling. Six kilometres of my commute is unlit, so fifty minutes in the dark.", "Runtime and weight are *doubled* in the score, on purpose — brightness alone is a weak number."]], ["SETUP", 6, "Open Safari, Numbers, Pages from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to understand what lumens actually means.", "*Numbers*, for the spec sheets and the scoring.", "And *Pages*, to write the recommendation I'll hand back."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. The plan is written, everything I need is open.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["SAFARI", 8, "Search for bicycle lighting, click the Wikipedia page", 24, ["In *Safari* I search *bicycle lighting lumens runtime standard*.", "I click the Wikipedia result."]], ["SAFARI", 9, "Read the lumens definition aloud, then note it", 34, ["I read the output and standards section.", "Lumens is total light coming out of the lamp, not how well it's aimed.", "It says nothing about how long that light lasts. That's why my scoring rule *doubles* runtime in the calculation.", "Brightness without stamina doesn't help on a dark commute."]], ["PREVIEW", 10, "Open spec_nordkant_vega400.pdf, read the four key figures", 26, ["Back in the folder, I open *spec nordkant vega four hundred dot p d f* in *Preview*.", "Plain table. Four hundred lumens, three hours runtime, one hundred and twenty-eight grammes with mount, thirty-four ninety euros."]], ["PREVIEW", 11, "Open spec_larsvik_beam800.pdf, read the figures", 24, ["I open *spec larsvik beam eight hundred dot p d f*.", "At a glance box on the right. Eight hundred lumens, four hours, one hundred and thirty-two grammes, fifty-four ninety-five euros."]], ["PREVIEW", 12, "Open spec_halcyon_pulse1000.pdf, find the real runtime", 34, ["I open *spec halcyon pulse one thousand dot p d f*.", "The front says 'up to twelve hours' runtime, but there's an asterisk.", "The footnote says twelve hours is *Low mode* at one hundred and fifty lumens. Boost is one thousand lumens for *one hour thirty*, steps down after twelve minutes."]], ["PREVIEW", 13, "Read Halcyon specs: weight and price", 20, ["Two hundred and five grammes with bracket, eighty-nine euros.", "// that's over budget and the real runtime is ninety minutes, not twelve hours"]], ["PREVIEW", 14, "Open spec_cendral_vex600.pdf, read the middle column", 28, ["I open *spec cendral vex six hundred dot p d f*.", "It's a catalogue page with three models. I read the middle column.", "Six hundred lumens, three hours twelve — that's three point two hours, one hundred and forty-six grammes, forty-seven fifty euros."]], ["NUMBERS", 15, "File > Open light_comparison.xlsx, enter the four specs", 61, ["In *Numbers*, I open *light comparison dot x l s x*.", "Grey cells are given, yellow are mine to fill.", "I enter the four lights: Nordkant four hundred lumens, three hours runtime, one twenty-eight grammes, thirty-four ninety euros. Larsvik eight hundred lumens, four hours, one thirty-two grammes, fifty-four ninety-five euros.", "Halcyon one thousand lumens, one point five hours real runtime, two hundred five grammes, eighty-nine euros. Cendral six hundred lumens, three point two hours, one forty-six grammes, forty-seven fifty euros."]], ["NUMBERS", 16, "Add a formula for runtime per gram", 26, ["I add a row for runtime per gramme.", "The formula is hours times sixty divided by grammes.", "In the Larsvik cell: four times sixty divided by one thirty-two equals *one point eight two* minutes per gram."]], ["NUMBERS", 17, "Copy the formula, paste it for the other three lights", 22, ["I click the formula cell, *Command C*.", "I select the other three lights below it, *Command V*."]], ["NUMBERS", 18, "Score by hand: ranks of 4 = best for each criterion", 72, ["Now I score them by hand.", "*Lumens*: Halcyon gets rank four because it's brightest at one thousand, Larsvik three at eight hundred, Cendral two at six hundred, Nordkant one at four hundred.", "*Runtime*: Larsvik four for four hours of full power, Cendral three for three point two, Nordkant two for three hours, Halcyon one for only ninety minutes.", "*Minutes per gram*: Larsvik four again at one point eight two, Nordkant three at one point four one, Cendral two at one point three two, Halcyon one at zero point four four — the worst combination."]], ["NUMBERS", 19, "Price score and totals", 24, ["*Price*: Nordkant is cheapest so rank four, Cendral three, Larsvik two, Halcyon one.", "Runtime and minutes per gram are doubled in my scoring rule.", "Larsvik totals twenty-one out of twenty-four. Nordkant and Cendral tie on fifteen. Halcyon scores nine."]], ["NUMBERS", 20, "Add a verdict column with dropdowns", 34, ["I add a verdict column with a dropdown for each light.", "*Buy this one* for Larsvik. *Runner-up* for Nordkant and Cendral because they're cheaper. *Rule out* for Halcyon because ninety minutes of full power just doesn't cut it on my fifty-minute commute and the weight is crazy."]], ["NUMBERS", 21, "File > Export To > PDF: light_comparison.pdf", 22, ["*File*, *Export To*, *PDF*.", "I save it to the folder as *light comparison dot p d f*."]], ["PAGES", 22, "Open blank document, add title and four paragraphs", 78, ["In *Pages* I click *Blank*, then *Create*.", "Title: *Front light – decision*.", "Paragraph one: *Larsvik Beam 800, fifty-four ninety-five euros, inside my sixty euro ceiling. Best runtime at full power with four hours, best runtime per gram at one point eight two, and best price per lumen at six point nine cents*.", "Paragraph two: *The scoring rule weights runtime and efficiency double, because brightness alone is a weak number. A bright light that dies after ninety minutes on a fifty-minute commute is worse than useless*."]], ["PAGES", 23, "Add paragraphs on Halcyon and runners-up", 34, ["Paragraph three: *Halcyon Pulse 1000 is the trap. Brightest and most expensive, but ninety minutes at full power against a fifty-minute commute that will only get darker*.", "Paragraph four: *Nordkant and Cendral tie on fifteen, both cheaper and under three and a quarter hours at full power. Either is a fine runner-up if the Larsvik is sold out*."]], ["PAGES", 24, "Format > Document > set the title style", 18, ["I click the title. *Format* in the sidebar, *Paragraph Styles*, *Title*.", "// makes the title stand out"]], ["PAGES", 25, "File > Export To > PDF: recommendation.pdf", 22, ["*File*, *Export To*, *PDF*.", "I save it as *recommendation dot p d f*."]], ["FINISH", 26, "Finder — select both PDFs, Compress, rename deliverables.zip", 26, ["Back in *Finder*. I select *light comparison* and *recommendation*, both PDFs.", "Right-click, *Compress two items*."]], ["FINISH", 27, "Closing line and hold on the recorder window", 72, ["I rename the archive *deliverables dot zip*.", "Four lights, one scoring rule written before I looked at the specs, so there's no bias.", "Larsvik Beam 800 wins at twenty-one out of twenty-four — that's the best score.", "Four hours at full power, best runtime per gram at one point eight two minutes per gram, fifty-four ninety-five euros inside my sixty euro budget.", "I'm ordering it today, so I'll have it before the clocks go back and my commute goes dark.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r06_contact_sheet", "title": "Ride photos to a contact sheet", "group": "Outdoors and cycling", "apps": ["Safari", "Photos", "Pages", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window, then say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// Accessibility Inspector running, window closed, dot under Dock icon", "// Do Not Disturb on, desktop empty, no disk images mounted", "// only Safari, Photos, Pages, Preview, Finder, Notes may run"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 36, ["I ride with a local mountain bike club, and our newsletter editor needs eight photos for the autumn issue.", "I'll download Creative Commons shots, cut them to the best eight, then send back a contact sheet and credits."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down.", "Find the brief. Download nine Commons photos. Favourite the eight keepers. Print a contact sheet. Write the credits list."]], ["SETUP", 4, "Finder — open the folder, name the files", 30, ["In *Finder*, in my Documents, I open the folder *tasks*, then *r zero six contact sheet*.", "That's where everything for this lives — the brief as a PDF, and where the outputs go."]], ["SETUP", 5, "Preview — read the brief aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*.", "Eight photos for pages six and seven. Two euros at the club bar — commercial use, so nothing marked NonCommercial.", "Sixty millimetres wide per slot, so nothing dark or cluttered."]], ["SETUP", 6, "Open Safari, Photos and Pages — one reason each", 28, ["From the *Dock*: *Safari*, because that is where I download from Wikimedia Commons.", "*Photos*, to build the contact sheet. And *Pages*, to write the credits list."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. Everything I need is open, so I'll get to work.", "// minimise Notes with the yellow button - work time is measured from here"]], ["SAFARI", 8, "Search and open Wikimedia Commons category: Mountain biking", 30, ["In *Safari* I search *wikimedia commons category mountain biking*.", "Commons is all public domain or Creative Commons — that's why I'm not using a search engine."]], ["SAFARI", 9, "Open the category page, explain why you open file pages", 28, ["I click the mountain biking category page.", "I'm going to open the file page in a new tab, not the thumbnail, because the licence and the author's name live on the file page."]], ["SAFARI", 10, "Right-click first thumbnail, open in new tab", 22, ["Right-click the first photo thumbnail and *Open Link in New Tab*.", "// the tab stays open so I can copy the author and file name later"]], ["SAFARI", 11, "Read the licence on the file page, explain it", 28, ["The file page opens. I read the licence: *CC BY-SA 4.0*.", "That means commercial use is fine, and I have to credit the author. This one works."]], ["SAFARI", 12, "Right-click image, Save Image As to ride_photos", 24, ["Right-click the image and *Save Image As*.", "The panel opens at *ride photos* on the Desktop — where I primed it beforehand."]], ["SAFARI", 13, "Open second tab for next photo, repeat the download pattern", 20, ["Back to the category page. Right-click the second photo thumbnail and *Open Link in New Tab*.", "This one's *CC BY*, fine. *Save Image As*."]], ["SAFARI", 14, "Download third and fourth photos", 44, ["Third photo. Right-click, new tab. *CC BY-SA*, fine. Save it.", "Fourth photo. New tab, read the licence — *NonCommercial marked*.", "We sell the newsletter for two euros, so it's commercial use. This one is *out*. Skip it.", "// that is the planted snag - mention it out loud"]], ["SAFARI", 15, "Download fifth, sixth, seventh photos", 40, ["Fifth. Right-click, new tab. *CC BY-SA 4.0*, fine. Save it.", "Sixth. New tab. *CC0*, public domain, even better. Save it.", "Seventh. New tab, licence check, save it. That's five keepers."]], ["SAFARI", 16, "Download eighth and ninth photos", 32, ["Eighth. Right-click thumbnail, new tab. Read the licence, *CC BY 4.0*. Save it.", "Ninth and last. New tab, licence check, save it.", "Nine total downloaded, one dropped because it was NonCommercial, so eight keepers."]], ["PHOTOS", 17, "File > Import, select all nine photos from ride_photos", 26, ["In *Photos*, *File* menu, *Import*. I point at the *ride photos* folder on the Desktop.", "All nine are there. *Review for Import*, then *Import All New Items*."]], ["PHOTOS", 18, "Walk through the photos, drop the dark one", 38, ["The nine photos land in the library. I walk through them large.", "One shot into the sun — the rider's a silhouette, far too dark at sixty millimetres.", "That's the one I drop. The other eight are wide landscape shots with one clear rider."]], ["PHOTOS", 19, "Heart button on the eight keepers to add them to Favourites", 38, ["I click the *heart icon* on each of the eight keepers.", "First keeper gets the heart, second, third — all the way through the eight.", "The heart adds it to the Favourites album — my shortlist in one place, so I can select exactly those eight in one click later."]], ["PHOTOS", 20, "Confirm Favourites album header reads 8 Photos", 18, ["I click the *Favourites* album. The header reads *8 Photos*. That's the count I need."]], ["PHOTOS", 21, "Edit > Select All, File > Print, Contact Sheet, 4 columns", 34, ["*Edit*, *Select All*. The eight photos are all selected.", "*File*, *Print*. I set the *Contact Sheet* layout, not Standard.", "Then *Columns* to four — that gives me four across and two down, one page."]], ["PHOTOS", 22, "PDF pop-up bottom left, Save as PDF to contact_sheet.pdf", 26, ["The *PDF pop-up* at the bottom left of the print dialog. *Save as PDF*, into the Documents folder.", "I name it *contact sheet dot p d f*."]], ["PAGES", 23, "Blank document, heading for autumn newsletter credits", 24, ["In *Pages*, I start a *Blank* document.", "Heading: *Autumn newsletter, pages 6-7, photo credits*."]], ["PAGES", 24, "Type the first credit line, reading off the Safari tab", 28, ["First credit line format: *File name - Author - CC BY-SA 4.0*.", "I switch back to the first Safari file tab and *Command C* the file name, then *Command V* it in.", "Author's name, then the licence. One line done, that's one of eight."]], ["PAGES", 25, "Type credit lines two through eight, progress check", 50, ["Second line, copying from the second tab. Done.", "Third through fifth, each one off its open tab. That's five of eight.", "Sixth, seventh, eighth — same pattern, copying not retyping. All eight are done.", "Attribution is a licence condition — we use them, they get named. A misspelt credit is a broken attribution, so I copy, never retype."]], ["PAGES", 26, "Type closing line: all from Wikimedia Commons, none NonCommercial", 22, ["Closing line: *All images from Wikimedia Commons, public domain or Creative Commons licence.*", "*No NonCommercial images included.*"]], ["PAGES", 27, "File > Export To > PDF to photo_credits.pdf", 20, ["*File*, *Export To*, *P D F*, and save it as *photo credits dot p d f*."]], ["PREVIEW", 28, "Open contact_sheet.pdf, verify four by two grid on one page", 26, ["In *Preview*, I open *contact sheet dot p d f*.", "The *Thumbnails* sidebar shows one page, four by two. I count eight photos aloud."]], ["PREVIEW", 29, "View > Zoom In, verify readability at 60 mm", 22, ["*View*, *Zoom In*. At sixty millimetres the photos are still sharp and readable.", "Cluttered photos turn to mush at that size — these are clear."]], ["PREVIEW", 30, "Check the margins and print layout one more time", 20, ["I zoom back out to see the whole page. The grid is square, eight photos land perfectly, nothing spills off the edge."]], ["FINDER", 31, "Select both PDFs, compress to deliverables.zip", 28, ["Back in *Finder*. I select *contact sheet dot p d f* and *photo credits dot p d f*.", "Right-click, *Compress 2 Items*."]], ["FINISH", 32, "Rename archive to deliverables.zip, closing line", 38, ["I rename it *deliverables dot zip*.", "Nine Creative Commons photos down to eight. Four by two contact sheet, every photo credited, nothing NonCommercial made it through.", "Ahead of the twenty-fourth of September deadline.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r07_session_analysis", "title": "Heart-rate and cadence session analysis", "group": "Outdoors and cycling", "apps": ["Safari", "Numbers", "Pages", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window, then say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// Accessibility Inspector running, window closed, dot under Dock icon", "// Do Not Disturb on, desktop empty, no disk images mounted", "// only Safari, Numbers, Pages, Preview, Finder, Notes may run"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 36, ["I ride road bikes. Last Sunday I did a ninety-two-minute steady test on the Parpers loop, trying to hold two hundred and five watts.", "It felt much harder at the end, so I'm pulling the head-unit file to see if my heart rate agrees."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan.", "Check cardiovascular drift. Open the session data. Find the zero heart-rate cells and clean them. Chart everything. Write the review."]], ["SETUP", 4, "Finder — open the folder, name the files", 30, ["In *Finder*, in my Documents, I open *tasks*, then *r zero seven session analysis*.", "Two files: the *brief* telling me what to check, and the *session dot c s v* with the data."]], ["SETUP", 5, "Preview — read the brief aloud", 32, ["I open *brief dot p d f* in *Preview*.", "Four questions: did heart rate climb? Where in the ride? Are power and heart rate linked? What does the data say about pacing?"]], ["SETUP", 6, "Open Safari, Numbers, Pages — one reason each", 28, ["From the *Dock*: *Safari*, to look up what cardiovascular drift actually means.", "*Numbers*, for the session data and the charting. And *Pages*, to write the analysis."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. The brief is read, so I'll get into the data.", "// minimise Notes with the yellow button - work time is measured from here"]], ["SAFARI", 8, "Search Wikipedia for Cardiovascular drift", 28, ["In *Safari* I search *cardiovascular drift*.", "The Wikipedia page opens. I read the opening paragraph: heart rate climbs at unchanged workload."]], ["SAFARI", 9, "Explain cardiovascular drift from the article", 26, ["*Cardiovascular drift* happens when you hold the same power but your heart rate goes up.", "Plasma volume falls, so there's less blood per beat, and the heart has to beat more times to keep up.", "// close Safari with the red button - I'm done with it"]], ["NUMBERS", 10, "Open session.csv from the folder", 26, ["Back in *Finder*, I double-click *session dot c s v*.", "It opens in *Numbers* — five hundred and fifty-two rows, one row every ten seconds, ninety-two minutes of riding data from my head unit."]], ["NUMBERS", 11, "Describe the four data columns", 24, ["Four columns: *elapsed min* from zero to ninety-two. *H R bpm*, heart rate in beats per minute.", "*Cadence R P M*, pedal strokes per minute. *Power W*, watts."]], ["NUMBERS", 12, "Scroll to row 427, find the three zero heart-rate cells", 28, ["I scroll down to around row four hundred and twenty-seven, looking for anomalies.", "At minute seventy-one, the heart rate shows zero for three consecutive rows. That's a dropped chest-strap sensor — dead strap, not a heart rate of zero."]], ["NUMBERS", 13, "Select and delete the three zero cells, not empty them to zero", 26, ["I select those three cells in the H R column — they show zero but cadence and power are fine.", "*Delete* to empty them. Zeros wreck the chart line and mess up whole-session averages."]], ["NUMBERS", 14, "Table menu > Headers > Header Column on column A", 26, ["*Table*, *Headers*, *Header Column*. Column *A* goes grey.", "If I don't do this, Numbers plots elapsed time as a zero-to-ninety-two ramp line instead of a proper time axis for the chart."]], ["NUMBERS", 15, "Select column B, create line chart for Heart rate", 30, ["I click the *B* column header to select heart rate.", "*Chart* from the toolbar, *2D Line* chart. I set the *Y* minimum to ninety bpm so the variation shows.", "Title: *Heart rate over the ride*."]], ["NUMBERS", 16, "Create cadence chart in column C", 24, ["Column *C* for cadence. *Chart*, *2D Line*.", "Title: *Cadence over the ride*."]], ["NUMBERS", 17, "Create power chart in column D", 22, ["Column *D* for power. *Chart*, *2D Line*.", "Title: *Power over the ride*."]], ["NUMBERS", 18, "Verify the three charts show the pattern clearly", 26, ["All three charts now show the session structure. Heart rate climbs at the end while power stays flat — that's the drift.", "The cadence drop during the climb block shows the effort change."]], ["NUMBERS", 19, "Add two columns for block averages", 24, ["*Table*, *Add Column After*, twice. Columns *E* and *F* for the block calculations.", "These two columns will hold the early block and late block averages."]], ["NUMBERS", 20, "Early block formula: average HR from minute 10 to 40", 28, ["In cell *F two*, I type an AVERAGEIFS formula.", "Average column *B* (heart rate) where column *A* (elapsed time) is between *ten* and *forty* minutes, and heart rate is greater than zero.", "The answer is *one hundred and forty point zero* bpm."]], ["NUMBERS", 21, "Late block formula: average HR from minute 72 to 90", 26, ["In cell *F three*, the same formula for the late block, minute seventy-two to ninety.", "The answer is *one hundred and forty-nine point one* bpm.", "Nine beats of drift at unchanged power — that's cardiovascular drift."]], ["NUMBERS", 22, "Early and late power averages to confirm they match", 32, ["In cells *F four* and *F five* I calculate power averages for the same two blocks.", "Early: *two hundred and four point one* watts. Late: *two hundred and four point four* watts.", "Effectively the same power both times. So it's not that I worked harder at the end."]], ["NUMBERS", 23, "Cadence averages for the climb block: minute 55 to 67", 32, ["In cells *F six* and *F seven*, cadence averages for the climb window, minute fifty-five to sixty-seven.", "Early cadence: *eighty-eight point zero* R P M. On the climb: *sixty-three point eight* R P M.", "Much lower cadence at higher power — that's where the heavy legs came from."]], ["NUMBERS", 24, "File > Export To > PDF to session_charts.pdf", 22, ["*File*, *Export To*, *P D F*, named *session charts dot p d f*."]], ["PAGES", 25, "Blank document, heading for session review", 26, ["In *Pages*, I start a *Blank* document.", "Heading: *Parpers loop, nine August, session review*."]], ["PAGES", 26, "Write four paragraphs: drift, climb, missing data, pacing plan", 48, ["Paragraph one: cardiovascular drift — same power at the end but nine more beats. Why that matters.", "Paragraph two: the climb, minute fifty-five to sixty-seven. Cadence dropped to sixty-four, power went up to two hundred and fifty. That's heavy work.", "Paragraph three: the zero cells at minute seventy-one. Not a heart rate — a dropped sensor.", "Paragraph four: pacing plan for September long rides — pace off power, not heart rate."]], ["PAGES", 27, "Export To PDF to session_review.pdf", 20, ["*File*, *Export To*, *P D F*, named *session review dot p d f*."]], ["PREVIEW", 28, "Open session_charts.pdf and markup with pen", 28, ["In *Preview*, I open *session charts dot p d f*.", "I click the *markup* button — the pen-tip icon in the toolbar."]], ["PREVIEW", 29, "Add labels to the heart-rate chart: 140 bpm early, 149 bpm late", 26, ["On the heart-rate chart, I add a text label: *one hundred and forty bpm at two hundred and four watts*.", "Then another label on the late part: *one hundred and forty-nine bpm at two hundred and four watts*."]], ["PREVIEW", 30, "Label the climb block on the cadence chart", 20, ["On the cadence chart, I add a label: *twelve minute climb, eighty-eight to sixty-four R P M*."]], ["PREVIEW", 31, "File > Export as PNG to session_charts_annotated.png", 20, ["*File*, *Export*, format *P N G*, named *session charts annotated*."]], ["FINDER", 32, "Select the three exports and compress", 22, ["Back in *Finder*. Three exports: the charts PDF, the review PDF, and the annotated image.", "I select all three. Right-click, *Compress 3 Items*."]], ["FINISH", 33, "Rename archive to deliverables.zip, closing line", 42, ["I rename it *deliverables dot zip*.", "Same power both blocks, nine beats of drift — it felt harder, it wasn't harder.", "The climb dropped my cadence to sixty-four, hence the heavy legs. The zeros are missing data from a dropped strap.", "September long rides: pace off power, not heart rate.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r08_kit_weight", "title": "Bikepacking kit weight budget", "group": "Outdoors and cycling", "apps": ["Safari", "Numbers", "Pages", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window, then say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// Accessibility Inspector running, window closed, dot under Dock icon", "// Do Not Disturb on, desktop empty, no disk images mounted", "// only Safari, Numbers, Pages, Preview, Finder, Notes may run"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 36, ["I'm packing for a three-day bikepacking trip in the Pyrenees next month.", "I weighed every single item on the kitchen scale, and now I need to work out what stays at home to get under nine kilos."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan.", "Check what base weight means. Load the kit list. Group by category. Chart it. Find what to cut."]], ["SETUP", 4, "Finder — open the folder, name the files", 30, ["In *Finder*, in my Documents, I open *tasks*, then *r zero eight kit weight*.", "Three files: the *brief*, the *kit dot c s v* with all thirty-eight items weighed, and a *weight budget* sheet I have to fill."]], ["SETUP", 5, "Preview — read the brief aloud", 32, ["I open *brief dot p d f* in *Preview*.", "Target weight: under nine kilos. Base weight means no food, no water, no fuel, just the kit itself — which is my list.", "The brief says nothing essential gets cut."]], ["SETUP", 6, "Open Safari, Numbers, Pages — one reason each", 28, ["From the *Dock*: *Safari*, to check what base weight actually means in ultralight backpacking.", "*Numbers*, for the kit list and charting. And *Pages*, to write the cut list."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. The target is nine kilos, so I'll get to work.", "// minimise Notes with the yellow button - work time is measured from here"]], ["SAFARI", 8, "Search Wikipedia for Ultralight backpacking and base weight", 28, ["In *Safari* I search *ultralight backpacking base weight*.", "The Wikipedia page defines it: base weight is everything you carry except food, water, and fuel. That's my list exactly."]], ["SAFARI", 9, "Explain base weight concept, close Safari", 20, ["If I get base weight wrong the whole budget is wrong — so I check Wikipedia first.", "// close Safari with the red button - I don't need it anymore"]], ["NUMBERS", 10, "Open kit.csv from the folder", 22, ["Back in *Finder*, I double-click *kit dot c s v*.", "It opens in *Numbers* — thirty-eight items, all weighed."]], ["NUMBERS", 11, "Describe the spreadsheet structure", 24, ["Four columns: the *item name*, *grams*, *category*, and whether it's marked *essential*.", "The categories are Shelter, Clothing, Bags, Electronics, Cooking, Tools, and Personal."]], ["NUMBERS", 12, "Click grams column header, read the total bottom right", 24, ["I click the *grams* column header to select all the weights.", "The sum appears bottom right: *ten thousand six hundred and ten grams — ten point six one kilos*. Over target by one thousand six hundred and ten."]], ["NUMBERS", 13, "Find the blank category in Washbag row, fix it to Personal", 26, ["I scroll to find the Washbag row. It has a blank category field.", "A blank category means that row falls out of every group total and the percentages stop adding to a hundred. So it gets fixed, never deleted. I type *Personal*."]], ["NUMBERS", 14, "Sort grams column descending to see heaviest items first", 24, ["*Sort and Filter* toolbar button. Sort the grams column *descending*, heaviest first.", "The top four rows are a quarter of the whole pack."]], ["NUMBERS", 15, "Organize by Categories, set summary to Sum", 28, ["*Organize*, *Categories* on the category column.", "The summary is set to *Sum*, so each group shows its total weight."]], ["NUMBERS", 16, "Read the seven category totals aloud", 28, ["Reading the seven group totals: Shelter and sleep is the heaviest at four thousand one hundred and sixty-nine grams.", "That's nearly forty percent of everything I carry. Clothing is two thousand and thirteen. Bags are one thousand four hundred and thirteen."]], ["NUMBERS", 17, "Continue reading category totals", 22, ["Electronics: one thousand two hundred and seventy-two. Cooking: seven hundred and thirty-two.", "Tools: six hundred and fifty-nine. Personal: three hundred and fifty-two."]], ["NUMBERS", 18, "Explain the shelter weight: tent is essential, heaviest but stays", 26, ["Tent is essential and the heaviest item at one thousand four hundred and twenty grams — that's the winter purchase, not a cut.", "Sums come from clicked cells, not memory — the data does the maths."]], ["NUMBERS", 19, "Create a clean block of categories and weights in F/G columns", 28, ["I build a clean seven-by-two block in columns *F* and *G* with category names and their totals.", "I never chart off the grey group rows — I keep clear of the grams column and build my own block instead."]], ["NUMBERS", 20, "Select block, create bar chart", 24, ["I select the block. *Chart* from the toolbar, *2D bar* chart.", "Title: *Base weight by category*, showing grams. Format to show *value labels* on each bar."]], ["NUMBERS", 21, "Export the chart to PDF", 20, ["*File*, *Export To*, *P D F*, named *kit chart dot p d f*."]], ["NUMBERS", 22, "Calculate what to cut: current total minus optional items", 34, ["In cell *F twelve*, I build a sum: I click the grams header, which gives me *ten thousand six hundred and ten*.", "In *F thirteen*, I type the formula minus the camp chair, the spare shoes, and the second lens — all non-essential. That's *eight thousand six hundred and seventy* grams."]], ["NUMBERS", 23, "Name the three cuts and explain the logic", 32, ["Chair sat in twice in two years — *eight hundred and ninety grams*. Spare shoes become flip-flops — *six hundred and forty*.", "Second camera lens I can live without for three days — *four hundred and ten*. Together: *one thousand nine hundred and forty grams.*"]], ["NUMBERS", 24, "Verify final weight is under nine kilos", 18, ["Eight thousand six hundred and seventy grams is *eight point six seven kilos*, three hundred grams under nine."]], ["NUMBERS", 25, "Explain the decision method: heaviest first, non-essential only", 22, ["Heaviest first, all marked non-essential. Nothing essential is touched — that's what the brief asked for."]], ["SHEET", 26, "Open weight_budget.xlsx from the folder", 22, ["Back in *Finder*, I open *weight budget dot x l s x*.", "Yellow cells are mine to fill in."]], ["SHEET", 27, "Fill current weight, cuts, and new total", 26, ["I type the current weight: *ten thousand six hundred and ten grams*.", "The cuts: *one thousand nine hundred and forty grams*. The new total: *eight thousand six hundred and seventy*."]], ["SHEET", 28, "Fill the three cut items with reasons", 24, ["*Camp chair*: sat in twice in two years.", "*Spare shoes*: become flip-flops. *Second lens*: not needed for three days."]], ["SHEET", 29, "Export the filled sheet to PDF", 20, ["*File*, *Export To*, *P D F*, named *weight budget dot p d f*."]], ["PAGES", 30, "Blank document, heading for cut list", 28, ["In *Pages*, I start a *Blank* document.", "Heading in bold, large type at about twenty-eight points: *LEAVE AT HOME — Pyrenees, eleven to thirteen September*."]], ["PAGES", 31, "Type the three cut lines with reasons", 24, ["Three lines: Camp chair, nothing else came close. Spare shoes become flip-flops. Second lens not needed for three days.", "Then the summary: *Total saved one thousand nine hundred and forty grams. New base weight eight point six seven kilos.*"]], ["PAGES", 32, "Export to PDF to cut_list.pdf", 18, ["*File*, *Export To*, *P D F*, named *cut list dot p d f*."]], ["PREVIEW", 33, "Open kit_chart.pdf and markup with pen", 26, ["In *Preview*, I open *kit chart dot p d f*.", "I click the *markup* button — the pen-tip icon."]], ["PREVIEW", 34, "Add label to the Shelter & sleep bar", 20, ["I add a text label on the Shelter bar: *four thousand one hundred and sixty-nine grams — thirty-nine percent of base weight*."]], ["PREVIEW", 35, "Export to PNG as kit_chart_annotated.png", 18, ["*File*, *Export*, format *P N G*, named *kit chart annotated*."]], ["FINDER", 36, "Select four exports and compress", 22, ["Back in *Finder*. Four exports: the chart, the filled weight budget, the cut list, and the annotated image.", "I select all four. Right-click, *Compress 4 Items*."]], ["FINISH", 37, "Rename archive to deliverables.zip, closing line", 42, ["I rename it *deliverables dot zip*.", "Started at ten point six one kilos against a nine kilo target.", "Dropping the chair, spare shoes and second lens saves one thousand nine hundred and forty grams, putting me at eight point six seven.", "Nothing essential touched.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r11_hiking_boots", "title": "Compare three hiking boots", "group": "Outdoors and cycling", "apps": ["Preview", "Safari", "Numbers", "Pages"], "beats": [["SETUP", 1, "Hold on the recorder window, say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// only Finder, Preview, Safari, Numbers, Pages may open - everything else quit", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through the apps", 36, ["My hiking boots came apart on me in June, and I want a pair before autumn.", "I've got spec sheets for three candidates, so I'm going to *score them properly* instead of buying on a hunch.", "Their brief in *Preview*, the spec sheets there too, then I score them in *Numbers*, and write the pick in *Pages*."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down, so I can hold myself to it.", "Read the three specs. Check why wet grip matters. Score them five-by-five. Chart the winner. Zip it up.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open r11_hiking_boots, name the two files", 30, ["In *Finder*, in my Documents, I open the folder *r eleven hiking boots*.", "Two files: the *brief* as a PDF, and a blank *sheet* I have to fill and send back."]], ["SETUP", 5, "Preview — brief.pdf, read the three asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what they want.", "Three asks. Which boot wins on the specs. Why wet grip gets thirty percent weight.", "And watch the weight: one sheet says pair, the rest per boot."]], ["SETUP", 6, "Open Safari, Numbers, Pages from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to look up why limestone matters.", "*Numbers*, for the scoring sheet.", "And *Pages*, for the summary they get back."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. The plan is written, everything I need is open, so I will get into the boots.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["PREVIEW", 8, "Open spec_vallmar_alpin3.pdf, read the spec aloud", 42, ["In *Preview* I click *Finder* in the sidebar, then open the first spec: *spec vallmar alpin3 dot p d f*.", "Vallmar Alpin 3: *six twelve grams per boot*, EU42, *HydroSeal* three-layer membrane, *five millimetre lugs*, Kaldera XT compound.", "Twelve millimetre drop, *one hundred and eighty-nine euros*. Footer says *per boot*, which is the right way to quote it."]], ["PREVIEW", 9, "Open spec_terrafox_swift.pdf, spot the trap", 44, ["Next spec: *spec terrafox swift dot p d f*.", "Terrafox Swift Low: *eight seventy-six grams*. But the row says *weight, pair* — that is both shoes together.", "So I halve it: *four thirty-eight grams per boot*. No membrane at all, lug depth is blank — they did not list it.", "Eight millimetre drop, *one hundred and thirty-nine euros*. That is the trap laid out."]], ["PREVIEW", 10, "Open spec_nordkamm_midtr.pdf, the middle contender", 32, ["Third spec: *spec nordkamm midtr dot p d f*.", "Nordkamm Mid TR: *five hundred and five grams per boot*, *AquaStop* two-layer membrane, *four point five millimetre lugs*, GripStone MX compound.", "Ten millimetre drop, *one hundred and fifty-nine euros*. Right in the middle of the other two, every axis."]], ["SAFARI", 11, "Wikipedia karst page, why wet grip matters", 48, ["Now to *Safari*. I search *karst* and click the Wikipedia page.", "Scroll down to the *dissolution* section. Limestone is calcium carbonate, which *rainwater dissolves* because the rain is slightly acidic.", "The result: *smooth, polished rock*. Smooth plus wet is where hard shallow lugs *let go* — so wet grip gets thirty percent weight in my scoring.", "That is not my opinion, it is how limestone creeps and what it does to your feet."]], ["NUMBERS", 12, "Open boot_scores.xlsx, describe the grey and yellow sections", 30, ["Back to *Finder*, I open *boot scores dot x l s x* in *Numbers*.", "*Grey* cells are the specs I read off the sheets. *Yellow* is mine — weights, scores, and the weighted totals.", "The five criteria are wet grip, waterproofing, weight, ankle support, and price."]], ["NUMBERS", 13, "Type the specs into the yellow cells", 28, ["In row five, Vallmar: *six one two* grams, *one eight nine* euros, yes for waterproofing.", "Row six, Terrafox: *four three eight* grams — the halved pair — *one three nine* euros, no waterproofing.", "Row seven, Nordkamm: *five zero five* grams, *one five nine* euros, yes."]], ["NUMBERS", 14, "Type the five scores, out of five", 42, ["Column E, wet grip. Vallmar gets *five* out of five for the Kaldera grip. Terrafox gets *two* — hard compound on wet limestone is no good.", "Nordkamm gets *four* — it is the middle contender.", "Column F, waterproofing. Vallmar *five*, Terrafox *one* — no membrane — Nordkamm *four*.", "Column G, weight. Vallmar is heavy so *one*, Terrafox is light so *five*, Nordkamm *four*."]], ["NUMBERS", 15, "Finish the scores and enter the formula", 74, ["Column H, ankle support. Vallmar *five* — high cut — Terrafox *two*, Nordkamm *four*.", "Column I, price. Vallmar is dear so *one*, Terrafox is cheap so *five*, Nordkamm *four* — middle price, middle score.", "Now cell J five. I type the formula: *equals zero point three star e five plus zero point two five star f five plus zero point two star g five plus zero point one five star h five plus zero point one star i five*.", "I say it aloud: thirty percent wet grip, twenty-five percent waterproofing, twenty percent weight, fifteen percent support, ten percent price."]], ["NUMBERS", 16, "Drag the formula down to rows 6 and 7", 22, ["The little square handle at the bottom right of the cell. I drag it down to J six and J seven.", "Three totals land: *three point eight zero*, *two point six five*, *four point zero zero*."]], ["NUMBERS", 17, "Read the results and set the verdict dropdowns", 32, ["Vallmar three point eight zero. Terrafox two point six five. Nordkamm four point zero zero — the winner.", "The *Verdict* column is a dropdown. Vallmar: *Reject*. Terrafox: *Reject*. Nordkamm: *Buy*.", "// weights add to one, so totals stay out of five. Nordkamm is a four everywhere, check it lands exactly 4.00"]], ["NUMBERS", 18, "Fill the penalty block — weight difference from Nordkamm", 32, ["Scroll down to the penalty block. Cell B twenty: Vallmar minus Nordkamm is *one zero seven* grams per boot.", "Cell C twenty: Nordkamm minus Terrafox is *minus sixty-seven* — that is sixty-seven grams lighter.", "B twenty-one and C twenty-one are the same numbers, but per thousand steps instead of per boot."]], ["NUMBERS", 19, "Explain the weight penalty in human terms", 42, ["One step lifts one boot. So one hundred and seven grams extra per step is one hundred and seven *kilograms* extra per thousand steps.", "On my fourteen point six kilometre loop, that is about twenty-one thousand steps.", "One hundred and seven kilograms times twenty-one thousand steps divided by a thousand steps per kilogram... call it over *two tonnes* of lifting.", "That is the cost of the Vallmar, in my knees."]], ["NUMBERS", 20, "Select Boot and Weighted total columns, create a chart", 36, ["Now I select the *Boot* column and the *Weighted total* column. Command-click to add the second column.", "Click the *Chart* button in the toolbar, then *2D Column chart*.", "The title is *Weighted total, out of five*. Turn on *Value Labels* so the numbers show on the bars."]], ["NUMBERS", 21, "Export the chart as boot_scores.pdf", 26, ["Click an empty cell. *File*, *Export To*, *P D F*.", "Save it as *boot scores dot p d f* into the folder."]], ["PREVIEW", 22, "Open boot_scores.pdf, markup the winner", 32, ["Back in *Preview*, I open *boot scores dot p d f*.", "Click the *markup* button in the toolbar — the pen tip.", "An *arrow* pointing at the *Nordkamm* bar. Text beside it: *Nordkamm Mid TR - four point zero zero*.", "It is the only bar that reads exactly four."]], ["PREVIEW", 23, "Export the marked-up PDF as boot_chart.png", 22, ["*File*, *Export*, format *P N G*, named *boot chart dot p n g*, into the folder.", "The marked-up version as a picture for my notes."]], ["PAGES", 24, "Blank template, heading, and opening paragraph", 40, ["In *Pages*, I click *Blank* and *Create*.", "Heading: *Boot replacement - the pick*.", "Paragraph: I am *buying Nordkamm at one fifty-nine euros*. The *Nordkamm scores four point zero* versus three point eight zero for Vallmar and two point six five for Terrafox."]], ["PAGES", 25, "Explain the trade-offs and copy the chart", 48, ["Continue: The Terrafox is *sixty-seven grams lighter*, but it *loses on wet limestone* — no membrane, hard compound.", "The Vallmar grips better and carries more support, but it *costs one hundred and seven kilograms of lifting per thousand steps* — and thirty euros more.", "What the Nordkamm gives up: the stiff shank and the crampon welt, so it is *not a February boot*.", "Now I go back to *Numbers*, click the chart, and *Command C*."]], ["PAGES", 26, "Paste the chart and export the summary", 30, ["Back in *Pages*, *Command V* to paste the chart under the text.", "*File*, *Export To*, *P D F*, named *boot pick dot p d f*, into the folder."]], ["FINDER", 27, "Select the three exports and compress", 30, ["Back in *Finder*. Three files: the *chart*, the *marked-up image*, and the *summary page*.", "I select all three, right-click, *Compress three items*."]], ["FINISH", 28, "Rename deliverables.zip, closing line, hold on recorder", 44, ["Rename the archive *deliverables dot zip*.", "So: the *Nordkamm wins* at four point zero, ahead of three point eight zero and two point six five.", "The *light pair loses* on wet limestone — hard lugs, no membrane.", "The *heavy pair costs one hundred and seven kilograms per thousand steps* — over two tonnes on my loop.", "159 euros, bought.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "r12_ride_clip", "title": "Ride highlight clip with Creative Commons credit", "group": "Outdoors and cycling", "apps": ["Safari", "iMovie", "TextEdit", "QuickTime Player"], "beats": [["SETUP", 1, "Hold on the recorder window, say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// only Finder, Safari, iMovie, TextEdit, QuickTime Player, Notes, Preview may open", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "The opening — what you are doing and the route through the apps", 36, ["I run the social account for my cycling club, and *Friday needs a forty-five second clip*.", "No club footage this summer, so I am *cutting a Creative Commons footage* off the Internet Archive.", "Their brief in *Preview*, the licence on *Safari*, the download and edit in *iMovie*, and I check it in *QuickTime*."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down, so I can hold myself to it.", "Find the footage, check the licence, download it, cut forty-one seconds, add a title card with credit, dissolve, and zip.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open r12_ride_clip, name the file", 28, ["In *Finder*, in my Documents, I open the folder *r twelve ride clip*.", "One file: the *brief* as a PDF, which tells me exactly what to do."]], ["SETUP", 5, "Preview — brief.pdf, read the asks aloud", 34, ["I double-click *brief dot p d f* so it opens in *Preview*, to see what they want.", "Forty-five seconds at *ten eighty p*, not the first forty-five seconds — the camera work is no good.", "A *title card*, *one dissolve*, and the *credit* must survive on the file itself, because clips travel captionless."]], ["SETUP", 6, "Open Safari, iMovie, TextEdit, QuickTime — one reason each", 28, ["From the *Dock*: *Safari*, to find the footage and check the licence.", "*iMovie*, because that is where the edit gets made.", "*TextEdit*, for the caption file they can drop into their post.", "And *QuickTime*, to verify the final file before I ship it."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. The plan is written, everything I need is open, so I will get into the clip.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["SAFARI", 8, "Open archive.org, search Ride with Wendy", 36, ["In *Safari* I go to *archive dot o r g* and search *ride with wendy*.", "Click the first result, and the item page opens. I can see the *creator: Doug Whitfield*.", "Right there at the top."]], ["SAFARI", 9, "Click the licence link and read the CC BY 4.0 deed", 40, ["Click the *licence* link.", "*Creative Commons Attribution Four Point Oh*. I say it clearly: *CC BY Four Point Oh*.", "I *can share it and adapt it*, even commercially. The one condition is *attribution* — I must credit the creator.", "Back to the item page."]], ["SAFARI", 10, "Show All, describe the file and start download", 42, ["Click *Show all* to see every file in the item.", "Scroll down to *lightcheck dash G H zero one zero six three six dot M P four*, resolution *nineteen twenty by ten eighty*.", "*Three hundred megabytes*. Click it to start the download.", "// do NOT watch the progress bar - it runs for about five minutes. The next three beats fill that time with real narrated work"]], ["TEXTEDIT", 11, "Create caption.txt while the file downloads", 42, ["In *TextEdit*, *File*, *New Document*. Go to *Format* menu, *Make Plain Text*.", "Type the caption: *Ridge line, Saturday nine*.", "Credit line: *Doug Whitfield, Creative Commons Attribution Four Point Oh*.", "Add the URL to the archive item so they can check the licence themselves.", "Save it as *caption dot t x t* into the folder."]], ["IMOVIE", 12, "Create new project, name it Summer on the ridge", 48, ["In *iMovie*, *File*, *New*, then *Movie*, with no template.", "A blank project appears with an empty timeline at the bottom.", "Name the project *Summer on the ridge* — this name will be in all the metadata.", "Look at the duration readout at the top right of the screen. It must end at *forty-five point zero seconds* exactly.", "Right now it shows zero seconds because the timeline is empty."]], ["FINDER", 13, "Check the Downloads folder, file is there", 36, ["Back to *Finder*, click *Downloads* in the sidebar.", "The file has arrived: *lightcheck dash G H zero one zero six three six dot M P four*.", "Check the *size* in the info panel — it says *three hundred megabytes*, which matches the archive page exactly.", "This is the complete file."]], ["IMOVIE", 14, "Import media, select and import the downloaded file", 48, ["Back in *iMovie*, click *Import Media* on the left sidebar.", "A dialog appears. Folder is set to *Downloads*. I can see *lightcheck dash G H zero one zero six three six*.", "Select it and click *Import Selected*.", "The clip gets imported into the *Library* on the left, and iMovie shows me a preview."]], ["IMOVIE", 15, "Skim and clip, note what to skip", 44, ["The clip appears in the library. Move the *skim cursor* across it to preview what is in it.", "The first *twenty seconds* is just the camera setting up — lens cap off, checking focus.", "The brief says *skip that part* entirely. I want forty-one seconds of the actual ride.", "The whole file is *one minute nineteen seconds* long, which gives me plenty of slack."]], ["IMOVIE", 16, "Drag-select from 00:20 to 01:01, verify forty-one seconds", 48, ["Click at the *twenty-second mark* and hold, then drag to the *one-minute one-second mark*.", "That is exactly *forty-one seconds* — from the end of the camera work to forty-one seconds into the ride.", "Drag this selection into the timeline at the bottom of the window.", "The readout in the top right corner shows *forty-one point zero seconds*. That is the footage I want."]], ["IMOVIE", 17, "Add title card, two lines with credit", 58, ["Click the *Titles* tab on the left panel.", "Drag the *Standard* title style and drop it *before* the footage clip — this style has a top line and a bottom line.", "Click inside the title on the timeline to edit the text.", "Type the top line: *Summer on the ridge*.", "Type the bottom line: *Footage: Doug Whitfield · CC BY Four Point Oh*.", "Set the duration to *five point zero seconds* in the inspector, click *Apply*.", "The readout now shows *forty-six seconds total* — the title added one second, but the dissolve will subtract it back."]], ["IMOVIE", 18, "Add cross-dissolve between title and footage", 62, ["Click the *Transitions* tab on the left panel.", "Drag *Cross Dissolve* onto the join between the title and the footage clip — the line where they meet in the timeline.", "Double-click the transition to open its settings panel.", "Set the duration to *one point zero* second exactly — the default is usually point five, but I need one.", "Click *Apply* and the transition is set.", "Look at the readout in the top right. It must now say *forty-five point zero* seconds exactly.", "This is right because the dissolve *overlaps* the two clips: five plus forty-one minus one equals forty-five."]], ["IMOVIE", 19, "Play the beginning to verify credit is on screen", 32, ["Click the *play* button to preview the first ten seconds.", "The title card appears first, with both lines of credit visible.", "Then the forty-one seconds of footage starts, at the twenty-second mark of the footage.", "The credit *rides on the clip itself* — that is what the licence requires."]], ["IMOVIE", 20, "Export to file as ridge_highlight.mp4", 48, ["*File*, *Share*, *File*.", "On the dialog: resolution is *ten eighty p*, not four K — bigger than the source invents detail.", "Quality: *High*, then *Better Quality*.", "Name it *ridge highlight*, and save to the folder.", "// iMovie will render for 30-60 seconds - sit with this window open and let it finish"]], ["QUICKTIME", 21, "Open the exported file, show Movie Inspector", 40, ["*QuickTime Player*, open *ridge highlight dot m p four* from the folder.", "*Window*, *Show Movie Inspector* — this opens a panel on the right with file details.", "Resolution: *nineteen twenty by ten eighty* pixels. Duration: *zero zero forty-five* — exactly forty-five seconds.", "Play a few seconds to see the credit card and the footage itself."]], ["FINDER", 22, "Select both files and compress", 28, ["Back in *Finder*. Two files: *ridge highlight dot m p four* and *caption dot t x t*.", "Select both, right-click, *Compress two items*."]], ["FINISH", 23, "Rename deliverables.zip, closing line, hold on recorder", 48, ["Rename the archive *deliverables dot zip*.", "*CC BY Four Point Oh* — Doug Whitfield. That is what the licence lets me do.", "*Forty-one seconds* of footage, *five-second* title card with the credit, *one dissolve* between them.", "Exactly *forty-five seconds*, *ten eighty p*, verified in QuickTime.", "Zipped and ready for Friday's post to the club.", "// pause 2-3 s on the recorder window before you press Stop, or the last seconds get cut"]]]}, {"id": "r16_nutrition_plan", "title": "Long ride nutrition plan", "group": "Outdoors and cycling", "apps": ["Safari", "Numbers", "Pages", "Preview", "Finder"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, then say the UTC time", 18, ["It is *[read the UTC clock — hours, minutes and seconds]*, coordinated universal time.", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 40, ["I ride a lot, and on the twenty-ninth I'm doing *160 kilometres* on my own with *one shop stop*.", "Last time I ran out of food at 120 and crawled home, so today I'm working out exactly what goes in my pockets.", "I pick from twelve things I weighed and priced, and I keep the caffeine for the last two hours."]], ["SETUP", 3, "Notes — type the five-line plan", 28, ["First I write the plan down, so I can hold myself to it.", "Check the absorption ceiling. Find the twelve foods. Pick what to carry. Fill the hour-by-hour card. Zip it up.", "// type it, don't paste - five short lines is enough"]], ["SETUP", 4, "Finder — open r16_nutrition_plan, name the three files", 30, ["In *Finder*, in my *Documents*, I open the folder *r sixteen nutrition plan*, because everything for this lives there.", "Three files: the *brief* as a PDF, the *foods* as a CSV, and an empty *fuelling sheet* I have to fill."]], ["SETUP", 5, "Preview — brief.pdf, read the three asks aloud", 34, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what they want.", "Three hundred and ninety grams of carbs, the weight and cost, the caffeine timing, and a *twenty euro* budget.", "The ride is 160 kilometres, one shop stop at 92."]], ["SETUP", 6, "Open Safari, Numbers, Pages from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to find the absorption ceiling for carbs.", "*Numbers*, because I have to fill a sheet with the twelve foods and the quantities.", "And *Pages*, to make the card for my top-tube bag."]], ["SETUP", 7, "Say UTC again, minimise Notes", 16, ["It is now *[read the UTC clock again]*. The plan is written, everything I need is open, so I will get into the numbers.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here"]], ["SAFARI", 8, "Wikipedia sports drink page, read the carbohydrate section", 28, ["In *Safari*, I go to Wikipedia's *sports drink* page, and scroll to the carbohydrate section.", "*Sixty grams an hour* is about the ceiling. Past that your gut can't absorb it, it just sits there."]], ["SAFARI", 9, "Read the absorption explanation, say why mixed sources matter", 26, ["*Mixed glucose and fructose* absorb by two different routes.", "So a mix plus bananas sits better than four gels in a row.", "// close the Safari window with the red button before moving on"]], ["NUMBERS", 10, "Open foods.csv from the folder, point at each column", 32, ["Back in the folder, I double-click *foods dot c s v*, and it opens in *Numbers*.", "*Twelve items*, weighed as carried — skin on the banana, with the drink mix in the bottle.", "Carbs, weight, caffeine, cost."]], ["NUMBERS", 11, "Point at the three items that are out: sachet, nuts, cola", 30, ["The sachet from Denmark: caffeine column is *blank*, and *four seventy-five euros*, price outlier.", "Salted nut mix: *nine grams* of carbs for *fifty grams* of weight — terrible ratio.", "Cola: *three hundred and fifty grams* to carry for *thirty-five grams* of carbs."]], ["NUMBERS", 12, "Open fuelling_plan.xlsx, describe grey and yellow cells", 26, ["Now I open *fuelling plan dot x l s x*. *Grey* cells are given. *Yellow* is mine to fill.", "Quantities for gel, bar, banana, drink mix, and everything else marked zero."]], ["NUMBERS", 13, "Type the quantities: 4, 3, 2, 2, then the rest", 24, ["Four gels — one an hour for the back half of the ride.", "Three oat bars. Two bananas, thirty-five cents each and they go down easily early.", "Two bottles, because that is what the cages hold."]], ["NUMBERS", 14, "Fill the weight column: 260, 216, 384, 320", 26, ["Weight column: *two hundred and sixty* grams for the gels.", "*Two hundred and sixteen* for the bars. *Three hundred and eighty-four* for the bananas — they are the heaviest item.", "*Three hundred and twenty* for the bottles."]], ["NUMBERS", 15, "Fill the cost column: 5.80, 3.60, 0.70, 4.20", 24, ["Cost: *five euros eighty* for the gels. *Three sixty* for the bars. *Seventy cents* for the bananas, great value.", "*Four twenty* for the bottles."]], ["NUMBERS", 16, "Fill the dropdown 'In plan?' column per item", 24, ["Dropdown column *In plan?*: the gel is *In plan*, the bar is *In plan*, the banana is *In plan*, the bottle is *In plan*.", "The sachet, nuts and cola are all *Leave at home*. Everything else is *Backup*."]], ["NUMBERS", 17, "Select the four weight cells, check the total", 24, ["Now I select the four *weight* cells. The sum is *eleven hundred and eighty grams*, about *two point six pounds* on the bike.", "The bottles are the heaviest, but the bananas are dense."]], ["NUMBERS", 18, "Select the four cost cells, confirm under budget", 22, ["I select the four *cost* cells. The sum is *fourteen euros thirty*, leaving *five euros seventy* of my twenty euro budget.", "That sachet outlier cost a fortune."]], ["NUMBERS", 19, "Select carbs column, read the individual totals aloud", 26, ["Carbs: *eighty-eight* from the gels, *one hundred and twenty* from the bars, *fifty-four* from the bananas, *one hundred and thirty-four* from the bottles.", "// read them down the column to confirm each entry"]], ["NUMBERS", 20, "Select all four carbs cells, read the sum in the status bar", 28, ["I select the four carbs numbers and look at the bottom status bar.", "The sum reads *three hundred and ninety-six* against a target of *three ninety*. Six grams over across the whole ride."]], ["NUMBERS", 21, "Type the totals line: 396 g, 60.9 g/h, 1180 g, 14.30 EUR, 200 mg caffeine", 34, ["Below that I type the totals.
