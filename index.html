e transcript, *ori* tells bacteria where to copy, *AmpR* selects transformants."]], ["SAFARI", 9, "Search Addgene sequencing primers, find CMV Forward primer", 30, ["In *Safari*, I search *Addgene sequencing primers* and open the reference page.", "The facility used *C M V Forward*, so I find it on the list: *A A A T G G G C G G T A G G C G T G*."]], ["SAFARI", 10, "Copy the primer sequence, Command C", 14, ["*Command C* to copy the primer."]], ["VIEWER", 11, "Search field: paste, Command V, primer at 523-540", 28, ["Back in *SnapGene*, bottom left, the *search field*. *Command V* to paste.", "It matches at *five twenty-three* to *five forty*, just before the target gene starts. The reads begin right downstream."]], ["VIEWER", 12, "Open clone1.ab1: sharp peaks, good read quality", 24, ["I open *clone one dot a b one* in the traces panel. *Sharp peaks* all through the read.", "Clean bases, no ambiguity. This one looks good."]], ["VIEWER", 13, "Open clone4.ab1: scroll to tail, peaks ragged", 22, ["Then *clone four dot a b one*. Scroll to the last hundred bases.", "The peaks turn *ragged*, piling up into noise — normal Sanger end, chemistry running out."]], ["SAFARI", 14, "Copy TGT1 sequence: double-click in SnapGene map, Edit > Copy", 26, ["Back in *SnapGene*, double-click *T G T one*, the target gene. *Edit*, *Copy* to get the sequence."]], ["SAFARI", 15, "New tab, search EMBOSS Needle at EBI, set sequence type DNA", 26, ["In *Safari*, open a new tab. Search *EMBOSS Needle* at the *European Bioinformatics Institute*, *e b i dot a c dot u k*.", "Set the sequence type to *D N A*."]], ["SAFARI", 16, "Box 1: paste reference sequence, Command V", 14, ["In box one, paste the reference: *Command V*."]], ["TEXTEDIT", 17, "Open clone3.fasta, select sequence lines only, Command C", 24, ["I open *clone three dot fasta* in *TextEdit*. Select the *sequence lines only* — not the header line.", "*Command C* to copy."]], ["SAFARI", 18, "Box 2: paste clone3 sequence, Command V, submit", 18, ["Back in Needle, box two: *Command V*. *Submit*."]], ["SAFARI", 19, "Read alignment, scroll to position 388, call the difference", 26, ["When the alignment loads, I scroll down. At position *three eighty-eight*, I see *one mismatch*.", "G has changed to A in the read. That is the candidate mutation."]], ["VIEWER", 20, "Go back to clone3.ab1 trace, scroll to base 448", 22, ["Back in *SnapGene*, back to the traces. Double-click *clone three dot a b one*.", "Scroll to base *four forty-eight*, where the sequence change appears on the trace."]], ["VIEWER", 21, "Look at the peak at base 448: single sharp peak, confident", 26, ["At base *four forty-eight*, I see a *single sharp peak*, no wobble.", "The sequencer machine is confident in that base call. It is a *real* mutation, not a calling error."]], ["VIEWER", 22, "File > Export: save clone3_variant.png to task folder", 18, ["*File*, *Export*, and I save it as *clone three underscore variant dot p n g*."]], ["SAFARI", 23, "Needle: align clone1 sequence, compare to reference", 24, ["Now the other clones. Back to Needle with a new query. Clone one sequence in box two.", "Results: *nine hundred of nine hundred* bases match. Perfect."]], ["SAFARI", 24, "Needle: align clone2 sequence, compare", 18, ["Clone two in box two. Results: identical to clone one. No differences."]], ["SAFARI", 25, "Needle: align clone4 sequence, check differences", 22, ["Clone four in box two. Results: I see about *twenty-six* differences.", "All of them sit past base *seven sixty*, where the trace quality dropped. End-of-read noise, not mutations."]], ["NUMBERS", 26, "Open clone_qc.xlsx, explain yellow vs grey cells", 20, ["In *Numbers*, I open *clone underscore q c dot x l s x*.", "*Yellow* cells are mine to fill. *Grey* are pre-filled."]], ["NUMBERS", 27, "Clone 1: type 0, none, Pass", 16, ["Clone one: *zero* mismatches, *none*, *Pass*."]], ["NUMBERS", 28, "Clone 2: type 0, none, Pass", 16, ["Clone two: *zero* mismatches, *none*, *Pass*."]], ["NUMBERS", 29, "Clone 3: type 1, position 988, mutation c.388G>A, p.Gly130Ser, Reject", 34, ["Clone three: *one* mismatch at plasmid position *nine eighty-eight*.", "*C dot three eighty-eight G to A*. Codon one thirty: *G G C* becomes *A G C*. That is *glycine to serine*, *p dot Gly130Ser*.", "Verdict: *Reject*."]], ["NUMBERS", 30, "Clone 4: end-of-read noise only, Pass", 16, ["Clone four: *end-of-read* noise, *Pass*."]], ["NUMBERS", 31, "Fill Contact Type dropdown: H bond, None, None, None", 18, ["Contact type column: *hydrogen bond* for the mutation, *none* for the others."]], ["NUMBERS", 32, "File > Export To > PDF: clone_qc.pdf to task folder", 18, ["*File*, *Export To*, *P D F*, saved as *clone underscore q c*."]], ["PREVIEW", 33, "Open clone3_variant.png, click Markup button", 14, ["I open *clone three underscore variant dot p n g* in *Preview*."]], ["PREVIEW", 34, "Circle the sharp peak at base 448, add text label", 18, ["*Markup*, the pen icon. Circle the sharp peak at base *four forty-eight*.", "Label: *c dot three eighty-eight G greater than A*."]], ["PREVIEW", 35, "File > Save the marked-up image", 14, ["*File*, *Save*."]], ["FINISH", 36, "Finder: select both exports, compress 2 items", 16, ["In *Finder*, I select the P D F and the marked-up trace. Right-click, *Compress 2 Items*."]], ["FINISH", 37, "Rename the archive deliverables.zip", 12, ["Rename to *deliverables dot zip*."]], ["CLOSE", 38, "Closing line", 72, ["Four reads validated. Clone one: nine hundred of nine hundred bases match the reference. Pass.", "Clone two: identical to one. Pass.", "Clone three: one point mutation. *C dot three eighty-eight G to A*, changing codon one thirty from glycine to serine.", "The trace shows a single sharp peak at that position — the machine is confident, so this is a real change. Clone three fails.", "Clone four: has twenty-six differences, but every single one sits past base seven sixty where the trace quality drops and decays.", "That is chemistry running out, not mutations. Clone four passes.", "Clone one is the validated construct. It advances to the next stage of the project."]]]}, {"id": "e02_gel_digest", "title": "Diagnostic digest gel analysis in Fiji", "group": "Molecular biology", "apps": ["Safari", "Fiji", "Numbers", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["After a ligation I picked six colonies, and each miniprep gets cut with two restriction enzymes and run on a gel.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "What you need to find out, and the route through it", 28, ["I need to *see which clones took the insert* before I spend sequencing money.", "So: the ladder sizes in *Safari*, the bands measured in *Fiji*, and their summary sheet filled in."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 49, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "First, their brief in *Preview*, to see exactly what they are asking for.", "Then the ladder sizes in *Safari*, to have a reference for reading the bands.", "Then *Fiji*, to invert the gel image and measure every lane.", "Then their summary sheet filled in, and the three exports zipped.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open e02_gel_digest, name the files", 30, ["In *Finder*, I open *e zero two gel digest*, in Documents.", "Two files: the *gel dot t i f*, the image from the scanner. And *gel underscore q c dot x l s x*, the verdict sheet."]], ["SETUP", 5, "Preview — brief.pdf, read the asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*.", "Three asks: which clones have both bands, which have one or wrong size, and fill in a QC sheet with the verdict."]], ["SETUP", 6, "Open the other apps from the Dock, one reason each", 28, ["From the *Dock*: *Safari*, for the GeneRuler ladder reference so I can call the band sizes.", "*Fiji*, the image analysis program I will measure the lanes in.", "*Numbers*, for the QC sheet."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything is open, so I will start measuring.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Search GeneRuler 1 kb ladder, open product page", 32, ["In *Safari*, I search *GeneRuler one k b ladder* and open the product page from New England Biolabs.", "This is the standard reference ladder used for every agarose gel in the lab."]], ["SAFARI", 9, "Read the 14 fragment sizes, 250 to 10000 bp, identify bright bands", 30, ["Fourteen fragments running from *two fifty* base pairs to *ten thousand*.", "The *six thousand* and *three thousand* base pair bands are marked as brighter — those are my anchor marks to identify them on the actual gel."]], ["FIJI", 10, "File > Open: gel_digest.tif", 18, ["*Fiji*, *File*, *Open*, and I open *gel underscore digest dot t i f*."]], ["FIJI", 11, "Edit > Invert: dark bands on light background", 18, ["*Edit*, *Invert*. The gel image flips — bands turn dark on light.", "The analyser reads them that way."]], ["FIJI", 12, "Rectangle tool: draw over lane 1, the ladder lane", 20, ["Rectangle tool from the toolbar. Draw a box over *lane one*, the ladder lane on the left."]], ["FIJI", 13, "Analyze > Gels > Select First Lane", 16, ["*Analyze* menu, *Gels*, *Select First Lane*."]], ["FIJI", 14, "Drag rectangle to lane 2, Select Next Lane, repeat for lanes 3-7", 32, ["Drag the rectangle box to *lane two*, the first clone. *Analyze*, *Gels*, *Select Next Lane*.", "Repeat: drag to lane three, *Select Next Lane*. Continue dragging and selecting through lane seven — that is six clones total."]], ["FIJI", 15, "Analyze > Gels > Plot Lanes", 16, ["*Analyze*, *Gels*, *Plot Lanes*. A separate window opens showing the lane profiles."]], ["FIJI", 16, "Straight line tool: close each peak at the base", 24, ["Straight line tool closes the base of each peak. Draw across the bottom of each peak — one line per peak baseline."]], ["FIJI", 17, "Wand tool: click inside each peak to mark it", 22, ["Wand tool from the toolbar. Click inside each peak to mark it, so Fiji knows which regions to count as bands."]], ["FIJI", 18, "Analyze > Gels > Label Peaks, read the results", 18, ["*Analyze*, *Gels*, *Label Peaks*. The peaks get numbered."]], ["FIJI", 19, "Results window: File > Save As gel_peaks.csv", 18, ["Results window: *File*, *Save As*, save as *gel underscore peaks dot c s v* so the measurements persist."]], ["FIJI", 20, "Minimize Fiji, look at the lane profile data", 18, ["Minimise Fiji now. The lanes are plotted and all the peaks are marked and ready to be called."]], ["NUMBERS", 21, "Open gel_qc.xlsx: explain grey vs yellow cells", 20, ["In *Numbers*, I open *gel underscore q c dot x l s x*.", "*Grey* cells are pre-filled. *Yellow* are mine to complete."]], ["NUMBERS", 22, "Lane 1: the ladder — 14 fragments, read sizes off the gel", 22, ["*Lane one* is the ladder. Fourteen fragment sizes from the Fiji plot."]], ["NUMBERS", 23, "Lanes 2-7: the six clones, describe expected pattern", 24, ["*Lanes two to seven* are my six clones. Correct pattern is two bands: *four thousand one hundred* and *nine hundred*.", "Vector plus insert means a good ligation."]], ["NUMBERS", 24, "Clone 1: both bands 4100 and 900, Pass", 14, ["Clone one: shows both bands. *Pass*."]], ["NUMBERS", 25, "Clone 2: both bands 4100 and 900, Pass", 14, ["Clone two: both bands. *Pass*."]], ["NUMBERS", 26, "Clone 3: 4100 band only, no insert, empty vector, Reject", 22, ["Clone three: only the *four thousand one hundred* band. No insert.", "The vector closed on itself in the ligation. Empty vector. *Reject*."]], ["NUMBERS", 27, "Clone 4: both bands 4100 and 900, Pass", 14, ["Clone four: both bands. *Pass*."]], ["NUMBERS", 28, "Clone 5: 4100 and 1500, wrong insert size, Reject", 20, ["Clone five: has *four thousand one hundred*, but the second band is *fifteen hundred*, not nine hundred.", "Wrong insert size picked up. *Reject*."]], ["NUMBERS", 29, "Clone 6: both bands 4100 and 900, Pass", 14, ["Clone six: both bands. *Pass*."]], ["NUMBERS", 30, "Fill verdict dropdown: Pass or Reject, 4 pass, 2 reject", 18, ["Verdict column dropdown: *Pass* for clones one, two, four, six. *Reject* for three and five."]], ["NUMBERS", 31, "File > Export To > PDF: gel_qc.pdf", 16, ["*File*, *Export To*, *P D F*, saved as *gel underscore q c*."]], ["PREVIEW", 32, "Open gel_digest.tif in Preview, click Markup button", 16, ["I open *gel underscore digest dot t i f* in *Preview*. *Markup* toolbar, the pen icon."]], ["PREVIEW", 33, "Label the ladder sizes beside lane 1: 6000, 3000", 18, ["Label the bright bands beside *lane one*: *six thousand* and *three thousand*."]], ["PREVIEW", 34, "Add text description of the two anchor bands", 16, ["Add a note beside them: *these bright bands mark the scale*."]], ["PREVIEW", 35, "Circle lane 3: empty vector, no insert band", 16, ["Circle *lane three*, the empty vector failure."]], ["PREVIEW", 36, "Circle lane 5: wrong insert size, second band is 1500 not 900", 18, ["Circle *lane five*, wrong insert size failure."]], ["PREVIEW", 37, "File > Export as PNG: gel_annotated.png", 14, ["*File*, *Export as P N G*, saved as *gel underscore annotated*."]], ["FINISH", 38, "Finder: select 3 exports, Compress 3 Items", 14, ["In *Finder*, select the P D F, the gel plot C S V, and the marked-up image."]], ["FINISH", 39, "Rename the archive deliverables.zip", 14, ["Right-click, *Compress three items*. Rename to *deliverables dot zip*."]], ["CLOSE", 40, "Closing line", 94, ["A diagnostic digest gel that takes ten minutes to run and read, before any sequencing money is spent.", "Two restriction enzymes cut the plasmid at two sites. A correct clone drops the insert out, leaving two separate bands on the gel.", "The vector band at four thousand one hundred base pairs, and the insert band at nine hundred.", "Four of the six clones show both bands — clones one, two, four, and six all pass this quality check.", "Clone three shows only the vector band. Empty. The backbone closed on itself with no insert.", "Clone five shows the vector band plus a second band, but it is fifteen hundred base pairs, not nine hundred.", "Wrong piece of D N A got ligated in. Only the four passing clones go to the sequencing facility."]]]}, {"id": "e03_psnapgene", "title": "pEGFP-N1 element inventory, Detect Common Features", "group": "Molecular biology", "apps": ["Finder", "Preview", "Safari", "SnapGene Viewer", "Numbers"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["A student picked pEGFP-N1 off a paper, and before we order it I need to know what is actually on it.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Insightful running and minimised · Do Not Disturb on · desktop empty · no disk images mounted", "// let the recorder window sit visible ~3 s so the description and app list are on film"]], ["SETUP", 2, "What you need to find out, and the route through it", 28, ["I need to *pull the real sequence* from the public database, and *go through every element*.", "So: NCBI in *Safari*, the sequence annotated in *SnapGene*, and their summary sheet filled in."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 50, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "First, their brief in *Preview*, to see exactly what they are asking for.", "Then the sequence from *NCBI* in *Safari*, to get the real record, not a guess.", "Then *SnapGene*, to run Detect Common Features and go through each element.", "Then their summary sheet filled in, and the three exports zipped.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open e03_psnapgene, name the files", 30, ["In *Finder*, I open *e zero three p snap gene*, in Documents.", "Two files: the *brief dot p d f* with what she wants, and *plasmid underscore elements dot x l s x* I have to fill."]], ["SETUP", 5, "Preview — brief.pdf, read the asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*.", "Three asks: pull the sequence from NCBI, inventory every element on the plasmid, mark up a map so she sees where things go."]], ["SETUP", 6, "Open the other apps from the Dock, one reason each", 28, ["From the *Dock*: *Safari*, for the NCBI Nucleotide database.", "*SnapGene*, to see the map and to annotate it with features.", "*Numbers*, for the inventory sheet."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["Everything is open, so I will start with NCBI.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Search N C B I Nucleotide, go to the database", 28, ["In *Safari*, I search *N C B I Nucleotide* and go to the public database at the National Institutes of Health.", "No account needed — it is open to everyone."]], ["SAFARI", 9, "Search pEGFP-N1, click accession U55762", 22, ["In the search box, *pEGFP-N1*. Click the entry: accession *U fifty-five seven sixty-two*."]], ["SAFARI", 10, "Say why NCBI instead of Addgene: public, no account, fast", 22, ["Public record, no account, fast download. That is why NCBI."]], ["SAFARI", 11, "Send to > Complete Record > File > Format GenBank > Create", 26, ["*Send to*, top right. *Complete Record*. *File*. *Format: GenBank*. *Create File*. It saves to Downloads."]], ["FINDER", 12, "Downloads: rename sequence.gb to pEGFP-N1.gb", 18, ["In *Finder*, go to Downloads. Rename *sequence dot g b* to *p E G F P dash N one dot g b*."]], ["FINDER", 13, "Drag pEGFP-N1.gb into e03_psnapgene folder", 16, ["Drag it into the *e zero three* folder."]], ["VIEWER", 14, "Double-click pEGFP-N1.gb: circular, 4733 bp, sparse annotation", 26, ["*SnapGene* opens it. *Circular*, *four thousand seven hundred thirty-three* base pairs.", "Only two features labelled: EGFP and a resistance gene. A database record is a sequence. A map is someone telling you what everything does."]], ["VIEWER", 15, "Features menu > Detect Common Features, accept matches", 22, ["*Features*, *Detect Common Features*. *SnapGene* searches its parts library.", "*Accept* the matches. The map fills in with all the standard elements."]], ["VIEWER", 16, "Click each feature: read name, position, strand, explain purpose", 32, ["Now I go through each one. Click it, read the name, the position, the strand direction.", "Say what it is for. Ten elements total."]], ["VIEWER", 17, "CMV enhancer and promoter: the switch from cytomegalovirus", 26, ["*CMV enhancer* and *CMV promoter*. From human cytomegalovirus.", "The promoter is the switch. The enhancer makes it louder. Works in almost every mammalian cell type."]], ["VIEWER", 18, "EGFP: green fluorescent protein, 720 bases, the point of the vector", 28, ["*EGFP*: green fluorescent protein. Seven hundred twenty bases. The point of this vector — the tag you see when the protein expresses."]], ["VIEWER", 19, "SV40 poly-A signal: end message, add poly-A tail for stability", 26, ["*S V forty poly-A signal*: a full stop. Tells the cell where the message ends, adds the tail that keeps it stable."]], ["VIEWER", 20, "F1 origin: single-stranded DNA, legacy from older sequencing", 22, ["*F one origin of replication*: lets a helper phage package the plasmid as single-stranded D N A.", "Older sequencing methods. Not much used now."]], ["VIEWER", 21, "SV40 promoter and origin: drives resistance in mammalian cells", 24, ["*S V forty promoter* and *origin*: a second replication system for mammalian cells.", "This one drives the resistance gene inside human or mouse cells."]], ["VIEWER", 22, "NeoR / KanR: one gene, two jobs, two selection stages", 28, ["*NeoR* slash *KanR*: *one gene* doing *two jobs*. Kanamycin resistance in bacteria. G418 resistance in mammalian cells.", "Same protein, two selections, two stages of the experiment."]], ["VIEWER", 23, "HSV TK poly-A signal: full stop for the resistance transcript", 22, ["*H S V T K poly-A signal*: another full stop, ends the resistance message."]], ["VIEWER", 24, "Ori: where E. coli starts copying the plasmid", 18, ["*Ori*: the bacterial origin. Where *E* dot *coli* starts copying when it grows up."]], ["VIEWER", 25, "Multiple cloning site: cut sites ahead of EGFP, tag lands on C-terminus", 28, ["*M C S*, multiple cloning site: where your gene goes in. It sits *ahead* of EGFP on the map.", "Your gene is read as one piece with the tag on the *end*. That makes it N1 — C-terminal tag."]], ["NUMBERS", 26, "Open plasmid_elements.xlsx: 10 rows, one per feature", 20, ["In *Numbers*, I open *plasmid underscore elements dot x l s x*. Ten rows, one for each feature."]], ["NUMBERS", 27, "Column 1: Element name, read off the screen", 16, ["Column one: element name. Read off the screen — nothing from memory."]], ["NUMBERS", 28, "Column 2: Position on the circle, read off the screen", 18, ["Column two: position. Every position off the screen."]], ["NUMBERS", 29, "Column 3: Strand direction, dropdown", 14, ["Column three: *plus* or *minus* strand."]], ["NUMBERS", 30, "Column 4: What it does, description from biology", 18, ["Column four: what it is for, in plain terms."]], ["NUMBERS", 31, "Fill all 10 rows with feature data", 22, ["All ten rows filled: promoters, genes, origins, poly-A signals, cloning site."]], ["NUMBERS", 32, "Type three note lines at the bottom: selection and tags", 26, ["Three note lines: this is a mammalian expression vector. Selection is kanamycin in bacteria, G418 in mammalian cells.", "If the tag needs to be on the N-terminus, this is the wrong vector — they want C1."]], ["NUMBERS", 33, "File > Export To > PDF: plasmid_elements.pdf", 14, ["*File*, *Export To*, *P D F*."]], ["VIEWER", 34, "File > Export > PNG image: pegfp_map.png", 16, ["Back in *SnapGene*. *File*, *Export*, *P N G image*, saved as *pegfp underscore map*."]], ["VIEWER", 35, "File > Export > GenBank: pEGFP-N1_annotated.gb", 16, ["*File*, *Export*, *GenBank*, saved as *p E G F P dash N one underscore annotated*."]], ["PREVIEW", 36, "Open pegfp_map.png, click Markup button", 14, ["I open *pegfp underscore map dot p n g* in *Preview*. *Markup*."]], ["PREVIEW", 37, "Circle the MCS ahead of EGFP, add label and arrow", 18, ["Circle the *M C S* where it sits ahead of *EGFP* on the map. Arrow pointing in.", "Label: *your gene goes here*."]], ["PREVIEW", 38, "File > Save the marked-up map", 12, ["*File*, *Save*."]], ["FINISH", 39, "Finder: select 3 exports, Compress 3 Items", 14, ["In *Finder*, select the three exports. Right-click, *Compress*."]], ["FINISH", 40, "Rename deliverables.zip", 12, ["Rename to *deliverables dot zip*."]], ["CLOSE", 41, "Closing line", 76, ["A mammalian expression vector with a green fluorescent protein C-terminal tag.", "Ten annotated features. Promoter and enhancer to drive expression. EGFP, the visible tag. Three poly-A signals to end transcripts. Three origins for replication.", "One cloning site where the gene goes in. And the resistance markers.", "The N1 in the name means the cut sites sit ahead of EGFP, so the tag lands on the C-terminus of the protein.", "Right choice if the tag can sit on the far end. Wrong choice if the protein needs its own C-terminus free for binding, for a signal, or for activity.", "The kanamycin and G418 resistance in one gene is particularly clever: it selects transformants in the bacteria first, then later selects successfully transfected mammalian cells."]]]}, {"id": "r01_ride_log", "title": "Season ride log review for the club AGM", "group": "Outdoors and cycling", "apps": ["Numbers", "Keynote", "Safari", "Preview", "Finder"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["I ride with a local cycling club, and I've been asked to put the season's numbers on a screen at our AGM.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Do Not Disturb on · desktop empty · no disk images mounted", "// only Numbers, Keynote, Safari, Preview, Finder, Notes may run"]], ["SETUP", 2, "The opening — what you are doing and the route through the apps", 31, ["I need four slides out of my ride log by Friday: the season totals, the chart by month, the standout rides, and next season's goal.", "So: the brief in *Preview*, the rides in *Numbers*, a chart by month, and four slides in *Keynote*, exported as PDF."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 52, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "First, their brief in *Preview*, to see exactly what they are asking for.", "Then the rides in *Numbers*, to total the columns and check the blank cell.", "Then the month chart, also in *Numbers*, and four slides built in *Keynote*.", "Then export everything as PDF, and zip it up.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open r01_ride_log, name the two files", 30, ["In *Finder*, in my Documents, I open the folder *r zero one ride log*.", "Two files: the *brief* as a PDF, and my *rides* as a CSV."]], ["SETUP", 5, "Preview — brief.pdf, read the four asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what they want.", "Four slides. Totals in one. Chart by month in another. Standout rides. And next season's goal."]], ["SETUP", 6, "Open Safari, Numbers, Keynote from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to check the Everest comparison.", "*Numbers*, because that's where the rides live and the chart gets made.", "And *Keynote*, to build the four slides for the projector."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything I need is open.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Search for Mount Everest height, point at the metres figure", 28, ["In *Safari* I search *mount everest height metres*, and click the Wikipedia result.", "I point at the infobox: *eight thousand eight hundred and forty-eight point eight six metres*."]], ["SAFARI", 9, "Calculate the Everest comparison, then close the Safari window", 30, ["My season's climbing is forty-one thousand eight hundred and fifty metres.", "Divide that by eight thousand eight hundred and forty-nine: that's *nearly five Everests*.", "// close the Safari window with the red button before moving on"]], ["NUMBERS", 10, "File > Open rides.csv, describe its shape", 36, ["Back in the folder, I double-click *rides dot c s v*, and it opens in *Numbers*.", "*Six* columns: date, distance, climbing, average speed, notes, and the ride name.", "*Sixty-eight* rides from the *fifth of January* to the *twenty-sixth of July*."]], ["NUMBERS", 11, "Click column C header, read the sum at bottom right", 26, ["I click the column *C* header — that's *distance in kilometres*.", "At the bottom right, Numbers shows me the sum: *three thousand four hundred and twelve kilometres*."]], ["NUMBERS", 12, "Click column D header, read the climbing total", 26, ["Column *D* header — that's *metres climbed*.", "The sum reads *forty-one thousand eight hundred and fifty metres*."]], ["NUMBERS", 13, "Scroll to row 43, point at the blank speed cell", 36, ["Now I scroll down to row *forty-three*, that's May nineteenth.", "Distance and climbing are recorded, but the average speed is *blank*. The note says the head unit died.", "I leave it blank, not zero. A zero would drag the season average down and lie about my speed."]], ["NUMBERS", 14, "Build the month table: months in column H, totals in column I", 42, ["Back to the top. I build a month table to chart the data.", "Column *H*, I type the months down: *January, February, March, April, May, June, July*.", "Column *I*, I type the monthly totals: three twenty, three ninety-five, five oh five, two sixty-two, six forty, seven twenty, five seventy.", "This aggregates all sixty-eight rides into seven numbers so I can see the pattern by month."]], ["NUMBERS", 15, "Select I1:I7, check the sum at bottom right matches 3,412", 26, ["I select *I one* down to *I seven*, the seven monthly totals.", "Bottom right: the sum reads three thousand four hundred and twelve — that matches exactly."]], ["NUMBERS", 16, "Select H1:I7, insert a 2D column chart", 48, ["I select from *H one* to *I seven* to include the month names and the totals.", "In the toolbar I click *Chart*, and I pick *2D Column* — bars, because these are seven separate months, not a continuous line.", "A bar chart shows each month as its own value, whereas a line would make it look like the riding flows smoothly through the season.", "// a line would suggest the months flow together, which they don't"]], ["NUMBERS", 17, "Set chart title, point at June and April, copy the chart", 51, ["Double-click the chart to edit it. The title box appears.", "I type *Kilometres per month, two thousand twenty-six season*.", "I point at the tall bar in June — *seven hundred and twenty* — that's the biggest month, roughly one fifth of the whole season.", "And the short one in April — *two hundred and sixty-two*, where I had the knee and took two weeks off."]], ["NUMBERS", 18, "Click the chart, Edit > Copy, say \"Command C\"", 22, ["I click the chart once to select it. *Edit*, *Copy*.", "*Command C*."]], ["KEYNOTE", 19, "Create a new Keynote presentation, white theme, wide 16:9", 32, ["In *Keynote*, the theme chooser appears. I pick the *white* theme — it's going on a projector at the AGM, so plain is better than fancy.", "I pick *wide* for *sixteen by nine*, because that's the standard format for a modern projector.", "Nothing distracts from the numbers."]], ["KEYNOTE", 20, "Slide 1: title and body with the season totals", 38, ["Slide one appears. I click the title and type *Valles Riders - my two thousand twenty-six season*.", "The body: *January to July, sixty-eight rides, three thousand four hundred and twelve kilometres, forty-one thousand eight hundred and fifty metres climbed — nearly five Everests — average fifty kilometres per ride*."]], ["KEYNOTE", 21, "Add Slide > Title & Bullets, paste the chart with Command V", 30, ["I click *Add Slide*, then pick *Title and Bullets*.", "I type the title *Kilometres per month*.", "I click in the body, *Edit > Paste*, say *Command V*. The chart lands in the slide."]], ["KEYNOTE", 22, "Drag the chart corner to resize it, make sure it's readable", 48, ["The chart is too big. I grab the *bottom-right corner* and drag it smaller so the whole slide reads together.", "I position it so the month names are readable and the bar heights are all visible.", "Month names and the numbers are clear on screen — that's what matters on a projector.", "I click on the slide background to deselect the chart."]], ["KEYNOTE", 23, "Add Slide 3: Rides worth talking about", 52, ["Add Slide again, Title and Bullets.", "Title: *Rides worth talking about*.", "Body: *One hundred and forty-two kilometres, Coast loop, Sunday June the fourteenth* — that's the only ride over a hundred all season. The next longest is eighty-four point two.", "*One thousand seven hundred and seventy metres of climbing, Collserola gravel, June the twenty-first* — that's the steepest day of the year in terms of metres per kilometre."]], ["KEYNOTE", 24, "Slide 3 continued: the April gap", 26, ["*April*: knee went on the twelfth, back on the twenty-seventh. Two weeks off, the longest break in the season.", "Everything either side of it is just a few days apart."]], ["KEYNOTE", 25, "Add Slide 4: Next season goal", 26, ["Add Slide, Title and Bullets.", "Title: *Next season*.", "Body: *Four thousand kilometres and fifty thousand metres. One more ride a month, off an injured season*."]], ["KEYNOTE", 26, "File > Export To > PDF, Good quality, season_summary.pdf", 24, ["*File*, *Export To*, *PDF*.", "Quality: *Good*. I save it to the folder as *season summary dot p d f*."]], ["PREVIEW", 27, "Open season_summary.pdf, click through the four slide thumbnails", 28, ["In *Finder* I double-click *season summary dot p d f* to open it in *Preview*.", "On the left sidebar I see the four thumbnails. I click each one to make sure the chart text survived the export."]], ["NUMBERS", 28, "File > Export To > PDF: month_totals.pdf", 22, ["Back to *Numbers*. *File*, *Export To*, *PDF*.", "I save it as *month totals dot p d f* to show the working."]], ["FINISH", 29, "Finder — select both PDFs, Compress, rename deliverables.zip", 26, ["In *Finder*, I select *season summary* and *month totals*, both PDFs.", "Right-click, *Compress two items*."]], ["FINISH", 30, "Closing line and hold on the recorder window", 34, ["I rename the archive *deliverables dot zip*.", "So: three thousand four hundred and twelve kilometres, forty-one thousand eight hundred and fifty metres, sixty-eight rides.", "June biggest at seven hundred and twenty, the Coast loop the standout at one hundred and forty-two, April the fortnight off.", "Four slides, PDF, ready for the projector.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r02_route_card", "title": "Hike route card with elevation profile", "group": "Outdoors and cycling", "apps": ["Safari", "Maps", "Numbers", "Pages", "Preview", "Finder"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["I'm planning a Pyrenees day walk for me and four friends.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Do Not Disturb on · desktop empty · no disk images mounted", "// only Safari, Maps, Numbers, Pages, Preview, Finder, Notes may run"]], ["SETUP", 2, "The opening — what you are doing and the route through the apps", 26, ["I need a one-page route card everyone can carry, built off the GPS track I walked in June.", "So: drive time and sunset in *Maps* and *Safari*, the elevation profile in *Numbers*, and a printed card in *Pages*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 60, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "First, the drive time in *Maps* and the sunset time in *Safari*, so nobody comes down in the dark.", "Then the GPS track in *Numbers*, to build the elevation profile and find the steepest section.", "Then the route card itself in *Pages*, with the chart and the route notes.", "Then mark it up in *Preview*, and zip everything for the group.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open r02_route_card, name the two files", 30, ["In *Finder*, in my Documents, I open the folder *r zero two route card*.", "Two files: the *brief* as a PDF with my planning notes, and the *track* as a CSV with GPS points."]], ["SETUP", 5, "Preview — brief.pdf, read the four asks aloud", 36, ["I double-click *brief dot p d f* so it opens in *Preview*, to see exactly what they want.", "Four things. The route distance and climbing and the high point. An elevation profile so they see where the hard bit is.", "The steepest section with kilometre marks. And water plus one escape route if the weather turns."]], ["SETUP", 6, "Open Safari, Maps, Numbers, Pages from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to check sunset times so nobody comes down in the dark.", "*Maps*, to read the drive time from Barcelona.", "*Numbers*, for the track file and the calculations. And *Pages*, to make the printed card."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything I need is open.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["MAPS", 8, "Search Setcases, click the top result", 24, ["In *Maps* I search *Setcases*.", "I click the top result — that's the trailhead in the Camprodon valley."]], ["MAPS", 9, "Click Directions, from Barcelona, read the drive time aloud", 28, ["I click the *Directions* button.", "From Barcelona. The drive time appears: *two hours and fifteen minutes*.", "So if I want boots on at eight in the morning, I leave at *half past five*."]], ["MAPS", 10, "Close the directions, leave the map visible", 18, ["I close the directions drawer.", "// leave Maps showing the Setcases location for now"]], ["SAFARI", 11, "Search or open sunrise-sunset.org, look for Setcases", 26, ["In *Safari* I navigate to *sunrise dash sunset dot org*.", "I search for *Setcases* to find the sunset time."]], ["SAFARI", 12, "Read the sunset time aloud", 20, ["The sunset time appears. That's when we stop and turn down the mountain.", "Nobody descends a steep track in the dark, so I make a note of it on the card."]], ["NUMBERS", 13, "File > Open track.csv, describe its shape", 32, ["Back in the folder, I double-click *track dot c s v*, and it opens in *Numbers*.", "*Two* columns: cumulative distance in kilometres and elevation in metres.", "*Two hundred and eighty-four* rows of GPS points, from the starting height back to the same height when the loop closes."]], ["NUMBERS", 14, "Scroll to the bottom row, check the distance and elevation", 26, ["I scroll to the bottom. The last row shows *fourteen point two kilometres* and we're back to *six hundred and twelve metres*.", "The loop closes — that's the sanity check."]], ["NUMBERS", 15, "Back to the top, add a change column", 24, ["Back to the top. I add a change column in *C*.", "In *C one* I type *change*. In *C three* I type equals *B three* minus *B two*."]], ["NUMBERS", 16, "Copy C3, paste it down to C285", 22, ["I click *C three*. *Command C*.", "I select from *C four* down to *C two hundred and eighty-five*, *Command V*."]], ["NUMBERS", 17, "Add calculations in column F: max distance, total ascent, high point", 36, ["In *F one* I type equals *M A X* of *A two* to *A two hundred and eighty-five* — that's the maximum distance.", "In *F two* I type equals *S U M I F* of *C three* to *C two hundred and eighty-five* comma greater than zero — that's total ascent.", "// only count the uphill steps, not the whole net change, which is zero on a loop"]], ["NUMBERS", 18, "High point and kilometre, steepness calculation", 36, ["In *F three* I find the high point: *M A X* of *B two* to *B two hundred and eighty-five*.", "In *F four* the kilometre where it happens: *I N D E X* and *M A T C H*.", "In *F five* I calculate the steepest gradient: the height change divided by five hundred metres, times one hundred.", "// this will show me the steepest half-kilometre on the route"]], ["NUMBERS", 19, "Look at column B around the water site at km 6.1", 26, ["I scroll down to around kilometre six point one.", "The elevation is dead flat at seven hundred and ninety-six metres — that's the spring, the only water on the walk."]], ["NUMBERS", 20, "Select columns A and B, insert a scatter chart", 28, ["I select *A* — distance — and *command-click* *B* — elevation.", "I click *Chart* in the toolbar, and pick *two D scatter* — not a line, because the GPS points are unevenly spaced and a scatter keeps each one in its true place on the axis."]], ["NUMBERS", 21, "Format the chart: add connecting line, set axis limits and titles", 32, ["I right-click the chart and click *Format*.", "*Series*: I turn on the connecting line so it reads as a profile.", "On *Axis*, Y minimum six hundred and fifty, maximum one thousand one hundred and fifty. Axis titles: *Distance (km)* across, *Elevation (m)* up."]], ["NUMBERS", 22, "Set chart title, point at the peak and the water", 26, ["Chart title: *Coll de Ferro circular*.", "I point at the peak around kilometre nine — that's the col at eleven hundred and two metres.", "And the flat section around kilometre six — that's the water."]], ["NUMBERS", 23, "File > Export To > PDF: track_profile.pdf", 22, ["*File*, *Export To*, *PDF*.", "I save it to the folder as *track profile dot p d f*."]], ["PAGES", 24, "Click the chart, Command C, open Pages blank document", 26, ["I click the chart to select it. *Command C*.", "In *Pages*, I click *Blank*, then *Create*. A blank page opens."]], ["PAGES", 25, "Paste the chart, add title and statistics above", 32, ["*Command V*. The chart lands on the page.", "Above it I type: *Saturday September the twelfth, Setcases, Coll de Ferro circular*.", "*Fourteen point two kilometres, six hundred and forty metres climbed, high point eleven hundred and two metres*."]], ["PAGES", 26, "Add route notes: low point, spring, ramp, escape", 70, ["Below the chart, I type the route notes.", "*Kilometre three point seven five: low point at six hundred and twenty-nine metres, in the beech wood*.", "*Kilometre six point one: spring at seven hundred and ninety-six metres, the only water on the whole loop*.", "*Kilometre eight point nine to nine point four: the ramp, fourteen percent gradient, seventy metres of climbing in half a kilometre — the steepest section*.", "*Kilometre eleven: forestry track escape to the valley road, roughly forty minutes down if the weather turns or someone gets hurt*."]], ["PAGES", 27, "Add leave time, parking, and boots-on time", 24, ["I add the logistics.", "*Drive from Barcelona two hours fifteen, so we leave at half past five*.", "*Gravel pull-in parking, four euros*.", "*Boots on at eight in the morning*."]], ["PAGES", 28, "File > Export To > PDF: route_card.pdf", 22, ["*File*, *Export To*, *PDF*.", "I save it as *route card dot p d f*."]], ["PREVIEW", 29, "Open route_card.pdf, use markup to annotate the steep section", 30, ["I double-click *route card dot p d f* to open it in *Preview*.", "I click the *markup* button in the toolbar — the pen-tip icon.", "I draw an *oval* around the steep section around kilometre nine and add text: *fourteen percent ramp*."]], ["PREVIEW", 30, "Add an arrow at the water site", 22, ["I draw an *arrow* pointing at the flat section around kilometre six.", "Next to it: *water, kilometre six point one*."]], ["PREVIEW", 31, "File > Export as PNG: route_card_marked.png", 22, ["*File*, *Export*, format *P N G*, named *route card marked dot p n g*.", "This marked-up version is a picture the group can drop into their phone."]], ["FINISH", 32, "Finder — select three exports, Compress, rename deliverables.zip", 26, ["Back in *Finder*. I select *track profile* PDF, *route card* PDF, and *route card marked* PNG — three files.", "Right-click, *Compress three items*."]], ["FINISH", 33, "Closing line and hold on the recorder window", 68, ["I rename the archive *deliverables dot zip*.", "So: fourteen point two kilometres, six hundred and forty metres up, the col at eleven hundred and two metres at kilometre nine point four.", "One steep bit at fourteen percent between kilometre eight point nine and nine point four — that's the crux of the route.", "Water only at kilometre six point one at the spring.", "A bail-out at kilometre eleven down the forestry track, and we leave at half five in the morning to make boots on at eight.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r03_bike_lights", "title": "Compare four bike lights on specs", "group": "Outdoors and cycling", "apps": ["Preview", "Safari", "Numbers", "Pages", "Finder"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["I commute fourteen kilometres each way and the clocks go back at the end of October, so I need a proper front light.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Do Not Disturb on · desktop empty · no disk images mounted", "// only Preview, Safari, Numbers, Pages, Finder, Notes may run"]], ["SETUP", 2, "The opening — what you are doing and the route through the apps", 24, ["I need to know which of four lights actually wins on the numbers, not on brightness alone.", "So: the specs in *Preview*, the comparison and the scoring in *Numbers*, and the recommendation written in *Pages*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 57, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "First, the scoring rule in *Preview*, to see exactly how the score is built before I look at a spec.", "Then the four spec sheets, also in *Preview*, and why wet grip matters in *Safari*.", "Then the comparison worked out in *Numbers*, five criteria against the weighting.", "Then the recommendation written in *Pages*, and zipped up.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open r03_bike_lights, name the files", 30, ["In *Finder*, in my Documents, I open the folder *r zero three bike lights*.", "My own *brief* with the scoring rule, and four spec sheets in PDF."]], ["SETUP", 5, "Preview — brief.pdf, read the scoring rule aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*, to see the scoring rule.", "Sixty euro ceiling. Six kilometres of my commute is unlit, so fifty minutes in the dark.", "Runtime and weight are *doubled* in the score, on purpose — brightness alone is a weak number."]], ["SETUP", 6, "Open Safari, Numbers, Pages from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to understand what lumens actually means.", "*Numbers*, for the spec sheets and the scoring.", "And *Pages*, to write the recommendation I'll hand back."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything I need is open.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Search for bicycle lighting, click the Wikipedia page", 24, ["In *Safari* I search *bicycle lighting lumens runtime standard*.", "I click the Wikipedia result."]], ["SAFARI", 9, "Read the lumens definition aloud, then note it", 34, ["I read the output and standards section.", "Lumens is total light coming out of the lamp, not how well it's aimed.", "It says nothing about how long that light lasts. That's why my scoring rule *doubles* runtime in the calculation.", "Brightness without stamina doesn't help on a dark commute."]], ["PREVIEW", 10, "Open spec_nordkant_vega400.pdf, read the four key figures", 26, ["Back in the folder, I open *spec nordkant vega four hundred dot p d f* in *Preview*.", "Plain table. Four hundred lumens, three hours runtime, one hundred and twenty-eight grammes with mount, thirty-four ninety euros."]], ["PREVIEW", 11, "Open spec_larsvik_beam800.pdf, read the figures", 24, ["I open *spec larsvik beam eight hundred dot p d f*.", "At a glance box on the right. Eight hundred lumens, four hours, one hundred and thirty-two grammes, fifty-four ninety-five euros."]], ["PREVIEW", 12, "Open spec_halcyon_pulse1000.pdf, find the real runtime", 34, ["I open *spec halcyon pulse one thousand dot p d f*.", "The front says 'up to twelve hours' runtime, but there's an asterisk.", "The footnote says twelve hours is *Low mode* at one hundred and fifty lumens. Boost is one thousand lumens for *one hour thirty*, steps down after twelve minutes."]], ["PREVIEW", 13, "Read Halcyon specs: weight and price", 20, ["Two hundred and five grammes with bracket, eighty-nine euros.", "// that's over budget and the real runtime is ninety minutes, not twelve hours"]], ["PREVIEW", 14, "Open spec_cendral_vex600.pdf, read the middle column", 28, ["I open *spec cendral vex six hundred dot p d f*.", "It's a catalogue page with three models. I read the middle column.", "Six hundred lumens, three hours twelve — that's three point two hours, one hundred and forty-six grammes, forty-seven fifty euros."]], ["NUMBERS", 15, "File > Open light_comparison.xlsx, enter the four specs", 61, ["In *Numbers*, I open *light comparison dot x l s x*.", "Grey cells are given, yellow are mine to fill.", "I enter the four lights: Nordkant four hundred lumens, three hours runtime, one twenty-eight grammes, thirty-four ninety euros. Larsvik eight hundred lumens, four hours, one thirty-two grammes, fifty-four ninety-five euros.", "Halcyon one thousand lumens, one point five hours real runtime, two hundred five grammes, eighty-nine euros. Cendral six hundred lumens, three point two hours, one forty-six grammes, forty-seven fifty euros."]], ["NUMBERS", 16, "Add a formula for runtime per gram", 26, ["I add a row for runtime per gramme.", "The formula is hours times sixty divided by grammes.", "In the Larsvik cell: four times sixty divided by one thirty-two equals *one point eight two* minutes per gram."]], ["NUMBERS", 17, "Copy the formula, paste it for the other three lights", 22, ["I click the formula cell, *Command C*.", "I select the other three lights below it, *Command V*."]], ["NUMBERS", 18, "Score by hand: ranks of 4 = best for each criterion", 72, ["Now I score them by hand.", "*Lumens*: Halcyon gets rank four because it's brightest at one thousand, Larsvik three at eight hundred, Cendral two at six hundred, Nordkant one at four hundred.", "*Runtime*: Larsvik four for four hours of full power, Cendral three for three point two, Nordkant two for three hours, Halcyon one for only ninety minutes.", "*Minutes per gram*: Larsvik four again at one point eight two, Nordkant three at one point four one, Cendral two at one point three two, Halcyon one at zero point four four — the worst combination."]], ["NUMBERS", 19, "Price score and totals", 24, ["*Price*: Nordkant is cheapest so rank four, Cendral three, Larsvik two, Halcyon one.", "Runtime and minutes per gram are doubled in my scoring rule.", "Larsvik totals twenty-one out of twenty-four. Nordkant and Cendral tie on fifteen. Halcyon scores nine."]], ["NUMBERS", 20, "Add a verdict column with dropdowns", 34, ["I add a verdict column with a dropdown for each light.", "*Buy this one* for Larsvik. *Runner-up* for Nordkant and Cendral because they're cheaper. *Rule out* for Halcyon because ninety minutes of full power just doesn't cut it on my fifty-minute commute and the weight is crazy."]], ["NUMBERS", 21, "File > Export To > PDF: light_comparison.pdf", 22, ["*File*, *Export To*, *PDF*.", "I save it to the folder as *light comparison dot p d f*."]], ["PAGES", 22, "Open blank document, add title and four paragraphs", 78, ["In *Pages* I click *Blank*, then *Create*.", "Title: *Front light – decision*.", "Paragraph one: *Larsvik Beam 800, fifty-four ninety-five euros, inside my sixty euro ceiling. Best runtime at full power with four hours, best runtime per gram at one point eight two, and best price per lumen at six point nine cents*.", "Paragraph two: *The scoring rule weights runtime and efficiency double, because brightness alone is a weak number. A bright light that dies after ninety minutes on a fifty-minute commute is worse than useless*."]], ["PAGES", 23, "Add paragraphs on Halcyon and runners-up", 34, ["Paragraph three: *Halcyon Pulse 1000 is the trap. Brightest and most expensive, but ninety minutes at full power against a fifty-minute commute that will only get darker*.", "Paragraph four: *Nordkant and Cendral tie on fifteen, both cheaper and under three and a quarter hours at full power. Either is a fine runner-up if the Larsvik is sold out*."]], ["PAGES", 24, "Format > Document > set the title style", 18, ["I click the title. *Format* in the sidebar, *Paragraph Styles*, *Title*.", "// makes the title stand out"]], ["PAGES", 25, "File > Export To > PDF: recommendation.pdf", 22, ["*File*, *Export To*, *PDF*.", "I save it as *recommendation dot p d f*."]], ["FINISH", 26, "Finder — select both PDFs, Compress, rename deliverables.zip", 26, ["Back in *Finder*. I select *light comparison* and *recommendation*, both PDFs.", "Right-click, *Compress two items*."]], ["FINISH", 27, "Closing line and hold on the recorder window", 72, ["I rename the archive *deliverables dot zip*.", "Four lights, one scoring rule written before I looked at the specs, so there's no bias.", "Larsvik Beam 800 wins at twenty-one out of twenty-four — that's the best score.", "Four hours at full power, best runtime per gram at one point eight two minutes per gram, fifty-four ninety-five euros inside my sixty euro budget.", "I'm ordering it today, so I'll have it before the clocks go back and my commute goes dark.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r04_training_block", "title": "Twelve-week training block", "group": "Outdoors and cycling", "apps": ["Safari", "Numbers", "Calendar", "Preview", "Finder"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["I paid for a one hundred and sixty kilometre sportive on the twenty-fifth of October.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Do Not Disturb on · desktop empty · no disk images mounted", "// only Safari, Numbers, Calendar, Preview, Finder, Notes may run"]], ["SETUP", 2, "The opening — what you are doing and the route through the apps", 22, ["I need my twelve-week plan filled into a tracker, and the key weeks booked as real appointments.", "So: the plan and the tracker in *Numbers*, and the key weeks into *Calendar*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 53, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "First, what a sportive actually is, in *Safari*, so the training makes sense.", "Then the plan and the tracker in *Numbers*, to check the phases, the rest weeks, and the running hours.", "Then the key weeks booked into *Calendar* as real appointments.", "Then export the tracker, and zip it all up.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open r04_training_block, name the files", 30, ["In *Finder*, in my Documents, I open the folder *r zero four training block*.", "Three files: the *brief*, the raw *plan* as a CSV, and the *tracker* as an Excel sheet."]], ["SETUP", 5, "Preview — brief.pdf, read the asks aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*, to see what's needed.", "Fill the tracker. Check the rest weeks and taper. Mark the key long rides.", "Export the tracker and make a calendar to print."]], ["SETUP", 6, "Open Safari, Numbers, Calendar from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to understand what a sportive is.", "*Numbers*, for the plan and to fill the tracker.", "And *Calendar*, to put the training on my actual calendar so the sessions become real appointments."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything I need is open.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Search cyclosportive, click the Wikipedia result", 24, ["In *Safari* I search *cyclosportive wikipedia*.", "I click the first result."]], ["SAFARI", 9, "Read what a sportive is, note the training difference", 30, ["It's a mass-participation timed ride on open roads with feed stations, not a race.", "So the training is built on long hours and long rides, not on speed work.", "That's why the plan focuses on sustainable pace, not pace repeatability."]], ["NUMBERS", 10, "File > Open plan.csv, describe its shape", 28, ["In *Finder* I double-click *plan dot c s v*, and it opens in *Numbers*.", "*Twelve* rows, one for each week from Monday the third of August.", "Each week has hours to train, a long ride distance, and notes."]], ["NUMBERS", 11, "Point at hours progression and the long rides", 36, ["I point at the hours column. It starts at six hours in week one, rises to ten hours in week eight — that's the peak week — then drops off for taper.", "The long rides go from sixty kilometres in week one up to one hundred and thirty in week nine — the longest ride — then shorter rides leading into race day.", "// I'm never going to ride the full hundred sixty on training, so week nine's hundred thirty is plenty"]], ["NUMBERS", 12, "Note week five's blank long ride, say why", 24, ["Week five, the long ride cell is *blank*. That's Girona weekend — three days riding with the group, so no single long ride.", "// say it out loud so the blank doesn't look like an error"]], ["NUMBERS", 13, "Open training_tracker.xlsx, explain grey and yellow cells", 28, ["I double-click *training tracker dot x l s x* in the folder.", "*Grey* cells are the week starts and numbers from the plan. *Yellow* cells are what I fill in: the phase, the percent of the week before, and cumulative hours."]], ["NUMBERS", 14, "Fill the phase column with dropdowns", 24, ["I click the first yellow phase cell. A dropdown appears. I pick *Build* for week one.", "Week three is *Rest*, week seven is *Rest*, week eleven is *Taper*, week twelve is *Race*. All the other weeks are *Build*."]], ["NUMBERS", 15, "Calculate percent of week before", 62, ["In the percent column, I calculate each week as a percentage of the one before.", "Week two: seven point five divided by six is one hundred and twenty-five percent — that's the build-up week after the start.", "Week three is four point five divided by seven point five — that's exactly sixty percent, which is the rest-week pattern I've built into the block.", "Every fourth week is a rest week at exactly sixty percent, which lets my body recover and absorb the work."]], ["NUMBERS", 16, "Fill the hours to date column", 36, ["I add the cumulative hours column.", "Week one is six. Week two is six plus seven point five equals thirteen point five. Week three adds another four point five — the first rest week.", "I keep adding through the block. Week eight adds ten hours — the peak. By week twelve, the total is eighty-seven point four five hours.", "// this tells me if I'm on track or if I've dropped a ride"]], ["NUMBERS", 17, "Point at the pattern: peak week 8, rest weeks at 60%", 28, ["I point at week eight: *ten* hours, the peak.", "Rest weeks three, seven, and eleven are all exactly *sixty* percent of the week before — four point five, five point seven, five point two five."]], ["NUMBERS", 18, "File > Export To > Excel, click Replace", 22, ["*File*, *Export To*, *Excel*.", "I save it to the folder, click *Replace*, and say out loud: Numbers doesn't save to *dot x l s x*, so I must export it to disk."]], ["NUMBERS", 19, "File > Export To > PDF: training_tracker.pdf", 22, ["*File*, *Export To*, *PDF*.", "I save it as *training tracker dot p d f*."]], ["CALENDAR", 20, "File > New Calendar, name it Sportive block, On My Mac", 32, ["In *Calendar*, I click *File*, *New Calendar*.", "A drawer appears. I type *Sportive block* and pick *On My Mac* — a separate calendar so I can hide the training block later and keep my personal calendar clean."]], ["CALENDAR", 21, "Switch to month view", 18, ["I switch to *month* view.", "// this is where the training block will live"]], ["CALENDAR", 22, "Add all-day event: race day, Sunday October 25", 28, ["I click *Sunday October the twenty-fifth* and type *Sportive de la Vall – one hundred and sixty kilometres*.", "All-day event, on the Sportive block calendar. Race day is the anchor point everything counts back from."]], ["CALENDAR", 23, "Add key long ride: September 27, 120 km", 28, ["I click *Sunday September the twenty-seventh*, type *Long ride one hundred and twenty kilometres*, time *oh eight hundred* to *one thirty*.", "On the Sportive block calendar. This is a key ride in the final push toward the event."]], ["CALENDAR", 24, "Add longest long ride: October 4, 130 km", 30, ["I click *Sunday October the fourth*, type *Long ride one hundred and thirty kilometres – longest of the block*, time *oh eight hundred* to *two p m*.", "Sportive block calendar. This is the peak ride, and I'll never actually ride the full hundred sixty."]], ["CALENDAR", 25, "Add taper banner: October 12, all-day", 28, ["I click *Monday October the twelfth*, type *Taper starts – five point two five hours week*, all-day.", "Sportive block calendar. This is my reminder to back off and recover before race day."]], ["CALENDAR", 26, "Add rest week banner: August 17, all-day", 28, ["I click *Monday August the seventeenth*, type *Rest week – four point five hours*, all-day.", "Sportive block. This is the first rest week in the block where I dial it back and let my body catch up."]], ["CALENDAR", 27, "File > Print, month view, October 2026, save as PDF", 26, ["*File*, *Print*. I make sure month view is selected and October is showing.", "I click the *PDF* button, then *Save as PDF*, and save it as *calendar block dot p d f*."]], ["PREVIEW", 28, "Open training_tracker.pdf, scroll through to verify it's filled", 30, ["In *Finder* I double-click *training tracker dot p d f* to open it in *Preview*.", "I scroll through to check all the yellow cells are filled and the twelve weeks are all there."]], ["FINISH", 29, "Finder — select three files, Compress, rename deliverables.zip", 26, ["In *Finder*, I select *training tracker dot x l s x*, *training tracker dot p d f*, and *calendar block dot p d f*.", "Right-click, *Compress three items*."]], ["FINISH", 30, "Closing line and hold on the recorder window", 62, ["I rename the archive *deliverables dot zip*.", "Twelve weeks, eighty-seven and a half hours of riding, starting at six hours in week one and rising to ten hours in week eight.", "Rest weeks three, seven, and eleven at exactly sixty percent — that's the recovery pattern.", "Longest ride one hundred and thirty kilometres in week nine, and the sportive is Sunday the twenty-fifth at one hundred and sixty.", "Sessions booked like appointments in the calendar, or they won't happen. It's all locked in now.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r05_trail_signs", "title": "Trail junction signage set", "group": "Outdoors and cycling", "apps": ["Finder", "Safari", "Inkscape", "Pages", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["I walk with a local group, and somebody took a grinder to two of our junction posts in July.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// before you press Start: Accessibility Inspector running, window closed, dot under its Dock icon", "// Do Not Disturb on · desktop empty · no disk images mounted", "// only Finder, Safari, Inkscape, Pages, Preview, Notes may run"]], ["SETUP", 2, "The opening — what you are doing and the route through the apps", 24, ["I need to redraw the four signs we lost so the print shop can cut them this week.", "So: export settings in *Safari*, the four plates in *Inkscape*, and the print sheet in *Pages*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 58, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "First, the four junctions in the brief, to see the distances and which post each sign goes on.", "Then export settings in *Safari*, so the plates come out sharp at print size.", "Then the four plates drawn in *Inkscape*, each arrow checked before it exports.", "Then the print sheet built in *Pages*, and everything zipped for the shop.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open r05_trail_signs, describe the two files", 30, ["In *Finder*, in my Documents, I open the folder *r zero five trail signs*.", "Two files: the *brief* PDF from the group secretary, and the *signs template* in SVG format."]], ["SETUP", 5, "Preview — brief.pdf, read the table aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*.", "The table shows four junctions, distances, directions, and which post each sign goes on.", "Font Freda left, Mirador right, Coll de Ferro straight on, Car park back. Thirty by twenty centimetres, dark green on white."]], ["SETUP", 6, "Open Safari, Inkscape, Pages from the Dock — one reason each", 28, ["From the *Dock*: *Safari*, to check how Inkscape exports.", "*Inkscape*, to draw the four plates.", "And *Pages*, to build the final print sheet for the shop."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["The plan is written, everything I need is open.", "// minimise Notes with the yellow button - this timestamp is the boundary, work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Search for Inkscape export DPI settings", 22, ["In *Safari* I navigate to *inkscape dot org slash learn*.", "I search for *Inkscape export D P I*."]], ["SAFARI", 9, "Read about DPI and pixel count for print", 26, ["Inkscape exports by D P I, not by pixel count.", "Thirty centimetres at three hundred D P I is about three thousand five hundred pixels — plenty for something printed at arm's length."]], ["INKSCAPE", 10, "File > Open signs_template.svg", 20, ["In *Inkscape*, I go *File* > *Open*.", "I click *signs template dot s v g*."]], ["INKSCAPE", 11, "Point at the document size and legend", 24, ["The template opens. The document is three hundred by two hundred millimetres — the real plate size.", "Below the plate is the legend, a crib sheet with text labels."]], ["INKSCAPE", 12, "Click the legend, delete it to keep the working file clean", 26, ["I click the grey legend at the bottom.", "I press *Delete*. The legend goes away — it sits off the page, so it wouldn't print anyway, and removing it keeps the working file clean."]], ["INKSCAPE", 13, "Select the text tool, prepare to draw the first sign", 22, ["I click the *text* tool in the left toolbar.", "I'm ready to type the four destination names."]], ["INKSCAPE", 14, "First sign: click above the arrow, type the destination and distance", 28, ["I click above the arrow in the template.", "I type *Font Freda*, Enter, *zero point zero kilometres* dash *one point two kilometres*.", "// this is the walking range between the start and this junction"]], ["INKSCAPE", 15, "Set the font to Freda and confirm it's in the right place", 26, ["I check the font dropdown and set it to *Freda* if it's not already.", "The text lines up above the arrow. Good."]], ["INKSCAPE", 16, "Add the post marker: P-14", 20, ["I click below the arrow.", "I type *P dash one four* — the post number."]], ["INKSCAPE", 17, "Select the arrow, rotate it 90 degrees clockwise twice", 26, ["I click the *selector* tool at the top of the left toolbar.", "I click the arrow to select it. The object menu appears. *Object* > *Rotate 90 degrees clockwise*, twice.", "The arrow now points *left*, which is the direction for Font Freda."]], ["INKSCAPE", 18, "File > Export: Document, 300 DPI, sign_font_freda.png", 24, ["*File* > *Export*. Format is *P N G*. I click *Document* so it exports exactly the page.", "*D P I* is set to *three hundred*. I name it *sign font freda dot p n g*."]], ["INKSCAPE", 19, "Delete the first sign's text and the arrow", 22, ["I select and delete the Font Freda text.", "I select and delete the arrow."]], ["INKSCAPE", 20, "Second sign: Mirador, 0.8 km, P-15, arrow right", 26, ["Text tool again. Above the arrow: *Mirador*, Enter, *zero point zero* dash *zero point eight*.", "Below: *P dash one five*.", "Selector tool, click the arrow, rotate 90 clockwise twice — the arrow is now pointing *right*."]], ["INKSCAPE", 21, "Export the second sign", 18, ["*File* > *Export*, *P N G*, *three hundred D P I*, named *sign mirador dot p n g*."]], ["INKSCAPE", 22, "Delete second sign, prepare for Coll de Ferro", 22, ["I delete the Mirador text.", "I keep the arrow this time, because Coll de Ferro shares post P-fifteen with Mirador."]], ["INKSCAPE", 23, "Third sign: Coll de Ferro, check if it fits", 28, ["Text tool. Above the arrow: *Coll de Ferro*, Enter, *zero point zero* dash *three point four*.", "Below: *P dash one five* — same post as Mirador.", "I look at the text. *Coll de Ferro* is the longest name, and it runs close to the arrow."]], ["INKSCAPE", 24, "Shrink Coll de Ferro text to make room for the arrow", 28, ["I click the destination text line.", "In the text toolbar, I click the size dropdown and change it to *m m*.", "The size box shows *twenty-eight*. I change it to *twenty-four*.", "Now the text has plenty of space to the arrow."]], ["INKSCAPE", 25, "Rotate the arrow 90 degrees anticlockwise once (arrow points up)", 26, ["Selector tool, click the arrow. *Object* > *Rotate 90 degrees*, but this time only *once*, anticlockwise.", "The arrow now points *straight up*, which is the direction for Coll de Ferro."]], ["INKSCAPE", 26, "Export the third sign", 18, ["*File* > *Export*, *P N G*, *three hundred D P I*, named *sign coll de ferro dot p n g*."]], ["INKSCAPE", 27, "Fourth sign: Car park, change size back to 28", 26, ["Text tool. Above the arrow: *Car park*, Enter, *zero point zero* dash *two point one*.", "Below: *P dash one seven*.", "In the text toolbar, I change the size back to *twenty-eight* for this one."]], ["INKSCAPE", 28, "Rotate arrow 90 degrees clockwise twice (arrow points down)", 24, ["Selector tool, click the arrow. *Object* > *Rotate 90 degrees*, twice clockwise.", "The arrow now points *down*, which is back the way we came to the car park."]], ["INKSCAPE", 29, "Export the fourth sign", 18, ["*File* > *Export*, *P N G*, *three hundred D P I*, named *sign car park dot p n g*."]], ["PREVIEW", 30, "Open all four PNGs in Preview, step through them", 26, ["In *Finder* I click the first PNG, *shift-click* the last one, so all four are selected.", "Right-click, *Open*, and they open in one *Preview* window with a sidebar.", "I step through them and point at each arrow to check the rotations are right."]], ["PAGES", 31, "Open blank document, landscape orientation", 22, ["In *Pages*, I click *Blank*, then *Create*.", "*Format* in the sidebar, *Document*, set to *Landscape*."]], ["PAGES", 32, "Add heading with plate size", 20, ["I add a heading: *Riu Sec walking group – junction plates, three hundred by two hundred millimetres*."]], ["PAGES", 33, "Media > Choose, pick the four PNGs, arrange in 2x2 grid", 28, ["*Media* in the sidebar, *Choose*.", "I select all four PNG files.", "*Pages* lays them out in a two-by-two grid below the heading."]], ["PAGES", 34, "File > Export To > PDF: trail_signs_print.pdf", 22, ["*File*, *Export To*, *PDF*.", "I save it as *trail signs print dot p d f*."]], ["FINISH", 35, "Finder — select five files, Compress, rename deliverables.zip", 26, ["In *Finder*, I select the four PNGs and the PDF — five files.", "Right-click, *Compress five items*."]], ["FINISH", 36, "Closing line and hold on the recorder window", 36, ["I rename the archive *deliverables dot zip*.", "Four plates from one template, same dark green, same thirty by twenty centimetres.", "Arrows rotated left, right, up, down to match the junctions.", "Seven and a half kilometres signed across the four.", "PNGs for the phone, PDF for the print shop.", "// pause 2-3 s on the recorder window before you press Stop"]]]}, {"id": "r06_contact_sheet", "title": "Ride photos to a contact sheet", "group": "Outdoors and cycling", "apps": ["Safari", "Photos", "Pages", "Preview"], "beats": [["SETUP", 1, "Hold on the recorder window 3 s, write the UTC time down", 18, ["I ride with a local mountain bike club, and our newsletter editor needs eight photos for the autumn issue.", "// write the UTC time down NOW, seconds included - do not say it out loud", "// Accessibility Inspector running, window closed, dot under Dock icon", "// Do Not Disturb on, desktop empty, no disk images mounted", "// only Safari, Photos, Pages, Preview, Finder, Notes may run"]], ["SETUP", 2, "The opening — what you are doing and the route through it", 21, ["I need eight Creative Commons photos, properly licensed and properly credited, before the deadline.", "So: Wikimedia Commons in *Safari*, the picks in *Photos*, and the credits written in *Pages*."]], ["SETUP", 3, "Notes — type the start time, then the five-line plan", 53, ["In *Notes* I am typing the plan, five lines, so the order is fixed before I touch the data.", "First, Wikimedia Commons in *Safari*, downloading shots and checking every licence as I go.", "Then the nine downloads in *Photos*, dropping the weak one and favouriting the eight keepers.", "Then a contact sheet printed from *Photos*, and the credits written in *Pages*.", "Then check both in *Preview*, and zip it up.", "// you are saying what you will click and why - not reading the note back", "// first line of the note is the UTC start time you wrote down, seconds included"]], ["SETUP", 4, "Finder — open the folder, name the files", 30, ["In *Finder*, in my Documents, I open the folder *tasks*, then *r zero six contact sheet*.", "That's where everything for this lives — the brief as a PDF, and where the outputs go."]], ["SETUP", 5, "Preview — read the brief aloud", 32, ["I double-click *brief dot p d f* so it opens in *Preview*.", "Eight photos for pages six and seven. Two euros at the club bar — commercial use, so nothing marked NonCommercial.", "Sixty millimetres wide per slot, so nothing dark or cluttered."]], ["SETUP", 6, "Open Safari, Photos and Pages — one reason each", 28, ["From the *Dock*: *Safari*, because that is where I download from Wikimedia Commons.", "*Photos*, to build the contact sheet. And *Pages*, to write the credits list."]], ["SETUP", 7, "Type the UTC time as the last line of the note, then minimise Notes", 16, ["Everything I need is open, so I'll get to work.", "// minimise Notes with the yellow button - work time is measured from here", "// type the current UTC time as the last line BEFORE minimising - this is the boundary the work clock is measured from"]], ["SAFARI", 8, "Search and open Wikimedia Commons category: Mountain biking", 30, ["In *Safari* I search *wikimedia commons category mountain biking*.", "Commons is all public domain or Creative Commons — that's why I'm not using a search engine."]], ["SAFARI", 9, "Open the category page, explain why you open file pages", 28, ["I click the mountain biking category page.", "I'm going to open the file page in a new tab, not the thumbnail, because the licence and the author's name live on the file page."]], ["SAFARI", 10, "Right-click first thumbnail, open in new tab", 22, ["Right-click the first photo thumbnail and *Open Link in New Tab*.", "// the tab stays open so I can copy the author and file name later"]], ["SAFARI", 11, "Read the licence on the file page, explain it", 28, ["The file page opens. I read the licence: *CC BY-SA 4.0*.", "That means commercial use is fine, and I have to credit the author. This one works."]], ["SAFARI", 12, "Right-click image, Save Image As to ride_photos", 24, ["Right-click the image and *Save Image As*.", "The panel opens at *ride photos* on the Desktop — where I primed it beforehand."]], ["SAFARI", 13, "Open second tab for next photo, repeat the download pattern", 20, ["Back to the category page. Right-click the second photo thumbnail and *Open Link in New Tab*.", "This one's *CC BY*, fine. *Save Image As*."]], ["SAFARI", 14, "Download third and fourth photos", 44, ["Third photo. Right-click, new tab. *CC BY-SA*, fine. Save it.", "Fourth photo. New tab, read the licence — *NonCommercial marked*.", "We sell the newsletter for two euros, so it's commercial use. This one is *out*. Skip it.", "// that is the planted snag - mention it out loud"]], ["SAFARI", 15, "Download fifth, sixth, seventh photos", 40, ["Fifth. Right-click, new tab. *CC BY-SA 4.0*, fine. Save it.", "Sixth. New tab. *CC0*, public domain, even better. Save it.", "Seventh. New tab, licence check, save it. That's five keepers."]], ["SAFARI", 16, "Download eighth and ninth photos", 32, ["Eighth. Right-click thumbnail, new tab. Read the licence, *CC BY 4.0*. Save it.", "Ninth and last. New tab, licence check, save it.", "Nine total downloaded, one dropped because it was NonCommercial, so eight keepers."]], ["PHOTOS", 17, "File > Import, select all nine photos from ride_photos", 26, ["In *Photos*, *File* menu, *Import*. I point at the *ride photos* folder on the Desktop.", "All nine are there. *Review for Import*, then *Import All New Items*."]], ["PHOTOS", 18, "Walk through the photos, drop the dark one", 38, ["The nine photos land in the library. I walk through them large.", "One shot into the sun — the rider's a silhouette, far too dark at sixty millimetres.", "That's the one I drop. The other eight are wide landscape shots with one clear rider."]], ["PHOTOS", 19, "Heart button on the eight keepers to add them to Favourites", 38, ["I click the *heart icon* on each of the eight keepers.", "First keeper gets the heart, second, third — all the way through the eight.", "The heart adds it to the Favourites album — my shortlist in one place, so I can select exactly those eight in one click later."]], ["PHOTOS", 20, "Confirm Favourites album header reads 8 Photos", 18, ["I click the *Favourites* album. The header reads *8 Photos*. That's the count I need."]], ["PHOTOS", 21, "Edit > Select All, File > Print, Contact Sheet, 4 columns", 34, ["*Edit*, *Select All*. The eight photos are all selected.", "*File*, *Print*. I set the *Contact Sheet* layout, not Standard.", "Then *Columns* to four — that gives me four across and two down, one page."]], ["PHOTOS", 22, "PDF pop-up bottom left, Save as PDF to contact_sheet.pdf", 26, ["The *PDF pop-up* at the bottom left of the print dialog. *Save as PDF*, into th
